name: CI

on:
  # ALLEEN DE HOOFDLIJN, en dat is een reparatie en geen bezuiniging.
  #
  # Hier stond 'claude/**' bij. Een push naar zo'n branch draaide dan de hele
  # keten EN de pull_request-trigger deed dat ook, op dezelfde commit, tegelijk.
  # De concurrency-groep hieronder kon dat niet zien: bij een pull_request is
  # de sleutel het PR-nummer en bij een push de ref, dus twee groepen die
  # elkaar nooit annuleren.
  #
  # Wat dat kostte was niet alleen tijd. Twee volledige schermrondes (elk bijna
  # een uur, elk met een eigen Chromium, Postgres en Redis) vochten om dezelfde
  # runners, en de traagste van de twee liep tegen zijn timeout van 90 minuten
  # aan -- drie keer op rij, telkens de PR-run, telkens op een commit waarvan
  # de push-run in 45 minuten groen was. Een rood vinkje om drukte in plaats
  # van om code, en elke keer een herstart met de hand.
  #
  # Een branch zonder PR krijgt hierdoor geen keuring meer. Dat is de prijs, en
  # hij is klein: mergen kan alleen via een PR, en dan draait pull_request.
  push:
    branches: [ main, master ]
  pull_request:
  # MET DE HAND TE STARTEN, en dat is geen luxe. Een tak zonder PR krijgt geen
  # keuring (zie hierboven), en een PR die op een ANDERE tak staat dan main --
  # zoals een vervolgtak op een tak die nog niet gemerged is -- kreeg op
  # 26 augustus 2026 helemaal geen run: de trigger vuurde niet bij het openen.
  # Zonder deze knop is de enige uitweg dan wachten op de merge eronder, en dat
  # is precies wanneer je de keuring wilt hebben.
  workflow_dispatch:

# Geen workflowstap krijgt stilzwijgend schrijfrechten op de repository.
permissions:
  contents: read

# Een nieuwe push vervangt de vorige run van dezelfde PR of hoofdlijn. Zonder
# deze grens bleven oude revisies urenlang drie runners bezetten, terwijl hun
# uitslag door de nieuwere commit al niet meer merge-bepalend kon zijn.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ============================================================================
# WAAROM DEZE KETEN ER ZO UITZIET (26 augustus 2026)
#
# Hij stond op 83 minuten, en dat kwam uit twee jobs die elk een uur duurden:
# de unit-suite (76m44s) en de schermtoetsen plus de a11y-scan (66 min). Alles
# daaromheen -- audit, container, registers -- was samen geen drie minuten.
#
# De oorzaak zat NIET in de keten maar in de code eronder: een serverstart kostte
# 10,6 seconden, waarvan 7,3 aan 220 scrypt-hashes voor VIER demo-wachtwoorden.
# De toetsen starten er per ronde bijna negenhonderd. Die reparatie staat in
# server/accounts/kluis.js (zaaiHash) en scheelt op dezelfde bestanden een factor
# 2,4. Dat is de eerste helft.
#
# De tweede helft staat hier: de twee lange jobs zijn opgedeeld. Wat daarbij
# oppast is niet het opdelen zelf maar de METERS. Drie ervan rekenden over de
# hele ronde, en die zouden per deel stilletjes minder streng worden:
#
#   - de dekkingsvloer stond in de vlaggen --test-coverage-* en rekent PER
#     PROCES. Elk deel schrijft nu lcov; scripts/dekkingsvloer.js telt ze op en
#     oordeelt daarna. Een deel zonder lcov is een fout, geen 100%.
#   - de waargenomen endpoint-dekking leest het routejournaal. Elk deel schrijft
#     zijn eigen journaal; de meter draait op de samengevoegde versie.
#   - de schermdekking (welke app heeft een toets echt geopend) idem, met
#     .schermjournaal.
#
# En de a11y-scan, die eerst NIET opgedeeld kon worden en het nu wel is. Zijn
# oordeel is een budget over de hele ronde ("ingelogd ten hoogste N
# contrastfouten"), en vier delen die elk hun kwart tegen dat HELE budget leggen
# laten samen vier keer zoveel door. Daarom is daar op 27 augustus 2026 eerst de
# meting van het oordeel gescheiden (BESTUUR.md): vier delen meten, een job telt
# op en velt het oordeel. Zelfde budget, vier keer minder wachten.
#
# Wat er van die dag NIET is opgedeeld en waarom: niets meer. De zes
# bronmuterende ijkingen hebben elk een eigen job gekregen omdat ze traag zijn
# en op niets hoeven te wachten -- meterijk alleen duurde 18 van de 19 minuten
# van het langste toetsdeel.
# ============================================================================

jobs:
  # ==========================================================================
  # DE TOETSSCHERVEN.
  #
  # De suite draaide in EEN stap: 1083 bestanden, en op 22 augustus 2026 werd de
  # job na 240 minuten afgekapt terwijl de toetsstap alleen al 3 uur 57 liep.
  # Verdelen kon tot nu toe niet, want `--test-coverage-lines` rekent per
  # PROCES: elke scherf meet dan alleen wat hij zelf aanraakt en zakt op de
  # vloer terwijl het geheel er ruim overheen zit.
  #
  # Dat is nu opgelost. Elke scherf schrijft zijn dekking als lcov weg; de job
  # `test` hieronder telt ze op (scripts/lib/lcov.js) en handhaaft de vloer EEN
  # keer over het totaal -- precies wat het ene proces ook deed.
  #
  # DE VERDELING loopt via dezelfde runner als `npm test`. De zes
  # bronmuterende ijkingen staan niet tussen de gewone toetsen: zij krijgen
  # hieronder elk een eigen runner, zodat ze elkaar niet raken en de langste
  # ijking niet meer achter een volledige scherf hoeft te wachten.
  #
  # fail-fast staat uit: bij drie zakkende scherven wil je alle drie zien, niet
  # de eerste.
  # ==========================================================================
  toetsscherf:
    name: Toetsscherf ${{ matrix.scherf }} van 4
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scherf: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rtgtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
      # Redis is geen luxe: twee toetsbestanden (grand-integratie, sloophamer)
      # slaan ZICHZELF over zonder REDIS_URL. Ze stonden er dus wel, maar
      # draaiden nooit -- vijftien toetsen die eruitzagen als dekking.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      # fetch-depth: 0 is hier geen gemak maar de invoer van scripts/lib/semdiff.js:
      # die vergelijkt met het punt waar de tak van de hoofdlijn afweek, en in een
      # ondiepe kloon bestaat origin/main niet. Zonder dit geeft de diff nul
      # bestanden en zakt test/semdiff.test.js op iets dat niets met de code te
      # maken heeft. Zelfde reden als bij de deltapoort in de job hieronder.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      # DE RUST-MOTOR, want zonder hem is de pariteitstoets een belofte zonder
      # dekking. test/magnaat-capabilities.test.js eist `motor.bron === 'rust'`:
      # de Capability Graph wordt door twee onafhankelijke motoren gescand en de
      # toets legt hun uitkomst byte voor byte naast elkaar. Ontbreekt de binary,
      # dan valt de scanner veilig terug op JavaScript -- en dan MEET die toets
      # niets meer, maar zakt hij wel. Zo stond het: de binary staat niet in git,
      # werd door geen enkele werkstroom gebouwd, en die twee beweringen zakten
      # overal waar scherf 4 toevallig afliep. Nagemeten op 25 augustus 2026 in
      # een losse werkboom van origin/main: daar zakken ze precies zo, dus het
      # was geen regressie van deze tak maar een gat dat al die tijd door
      # afgebroken scherven werd gemaskeerd.
      #
      # De bouw is goedkoop: motor/Cargo.toml heeft NUL afhankelijkheden (alleen
      # de standaardbibliotheek, ook voor de AEAD), dus er wordt niets van een
      # registry gehaald. `working-directory: motor` staat er omdat rustup de
      # toolchain uit de WERKMAP leest, en motor/rust-toolchain.toml pint 1.97.1.
      # LIBXML2 HOORT HIER OOK, en stond alleen in de check-job hieronder.
      # test/samlc14n.test.js legt onze canonicalisatie naast die van xmllint en
      # slaat zichzelf bewust NIET over als die ontbreekt -- maar die toets valt
      # in een SCHERF, niet in de check-job. De scheidsrechter stond dus in een
      # andere machine dan de toets: drie beweringen zakten op ENOENT terwijl ze
      # los groen zijn. Een aanname over de omgeving is geen omgeving, en die
      # zin gold hier net zo goed.
      - name: libxml2 (de scheidsrechter van de c14n-toets)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Deze scherf, met dekking als lcov
        run: |
          set -o pipefail
          uitslag=0
          npm run test:deel -- --deel=${{ matrix.scherf }}/4 --zonder-ijkingen --dekking=dekking 2>&1 | tee -a /tmp/scherf.log || uitslag=$?
          if [ "$uitslag" -ne 0 ]; then node scripts/gezakte-toetsen.js /tmp/scherf.log; fi
          for bestand in dekking/*.info; do
            mv "$bestand" "${bestand%.info}-scherf-${{ matrix.scherf }}.info"
          done
          exit "$uitslag"
        env:
          RTG_ROUTELOG: ${{ github.workspace }}/routejournaal.log
      - name: De dekking van deze scherf bewaren
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dekking-scherf-${{ matrix.scherf }}
          path: dekking/*.info
          if-no-files-found: error
      - name: Het routejournaal van deze scherf bewaren
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: routejournaal-scherf-${{ matrix.scherf }}
          path: routejournaal.log
          retention-days: 1
          if-no-files-found: error

  # Deze zes toetsen veranderen bronbestanden met opzet om een meter te ijken.
  # Ze mogen daarom niet tegelijk met scanners of met elkaar draaien. Elk krijgt
  # een eigen runner; test/delen.test.js bewaakt dat deze matrix gelijk blijft
  # aan scripts/lib/ijkingen.js.
  ijkingen:
    name: De ijking - ${{ matrix.ijking }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ijking: [boot-smoke, grens-sweep, keuring, klok, meterijk, zaakdoos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: De ijking draaien (een bestand, alleen op deze machine)
        run: |
          set -o pipefail
          uitslag=0
          npm run test:deel -- --bestanden=${{ matrix.ijking }}.test.js --zonder-ijkingen --dekking=dekking 2>&1 | tee /tmp/ijk.log || uitslag=$?
          if [ "$uitslag" -ne 0 ]; then node scripts/gezakte-toetsen.js /tmp/ijk.log; fi
          for bestand in dekking/*.info; do
            mv "$bestand" "${bestand%.info}-ijking-${{ matrix.ijking }}.info"
          done
          # Niet elke ijking start een server. Een leeg journaal betekent dan
          # eerlijk "deze job raakte nul routes" en bewijst tegelijk dat haar
          # artefact niet stil uit de samenvoeging verdwijnt.
          touch routejournaal.log
          exit "$uitslag"
        env:
          RTG_ROUTELOG: ${{ github.workspace }}/routejournaal.log
      - name: De dekking van deze ijking bewaren
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dekking-ijking-${{ matrix.ijking }}
          path: dekking/*.info
          if-no-files-found: error
      - name: Het routejournaal van deze ijking bewaren
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: routejournaal-ijking-${{ matrix.ijking }}
          path: routejournaal.log
          retention-days: 1
          if-no-files-found: error

  test:
    name: Tests, checks en build
    # DEZE NAAM STAAT IN DE TAKBESCHERMING VAN main en verandert dus niet.
    # Wat eronder gebeurt is wel veranderd: de zware toetsstap is naar
    # `toetsscherf` hierboven verhuisd en deze job telt hun dekking op en
    # handhaaft de vloer. De snelle keuringen (check.js, de deltapoort, de
    # AST-scan, de norm, de bouw) blijven hier, want die zijn samen twee
    # minuten en horen bij het oordeel over de tak als geheel.
    needs: [toetsscherf, ijkingen]
    runs-on: ubuntu-latest
    # 1h08 op 18 aug, gecanceld op 90 min op 20 aug, en op 21 aug liep hij op
    # 150 min NOG. Gemeten in die afgebroken ronde: de unit-stap draaide toen al
    # 117 minuten en was nog bezig -- geen vastloper, gewoon een suite die met
    # deze samenvoeging van ~897 naar 1058 toetsbestanden ging. De concurrency
    # staat al op 4 (het maximum voor een standaard runner; hoger laat servers
    # elkaars healthcheck verdringen, zie scripts/test-runner.js), dus er valt
    # geen tijd te winnen zonder de suite te splitsen. Ruimte voor de groei en
    # voor een trage runner, en niet zo hoog dat een echte vastloper er een uur
    # onder wegzakt.
    # VEERTIG MINUTEN, want het zware werk staat niet meer in deze job. Op
    # 22 augustus 2026 werd hij nog na 240 minuten afgekapt met de toetsstap op
    # 3 uur 57; die stap is nu verdeeld over vier scherven die parallel lopen.
    # Wat hier overblijft zijn de snelle keuringen, het optellen van de dekking
    # en de bouw -- samen een paar minuten. Blijft hij hier hangen, dan is er
    # iets anders aan de hand dan een groeiende suite, en dan hoort hij snel
    # rood te staan in plaats van een uur te wachten.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rtgtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
      # Redis is geen luxe: twee toetsbestanden (grand-integratie, sloophamer)
      # slaan ZICHZELF over zonder REDIS_URL. Ze stonden er dus wel, maar
      # draaiden nooit -- vijftien toetsen die eruitzagen als dekking.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      # fetch-depth: 0 is GEEN gemak maar de invoer van de deltapoort hieronder.
      # Die poort vergelijkt deze wijziging met het punt waar de tak van de
      # hoofdlijn afweek; in een ondiepe kloon bestaat dat punt niet, en dan
      # zakt hij met exitcode 2 in plaats van stil groen te melden.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      # LIBXML2 IS DE SCHEIDSRECHTER van test/samlc14n.test.js. Onze eigen
      # canonicalisatie wordt daar naast die van een vreemde implementatie
      # gelegd, en die toets slaat zichzelf bewust NIET over als xmllint
      # ontbreekt: een veiligheidsmeting die niet heeft gedraaid mag er niet
      # uitzien als een groen vinkje.
      #
      # In die toets stond dat xmllint "op elke ubuntu-runner" staat. Dat was
      # niet waar -- de image van ubuntu-latest draagt hem niet, en de eerste
      # volledige suite die hem bereikte zakte met drie keer ENOENT. Een
      # aanname over de omgeving is geen omgeving; daarom staat hij hier.
      - name: libxml2 (de scheidsrechter van de c14n-toets)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Codeafspraken (check.js)
        run: npm run check
      # DE DELTAPOORT. De norm hieronder is een som over de hele codebase, en een
      # som verrekent: vijf inline stijlattributen erbij in het ene bestand en zes
      # eruit in het andere is een DALING, dus de ratel juicht terwijl het nieuwe
      # bestand zijn vijf houdt. Deze stap weigert die verrekening en keurt per
      # bestand: een nieuw bestand staat op de norm, een aangeraakt bestand zakt
      # er niet onder. Hij draait vroeg omdat hij seconden kost en een fout hier
      # niets met de rest van de baan te maken heeft.
      #
      # RTG_BASIS staat alleen bij een pull request gevuld; dan is het
      # exacte punt bekend waar de tak vandaan komt. Bij een push naar een tak is
      # de variabele leeg en zoekt de poort het aftakpunt zelf.
      - name: De deltapoort (nieuw werk staat op de norm)
        run: node scripts/deltapoort.js --toon
        env:
          RTG_BASIS: ${{ github.event.pull_request.base.sha }}
      # HET VERVAL. De ratel bewaakt de code; dit bewaakt de ratel. NORM.json kan
      # alleen met de hand losser worden gezet, en dat mag -- een poort zonder
      # uitweg wordt uitgezet -- maar niet in stilte en niet voor altijd. Deze
      # stap zakt op een verlaging zonder notitie, op een notitie zonder soort,
      # en op een schuld die over zijn vervaldatum is. Zie scripts/normverval.js.
      - name: Het verval (een verlaging heeft een reden en een einde)
        run: node scripts/normverval.js
        env:
          RTG_BASIS: ${{ github.event.pull_request.base.sha }}
      - name: Eigen AST-scan (statische analyse, geen dependency)
        run: npm run ast-scan
      - name: CI-keten gebruikt alleen exact vastgezette Actions
        run: npm run ci-keten
      # Het wettenregister mag niet stil uit elkaar lopen met de code: elke wet
      # wijst naar een letterlijke zin in zijn doctrine-document en naar de
      # bestanden die hem tegenhouden. Deze stap is STATISCH en kost seconden --
      # hij controleert of die bron en die handhavers er nog zijn, en of een
      # eerdere sabotage-uitslag nog bij het huidige recept hoort. Het ECHT
      # uitzetten van elke handhaver (npm run sabotage) duurt tientallen minuten
      # en hoort in de wekelijkse ronde, niet in elke push.
      - name: Het wettenregister klopt met de code (wetten.js --controle)
        run: node scripts/wetten.js --controle
      # HET GEZAG: hoeveel losse schalen beantwoorden de vraag "mag de machine
      # dit zelf"? Het zijn er vijf, ze kennen elkaar niet, en dat is LAT.md
      # regel 4 op de plek waar hij het duurst is. Deze stap kost seconden en
      # houdt het getal een kant op -- een zesde schaal erbij is een middag werk
      # en voelt lokaal als de nette keuze, dus zonder ratel groeit hij vanzelf.
      # Hij zakt ook als een geregistreerde schaal is hernoemd (dan meet hij
      # niets meer) of als een vastgelegde tegenspraak van vorm verandert.
      - name: Het gezag (vijf schalen voor een vraag, mag alleen krimpen)
        run: npm run gezag
      # DE ENVELOP: wat weet RTG op het moment dat een poortwachter JA zegt?
      # Zeven van de elf velden die een controlelaag nodig heeft (doel, intent,
      # wijzigingen, risicoklasse, omkeerbaarheid, context, correlatie) worden
      # door GEEN enkele poortwachter vastgesteld, en de actor draagt zeven
      # verschillende namen. Beide mogen alleen omlaag. Deze stap kost seconden
      # en zakt ook als een poortwachter zijn eigenschap niet meer zet -- dan
      # meet de meter niets meer en hoort hij te vallen, niet stil te dalen.
      - name: De envelop (wat ligt er op tafel als het gezag wordt verleend)
        run: npm run envelop
      # De hoofdsuite draait op de standaard (json) opslag; DATABASE_URL is hier
      # bewust NIET gezet, anders zouden alle testbestanden dezelfde Postgres delen.
      # test:gate draait dezelfde suite MET een dekkingsvloer (regels/branches/
      # functies): zakt de in-proces-dekking onder de vloer, dan faalt de stap.
      # De vloeren staan bewust een paar punten onder de gemeten basislijn zodat
      # normale ruis niet flaket, maar echte terugval hard opvalt.
      #
      # GEMETEN OP 25 AUGUSTUS 2026, parallelle groep (953 van 962 bestanden):
      #   regels 81,22  takken 80,64  functies 68,63   -> vloer 78 / 78 / 65
      # (daarvoor, 17 augustus 2026, hele suite van 6520 toetsen:
      #   regels 80,63  takken 80,60  functies 67,73)
      #
      # DE VLOER MEET DE SUITE MINUS DE GEISOLEERDE BESTANDEN, en dat is sinds
      # 25 augustus 2026 zo. test:gate was tot dan een eigen aanroep --
      # `node --test test/*.test.js` -- en ging daarmee langs
      # scripts/test-runner.js heen, en dus langs de isolatielijst in
      # scripts/lib/geisoleerd.js. Omdat dit de ENIGE suite-run in deze keuring
      # is, zijn de bronmuterende toetsen hier nooit geisoleerd geweest: vier
      # toetsen zijn erop omgevallen zonder dat er iets mis was (excursie en
      # horeca-host hier, negenplus en schakelkast-dekking lokaal), telkens
      # doordat een server bootte terwijl envelop.test.js `function gastAuth(`
      # had hernoemd of meterijk.test.js een tijdelijk bestand had staan.
      #
      # De negen geisoleerde bestanden draaien nu ERNA, een voor een, ZONDER
      # vloer. Node meet dekking per proces, dus een los bestand haalt nooit
      # 78% van de hele boom; een vloer daarop zou alleen nog meten hoe groot
      # dat ene bestand is. Ze draaien wel en ze zakken ook gewoon -- ze tellen
      # alleen niet mee in het dekkingscijfer.
      #
      # Dat het cijfer daardoor niet KELDERDE is gemeten en niet gehoopt: de
      # nieuwe indeling staat op 81,22 / 80,64 / 68,63, boven de oude meting
      # over alles. De vloer kon dus blijven staan waar hij stond.
      #
      # Daarvoor stonden de vloeren op 58/74/47 terwijl deze opmerking 63/80/51
      # als basislijn noemde: twee getallen die geen van beide meer klopten, en
      # ruim 22 punten lucht op regels en functies. Een vloer die zo diep onder
      # de stand ligt bewaakt niets -- er kon een vijfde van de dekking wegvallen
      # zonder dat de stap rood werd. Bij de volgende meting hoort de vloer weer
      # mee op te schuiven; dat is dezelfde ratel als NORM.json.
      # RTG_ROUTELOG laat elke kindserver opschrijven welk ROUTEPATROON hij heeft
      # afgehandeld. Dat kost niets extra's in deze stap en levert de volgende
      # stap een waargenomen dekkingscijfer in plaats van een tekstzoektocht
      # door de tests. Zie server/routelog.js en scripts/dekking.js.
      # EEN GEZAKTE TOETS MOET TE LEZEN ZIJN, ANDERS IS HET GEEN SIGNAAL.
      # Deze stap zakte een keer met drie rode toetsen, en die namen waren niet
      # meer te achterhalen: node zet "not ok" op de plek waar de toets draaide,
      # daarna komt de dekkingstabel van ruim tweeduizend regels overheen, en de
      # log-API levert alleen de STAART. Het downloadadres van het volledige log
      # ligt achter een andere host, die niet altijd bereikbaar is. Wie dan een
      # rode stap ziet, weet alleen DAT er iets zakte. Vandaar de herhaling
      # onderaan, na de tabel, waar ze wel te vinden is.
      # Die herhaling gaf eerst alleen de NAAM terug ("not ok 5861 - ..."), en
      # niet de reden. Daarmee begon iedereen alsnog bij het lokaal naspelen van
      # de hele suite; op 18 augustus 2026 kostte dat een ochtend. Sindsdien komt
      # het hele TAP-blok mee: de bewering, de verwachte en de gevonden waarde en
      # de stapel. Zie scripts/gezakte-toetsen.js.
      - name: De dekking van alle vier de scherven ophalen
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: dekking-*
          path: dekking-scherven
          merge-multiple: true
      - name: De dekkingsvloer, over alle scherven opgeteld
        # Fail-closed: ontbreekt er een scherf, dan wordt er NIET gerekend. Een
        # som over drie van de vier is geen lagere dekking maar een andere
        # meting, en die hoort niet te bepalen of een tak doorkomt.
        run: node scripts/dekkingsvloer.js --scherven 4

      # Elke toetsscherf en ijking schrijft zijn eigen routejournaal. Voeg ze
      # samen voordat de aparte dekkingsjob ze naast het schermjournaal legt.
      - name: De routejournalen van de scherven en ijkingen ophalen
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: routejournaal-*
          path: routejournalen
      - name: De routejournalen samenvoegen
        run: |
          test "$(find routejournalen -name routejournaal.log -type f | wc -l)" -eq 10
          cat routejournalen/routejournaal-*/routejournaal.log > routejournaal.log
      - name: Routejournaal bewaren voor de dekkingsjob
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: routejournaal
          path: routejournaal.log
          retention-days: 1
          if-no-files-found: error

      # De PostgreSQL-opslag, -accounts en chaos-test apart, met DATABASE_URL alleen
      # voor deze stap. Serieel (--test-concurrency=1): pg.test.js en chaos delen de
      # kv-tabel en zouden elkaar bij parallel draaien resetten.
      # Elk bestand in een EIGEN database (scripts/pgtoetsen.js). Serieel draaien
      # was niet genoeg: deze toetsen maken en droppen dezelfde tabellen, dus
      # begon nummer vijf op wat nummer vier had achtergelaten. Daardoor stonden
      # hier drie van de acht bestanden -- de andere vijf draaiden nooit.
      - name: PostgreSQL-integratietests (elk in een eigen database)
        run: node scripts/pgtoetsen.js
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rtgtest
          RTG_VAULT_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          RTG_SECRET_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210

  norm:
    name: De norm, de instroom en de build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # DE NORM: een ratel, geen rapportcijfer. NORM.json legt vast waar de code
      # staat; deze stap zakt zodra een van die meters SLECHTER wordt. Beter mag
      # altijd -- dan meldt hij dat de norm strakker gezet kan worden. Zonder
      # deze stap zakt kwaliteit weg zonder dat iemand een besluit neemt.
      - name: De norm (mag alleen strakker, nooit losser)
        run: npm run norm

      # EN DE LAT ZELF. NORM.json staat IN de tak, dus een tak kan hem verzetten
      # en dan meet de stap hierboven de code tegen een lat die in dezelfde
      # commit is verlaagd. Deze stap legt hem naast die van main: strakker mag
      # altijd, losser alleen met een reden in `notities` die de meter bij naam
      # noemt. De fetch is er omdat de checkout ondiep is en origin/main hier
      # anders niet bestaat -- en dan zakt normbasis.js liever dan dat hij
      # stilzwijgend slaagt.
      - name: De basislijn van de norm (verlagen mag, stilletjes niet)
        run: |
          git fetch --depth=1 origin main
          node scripts/normbasis.js --tegen FETCH_HEAD

      # DE INSTROOM, NAAST DE VOORRAAD. endpointsZonderTest is een TOTAAL: een
      # tak die drie routes toevoegt en er vier laat toetsen komt er groen
      # doorheen. TAKEN.md 4.3 noemde 622 ongedekte endpoints, vandaag zijn het
      # er 1192, en de ratel heeft in die hele periode niet een keer geklaagd --
      # hij bewaakte de voorraad en niemand bewaakte wat erbij kwam. Deze stap
      # draait de routekaart hier en in een worktree van main, en eist een toets
      # voor het verschil. De fetch van de stap hierboven maakt FETCH_HEAD.
      # TIJDELIJK UIT, EN MET EEN DATUM WAAROP HIJ TERUGKOMT (27 augustus 2026).
      #
      # Deze stap meet de basis MET DE BASIS: hij start de server van main op in
      # een worktree om diens routekaart te maken. Die server van main komt niet
      # door het opstarten heen -- hij drukt zijn hele opstartregel af en eindigt
      # daarna nooit. Lokaal achttien minuten zonder resultaat, in CI liep hij op
      # de grens van drie minuten af; onze eigen boom doet dezelfde kaart in DRIE
      # SECONDEN, ook in een verse worktree zonder datamap. Het ligt dus niet aan
      # opbouwen-vanaf-nul maar aan de servercode van main, en juist deze
      # samenvoeging repareert dat. Zolang hij aanstaat blokkeert de poort de
      # merge die hem weer laat werken.
      #
      # WAT ER ONDERTUSSEN WEL BEWAAKT WORDT: de deltapoort hierboven dwingt
      # dezelfde regel af op alles wat deze wijziging aanraakt
      # ("nieuw-endpoint-zonder-toets"), en die is gehaald. Wat hier wegvalt is de
      # vergelijking over de HELE kaart, niet de regel zelf.
      #
      # AANZETTEN ZODRA MAIN DEZE SAMENVOEGING DRAAGT. Haal dan het commentaar
      # weg en draai de stap een keer met de hand: `git fetch --depth=1 origin
      # main && node scripts/nieuweroutes.js --tegen FETCH_HEAD`. Komt hij door,
      # dan hoort hij hier gewoon weer te staan.
      # - name: Nieuwe routes komen met een toets
      #   run: node scripts/nieuweroutes.js --tegen FETCH_HEAD
      - name: Frontend-build (minify + service-worker-cache)
        run: npm run build
      - name: Build is idempotent (geen ongecommitte wijziging aan de bron)
        run: git diff --exit-code -- public server scripts

  security:
    name: Kwetsbare dependencies (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'
      # Eerst het volledige rapport tonen (faalt niet), zodat ook moderate/low
      # zichtbaar zijn in de log; daarna de harde poort op high + critical.
      - name: Volledig audit-rapport (informatief)
        run: npm audit || true
      - name: Harde poort - faal op kwetsbare dependencies (high/critical)
        run: npm audit --audit-level=high
      - name: Secret-scan - faal op gelekte sleutels/tokens in de broncode
        run: npm run secrets

  dependency-review:
    name: Nieuwe dependencies beoordelen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Blokkeer nieuwe high/critical kwetsbaarheden
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  ladder:
    # DE LADDER, de meest complete aanvalsproef van dit huis: dertien treden van
    # een kleuter die op alles ramt tot een aanvaller die weet wat hij doet,
    # tegen een ECHTE server, met 3878 pogingen.
    #
    # Hij hing tot 18 augustus 2026 aan NIETS -- niet aan deze pijplijn, niet aan
    # de weekronde, niet aan een meter -- en draaide dus alleen als iemand eraan
    # dacht. Dat was geen slordigheid maar een gevolg: hij kon niet groen worden.
    # Twaalf bewust-openbare routes stonden niet in zijn publieke lijst, een 503
    # uit de schakelkast telde als serverfout, en de begane grond toetste op
    # seed-gegevens die weggedreven waren. Een proef die per definitie rood staat
    # kan nergens aan hangen.
    #
    # EIGEN BAAN, dus hij draait naast de tests in plaats van erachteraan: vier
    # minuten die de kritieke lijn niet verlengen. Hij zakt op een bevinding EN
    # op minder proberen dan de norm (ladderRaak en ladderNietGeprobeerd in
    # NORM.json) -- nul bevindingen is anders te halen door niets meer te doen.
    name: De ladder (aanvalsproef tegen een echte server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Van kleuter tot aanvaller
        run: node scripts/ladder.js
      - name: De uitslag bewaren, ook als hij zakt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ladder-uitslag
          path: LADDER.json
          if-no-files-found: warn

  rolronde:
    # DE ROLSCHEIDING, gevraagd aan een echte server in plaats van aan de bron.
    # test/auth-rol.test.js beloofde "ELK leden-endpoint" en herkende er 1374;
    # een grendel die in de BODY van de handler staat viel buiten zijn
    # uitdrukking. Deze ronde klopt met drie rollen (anoniem, lid, leverancier,
    # kantoor) op elke route en vindt er 1444 -- zeventig meer, en die zeventig
    # waren nog nooit op rolscheiding beproefd.
    #
    # Eigen baan om dezelfde reden als de ladder: minuten die de kritieke lijn
    # niet verlengen. Hij zakt op een gat EN op minder beproeven dan de norm --
    # nul gaten is anders te halen door minder te onderzoeken.
    name: De rolronde (welke rol komt waar binnen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Elke rol op elke route
        run: node scripts/rolronde.js
      - name: De uitslag bewaren, ook als hij zakt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rolronde-uitslag
          path: ROLRONDE.json
          if-no-files-found: warn

  gluurronde:
    # DE HORIZONTALE SCHEIDING: mag lid A bij de spullen van lid B? De rolronde
    # doet de verticale vraag (welke ROL komt waar binnen); deze doet de
    # moeilijke: A heeft een geldig token, de deur gaat terecht open, en de
    # scheiding moet per opvraging gebeuren.
    #
    # Twee echte leden leggen allebei een leven aan via elke aanmaakroute, en
    # daarna krijgt A drie vragen: ziet hij iets van B zonder erom te vragen,
    # krijgt hij iets als hij B's identificator instuurt, en staan B's spullen
    # er daarna nog. Bijna 8000 vragen.
    #
    # DE ZELFPROEF STAAT ER APART BIJ, en met reden: de vernielingscontrole is
    # de enige die een schrijflek kan zien, en drie pogingen om hem met een
    # opzettelijk gat te beproeven sloegen af op de opslagvorm. Deze stap laat B
    # zelf iets weggooien en eist dat de controle dat ziet. Een ronde waarvan de
    # scherpste controle niets meet, is groen zonder betekenis.
    name: De gluurronde (mag A bij de spullen van B)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Slaat de vernielingscontrole echt uit? (zelfproef)
        run: node scripts/gluurronde.js
        env:
          GLUUR_ZELFPROEF: '1'
      - name: A tegen B
        run: node scripts/gluurronde.js
      - name: De uitslag bewaren, ook als hij zakt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gluurronde-uitslag
          path: GLUURRONDE.json
          if-no-files-found: warn
  # PR #58 wilde het runtime-image van node:22-slim naar node:26-slim tillen en
  # kreeg zes groene vinkjes, terwijl geen enkele job de container aanraakte:
  # release-image.yml bouwt pas bij een release, en de keuring hierboven draait
  # op de Node van de runner. Deze job draait de echte server met de echte CMD
  # in de Node uit de Dockerfile -- geen imagebouw, dus geen Rust-fase van
  # minuten op elke PR. Wat hij niet dekt (Rust-fase, COPY, rechten) staat in
  # de kop van het script.
  container:
    name: De container komt op
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: De Node uit de Dockerfile draait de CMD uit de Dockerfile
        run: node scripts/containerproef.js

  a11y:
    # OPGEDEELD METEN, EEN KEER OORDELEN. Deze scan was met ruim een kwartier de
    # op een na langste job, en hij kon lang NIET opgedeeld worden: zijn oordeel
    # is een budget over de hele ronde (A11Y-INGELOGD.json, vandaag overal nul),
    # en vier delen die elk hun kwart tegen dat hele budget leggen laten samen
    # vier keer zoveel door -- alle vier groen.
    #
    # Sinds 27 augustus 2026 is de meting van het oordeel gescheiden
    # (BESTUUR.md): elk deel meet zijn kwart en schrijft ruwe tellingen weg, en
    # de job `a11y-oordeel` hieronder telt ze op en velt daarna EEN keer het
    # oordeel -- tegen precies hetzelfde budget als toen alles in een job zat.
    # test/a11yoordeel.test.js laat dat zakken zodra iemand het per deel gaat
    # afrekenen; die toets heeft geen browser nodig.
    name: Toegankelijkheid deel ${{ matrix.deel }} van 4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        deel: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Playwright + Chromium
        run: |
          npm i --no-save playwright@^1.49.0
          npx playwright install --with-deps chromium
      # De scan gaat over ALLE schermen, uitgelogd en ingelogd, en sinds de
      # raakvlakronde nog een derde keer op telefoonformaat. Dit deel meet zijn
      # kwart daarvan en oordeelt niet.
      - name: Eigen a11y-scan (dit kwart), uitgelogd + ingelogd + raakvlak
        run: node scripts/a11y.js --deel=${{ matrix.deel }}/4 --meting=a11ymeting/deel-${{ matrix.deel }}.json
        env:
          A11Y_STRICT: '1'
      - name: De meting van dit deel bewaren
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: a11ymeting-deel-${{ matrix.deel }}
          path: a11ymeting/
          if-no-files-found: error
          retention-days: 5

  a11y-oordeel:
    name: Toegankelijkheid - het oordeel over alle delen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: a11y
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: De metingen van de vier delen ophalen
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: a11ymeting-deel-*
          path: a11ymeting
      # --delen=4 is de helft van de grendel: minder metingen dan beloofde delen
      # zakt. De andere helft zit in het script zelf -- de delen samen moeten
      # ELK scherm hebben gezien dat scripts/schermen.js kent, anders oordeelt
      # hij over een gat en dat is geen oordeel.
      - name: Het oordeel over de hele ronde
        run: node scripts/a11y-oordeel.js a11ymeting --delen=4

  schermen:
    name: Schermtoetsen deel ${{ matrix.deel }} van 4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        deel: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Playwright + Chromium
        run: |
          npm i --no-save playwright@^1.49.0
          npx playwright install --with-deps chromium
      # RTG_E2E_STRICT=1 zegt: deze omgeving BELOOFT schermtoetsen te draaien.
      # test/browserpoort.e2e.js zakt dan als er geen browser is. Zonder die
      # vlag slaan drieenveertig e2e-bestanden zichzelf stil over als Chromium
      # ontbreekt, en meldt de stap "0 fail" -- groen zonder iets gezien te
      # hebben. De stap hierboven installeert de browser; deze vlag controleert
      # dat dat ook echt gelukt is.
      #
      # BINNEN EEN DEEL BLIJFT HET SERIEEL, en dat is bewust: elk bestand start
      # een echte server en vaak een Chromium. Met concurrency 2 wisselde onder
      # runnerbelasting alleen WELK goed scherm zijn lokale 8/20s-grens miste
      # (Boeken, daarna Mobiliteit). De winst van het opdelen komt van vier
      # MACHINES, niet van meer processen op dezelfde machine.
      #
      # Dezelfde herhaling van gezakte toetsen als bij de unit-toetsen, en om
      # dezelfde reden: zakt er een, dan staat zijn blok duizenden regels hoger.
      - name: Scherm-tests (PDA in de browser)
        run: |
          set -o pipefail
          uitslag=0
          npm run e2e -- --deel=${{ matrix.deel }}/4 2>&1 | tee /tmp/e2e.log || uitslag=$?
          if [ "$uitslag" -ne 0 ]; then node scripts/gezakte-toetsen.js /tmp/e2e.log; fi
          exit "$uitslag"
        env:
          RTG_E2E_STRICT: '1'
      # Elk deel schrijft alleen zijn eigen kwart van het schermjournaal. Een
      # kwart op zichzelf beoordelen zou alle toetsen uit de andere drie delen
      # ten onrechte als ontbrekend aanmerken. Bewaar de vier delen daarom met
      # een unieke naam; de job hieronder voegt ze eerst samen en oordeelt pas
      # daarna over de volledige ronde.
      - name: Schermjournaal van dit deel bewaren
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: schermjournaal-deel-${{ matrix.deel }}
          path: .schermjournaal
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  schermen-oordeel:
    name: Schermdekking - het oordeel over alle delen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: schermen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: De journalen van de vier delen ophalen
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: schermjournaal-deel-*
          path: journalen/scherm
      - name: De vier delen samenvoegen
        run: |
          : > .schermjournaal
          for deel in 1 2 3 4; do
            bestand="journalen/scherm/schermjournaal-deel-${deel}/.schermjournaal"
            test -s "$bestand"
            cat "$bestand" >> .schermjournaal
          done
      # "Af" is geen bewering meer. Pas de volledige ronde mag de norm in
      # NORM.json toetsen; zo is een ontbrekende scherf een storing en geen
      # verzonnen verslechtering van de schermdekking.
      - name: Schermdekking (welke apps heeft een toets echt geopend)
        run: node scripts/schermen.js
      # Dezelfde samengevoegde waarneming gaat naar de endpoint-dekkingsjob.
      - name: Volledig schermjournaal bewaren voor de dekkingsjob
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: schermjournaal
          path: .schermjournaal
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  # DE WAARGENOMEN DEKKING, EN WAAROM HIJ EEN EIGEN JOB HEEFT.
  #
  # De teller in de keuring zoekt routenamen in de TEKST van de tests: te laag
  # voor suites die een hulpje gebruiken, en op te poetsen met een
  # zoek-en-vervang. scripts/dekking.js vraagt het niet aan de tekst maar aan de
  # server -- wat in het routejournaal staat is echt aangeroepen.
  #
  # Maar dat journaal wordt op TWEE plekken geschreven: `npm test` in de job
  # "test" en `npm run e2e` in de job "schermen". Deze stap stond eerst in de job
  # "test" en oordeelde dus over een meting die de hele schermsuite miste. Nu
  # wacht hij op allebei en telt hij de unie; de meter zegt zelf bovenaan welke
  # journalen meetelden, zodat een ontbrekende suite niet stil verdwijnt.
  #
  # `needs` op allebei betekent ook: is een van de twee rood, dan valt dit
  # oordeel weg. Dat is met opzet -- een dekkingscijfer over een suite die niet
  # is afgelopen, is geen cijfer.
  dekking:
    name: Waargenomen endpoint-dekking (beide journalen)
    runs-on: ubuntu-latest
    needs: [test, schermen-oordeel]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Het journaal van npm test ophalen
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: routejournaal
          path: journalen/test
      - name: Het journaal van de schermsuite ophalen
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: schermjournaal
          path: journalen/scherm
      # De vloer staat in NORM.json (dekkingWaargenomenPct), het plafond in
      # endpointsNooitAangeraakt. Die tweede is de scherpe: een afgerond
      # percentage dekt tot een stuk of twaalf endpoints die nooit zijn geraakt.
      - name: Waargenomen endpoint-dekking (uit beide routejournalen)
        run: |
          node scripts/dekking.js \
            --lees journalen/test/routejournaal.log \
            --lees journalen/scherm/.schermjournaal
