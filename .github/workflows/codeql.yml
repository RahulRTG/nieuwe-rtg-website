# CodeQL: GitHub's statische code-analyse (SAST). Zoekt bekende bug- en
# kwetsbaarheidspatronen in de JavaScript-broncode (injecties, onveilige
# regexes, path-traversal, enz.) en meldt ze in het Security-tabblad.
# Werkt gratis op publieke repositories; op privé-repos vereist het GitHub
# Advanced Security. Draait bij pushes/PR's naar de hoofdlijn en wekelijks.
name: CodeQL
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '30 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: CodeQL initialiseren
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyse uitvoeren
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
      - name: Nul bevindingen op deze commit bewijzen
        run: node scripts/codeql-verdict.js --dir=codeql-results --out=.release/codeql-verdict.json
      - name: Commitgebonden CodeQL-verdict bewaren
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-verdict
          path: .release/codeql-verdict.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
