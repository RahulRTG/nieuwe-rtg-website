# CodeQL: GitHub's statische code-analyse (SAST). Zoekt bekende bug- en
# kwetsbaarheidspatronen in de JavaScript-broncode (injecties, onveilige
# regexes, path-traversal, enz.) en meldt ze in het Security-tabblad.
# Werkt gratis op publieke repositories; op privé-repos vereist het GitHub
# Advanced Security. Draait bij pushes/PR's naar de hoofdlijn en wekelijks.
name: CodeQL
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '30 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: CodeQL initialiseren
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyse uitvoeren
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:javascript-typescript"
