name: Desktop- en mobielstandaard
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-standard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  all-screens:
    name: Alle schermen op ${{ matrix.width }} px
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 390]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: node scripts/browserinstall.js
      - if: matrix.width == 390
        run: npx playwright install --with-deps webkit
      - if: matrix.width == 390
        name: TIJDELIJK - WebKit-hervatten twaalf keer (gaat eruit voor review)
        run: for i in $(seq 1 12); do echo "ronde $i"; node --test --test-concurrency=1 --test-name-pattern="webkit: Pass" test/mobile-content.e2e.js || exit 1; done
        env:
          RTG_TEST_WEBKIT: '1'
      - run: npm run desktop:controle -- --width ${{ matrix.width }}
      - if: matrix.width == 1440
        run: node --test --test-concurrency=1 test/warm-presentation.e2e.js test/world-desktop-identity.e2e.js
      - if: matrix.width == 390
        run: node --test --test-concurrency=1 test/mobile-content.e2e.js test/pass-startup.e2e.js test/world-palette.e2e.js
        env:
          RTG_TEST_WEBKIT: '1'
      - if: matrix.width == 390
        name: Living Experience contract en daadwerkelijke pilotproeven
        run: npm run experience:prove
      - name: Bewaar rapport en schermafbeeldingen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-standard-${{ matrix.width }}
          path: |
            artifacts/desktop-standard/
            artifacts/mobile-content/
            artifacts/world-palette/
            artifacts/experience/
          if-no-files-found: error
