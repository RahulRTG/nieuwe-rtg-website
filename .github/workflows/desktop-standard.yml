name: Desktopstandaard
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-standard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  all-screens:
    name: Alle schermen gebruiken dezelfde desktopstandaard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: node scripts/browserinstall.js
      - run: npm run desktop:controle
      - name: Bewaar rapport en schermafbeeldingen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-standard
          path: artifacts/desktop-standard/
          if-no-files-found: error
