name: Desktop- en mobielstandaard
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-standard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  all-screens:
    name: Alle schermen op ${{ matrix.width }} px
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 390]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: node scripts/browserinstall.js
      - if: matrix.width == 390
        run: npx playwright install --with-deps webkit
      - run: npm run desktop:controle -- --width ${{ matrix.width }}
      - if: matrix.width == 1440
        run: node --test --test-concurrency=1 test/warm-presentation.e2e.js test/world-desktop-identity.e2e.js
      - if: matrix.width == 390
        run: node --test --test-concurrency=1 test/mobile-content.e2e.js test/pass-startup.e2e.js test/world-palette.e2e.js
        env:
          RTG_TEST_WEBKIT: '1'
      - if: matrix.width == 390
        name: Living Experience contract en daadwerkelijke pilotproeven
        run: npm run experience:prove
      - name: Bewaar rapport en schermafbeeldingen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-standard-${{ matrix.width }}
          path: |
            artifacts/desktop-standard/
            artifacts/mobile-content/
            artifacts/world-palette/
            artifacts/experience/
          if-no-files-found: error
  webkit-kernroutes:
    # DE KERNROUTES IN WEBKIT, de motor van Safari en van elke browser op iOS.
    # De kantoordeur liep op de iPhone van de eigenaar vast terwijl alle
    # schermtoetsen in Chromium groen waren (CONSOLIDATIE.md, fase 2). Deze job
    # draait de lanceerbare kern -- het kantoor, Edge, Rahul, Pay en reizen --
    # in WebKit via startBrowser() in test/helper.js. RTG_EIS_INFRA maakt een
    # ontbrekende browser een fout en geen stille overslag. Wat WebKit hier niet
    # kan (een virtuele passkey) staat op de iPhone-checklist.
    name: Kernroutes in WebKit (Safari-motor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: node scripts/browserinstall.js
      - name: Belasting (alleen op deze proeftak, nooit naar main)
        run: for i in $(seq 1 20); do echo "=== RONDE $i"; RTG_TEST_MOTOR=webkit node --test test/reisschermen.e2e.js > uit-r.txt 2>&1; echo "reisschermen exit $?"; grep -E "^ℹ (pass|fail)|internal error|Error:|evaluating|navigating to|paginafouten" uit-r.txt | head -12; RTG_TEST_WEBKIT=1 node --test test/mobile-content.e2e.js > uit-m.txt 2>&1; echo "mobile-content exit $?"; grep -E "^ℹ (pass|fail)|internal error|Error:|reload|navigating to" uit-m.txt | head -12; done
        env:
          RTG_EIS_INFRA: '1'
