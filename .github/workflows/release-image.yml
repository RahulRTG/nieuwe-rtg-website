name: Productie-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # xmllint is de scheidsrechter van test/samlc14n.test.js en die toets slaat
      # zichzelf niet over; ubuntu-latest draagt hem niet. Zie ci.yml voor waarom.
      - name: libxml2 (de scheidsrechter van de c14n-toets)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Releasepoort
        run: npm run check
      - name: Server- en integratietoetsen
        run: npm test
      - name: Docker Compose live-overlay is geldig
        run: docker compose -f docker-compose.yml -f docker-compose.live.yml config --quiet
        env:
          RTG_BACKUP_HOST_DIR: /tmp/rtg-backups
          RTG_PUBLISH_HOST: 0.0.0.0
          RTG_PUBLISH_PORT: "443"
          RTG_CONTAINER_PORT: "443"
          RTG_ENV_FILE: .env.example
          RTG_POSTGRES_PASSWORD_FILE: .env.example
      - name: Bepaal immutable GHCR-tag
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="${GITHUB_REF_NAME}"; else tag="sha-${GITHUB_SHA::12}"; fi
          echo "RTG_RELEASE_IMAGE=ghcr.io/$repo:$tag" >> "$GITHUB_ENV"
      # De materiaallijst hoort bij DEZE commit en wordt daarom hier gemaakt en
      # niet uit de repository gelezen: een SBOM die iemand vergat bij te werken,
      # beschrijft een andere release dan er wordt gepubliceerd.
      # WELKE BASIS-IMAGES ZIJN ER WERKELIJK GETROKKEN. Een tag is geen afdruk;
      # pinnen op een digest is een besluit met onderhoud eraan (SBOM.md). Wat
      # hier gebeurt is het goedkope deel dat dat besluit mogelijk maakt: van
      # elke release vastleggen UIT WELKE images hij is gebouwd. Zonder pullen,
      # rechtstreeks bij het register opgevraagd.
      - name: Digests van de basis-images vastleggen
        shell: bash
        run: |
          docker buildx create --use --driver docker-container
          echo '{"uitleg":"De digests die de pijplijn werkelijk trok. Gegenereerd in release-image.yml.","images":{}}' > BASISIMAGES.json
          for ref in $(grep -oPi '^FROM\s+\K\S+' Dockerfile | grep ':' | sort -u); do
            d=$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}' 2>/dev/null || true)
            if [ -n "$d" ]; then
              node -e 'const f="BASISIMAGES.json",j=require("./"+f);j.images[process.argv[1]]=process.argv[2];
                require("fs").writeFileSync(f,JSON.stringify(j,null,2)+"\n")' "$ref" "$d"
              echo "$ref -> $d"
            else
              echo "LET OP: geen digest gevonden voor $ref; hij komt zonder in de lijst."
            fi
          done
      - name: Materiaallijst (SBOM) en bronafdruk
        shell: bash
        run: |
          npm run sbom
          afdruk="$(node -e 'process.stdout.write(require("./SBOM.json").eigenCode.afdruk)')"
          echo "RTG_BRON_AFDRUK=$afdruk" >> "$GITHUB_ENV"
          echo "RTG_BOUW_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "Bronafdruk: $afdruk"
      - name: De materiaallijst bewaren bij de run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: |
            SBOM.json
            BASISIMAGES.json
      - name: Login op GitHub Container Registry
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # BOUWEN MET HERKOMST. `--provenance=mode=max` laat BuildKit een
      # SLSA-provenance-attestatie meepubliceren (welke bron, welke bouwstappen,
      # welke builder), `--sbom=true` een materiaallijst van het image zelf.
      # Allebei komen ze naast het image in het register te staan en zijn ze op
      # te vragen met `docker buildx imagetools inspect`.
      #
      # WAT DIT WEL EN NIET IS, en dat hoort erbij: dit is provenance van de
      # BOUWER (BuildKit in deze workflow). Het is geen door sigstore
      # ondertekende attestatie op naam van GitHub -- dat is een volgende stap en
      # vraagt een extra actie plus `id-token: write`. Zie SBOM.md.
      - name: Bouw en publiceer exact één app/motor-image, met herkomst
        run: |
          docker buildx build --pull --push \
            --provenance=mode=max --sbom=true \
            --build-arg "RTG_BOUW_COMMIT=$GITHUB_SHA" \
            --build-arg "RTG_BRON_AFDRUK=$RTG_BRON_AFDRUK" \
            --build-arg "RTG_BOUW_AT=$RTG_BOUW_AT" \
            --tag "$RTG_RELEASE_IMAGE" .
          echo "Gepubliceerd: $RTG_RELEASE_IMAGE"
          echo "Herkomst opvraagbaar met: docker buildx imagetools inspect $RTG_RELEASE_IMAGE --format '{{ json .Provenance }}'"
          echo "RTG_IMAGE_DIGEST=$(docker buildx imagetools inspect "$RTG_RELEASE_IMAGE" --format '{{ .Manifest.Digest }}')" >> "$GITHUB_ENV"

      # HET RELEASEZEGEL. Ondertekend met een EIGEN sleutel (besluit van de
      # eigenaar): dat bewijst dat RTG achter deze combinatie image-digest +
      # bronafdruk + commit staat. Het bewijst NIET dat GitHub het heeft gebouwd
      # -- de vertrouwensbron blijft RTG. Zie SBOM.md.
      #
      # Met openssl en niet met een ondertekengereedschap van een derde: bij een
      # supply-chain-functie is een extra binary in de keten precies de verkeerde
      # toevoeging. Verifieren kan iedereen met RELEASE.pub uit de repository:
      #   node scripts/releasezegel.js --verifieer RELEASE.json RELEASE.sig
      - name: Het releasezegel zetten
        shell: bash
        env:
          RTG_RELEASE_SLEUTEL: ${{ secrets.RTG_RELEASE_SLEUTEL }}
        run: |
          node scripts/releasezegel.js --maak --image "$RTG_RELEASE_IMAGE" --digest "$RTG_IMAGE_DIGEST"
          if [ -z "$RTG_RELEASE_SLEUTEL" ]; then
            echo "LET OP: er is geen RTG_RELEASE_SLEUTEL ingesteld; deze release wordt NIET ondertekend."
            echo "        Maak er een met: node scripts/releasesleutel.js"
            exit 0
          fi
          printf '%s' "$RTG_RELEASE_SLEUTEL" > /tmp/release.key
          openssl pkeyutl -sign -inkey /tmp/release.key -rawin -in RELEASE.json -out /tmp/release.sig
          base64 -w0 /tmp/release.sig > RELEASE.sig
          shred -u /tmp/release.key
          node scripts/releasezegel.js --verifieer RELEASE.json RELEASE.sig

      # DE KWETSBAARHEIDSSCAN. Niet-blokkerend, en dat is met opzet: een vals
      # alarm hoort geen release tegen te houden, en blokkerend maken is later
      # een schakelaar. Trivy draait als CONTAINER en niet als GitHub-actie --
      # zelfde vertrouwensmodel als de basis-images die hier al draaien, en hij
      # LEEST alleen; hij bepaalt niet wat er wordt gepubliceerd.
      #
      # De uitslag komt als artefact bij de run. Faalt de scanner zelf, dan staat
      # dat er hardop: een scan die stil overslaat, ziet eruit als een schone scan.
      - name: Kwetsbaarheden scannen (leest alleen, blokkeert niet)
        shell: bash
        run: |
          set +e
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasecurity/trivy:latest image --scanners vuln --format json \
            --output /dev/stdout "$RTG_RELEASE_IMAGE" > TRIVY.json 2> TRIVY.log
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "LET OP: de scanner is zelf niet goed gedraaid (code $code). Dit is GEEN schone uitslag."
            tail -20 TRIVY.log || true
          else
            node -e 'const r=require("./TRIVY.json");const t={};
              for (const x of (r.Results||[])) for (const v of (x.Vulnerabilities||[])) t[v.Severity]=(t[v.Severity]||0)+1;
              console.log("Gevonden: "+(Object.keys(t).length?JSON.stringify(t):"niets"));' || true
          fi

      - name: De uitslag van de scan bewaren bij de run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kwetsbaarheden
          path: |
            TRIVY.json
            TRIVY.log
          if-no-files-found: warn

      - name: Het zegel bewaren bij de run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: releasezegel
          path: |
            RELEASE.json
            RELEASE.sig
          if-no-files-found: warn
