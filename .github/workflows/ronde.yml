### DE RONDE -- de zware metingen draaien vanzelf, niet als iemand eraan denkt.
#
# CI (ci.yml) draait bij elke push en moet daarom snel blijven. De Beproeving
# duurt een kwartier en de dekkingsronde nog eens twintig minuten; die passen
# daar niet in, en zijn dus tot nu toe alleen gedraaid als iemand ze met de
# hand startte. Dat is precies de vorm waarin een ratel verslapt: NORM.json
# staat vol tanden die alleen bewegen als er een mens langskomt.
#
# Deze workflow draait ze wekelijks. Wat hij WEL en NIET afdwingt is bewust
# verschillend, en dat verschil is het hele punt:
#
#   MACHINE-ONAFHANKELIJK -> harde poort.
#     De Beproeving heeft eigen drempels (nul onverwachte 5xx, rol-scheiding,
#     geld op de cent, misbruik geweigerd, dekking). Die gaan niet over hoe
#     snel de runner is, dus als er een zakt, zakt deze workflow.
#
#   MACHINE-AFHANKELIJK -> alleen oordelen na bewezen vergelijkbaarheid.
#     p99 en event-loopvertraging op een andere runner zijn andere getallen.
#     De CI-validator eist daarom exact dezelfde bronvingerafdruk als NORM.json
#     en een kalibratie binnen factor 1,4. Klopt die herkomst niet, dan zegt de
#     job niet "slechter" maar zakt hij fail-closed als ONVERGELIJKBAAR. Klopt
#     zij wel, dan zijn de prestatielatten echte poorten -- inclusief verlopen
#     schulden; een gewone PASS van het brede harnas is dan niet genoeg.
#
# Wie hem tussendoor wil draaien: de Actions-tab, "Run workflow".

name: De ronde (wekelijks)

on:
  schedule:
    # zondagnacht 03:17 UTC. Een oneven minuut met opzet: precies op het uur
    # staat de wachtrij van GitHub vol en wachten runs onnodig lang.
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      omvang:
        description: 'Welke zware ronde wilt u handmatig draaien?'
        required: true
        default: 'beproeving'
        type: choice
        options:
          - beproeving
          - alles

permissions:
  contents: read

# PIPEFAIL, EN DAT IS GEEN NETHEID MAAR EEN GEVONDEN FOUT. Elke zware stap
# hieronder eindigt op `| tee <log>`, en de uitgangscode van een pijp is die van
# het LAATSTE onderdeel -- dus die van `tee`, en die is altijd 0. Een harnas dat
# met code 1 zakte, kwam hier dus groen door. Gemeten op 9 september 2026: de
# ijking van de heapproef gaf terecht code 1 (hij vond het ingebouwde lek niet)
# en de aanroep meldde 0.
#
# De standaardschil van een `run:`-stap is `bash -e {0}` -- WEL -e, GEEN
# pipefail. Door hier `shell: bash` te zetten wordt dat `bash --noprofile
# --norc -eo pipefail {0}`, en dan telt de code van het harnas weer. Dit staat
# op workflowniveau en niet per stap: een vergeten stap is precies de fout die
# hierboven al een keer is gemaakt.
defaults:
  run:
    shell: bash

# Twee rondes tegelijk hebben geen zin: de tweede meet dezelfde bron op een
# machine die al bezet is. Een lopende ronde afbreken doen we NIET -- een halve
# beproeving is geen meting.
concurrency:
  group: ronde
  cancel-in-progress: false

jobs:
  beproeving:
    name: De Beproeving (storm, geld, misbruik, herstel)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # De meting moet aan het event-SHA hangen, niet aan een branchnaam die
      # tijdens de run kan verschuiven. De validator eist de volle 40 tekens.
      RTG_BEPROEVING_EXPECTED_COMMIT: ${{ github.sha }}
      RTG_BEPROEVING_NODE_MAJOR: '26'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # LAATSTE_METING.json staat in Git. De wachtstand leeft daarom uitsluitend
      # onder .release: voorbereiden mag de tracked boom niet zelf vervuilen.
      - name: Bron, runtime en schone commit binden
        run: node scripts/beproeving-ci-bewijs.js --voorbereiden
      # Pas na de wachtstand installeren. Ook een npm-ci-storing levert zo een
      # actueel NIET_GEMETEN-register op in plaats van het ingecheckte oude.
      - run: npm ci
      # De beproeving zakt zelf (exitcode 1) zodra een van zijn drempels breekt.
      # `tee` zodat de volledige uitvoer ook bij een zak in het artefact staat:
      # bij een eerdere ronde ging de aanleiding verloren omdat alleen de staart
      # in beeld was, en dan weet je wel DAT hij zakte en niet waarop.
      - name: De Beproeving (sqlite-schaal)
        run: npm run beproeving 2>&1 | tee beproeving.log
      # Ook na een crash of rood oordeel uitvoeren. Deze poort vergelijkt alleen
      # met exact de bron uit NORM.json en een kalibratie binnen factor 1,4. De
      # verlopen p99- en event-loop-schuld gebruikt de oude lat uit datzelfde
      # register; een gewone groene Beproeving of een getal van andere hardware volstaat
      # dus niet. De log wordt apart bewaard omdat ook de validator kan zakken.
      - name: Exacte prestatie-aflossing controleren
        if: always()
        run: node scripts/beproeving-ci-bewijs.js --controleer 2>&1 | tee beproeving-ci-controle.log
      # Ook als de stap hierboven zakt willen we de cijfers hebben.
      # DE TIJD VERSTRIJKT ALLEEN HIER. Een schuld met een vervaldatum wordt in
      # ci.yml pas opgemerkt als iemand pusht; op een stille week gebeurt dat
      # niet, en dan verloopt hij ongezien. Deze wekelijkse stap is de enige die
      # de kalender ziet lopen zonder dat er een mens aan te pas komt.
      - name: Het verval (verlopen schulden en uitzonderingen)
        if: always()
        run: node scripts/normverval.js
      # DE DRIE METINGEN DIE ZICHZELF NIET VERVERSEN. activeringOndergrens,
      # tredeLekken, tredeRondgangGezakt en wekkersOnverklaard LEZEN een
      # vastgelegd bestand; ze meten niet zelf, want de activeringsmeter en de
      # tredeproef starten een echte server en dat hoort niet in een ratel die
      # bij elke push draait. De keerzijde staat in de kop van elke meter: wie
      # het bestand niet ververst, bevriest de meter -- en een bevroren meter
      # meldt jarenlang hetzelfde getal terwijl de code eronder wegloopt.
      #
      # Hier verstrijkt de tijd wel, dus hier worden ze ververst. Vóór npm run
      # norm, anders ratelt hij op de cijfers van vorige week.
      - name: De verstrengeling (randen tussen de delen van RTG)
        if: always()
        run: npm run verstrengeling:vast
      - name: De activering (wat wordt wakker per functie)
        if: always()
        run: npm run activering:vast
      - name: De wekkers (wat begint werk buiten HTTP om)
        if: always()
        run: npm run wekkers:vast
      - name: De tredeproef (alle zeven treden van LAUNCH.md)
        if: always()
        run: npm run tredeproef:alle
      - name: De zaakwig (een bestelling van het lid tot in de kassa)
        if: always()
        run: npm run zaakwig:vast
      - name: De norm (structureel hard, prestatie alleen gemeten)
        if: always()
        run: npm run norm
      - name: Samenvatting in beeld
        if: always()
        run: |
          {
            echo '## De Beproeving'
            echo ''
            # De ACTUELE meting eerst, ook als hij rood is. BEPROEVING.json is de
            # geaccepteerde basislijn en schuift alleen na een geslaagde ronde;
            # wie alleen die toont, laat een gezakte ronde onzichtbaar blijven.
            if [ -f .release/beproeving-ci-meting.json ]; then
              echo '```json'
              cat .release/beproeving-ci-meting.json
              echo '```'
            else
              echo '_Er is geen meting geschreven; zie het artefact voor de uitvoer._'
            fi
            if [ -f .release/beproeving-ci-oordeel.json ]; then
              echo ''
              echo '### Vergelijkbaarheid en prestatielat'
              echo '```json'
              cat .release/beproeving-ci-oordeel.json
              echo '```'
            fi
            echo ''
            echo '> De prestatiecijfers hierboven zijn op een GitHub-runner gemeten.'
            echo '> Alleen dezelfde bronvingerafdruk én vergelijkbare kalibratie worden beoordeeld.'
            echo '> Een andere machine wordt niet goedgekeurd: het CI-oordeel wordt dan fail-closed ONVERGELIJKBAAR.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: De uitvoer bewaren
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: beproeving
          path: |
            beproeving.log
            beproeving-ci-controle.log
            BEPROEVING.json
            .release/beproeving-ci-start.json
            .release/beproeving-ci-meting.json
            .release/beproeving-ci-oordeel.json
          if-no-files-found: error
          retention-days: 30

  tot-crash:
    name: Tot crash (escalerende druk tot iets breekt)
    if: github.event_name != 'workflow_dispatch' || inputs.omvang == 'alles'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # DIT HARNAS STOND ER AL EN WAS NERGENS AAN GEHANGEN. Hij noemt zichzelf in
      # zijn eigen kop de escalerende bug-jager "op weg naar 100 miljoen", maar
      # had geen npm-script en geen CI-pad -- anders dan chaos, beproeving en
      # spreiding. Een harnas dat je niet bij naam kunt aanroepen wordt niet
      # gedraaid, en dat is de waarschijnlijkste reden dat de sqlite-basislijn
      # van PASS naar GEZAKT kon lopen zonder dat iemand het zag.
      #
      # Hij zakt zelf (exitcode 1) bij een ECHTE breuk: het proces valt om, de
      # server hangt, het geld klopt niet meer, een onafgevangen fout, of een
      # heap die na GC blijft klimmen. Een 503-lastafworp is daar met opzet geen
      # breuk maar de immuunreactie van De Wacht.
      #
      # Wat hij NIET afdwingt is het aantal werkers dat aankomt: dat hangt van de
      # runner af. Het harnas meldt zelf wanneer het zijn eigen client meet in
      # plaats van de server, en stopt dan.
      - name: Tot crash (sqlite-schaal)
        run: npm run tot-crash 2>&1 | tee tot-crash.log
      - name: De uitvoer bewaren
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tot-crash
          path: tot-crash.log
          retention-days: 30

  heapproef:
    name: Heapproef (houdt de server geheugen vast?)
    if: github.event_name != 'workflow_dispatch' || inputs.omvang == 'alles'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # DE IJKING EERST, EN DAT IS DE VOLGORDE EN GEEN VOLGORDE-VOORKEUR. Een
      # geheugenmeter die je nooit hebt zien AANSLAAN, meet niets: hij zegt
      # "stabiel" over een server die lekt en over een server die dat niet doet,
      # en die twee zien er dan identiek uit. Deze stap bouwt een lek van 120
      # MB/min in (via de test-preload, nooit via servercode) en eist dat de
      # proef LEK zegt. Zegt hij iets anders, dan is de meter blind en heeft de
      # meting erna geen betekenis -- dus faalt de job hier al.
      - name: IJking (een bekend lek MOET gevonden worden)
        run: npm run heapproef:ijk 2>&1 | tee heapproef-ijk.log
      # Pas hierna de echte meting. Zij eindigt alleen met een foutcode bij LEK;
      # NIET_VAST_TE_STELLEN is een geldige uitslag en geen storing -- hij zegt
      # dat deze ronde te ruisig was om een lek van deze grootte aan te tonen,
      # en dat staat met het oplossend vermogen erbij in HEAPPROEF.json.
      - name: De meting
        run: npm run heapproef 2>&1 | tee heapproef.log
      - name: De uitvoer bewaren
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: heapproef
          path: |
            heapproef.log
            heapproef-ijk.log
            HEAPPROEF.json
          retention-days: 30

  dekking:
    name: Waargenomen endpoint-dekking en de samenhang
    if: github.event_name != 'workflow_dispatch' || inputs.omvang == 'alles'
    runs-on: ubuntu-latest
    # 90 was genoeg voor de suite plus de dekking; de meetronde komt er met
    # ongeveer vijfendertig minuten bij (zeven instrumenten, elk tegen een eigen
    # wegwerpserver). Een ronde die halverwege wordt afgekapt levert halve
    # registers op, en die zien er hetzelfde uit als hele.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # xmllint is de scheidsrechter van test/samlc14n.test.js en die toets slaat
      # zichzelf niet over; ubuntu-latest draagt hem niet. Zie ci.yml voor waarom.
      - name: libxml2 (de scheidsrechter van de c14n-toets)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      # De hele suite draait hier met het routejournaal aan. Wat daarin staat is
      # ECHT aangeroepen -- geen tekstzoektocht door de tests, die telt ook een
      # routenaam in een commentaarregel mee.
      # --dekking laat de runner per batch een lcov-bestand schrijven. Dat kost
      # niets extra (de suite draait hier toch al helemaal) en het vult het gat
      # dat de census hieronder al sinds zijn bestaan meldt: zonder
      # DEKKING-LCOV.info zegt `samenhang` netjes NIET GEMETEN over de
      # servermodules -- eerlijk, maar het antwoord op een vraag die niemand
      # stelde. Twintig minuten om apart te maken, nul minuten om hier mee te
      # nemen.
      - name: De hele suite, met routejournaal en dekking
        run: npm test -- --dekking=dekkinglcov
        env:
          RTG_ROUTELOG: ${{ github.workspace }}/routejournaal.log
      # De census leest EEN lcov-bestand, dus de batches gaan hier bij elkaar.
      # `if: always()`, want ook na een gezakte suite is het beter dat de census
      # zegt wat hij ziet dan dat hij zwijgt -- en zijn eigen controle (minstens
      # vijftig records en eindigend op end_of_record) houdt een halve meting
      # tegen. Zonder bestanden gebeurt er niets en meldt hij NIET GEMETEN.
      - name: De dekkingsdata voor de census samenstellen
        if: always()
        run: |
          shopt -s nullglob
          delen=(dekkinglcov/*.info)
          if [ ${#delen[@]} -gt 0 ]; then
            cat "${delen[@]}" > DEKKING-LCOV.info
            echo "DEKKING-LCOV.info: $(grep -c '^SF:' DEKKING-LCOV.info) bronbestanden uit ${#delen[@]} batch(es)"
          else
            echo "geen lcov gevonden; de census meldt straks NIET GEMETEN, en dat is dan het eerlijke antwoord"
          fi
      # Deze poort is wel hard: dekking is machine-onafhankelijk. De vloer staat
      # in NORM.json (dekkingWaargenomenPct, endpointsNooitAangeraakt).
      - name: Waargenomen endpoint-dekking (uit het journaal)
        run: node scripts/dekking.js --lees "$GITHUB_WORKSPACE/routejournaal.log"
      # Deze poort is wel hard: dekking is machine-onafhankelijk. En hij is sinds
      # de dekkingsronde ook onvoorwaardelijk hard -- hier stond "de vloer staat in
      # NORM.json (dekkingWaargenomenPct, endpointsNooitAangeraakt)", maar 100% is
      # geen norm meer die je kunt verlagen: de stap zakt op elke route (methode +
      # patroon, ook buiten /api/) die de suite niet heeft aangeraakt.
      - name: Waargenomen routedekking, 100% is de eis (uit het journaal)
        run: node scripts/dekking.js --lees "$GITHUB_WORKSPACE/routejournaal.log"
      # De census: welke handhaver bewaakt welke categorie. Hij zakt als een
      # categorie zonder bewaker komt te staan.
      - name: De samenhang (wie bewaakt wat)
        if: always()
        run: npm run samenhang
      # De sabotage: elke systeemwet ECHT overtreden en kijken of er iets rood
      # wordt. Dit hoort hier en niet in de CI -- elke wet die aan de keuring
      # hangt kost bijna twee minuten, want de keuring moet er twee keer
      # overheen. De uitslag gaat als artefact mee; AFGESLAGEN is een bevinding
      # en geen storing, dus de stap zakt daar bewust niet op (dat telt de meter
      # wettenOnbewezen). Hij zakt wel als een RECEPT nergens meer naar wijst.
      - name: De sabotage (zet elke handhaver echt uit)
        if: always()
        run: node scripts/sabotage.js
      # HIER STOND `|| true`, en dat was de laatste in deze keten die een gat was.
      # De kop van scripts/zekerheid.js past de regel juist op ZICHZELF toe:
      # "Ontbreekt een bron, dan staat dat er met naam EN krijgt dit script
      # exitcode 1 -- niet omdat er iets stuk is, maar omdat 'geen oordeel' geen
      # groen is." De `|| true` maakte exact die exitcode onzichtbaar, dus het
      # script deed netjes wat het beloofde en niemand kon het zien.
      - name: Wat we weten, en wat niet
        if: always()
        run: npm run zekerheid
      - name: De sabotage-uitslag bewaren
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sabotage
          path: SABOTAGE.json
          retention-days: 30
      # ---- DE MEETRONDE: de bewijslaag, die tot nu toe NERGENS vanzelf draaide ----
      #
      # Poortwacht, de vier proeven, de ketenronde en de bewijsmatrix vulden acht
      # registers, en geen van die instrumenten stond in een workflow. Ze liepen
      # dus alleen als iemand eraan dacht -- precies de vorm waarin een ratel
      # verslapt, en precies wat er gebeurde: POORTWACHT.json liep 196 routes
      # achter voordat iemand het opmerkte.
      #
      # Hij LEGT NIETS VAST. De registers gaan als artefact mee en de ratels
      # (bewijsmatrix, norm) oordelen; een ronde die zichzelf vastlegt, legt ook
      # een verslechtering vast. Wie de uitslag wil overnemen, haalt het artefact
      # op en commit hem met een reden.
      - name: De meetronde (poortwacht, de vier proeven, de keten, de matrix)
        if: always()
        run: npm run meetronde
      # Welk register hoort nog bij deze commit.
      #
      # HIER STOND `|| true`, met als reden: een register dat achterloopt op een
      # commit die alleen een typefout repareerde is geen defect. Die reden
      # klopte zolang dit script alleen MELDDE. Sinds 3 september 2026 houdt hij
      # zes registers tegen -- die over wie er binnenkomt en over geld -- en voor
      # die zes is "waarschijnlijk nog goed" precies de redenering waarmee een
      # achterstand jaren blijft liggen (TAKEN.md 7.3). De andere twaalf melden
      # nog steeds alleen, en dat is wat de `|| true` overbodig maakt: hij hoefde
      # er alleen te staan omdat de poort te breed was.
      - name: De versheid van de registers
        if: always()
        run: npm run versheid
      - name: De registers van deze ronde bewaren
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: registers
          path: |
            POORTWACHT.json
            ROLPROEF.json
            INVOERPROEF.json
            IDEMPROEF.json
            STAATPROEF.json
            KETENS.json
            BEWIJSMATRIX.json
          retention-days: 30
      - name: Het journaal bewaren
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: routejournaal
          path: routejournaal.log
          retention-days: 30
