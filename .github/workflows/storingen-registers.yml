name: Storingen registers vernieuwen
on:
  push:
    branches: [fix/storingen-webhook]
permissions:
  contents: read
  actions: read
jobs:
  registers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Bewezen routejournalen ophalen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34056571910 --repo RahulRTG/nieuwe-rtg-website --pattern 'routejournaal-*' --pattern 'schermjournaal' --dir /tmp/rtg-ci-routebewijs
      - name: Platform en webhook toetsen
        env:
          RTG_ROUTELOG: /tmp/storingen-routejournaal.log
        run: node --test --test-concurrency=1 test/bewakers.test.js test/idemschuld.test.js test/platformregister.test.js test/schakelaarsdekking.test.js test/schakelkast-dekking.test.js test/proefsleutels.test.js test/storingen-webhook.test.js
      - name: Registers opnieuw meten vanuit vastgelegde bron
        run: |
          node scripts/mutatieinventaris.js --vastleggen
          node scripts/mutatiecontract.js --vastleggen
          node scripts/capabilities.js --vastleggen
          journalen=$(find /tmp/rtg-ci-routebewijs -type f -name 'routejournaal.log' | paste -sd, -)
          node scripts/dekking.js --lees "$journalen,/tmp/rtg-ci-routebewijs/schermjournaal/.schermjournaal,/tmp/storingen-routejournaal.log" --vastleggen
          node scripts/kaart.js
          node scripts/bewijs.js
          node --test --test-concurrency=1 test/routedekking.test.js test/capabilities.test.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: storingen-registers
          if-no-files-found: error
          path: |
            MUTATIEINVENTARIS.json
            MUTATIECONTRACT.json
            CAPABILITEIT.json
            DEKKING.json
            NORM.json
            ARCHITECTUUR.md
            BEWIJS.md
