# Lokale/kleine productie-opstelling: de app + Redis (voor realtime over meerdere
# instances). Zet je geheimen in een .env-bestand naast dit bestand (zie
# .env.example); compose leest die automatisch.
#
# Starten:  docker compose up -d --build
# Logs:     docker compose logs -f app
# Stoppen:  docker compose down
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://rtg:${POSTGRES_PASSWORD:-rtg}@postgres:5432/rtg
      # de rest komt uit .env (RTG_ENC_KEY, APP_URL, STRIPE_SECRET_KEY, ...)
      RTG_ENC_KEY: ${RTG_ENC_KEY:-}
      RTG_VAULT_KEY: ${RTG_VAULT_KEY:-}
      RTG_SECRET_KEY: ${RTG_SECRET_KEY:-}
      APP_URL: ${APP_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Externe alarmering: een webhook-POST bij elke uitzondering. SENTRY_DSN
      # stond hier, maar wordt door niets gelezen (geen externe pakketten).
      ERR_WEBHOOK_URL: ${ERR_WEBHOOK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Rust draait standaard als continu gecontroleerde schaduwmotor. De Node-
      # waarheid blijft autoritatief tot RTG_MOTOR_GELD expliciet op motor gaat.
      RTG_MOTOR_SHADOW: http://motor:3100
      RTG_MOTOR_GELD: ${RTG_MOTOR_GELD:-schaduw}
      RTG_MOTOR_GELD_URL: http://motor:3100
      RTG_MOTOR_TOKEN: ${RTG_MOTOR_TOKEN:?Zet RTG_MOTOR_TOKEN op minimaal 16 willekeurige tekens}
    volumes:
      - rtg-data:/app/server/data
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      motor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 10s

  motor:
    build: .
    restart: unless-stopped
    command: ["/app/rtg-motor"]
    environment:
      RTG_MOTOR_ADDR: 0.0.0.0:3100
      RTG_MOTOR_DATA: /app/motor-data/state.json
      RTG_MOTOR_GIDS: /app/motor-data/gids.bin
      RTG_KLUIS_KEY_FILE: /app/motor-data/secret.key
      RTG_KLUIS_DATA: /app/motor-data/kluis.json
      RTG_MOTOR_TOKEN: ${RTG_MOTOR_TOKEN:?Zet RTG_MOTOR_TOKEN op minimaal 16 willekeurige tekens}
    volumes:
      - rtg-motor:/app/motor-data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3100/api/leeft',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - rtg-redis:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rtg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtg}
      POSTGRES_DB: rtg
    volumes:
      - rtg-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtg"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rtg-data:
  rtg-redis:
  rtg-pg:
  rtg-motor:
