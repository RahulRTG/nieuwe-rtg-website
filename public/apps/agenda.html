<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Agenda</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<style>
  :root{ --bg:#0C0C0B; --card:#151312; --card2:#1B1817; --line:rgba(255,255,255,0.10);
    --txt:#F4F1EC; --muted:rgba(244,241,236,0.68); --soft:rgba(244,241,236,0.5);
    --burgundy:#C23A5E; --gold:#A98F1C; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;padding-bottom:3rem;}
  h1,h2{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),rgba(12,12,11,.9));
    backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + .9rem) 1.1rem .7rem;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;}
  header .ey{display:block;font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
  header h1{font-size:1.15rem;}
  header a.terug{color:var(--muted);text-decoration:none;font-size:1.1rem;}
  main{padding:1rem 1.1rem;max-width:1000px;margin:0 auto;}
  .knop{background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);
    font:inherit;font-size:.8rem;font-weight:600;padding:.45rem .8rem;cursor:pointer;text-decoration:none;display:inline-block;}
  .knop:hover{border-color:var(--gold);}
  .knop.vol{background:var(--gold);border-color:var(--gold);color:#0C0C0B;}
  .knop.aan{border-color:var(--gold);color:var(--gold);}
  .knop:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .rij{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
  .stil{color:var(--soft);font-size:.82rem;line-height:1.55;}
  .veld{background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--txt);
    font:inherit;font-size:.85rem;padding:.45rem .6rem;}

  /* de balk boven de kalender: maand, pijlen, weergave */
  .stuur{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem;}
  .stuur h2{font-size:1.25rem;min-width:11rem;}
  .stuur .rek{flex:1;}

  /* Rahul plant mee, in gewone taal */
  .rahulbalk{display:flex;gap:.5rem;margin-bottom:1rem;}
  .rahulbalk input{flex:1;}

  /* de maand: een echt raster; buiten de maand gedimd, vandaag met goud */
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .mkop{background:var(--card2);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--soft);padding:.35rem .4rem;text-align:center;}
  .mdag{background:var(--card);min-height:6rem;padding:.28rem .32rem;cursor:pointer;text-align:left;
    border:0;color:inherit;font:inherit;display:block;width:100%;}
  .mdag:hover{background:var(--card2);}
  .mdag.buiten{opacity:.45;}
  .dnr{display:inline-block;font-size:.68rem;color:var(--muted);min-width:1.35rem;text-align:center;
    border-radius:999px;padding:.05rem 0;margin-bottom:.15rem;}
  .mdag.vandaag .dnr{background:var(--gold);color:#0C0C0B;font-weight:700;}
  .chip{display:block;font-size:.63rem;line-height:1.35;border-left:2px solid var(--burgundy);
    padding:.08rem .32rem;margin:.14rem 0;background:var(--card2);border-radius:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt);}
  .chip.eco{border-left-color:var(--gold);}
  .chip.uit{border-left-style:dashed;color:var(--muted);}
  .chip.nee{opacity:.5;text-decoration:line-through;}
  .chip b{font-weight:600;}
  .meer{font-size:.6rem;color:var(--soft);}

  /* de week: zeven kolommen met de afspraken op volgorde */
  .wgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .wdag{background:var(--card);min-height:11rem;padding:.3rem .35rem;}
  .wdag .chip{font-size:.7rem;padding:.2rem .4rem;cursor:pointer;}

  /* de lijst: gegroepeerd per dag, met de uitnodigingen erin */
  .ldag{margin-bottom:1rem;}
  .ldag h3{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:.35rem;}
  .litem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;
    margin-bottom:.45rem;display:flex;gap:.7rem;align-items:center;cursor:pointer;}
  .litem .tijd{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.78rem;min-width:5.4rem;}
  .litem .wat{flex:1;min-width:0;}
  .litem .wat b{display:block;font-weight:600;font-size:.9rem;}
  .litem .wat small{color:var(--soft);font-size:.72rem;}
  .litem.eco{border-left:3px solid var(--gold);}
  .litem .bron{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);}

  /* het afspraak-paneel */
  .scrim{position:fixed;inset:0;z-index:20;background:rgba(10,10,9,.86);display:none;
    align-items:flex-start;justify-content:center;padding:1rem;overflow:auto;}
  .scrim.open{display:flex;}
  .paneel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem;
    width:min(560px,100%);margin:auto 0;}
  .paneel h3{font-family:'Bodoni Moda',serif;font-size:1.15rem;margin-bottom:.6rem;}
  .paneel label{display:block;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--soft);margin:.6rem 0 .2rem;}
  .paneel input,.paneel select,.paneel textarea{width:100%;background:var(--card2);border:1px solid var(--line);
    border-radius:9px;color:var(--txt);font:inherit;font-size:.88rem;padding:.5rem .65rem;}
  .paneel .twee{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
  .deeln{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding:.35rem 0;
    display:flex;justify-content:space-between;gap:.6rem;}
  .deeln .st{color:var(--soft);font-size:.7rem;}
  .deeln .st.ja{color:var(--gold);}
  .melding{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--card2);
    border:1px solid var(--line);border-radius:999px;padding:.5rem .95rem;font-size:.82rem;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;}
  .melding.zie{opacity:1;}
  @media (max-width:760px){
    .mdag{min-height:4.6rem;}
    .chip{font-size:.56rem;}
    .stuur h2{min-width:8rem;font-size:1.05rem;}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
<link href="/shared/dagkleur.css" rel="stylesheet">
<link href="/shared/desktopframe.css" rel="stylesheet">
<script src="/shared/seizoen.js" defer></script>
<script src="/shared/desktopframe.js" defer></script>
</head>
<body>
<header>
  <a class="terug" href="/apps/index.html" aria-label="Terug naar het bureaublad">&#8592;</a>
  <span><span class="ey">RTG</span><h1>Agenda</h1></span>
  <span class="rij" style="margin-left:auto;">
    <button class="knop" id="icsBtn" type="button" title="Exporteer als .ics; opent in elke agenda ter wereld">Exporteer</button>
    <button class="knop vol" id="nieuwBtn" type="button">+ Afspraak</button>
  </span>
</header>
<main>
  <div class="rahulbalk">
    <input class="veld" id="rahulIn" maxlength="300" placeholder='Zeg het gewoon: "lunch met de notaris vrijdag om 12:30"'
      aria-label="Plan in gewone taal">
    <button class="knop" id="rahulBtn" type="button">Plan</button>
  </div>
  <div class="stuur">
    <button class="knop" id="vorige" type="button" aria-label="Vorige">&#8249;</button>
    <button class="knop" id="volgendeK" type="button" aria-label="Volgende">&#8250;</button>
    <h2 id="periode"></h2>
    <span class="rek"></span>
    <button class="knop" id="vandaagBtn" type="button">Vandaag</button>
    <button class="knop" id="wMaand" type="button">Maand</button>
    <button class="knop" id="wWeek" type="button">Week</button>
    <button class="knop" id="wLijst" type="button">Lijst</button>
  </div>
  <div id="kal" aria-live="polite"></div>
  <p class="stil" style="margin-top:.8rem;">Goud is wat uit RTG zelf komt (boekingen); dat leest de agenda alleen.
    Gestippeld is een uitnodiging die nog op uw ja of nee wacht. Herinneringen komen als seintje op het toestel.</p>
</main>

<!-- de afspraak -->
<div class="scrim" id="afScrim" role="dialog" aria-label="Afspraak">
  <div class="paneel">
    <h3 id="afKop">Afspraak</h3>
    <div id="uitnodigingBlok" style="display:none;">
      <p class="stil" id="uitnodigingTekst"></p>
      <div class="rij" style="margin:.6rem 0;">
        <button class="knop vol" id="afJa" type="button">Ik kom</button>
        <button class="knop" id="afNee" type="button">Ik kom niet</button>
      </div>
    </div>
    <div id="afVelden">
      <label for="afTitel">Titel</label>
      <input id="afTitel" maxlength="120">
      <div class="twee">
        <span><label for="afDatum">Datum</label><input id="afDatum" type="date"></span>
        <span><label for="afPlek">Plek</label><input id="afPlek" maxlength="120" placeholder="mag leeg"></span>
      </div>
      <div class="twee">
        <span><label for="afTijd">Van</label><input id="afTijd" type="time"></span>
        <span><label for="afEind">Tot</label><input id="afEind" type="time"></span>
      </div>
      <div class="twee">
        <span><label for="afHerhaal">Herhaling</label>
          <select id="afHerhaal">
            <option value="geen">Niet</option><option value="dag">Elke dag</option>
            <option value="week">Elke week</option><option value="maand">Elke maand</option>
            <option value="jaar">Elk jaar</option>
          </select></span>
        <span><label for="afHerhaalTot">Herhalen tot</label><input id="afHerhaalTot" type="date"></span>
      </div>
      <label for="afHerinner">Herinnering</label>
      <select id="afHerinner">
        <option value="">Geen</option><option value="0">Op het moment zelf</option>
        <option value="5">5 minuten vooraf</option><option value="15">15 minuten vooraf</option>
        <option value="30">30 minuten vooraf</option><option value="60">Een uur vooraf</option>
        <option value="1440">Een dag vooraf</option>
      </select>
      <label for="afNotitie">Notitie</label>
      <textarea id="afNotitie" rows="2" maxlength="300"></textarea>
      <div id="deelBlok" style="display:none;">
        <label for="afCode">Uitnodigen op codenaam</label>
        <div class="rij"><input id="afCode" maxlength="60" placeholder="Codenaam van het lid" style="flex:1;">
          <button class="knop" id="afNodig" type="button">Nodig uit</button></div>
        <div id="afDeelnemers"></div>
      </div>
    </div>
    <div class="rij" style="margin-top:.9rem;">
      <button class="knop vol" id="afBewaar" type="button">Bewaar</button>
      <button class="knop" id="afMeet" type="button" style="display:none;">Vergaderruimte</button>
      <button class="knop" id="afWeg" type="button" style="display:none;">Verwijder</button>
      <span class="rek" style="flex:1;"></span>
      <button class="knop" id="afDicht" type="button">Sluit</button>
    </div>
  </div>
</div>
<div class="melding" id="melding" role="status"></div>
<script src="/apps/agenda/kalender.js"></script>
<script src="/apps/agenda/paneel.js"></script>
<script src="/apps/agenda/app.js"></script>
<script src="/shared/schermbeeld.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/cookie.js" defer></script>
</body>
</html>
