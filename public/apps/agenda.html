<!doctype html>
<html lang="nl" data-ds="1">
<head>
<script src="/shared/id.js"></script>
<meta charset="utf-8">
<script>try{if(window.self!==window.top)document.documentElement.dataset.rtgOppervlak='1'}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="dailyField.agendaPage">RTG Agenda</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link href="/fonts/fonts.css" rel="stylesheet">




<script src="/shared/seizoen.js" defer></script>







<script src="/shared/rtg-world-desktop.js" defer></script>
<script src="/shared/appmenu.js" defer></script>

<script src="/shared/rtg-heritage-transition.js" blocking="render"></script>
<link href="/ds/rtg-ds.css" rel="stylesheet">
<script src="/ds/shell.js"></script>
</head>
<body class="ds-scherm ds-dagkamer rtg-stijl rtg-daily rtg-living-flow" data-kantoor-tool="agenda" data-rtg-world="living" data-rtg-edge-2-context="native-header,duimbalk" data-rtg-edge-2-state="overview" data-rtg-edge-2-auto="true" data-rtg-skin="heritage" data-rtg-daily="agenda" data-rtg-editorial-room="agenda" data-rtg-layout="standard">
<script>try{if(window.self!==window.top)document.body.setAttribute('data-ios-uit','')}catch(e){}</script>
<header class="ds-kop ds-dag-kop" data-rtg-menu-host>
  <a class="terug ds-knop" href="/apps/app.html" aria-label="Terug naar het bureaublad" data-i18n-aria="dailyField.backHome">&#8592;</a>
  <span><span class="ey" data-i18n="dailyField.livingBrand">RTG · LivingOS</span><h1 data-i18n="dailyField.yourCalendar">Uw agenda</h1></span>
  <span class="rij s-7myv37 ds-dag-rij ds-dag-auto">
    <button class="knop ds-knop" id="icsBtn" aria-label="Agenda exporteren" data-i18n-aria="daily.exportAgenda" data-rtg-edge-bar data-ds-actie="Agenda exporteren" type="button" title="Exporteer als .ics; opent in elke agenda ter wereld" data-i18n="dailyField.export" data-i18n-title="dailyField.exportHint">Exporteer</button>
  </span>
</header>
<!-- De hoofdhandeling staat onderaan en niet in de kopbalk: GRAMMATICA.md,
     "ik wil iets doen -> mijn duim vindt het onderaan". Op telefoonmaat is dit
     een vaste strook (shared/rtg-ui.css, .rtg-duimbalk); daarboven een gewone
     rij onder de kop. -->
<div class="rtg-duimbalk"><button class="knop vol ds-knop" id="nieuwBtn" data-rtg-edge-bar data-ds-actie="Nieuwe afspraak" type="button" data-hoofdactie data-i18n="dailyField.newAppointment">+ Afspraak</button></div>
<main class="ds-dag-main">
<section id="dailyIntro" aria-label="Agenda" data-i18n-aria="dailyField.agenda"></section>
  <div class="daily-content ds-dag-daily-content">
  <div id="agendaStatus" class="rtg-operation-status" role="status" aria-live="polite"></div>
  <div class="stuur ds-dag-stuur">
    <button class="knop ds-knop" id="vorige" data-rtg-edge-bar data-ds-actie type="button" aria-label="Vorige" data-i18n-aria="dailyField.previous">&#8249;</button>
    <button class="knop ds-knop" id="volgendeK" data-rtg-edge-bar data-ds-actie type="button" aria-label="Volgende" data-i18n-aria="dailyField.next">&#8250;</button>
    <h2 id="periode"></h2>
    <span class="rek ds-dag-rek"></span>
    <button class="knop ds-knop" id="vandaagBtn" data-rtg-edge-bar data-ds-actie type="button" data-i18n="dailyField.today">Vandaag</button>
    <button class="knop ds-knop" id="wDag" data-i18n="daily.dayView" type="button" data-rtg-edge-bar data-ds-actie>Dag</button>
    <button class="knop ds-knop" id="wMaand" data-rtg-edge-bar data-ds-actie type="button" data-i18n="dailyField.month">Maand</button>
    <button class="knop ds-knop" id="wWeek" data-rtg-edge-bar data-ds-actie type="button" data-i18n="dailyField.week">Week</button>
    <button class="knop ds-knop" id="wLijst" data-rtg-edge-bar data-ds-actie type="button" data-i18n="dailyField.list">Lijst</button>
  </div>
  <div id="dailyWeek" class="daily-week ds-dag-daily-week"></div>
  <div id="kal" class="ds-dag-kal" data-rtg-scroll="agenda-calendar" aria-live="polite"></div>
  <div class="daily-foot ds-dag-daily-foot"><button type="button" class="daily-action ds-knop ds-dag-actie" data-daily-target="nieuwBtn"><span data-i18n="daily.agendaAction">Plan een afspraak</span> <span aria-hidden="true">→</span></button></div>
  <details class="daily-planner ds-dag-daily-planner"><summary data-i18n="daily.planner">Plan met Rahul in uw eigen woorden</summary>
  <div class="rahulbalk ds-dag-rahulbalk">
    <input class="ds-invoer veld ds-invoer" id="rahulIn" maxlength="300" placeholder='Zeg het gewoon: "lunch met de notaris vrijdag om 12:30"'
      aria-label="Plan in gewone taal" data-i18n-aria="dailyField.planLabel" data-i18n-ph="dailyField.planPrompt">
    <button class="knop ds-knop" id="rahulBtn" type="button" data-i18n="dailyField.plan">Plan</button>
  </div>
  </details>
  <p class="stil ds-dag-marge ds-dag-stil" data-i18n="dailyField.agendaHelp">Goud is wat uit RTG zelf komt (boekingen); dat leest de agenda alleen.
    Gestippeld is een uitnodiging die nog op uw ja of nee wacht. Herinneringen komen als seintje op het toestel.</p>
  </div>
</main>



<!-- de afspraak -->
<div class="scrim ds-dag-scrim" id="afScrim" role="dialog" aria-label="Afspraak" data-i18n-aria="dailyField.appointment">
  <div class="paneel ds-dag-paneel">
    <h3 id="afKop" data-i18n="dailyField.appointment">Afspraak</h3>
    <div id="uitnodigingBlok" style="display:none;">
      <p class="stil ds-dag-stil" id="uitnodigingTekst"></p>
      <div class="rij s-9vyt3z ds-dag-rij ds-dag-marge">
        <button class="knop vol ds-knop" id="afJa" type="button" data-i18n="dailyField.attend">Ik kom</button>
        <button class="knop ds-knop" id="afNee" type="button" data-i18n="dailyField.decline">Ik kom niet</button>
      </div>
    </div>
    <div id="afVelden">
      <label for="afTitel" data-i18n="dailyField.title">Titel</label>
      <input class="ds-invoer" id="afTitel" required maxlength="120">
      <div class="twee ds-dag-twee">
        <span><label for="afDatum" data-i18n="dailyField.date">Datum</label><input class="ds-invoer" id="afDatum" type="date" required></span>
        <span><label for="afPlek" data-i18n="dailyField.place">Plek</label><input class="ds-invoer" id="afPlek" maxlength="120" placeholder="mag leeg" data-i18n-ph="dailyField.optional"></span>
      </div>
      <div class="twee ds-dag-twee">
        <span><label for="afTijd" data-i18n="dailyField.from">Van</label><input class="ds-invoer" id="afTijd" type="time"></span>
        <span><label for="afEind" data-i18n="dailyField.until">Tot</label><input class="ds-invoer" id="afEind" type="time"></span>
      </div>
      <div class="twee ds-dag-twee">
        <span><label for="afHerhaal" data-i18n="dailyField.recurrence">Herhaling</label>
          <select class="ds-invoer" id="afHerhaal">
            <option value="geen" data-i18n="dailyField.never">Niet</option><option value="dag" data-i18n="dailyField.daily">Elke dag</option>
            <option value="week" data-i18n="dailyField.weekly">Elke week</option><option value="maand" data-i18n="dailyField.monthly">Elke maand</option>
            <option value="jaar" data-i18n="dailyField.yearly">Elk jaar</option>
          </select></span>
        <span><label for="afHerhaalTot" data-i18n="dailyField.repeatUntil">Herhalen tot</label><input class="ds-invoer" id="afHerhaalTot" type="date"></span>
      </div>
      <label for="afHerinner" data-i18n="dailyField.reminder">Herinnering</label>
      <select class="ds-invoer" id="afHerinner">
        <option value="" data-i18n="dailyField.none">Geen</option><option value="0" data-i18n="dailyField.atTime">Op het moment zelf</option>
        <option value="5" data-i18n="dailyField.before5">5 minuten vooraf</option><option value="15" data-i18n="dailyField.before15">15 minuten vooraf</option>
        <option value="30" data-i18n="dailyField.before30">30 minuten vooraf</option><option value="60" data-i18n="dailyField.beforeHour">Een uur vooraf</option>
        <option value="1440" data-i18n="dailyField.beforeDay">Een dag vooraf</option>
      </select>
      <label for="afNotitie" data-i18n="dailyField.note">Notitie</label>
      <textarea class="ds-invoer" id="afNotitie" rows="2" maxlength="300"></textarea>
      <div id="deelBlok" style="display:none;">
        <label for="afCode" data-i18n="dailyField.inviteCodename">Uitnodigen op codenaam</label>
        <div class="rij ds-dag-rij"><input class="ds-invoer ds-dag-rek" id="afCode" maxlength="60" placeholder="Codenaam van het lid" data-i18n-ph="dailyField.memberCodename">
          <button class="knop ds-knop" id="afNodig" type="button" data-i18n="dailyField.invite">Nodig uit</button></div>
        <div id="afDeelnemers"></div>
      </div>
    </div>
    <div class="rij ds-dag-marge ds-dag-rij">
      <button class="knop vol ds-knop" id="afBewaar" type="button" data-rtg-morph-action data-rtg-action-state="idle"><span data-rtg-action-copy><span data-rtg-action-copy-for="idle" data-i18n="dailyField.save">Bewaar</span><span data-rtg-action-copy-for="pending" data-i18n="dailyField.saving">Bewaren…</span><span data-rtg-action-copy-for="success" data-i18n="dailyField.saved">Bewaard ✓</span><span data-rtg-action-copy-for="error" data-i18n="dailyField.retry">Opnieuw</span></span></button>
      <button class="knop ds-knop" id="afMeet" type="button" style="display:none;" data-i18n="dailyField.meeting">Vergaderruimte</button>
      <button class="knop ds-knop" id="afWeg" type="button" style="display:none;" data-i18n="dailyField.delete">Verwijder</button>
      <span class="rek ds-dag-rek ds-dag-rek"></span>
      <button class="knop ds-knop" id="afDicht" type="button" data-i18n="dailyField.close">Sluit</button>
    </div>
  </div>
</div>
<div class="melding ds-melding" id="melding" role="status"></div>
<script src="/shared/rtg-daily-copy.js"></script>
<script src="/shared/rtg-daily-fields.js"></script>
<script src="/shared/rtg-daily.js"></script>
<script src="/shared/uitvoer.js"></script>

<script src="/shared/rtg-route-memory.js"></script>
<script src="/shared/rtg-operation.js"></script>

<script src="/apps/agenda/kalender.js"></script>
<script src="/apps/agenda/paneel.js"></script>

<script src="/apps/agenda/app.js"></script>

<script src="/shared/schermbeeld.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/volscherm.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
<script src="/shared/ios.js" defer></script>
<script src="/shared/adaptief.js" defer></script>
<script src="/shared/objectverwijzing.js" defer></script>
<script src="/shared/adaptief/vorm.js" defer></script>
<script src="/shared/adaptief/register.js" defer></script>
<script src="/shared/adaptief/brug.js" defer></script>
<script src="/apps/agenda/context.js" defer></script>
</body>
</html>
