<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Store · uitgever</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<link href="/shared/rtg-ontwerp.css" rel="stylesheet">
<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft);
    --burgundy:#C23A5E; --gold:#A98F1C; --groen:#4C9A75; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:4rem;}
  h1,h2,h3{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  a{color:inherit;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),rgba(12,12,11,.88));backdrop-filter:blur(8px);
    padding:calc(env(safe-area-inset-top) + 1rem) 1.1rem .7rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.8rem;}
  header .ey{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
  header h1{font-size:1.3rem;margin-top:.05rem;}
  main{padding:1.1rem;max-width:900px;margin:0 auto;}
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;margin-bottom:.8rem;}
  .kaart h2{font-size:1.1rem;margin-bottom:.15rem;}
  .kaart h3{font-size:.98rem;}
  .sub{font-size:.8rem;color:var(--soft);line-height:1.6;}
  .rij{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.7rem;}
  .veld{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:.5rem .7rem;font:inherit;font-size:.85rem;min-height:2.6rem;}
  label.vlak{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:.25rem;}
  .knop{background:var(--txt);color:#000;border:none;border-radius:10px;padding:.5rem .9rem;font:inherit;font-weight:600;font-size:.83rem;cursor:pointer;min-height:2.6rem;}
  .knop.stil{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:400;}
  .knop:disabled{opacity:.5;cursor:default;}
  .bev{border-left:3px solid var(--burgundy);padding:.5rem .7rem;margin-top:.45rem;background:rgba(194,58,94,.07);border-radius:0 10px 10px 0;}
  .bev.letop{border-left-color:var(--gold);background:rgba(169,143,28,.08);}
  .bev b{font-size:.85rem;display:block;}
  .bev .waar{font-size:.72rem;color:var(--gold);font-variant-numeric:tabular-nums;}
  .bev .hoe{font-size:.79rem;color:var(--muted);line-height:1.55;display:block;margin-top:.2rem;}
  .st{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:.16rem .5rem;border-radius:7px;border:1px solid var(--line);color:var(--soft);}
  .st.live{color:var(--groen);border-color:var(--groen);}
  .st.wacht{color:var(--gold);border-color:var(--gold);}
  .st.nee{color:var(--burgundy);border-color:var(--burgundy);}
  table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:.5rem;}
  td,th{text-align:left;padding:.35rem .3rem;border-bottom:1px solid var(--line);}
  th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:400;}
  .melding{position:fixed;left:50%;transform:translateX(-50%);bottom:1.4rem;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:.6rem .9rem;font-size:.82rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:88vw;}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.6rem;}
  code{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;color:var(--gold);}
  /* Uit de inline stijlattributen gehaald. Die houden style-src-attr in de CSP
     open en de norm telt ze (scripts/norm.js, inlineStijlAttributen). Het
     opruimen legde meteen de herhaling bloot: negen keer dezelfde volle breedte
     en zeven marges met zes verschillende waarden voor hetzelfde bedoelde gat. */
  .vol{width:100%;}
  .vol-tekst{width:100%;min-height:4.4rem;}
  .breed{flex:1;min-width:12rem;}
  .groei{flex:1;}
  .scheiding-s{border-top:1px solid var(--line);padding-top:.6rem;margin-top:.6rem;}
  .mt-0{margin-top:0;}
  .mt-xxs{margin-top:.3rem;}
  .mt-xs{margin-top:.4rem;}
  .mt-s{margin-top:.5rem;}
  .mt-m{margin-top:.6rem;}
  .mt-l{margin-top:.8rem;}
  .mb-s{margin-bottom:.5rem;}
  .klein{font-size:.78rem;line-height:1.5;}
  .blok{display:block;}
  .zacht{color:var(--soft);}
  .gedempt{color:var(--muted);}
  .goud{color:var(--gold);}
  .bordeaux{color:var(--burgundy);}
  .knoplink{text-decoration:none;}
  .tweekolom{display:flex;justify-content:space-between;font-size:.82rem;}
  .machtiging{display:flex;gap:.5rem;align-items:flex-start;cursor:pointer;}
  .machtiging input{margin-top:.22rem;width:1rem;height:1rem;accent-color:#C23A5E;}
  .doeluitleg{margin-top:.3rem;margin-left:1.5rem;max-width:22rem;}
</style>
</head>
<body>

<header>
  <a class="knop stil" href="/apps/leverancier.html">← Werkplek</a>
  <div><div class="ey">RTG App Store</div><h1>Uitgeven</h1></div>
</header>

<main id="main"><div class="kaart"><p class="sub">Bezig met laden…</p></div></main>
<div class="melding" id="melding" role="status"></div>

<script>
/* ============================================================================
   DE UITGEVERSKANT -- inzenden zonder gereedschap te hoeven installeren.

   Waarom deze pagina bestaat en niet alleen een API: de poort is streng, en een
   strenge poort zonder snelle terugkoppeling is een trage poort. Hier kies je
   je map, drukt op PROEFKEURING, en ziet per bestand en per REGEL wat er aan de
   hand is en hoe het wel kan -- zonder dat er iets is ingezonden en zonder dat
   de rem van twaalf inzendingen per uur eraan gaat.

   Wat deze pagina met opzet NIET doet: goedkeuren. De machinepoort kan alleen
   afkeuren of doorlaten naar een mens van RTG. Dat staat ook zo op het scherm,
   want een groen vinkje dat "geslaagd" suggereert zou de belangrijkste stap
   onzichtbaar maken. */
const $ = s => document.querySelector(s);
const esc = t => String(t==null?'':t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* TWEE DEUREN, EEN BUREAU (besluit 27 augustus 2026). Een ZAAK logt in als
   leverancier en werkt onder /api/appstore/uitgever/...; een geverifieerd MENS
   logt in als lid en werkt onder /api/appstore/persoon/... De routes staan met
   opzet gelijk (server/routes/appstore/persoon.js), zodat dit scherm alleen zijn
   VOORVOEGSEL hoeft te kiezen en niet twee keer bestaat.

   De zaakinlog gaat voor: wie allebei heeft, is hier aan het werk als zaak --
   dan hoort zijn app bij het bedrijf en niet bij hem persoonlijk. */
let TOKEN = null, DEUR = 'uitgever';
try {
  TOKEN = localStorage.getItem('rtg_sup_token');
  if (!TOKEN) { TOKEN = localStorage.getItem('rtg_member_token'); if (TOKEN) DEUR = 'persoon'; }
} catch (e) {}
const P = (staart) => '/api/appstore/' + DEUR + (staart || '');
function meld(t){ const m = $('#melding'); m.textContent = t; m.style.opacity = '1'; clearTimeout(m._t); m._t = setTimeout(() => m.style.opacity = '0', 3200); }
const api = (pad, body) => fetch(pad, {
  method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
  body: JSON.stringify(body || {})
}).then(async r => { const d = await r.json().catch(() => ({})); if (!r.ok) { const e = new Error(d.error || 'Er ging iets mis.'); e.d = d; throw e; } return d; });

const TEKST = /\.(html|js|css|json|svg|txt)$/i;
let BUNDEL = [];   // [{ pad, inhoud, codering, bytes }]
let STAND = null;

/* De bundel uit een gekozen MAP. webkitRelativePath geeft het pad binnen die
   map; de bovenste maplaag valt eraf, want die heet bij iedereen anders. */
function leesBestand(f, pad){
  return new Promise((ja, nee) => {
    const r = new FileReader();
    r.onerror = () => nee(new Error('Kon ' + pad + ' niet lezen.'));
    if (TEKST.test(pad)) { r.onload = () => ja({ pad, inhoud: String(r.result), codering: 'tekst', bytes: f.size }); r.readAsText(f); }
    else { r.onload = () => ja({ pad, inhoud: String(r.result).split(',')[1] || '', codering: 'base64', bytes: f.size }); r.readAsDataURL(f); }
  });
}
async function kiesMap(input){
  const uit = [];
  for (const f of [...input.files]) {
    const rel = (f.webkitRelativePath || f.name).split('/').slice(1).join('/') || f.name;
    if (/(^|\/)\./.test(rel)) continue;                    // verborgen bestanden gaan niet mee
    uit.push(await leesBestand(f, rel.toLowerCase()));
  }
  BUNDEL = uit;
  $('#bundelStand').textContent = uit.length
    ? uit.length + ' bestanden · ' + Math.round(uit.reduce((n, x) => n + x.bytes, 0) / 1024) + ' kB - ' + uit.map(x => x.pad).slice(0, 6).join(', ') + (uit.length > 6 ? ' …' : '')
    : 'Nog geen map gekozen.';
}

const manifestUit = () => ({
  sleutel: $('#mSleutel').value.trim().toLowerCase(), naam: $('#mNaam').value.trim(),
  versie: $('#mVersie').value.trim(), uitleg: $('#mUitleg').value.trim(),
  categorie: $('#mCategorie').value, start: $('#mStart').value.trim() || 'index.html',
  /* De prijs gaat MEE in het manifest en staat niet ergens apart. Daarmee gaat
     hij door dezelfde keuring als de rest, en is een prijswijziging een nieuwe
     versie met een nieuwe handtekening van een mens. */
  prijsCenten: Math.round((Number(String($('#mPrijs').value).replace(',', '.')) || 0) * 100),
  machtigingen: [...document.querySelectorAll('input[data-mach]:checked')].map(i => {
    const sel = document.querySelector('select[data-doel="' + i.dataset.mach + '"]');
    return { id: i.dataset.mach, doel: sel ? sel.value : '' };
  })
});

function toonFouten(d){
  const fouten = (d.fouten || []).map(f => '<div class="bev"><b>'+esc(f.veld || f.pad || 'manifest')+'</b><span class="hoe">'+esc(f.wat)+'</span></div>').join('');
  const bev = (d.bevindingen || []).map(b => '<div class="bev'+(b.ernst === 'let-op' ? ' letop' : '')+'">'+
      '<b>'+esc(b.wat)+'</b>'+
      (b.bestand ? '<span class="waar">'+esc(b.bestand)+(b.regel ? ' · regel ' + b.regel : '')+'</span>' : '')+
      '<span class="hoe">'+esc(b.hoe)+'</span></div>').join('');
  $('#uitslag').innerHTML = (d.let ? '<p class="sub mb-s">'+esc(d.let)+'</p>' : '')+
    (d.error ? '<p class="sub bordeaux">'+esc(d.error)+'</p>' : '')+ fouten + bev ||
    '<p class="sub">Geen bevindingen.</p>';
}

async function proef(){
  $('#uitslag').innerHTML = '<p class="sub">De poort leest je bundel…</p>';
  try { toonFouten(await api(P('/proef'), { manifest: manifestUit(), bestanden: BUNDEL })); }
  catch (e) { toonFouten(e.d || { error: e.message }); }
}
async function inzenden(){
  try {
    const r = await api(P('/inzenden'), { manifest: manifestUit(), bestanden: BUNDEL });
    toonFouten(r); meld('Ingezonden. Een mens van RTG kijkt ernaar.'); laad();
  } catch (e) { toonFouten(e.d || { error: e.message }); meld(e.message); }
}

function tekenAanvraag(){
  return '<div class="kaart"><h2>Word uitgever</h2>'+
    '<p class="sub">Je zaak hangt onder een organisatie; die organisatie wordt de uitgever. Een mens van RTG laat je toe - dat is geen formaliteit, want vanaf dat moment staat er een aanspreekbare partij achter elke app die je publiceert.</p>'+
    '<div class="rij"><div class="breed"><label class="vlak" for="uNaam">Naam waaronder je publiceert</label>'+
      '<input class="veld" id="uNaam" class="vol" maxlength="120" value="'+esc((STAND.uitgever && STAND.uitgever.naam) || STAND.organisatie || '')+'"></div>'+
      '<div class="breed"><label class="vlak" for="uContact">Contact voor RTG</label>'+
      '<input class="veld" id="uContact" class="vol" maxlength="160" placeholder="ontwikkelaars@jouwbedrijf.nl" value="'+esc((STAND.uitgever && STAND.uitgever.contact) || '')+'"></div></div>'+
    '<div class="rij"><button class="knop" id="uVraag">'+(STAND.uitgever ? 'Bijwerken' : 'Uitgeversplek aanvragen')+'</button>'+
      (STAND.uitgever ? '<span class="st wacht">'+esc(STAND.uitgever.status)+'</span>' : '')+
      (STAND.uitgever && STAND.uitgever.reden ? '<span class="sub">'+esc(STAND.uitgever.reden)+'</span>' : '')+'</div></div>';
}

function tekenInzenden(){
  /* Per machtiging een DOEL, en het is een keuzelijst en geen tekstvak. Een lid
     beslist niet op wat je krijgt maar op waarvoor; een vast woord maakt dat
     vergelijkbaar tussen apps en maakt een update te diffen. */
  const m = STAND.machtigingen.map(x =>
    '<div class="mt-s">'+
      '<label class="machtiging">'+
        '<input type="checkbox" data-mach="'+esc(x.id)+'">'+
        '<span class="klein"><b class="blok">'+esc(x.id)+'</b>'+
        '<span class="gedempt">'+esc(x.geeft)+'</span><br>'+
        '<span class="zacht"><b class="goud">Nooit:</b> '+esc(x.nooit)+'</span></span></label>'+
      '<select class="veld" data-doel="'+esc(x.id)+'" class="doeluitleg" aria-label="Waarvoor '+esc(x.id)+'">'+
        x.doelen.map(d => '<option value="'+esc(d.id)+'">'+esc(d.id)+' &mdash; '+esc(d.uitleg)+'</option>').join('')+
      '</select>'+
    '</div>').join('');
  const niet = Object.entries(STAND.nietGebouwd).map(([k, v]) =>
    '<div class="bev letop"><b>'+esc(k)+'</b><span class="hoe">'+esc(v)+'</span></div>').join('');
  const b = STAND.budget;
  return '<div class="kaart"><h2>Een versie inzenden</h2>'+
    '<p class="sub">Alles wat je app nodig heeft zit in je eigen map: geen CDN, geen externe fonts, geen netwerk. In de cel heeft je app geen verbinding; wat je van RTG nodig hebt, vraag je met <code>RTG.roep(...)</code>. Dat script wordt er automatisch in gezet.</p>'+
    '<div class="grid2 mt-l">'+
      '<div><label class="vlak" for="mSleutel">Sleutel (vast)</label><input class="veld" id="mSleutel" class="vol" maxlength="40" placeholder="mijn-app"></div>'+
      '<div><label class="vlak" for="mNaam">Naam</label><input class="veld" id="mNaam" class="vol" maxlength="60"></div>'+
      '<div><label class="vlak" for="mVersie">Versie</label><input class="veld" id="mVersie" class="vol" maxlength="14" placeholder="1.0.0"></div>'+
      '<div><label class="vlak" for="mCategorie">Categorie</label><select class="veld" id="mCategorie" class="vol">'+
        ['sociaal','reizen','eten','media','geld','spelen','leven','veiligheid'].map(c => '<option>'+c+'</option>').join('')+'</select></div>'+
      '<div><label class="vlak" for="mStart">Startbestand</label><input class="veld" id="mStart" class="vol" maxlength="80" placeholder="index.html"></div>'+
      /* EEN PERSOON PUBLICEERT GRATIS (besluit 27 augustus 2026). Het veld staat
         er dan wel, maar op nul en dicht -- en met de reden ernaast. Zou het
         gewoon openstaan, dan typt iemand een prijs, bouwt een bundel en hoort
         pas bij het inzenden dat het nooit kon. De server blijft de poort
         (kern/appstore/uitgevers.js: magPrijsVragen); dit is het venster erop. */
      '<div><label class="vlak" for="mPrijs">Prijs in euro (0 = gratis)</label>'+
        '<input class="veld" id="mPrijs" class="vol" inputmode="decimal" placeholder="0,00" value="'+(DEUR==='persoon'?'0':'')+'"'+
        (DEUR==='persoon'?' readonly':'')+'></div>'+
    '</div>'+
    '<p class="sub mt-s">'+(DEUR === 'persoon'
      ? 'Als geverifieerd persoon publiceer je gratis. Een betaalde app vraagt een rechtspersoon: daar hangen de btw, de afdracht en een aanspreekbare partij aan. Wil je geld vragen, vraag dan een uitgeversplek aan vanuit een zaak.'
      : 'Een betaalde app wordt in de winkel gekocht, nooit in de app zelf. RTG int bij het lid, draagt de btw af in het land van dat lid, houdt de afdracht in en schrijft de rest bij op de RTG Pay-rekening van je zaak. Wat een lid betaalt, ziet hij als bon voordat hij drukt.')+'</p>'+
    '<div class="mt-m"><label class="vlak" for="mUitleg">Uitleg (20-260 tekens, dit leest een lid vóór hij iets geeft)</label>'+
      '<textarea class="veld" id="mUitleg" class="vol-tekst" maxlength="260"></textarea></div>'+
    '<div class="mt-l"><span class="vlak">Wat je vraagt</span>'+m+'</div>'+
    '<div class="mt-l"><label class="vlak" for="mMap">Je bundel (kies de map van je app)</label>'+
      '<input class="veld" type="file" id="mMap" webkitdirectory directory multiple class="vol">'+
      '<p class="sub" id="bundelStand" class="mt-xs">Nog geen map gekozen.</p>'+
      '<p class="sub">Budget: '+b.bestanden+' bestanden, '+Math.round(b.totaal/1024)+' kB totaal, '+Math.round(b.script/1024)+' kB scriptcode, '+Math.round(b.stijl/1024)+' kB stijl. Het budget is een poort en geen meter achteraf: te zwaar komt er niet in.</p></div>'+
    '<div class="rij"><button class="knop stil" id="bProef">Proefkeuring</button><button class="knop" id="bIn">Inzenden</button></div>'+
    '<div id="uitslag" class="mt-m"></div></div>'+
    '<div class="kaart"><h3>Wat je niet kunt vragen, en waarom</h3><p class="sub">Dit is geen routekaart maar het antwoord vooraf: een regel hier verdwijnt pas als de brug hem uitvoert.</p>'+niet+'</div>';
}

function tekenOmzet(){
  if (!STAND.omzet) return '';
  const o = STAND.omzet;
  if (!o.aantal) return '<div class="kaart"><h2>Verkopen</h2><p class="sub">Nog niets verkocht. Zodra er iets wordt gekocht, staat hier hoeveel en hoeveel er is bijgeschreven - aantallen en bedragen, nooit wie.</p>'+
    '<p class="sub">De afdracht van RTG staat nu op '+esc(String(o.afdrachtNu.procent))+'%. '+esc(o.afdrachtNu.reden || '')+'</p></div>';
  const r = (l, c) => '<div class="tweekolom"><span class="sub">'+l+'</span><b>'+eur(c)+'</b></div>';
  return '<div class="kaart"><h2>Verkopen</h2><p class="sub">'+esc(o.let)+'</p>'+
    '<div class="mt-m">'+
      r(o.aantal + ' aanschaffen, bruto', o.brutoCenten)+
      r('af: btw (door RTG afgedragen)', o.btwCenten)+
      r('af: afdracht App Store', o.afdrachtCenten)+
      r('bijgeschreven op je zaak', o.uitgeverCenten)+
    '</div>'+
    '<table><tr><th>app</th><th>aantal</th><th>bruto</th><th>bijgeschreven</th></tr>'+
    o.perApp.map(a => '<tr><td>'+esc(a.naam)+'</td><td>'+a.aantal+'</td><td>'+eur(a.brutoCenten)+'</td><td>'+eur(a.uitgeverCenten)+'</td></tr>').join('')+
    '</table>'+
    '<p class="sub mt-s">De afdracht van RTG staat nu op '+esc(String(o.afdrachtNu.procent))+'%. Een bon die al is geschreven, wordt nooit herrekend.</p></div>';
}
const eur = c => new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR' }).format(Number(c || 0) / 100);

function tekenApps(){
  if (!STAND.apps.length) return '';
  return '<div class="kaart"><h2>Je apps</h2>'+ STAND.apps.map(a =>
    '<div class="scheiding-s">'+
      '<div class="rij mt-0"><h3 class="groei">'+esc(a.naam)+'</h3>'+
        (a.live ? '<span class="st live">live · '+esc(a.live.versie)+'</span>'+
                  '<button class="knop stil aDos" data-s="'+esc(a.sleutel)+'" aria-expanded="false">Wat de klant leest</button>'+
                  '<button class="knop stil aTrek" data-s="'+esc(a.sleutel)+'">Intrekken</button>'
                : '<span class="st nee">niet live</span>')+'</div>'+
      '<div class="uDos" data-s="'+esc(a.sleutel)+'" hidden class="mt-s"></div>'+
      (a.ingetrokken ? '<p class="sub">Ingetrokken door '+esc(a.ingetrokken.door)+(a.ingetrokken.reden ? ': '+esc(a.ingetrokken.reden) : '')+'</p>' : '')+
      '<table><tr><th>versie</th><th>prijs</th><th>stand</th><th>hash</th><th>ingezonden</th><th>besluit</th></tr>'+
      a.versies.map(v => '<tr><td>'+esc(v.versie)+'</td><td>'+(v.prijsCenten ? eur(v.prijsCenten) : 'gratis')+'</td><td>'+esc(v.status)+'</td><td><code>'+esc(v.hash.slice(0,12))+'</code></td>'+
        '<td>'+esc(String(v.at).slice(0,16).replace('T',' '))+'</td>'+
        '<td>'+(v.besluit ? esc(v.besluit.door)+(v.besluit.reden ? ' - '+esc(v.besluit.reden) : '') : '-')+'</td></tr>').join('')+
      '</table></div>').join('')+'</div>';
}

/* HET NASLAGWERK EN HET EIGEN JOURNAAL.

   Allebei komen ze van de server en worden ze hier alleen getekend: de inhoud
   komt uit kern/appstore/naslag.js -- dezelfde bron die `rtg sdk` uitschrijft --
   zodat dit scherm en de gegenereerde typings niet uiteen kunnen lopen. Wie hier
   een lijstje bijzet dat niet van de server komt, maakt een tweede waarheid. */
function tekenNaslag(n){
  if (!n) return '';
  const kB = b => Math.round(b / 1024) + ' kB';
  return '<div class="kaart"><h2>Wat je app kan vragen</h2>'+
    '<p class="sub">'+esc(n.let)+'</p>'+
    '<table><tr><th>methode</th><th>machtiging</th><th>tweede aanroep</th></tr>'+
    n.methodes.map(m => '<tr><td><code>'+esc(m.naam)+'</code></td><td><code>'+esc(m.machtiging || '-')+'</code></td>'+
      '<td>'+(m.herhaalbaar ? 'laat dezelfde stand achter' : 'is een tweede gebeurtenis')+'</td></tr>').join('')+
    '</table>'+
    '<h3>Machtigingen</h3>'+
    n.machtigingen.map(m => '<div class="scheiding-s"><b>'+esc(m.label)+'</b> <code>'+esc(m.id)+'</code>'+
      '<p class="sub">geeft: '+esc(m.geeft)+'</p>'+
      '<p class="sub"><b class="goud">Nooit:</b> '+esc(m.nooit)+'</p>'+
      '<p class="sub">doelen: '+m.doelen.map(d => '<code>'+esc(d.id)+'</code> ('+esc(d.uitleg)+')').join(', ')+'</p></div>').join('')+
    '<h3>Bewust niet beschikbaar</h3>'+
    '<p class="sub">Dit ontbreekt niet, het is besloten. Een regel verdwijnt hier pas als de brug hem uitvoert.</p>'+
    n.nietBeschikbaar.map(x => '<div class="scheiding-s"><b>'+esc(x.wat)+'</b><p class="sub">'+esc(x.waarom)+'</p></div>').join('')+
    '<h3>Grenzen</h3>'+
    '<p class="sub">'+n.grenzen.opslagSleutels+' sleutels per lid · '+n.grenzen.opslagWaarde+' tekens per waarde · '+
      kB(n.grenzen.opslagTotaal)+' opslag · '+n.grenzen.berichtenPerDag+' berichten per dag · '+
      n.grenzen.roepenPerMinuut+' aanroepen per minuut</p>'+
    '<p class="sub">bundel: '+n.budget.bestanden+' bestanden · '+kB(n.budget.totaal)+' totaal · '+
      kB(n.budget.script)+' script · '+kB(n.budget.stijl)+' stijl</p>'+
    '<h3>Als de brug weigert</h3>'+
    '<table><tr><th>code</th><th>herhaalbaar</th><th>wat het betekent</th></tr>'+
    n.fouten.map(f => '<tr><td><code>'+esc(f.code)+'</code></td><td>'+(f.herhaalbaar ? 'ja' : 'nee')+'</td><td>'+esc(f.uitleg)+'</td></tr>').join('')+
    '</table></div>';
}

/* De cijfers. Tellingen van aanroepen, nooit van mensen -- en die zin staat er
   letterlijk bij, want zonder hem leest iemand "412 aanroepen" als "412
   gebruikers". Hij komt van de server mee (kern/appstore/meting.js). */
function tekenCijfers(apps){
  if (!apps || !apps.length) return '';
  const metIets = apps.filter(a => a.totaal.aanroepen);
  if (!metIets.length) return '<div class="kaart"><h2>Cijfers</h2>'+
    '<p class="sub">Nog geen aanroepen. Zodra een lid je app opent en die de brug gebruikt, staat hier hoe vaak, en hoe vaak dat werd geweigerd.</p></div>';
  return '<div class="kaart"><h2>Cijfers</h2>'+
    '<p class="sub">'+esc(metIets[0].let)+'</p>'+
    metIets.map(a => '<div class="scheiding-s"><b>'+esc(a.sleutel)+'</b>'+
      '<p class="sub">'+a.totaal.aanroepen+' aanroepen · '+a.totaal.weigeringen+' geweigerd</p>'+
      (Object.keys(a.totaal.codes).length
        ? '<table><tr><th>weigering</th><th>hoe vaak</th></tr>'+
          Object.entries(a.totaal.codes).sort((x,y)=>y[1]-x[1])
            .map(([c,n]) => '<tr><td><code>'+esc(c)+'</code></td><td>'+n+'</td></tr>').join('')+
          '</table>'
        : '')+
      '<table><tr><th>dag</th><th>aanroepen</th><th>geweigerd</th></tr>'+
      a.dagen.slice(0,14).map(d => '<tr><td>'+esc(d.dag)+'</td><td>'+d.aanroepen+'</td><td>'+d.weigeringen+'</td></tr>').join('')+
      '</table></div>').join('')+'</div>';
}

function tekenJournaal(lijst){
  if (!lijst) return '';
  if (!lijst.length) return '<div class="kaart"><h2>Wat er met je inzendingen gebeurde</h2>'+
    '<p class="sub">Nog niets. Zodra je inzendt, staat hier wat de poort vond en wanneer een mens van RTG ernaar keek.</p></div>';
  return '<div class="kaart"><h2>Wat er met je inzendingen gebeurde</h2>'+
    '<p class="sub">Je eigen regels uit het journaal van de App Store. Het groeit aan en wordt nooit herschreven.</p>'+
    '<table><tr><th>wanneer</th><th>wat</th><th>welke app</th></tr>'+
    lijst.map(r => '<tr><td>'+esc(String(r.at).slice(0,16).replace('T',' '))+'</td>'+
      '<td>'+esc(String(r.wat).replace(/-/g, ' '))+'</td><td>'+esc(r.over || '-')+'</td></tr>').join('')+
    '</table></div>';
}

async function laad(){
  if (!TOKEN) { $('#main').innerHTML = '<div class="kaart"><h2>Log eerst in</h2><p class="sub">Deze pagina hoort bij je RTG-werkplek. <a href="/apps/leverancier.html">Naar de werkplek →</a></p></div>'; return; }
  let d;
  try { d = await api(P()); }
  catch (e) { $('#main').innerHTML = '<div class="kaart"><h2>Nog geen uitgever</h2><p class="sub">'+esc(e.message)+'</p></div>'; return; }
  STAND = d;
  const toegelaten = d.uitgever && d.uitgever.status === 'toegelaten';
  /* De omzet komt apart binnen en mag ontbreken: draait dit proces zonder
     RTG Pay, dan is er geen betaalde kant en zegt de pagina dat door het blok
     gewoon weg te laten in plaats van een nul te tonen die niets betekent. */
  if (toegelaten) { try { const o = await api(P('/omzet')); if (o.aantal != null) STAND.omzet = o; } catch (e) {} }
  /* Het naslagwerk en het eigen journaal mogen ontbreken zonder dat de pagina
     omvalt: een proces zonder die routes hoort een werkend bureau te tonen en
     geen foutmelding over iets wat er niet is. */
  try { STAND.naslag = await api(DEUR === 'persoon' ? P('/naslag') : '/api/appstore/naslag'); } catch (e) {}
  if (toegelaten) { try { STAND.journaal = (await api(P('/journaal'))).lijst; } catch (e) {} }
  if (toegelaten) { try { STAND.cijfers = (await api(P('/cijfers'))).apps; } catch (e) {} }
  $('#main').innerHTML =
    '<div class="kaart"><h2>'+esc(d.organisatie || d.org)+'</h2>'+
      '<p class="sub">Organisatie <code>'+esc(d.org)+'</code> · '+(d.uitgever ? 'uitgeversplek: '+esc(d.uitgever.status) : 'nog geen uitgeversplek')+'</p></div>'+
    (toegelaten ? '' : tekenAanvraag()) + (toegelaten ? tekenInzenden() : '') + tekenApps() + tekenOmzet()
    + tekenCijfers(STAND.cijfers) + tekenJournaal(STAND.journaal) + tekenNaslag(STAND.naslag);

  const vraag = $('#uVraag');
  if (vraag) vraag.addEventListener('click', async () => {
    try { await api(P('/aanvraag'), { naam: $('#uNaam').value, contact: $('#uContact').value }); meld('Aangevraagd. Een mens van RTG kijkt ernaar.'); laad(); }
    catch (e) { meld(e.message); }
  });
  const map = $('#mMap');
  if (map) map.addEventListener('change', () => kiesMap(map).catch(e => meld(e.message)));
  if ($('#bProef')) $('#bProef').addEventListener('click', proef);
  if ($('#bIn')) $('#bIn').addEventListener('click', inzenden);
  /* WAT DE KLANT LEEST, hier en niet pas bij het inkoopgesprek.

     Een uitgever kan hier niets aan veranderen -- alles erin komt uit een meting
     op zijn eigen bundel of uit een besluit van RTG. Juist daarom hoort hij het
     te kunnen zien: wie pas bij de klant ontdekt wat er over hem staat, kan er
     niet meer op reageren; wie het vooraf leest, kan zijn bundel aanpassen. */
  document.querySelectorAll('.aDos').forEach(b => b.addEventListener('click', async () => {
    const vak = document.querySelector('.uDos[data-s="'+b.dataset.s.replace(/"/g,'')+'"]');
    if (!vak) return;
    if (!vak.hidden) { vak.hidden = true; b.setAttribute('aria-expanded','false'); return; }
    vak.hidden = false; b.setAttribute('aria-expanded','true');
    vak.innerHTML = '<p class="sub">Bezig…</p>';
    try {
      const d = await api(P('/dossier'), { sleutel: b.dataset.s });
      vak.innerHTML = '<p class="sub">'+esc(d.let)+'</p>'+
        '<p class="sub mt-xs"><b>Waar de gegevens blijven:</b> '+esc(d.waarDeGegevensBlijven.antwoord)+'</p>'+
        '<p class="sub"><b>Wat de poort vond:</b> '+d.watDePoortVond.blokkerend+' blokkerend, '+d.watDePoortVond.letOp+
          ' let-op'+(d.watDePoortVond.afgetekendDoor ? ', afgetekend door '+esc(d.watDePoortVond.afgetekendDoor) : '')+'.</p>'+
        '<p class="sub mt-xs"><b>Wat er ook bij jouw app NIET wordt beweerd</b> &mdash; bij elke app hetzelfde, ook bij die van je concurrent:</p>'+
        Object.keys(d.nietGebouwd||{}).map(k => '<p class="sub">· <b>'+esc(k)+'</b> &mdash; '+esc(d.nietGebouwd[k])+'</p>').join('')+
        '<p class="mt-m"><a class="knop stil knoplink" href="/apps/appstore-dossier.html?app='+encodeURIComponent(b.dataset.s)+'">Het hele dossier zoals een klant het opent →</a></p>';
    } catch (e) { vak.innerHTML = '<p class="sub">'+esc(e.message)+'</p>'; }
  }));
  document.querySelectorAll('.aTrek').forEach(b => b.addEventListener('click', async () => {
    try { await api(P('/intrekken'), { sleutel: b.dataset.s, reden: 'ingetrokken door de uitgever' }); meld('Ingetrokken - ook bij de leden die hem al hadden.'); laad(); }
    catch (e) { meld(e.message); }
  }));
}
laad();
</script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
</body>
</html>
