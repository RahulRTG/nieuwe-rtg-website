<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<!-- id.js zonder defer en vooraan: RTGId levert id's die al tijdens het parsen nodig zijn -->
<script src="/shared/id.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Rekening</title>
<link rel="icon" href="/icons/partners.svg">
<link href="/fonts/fonts.css" rel="stylesheet">
  <link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<style>
  :root{
    --bg:var(--rtg-bg); --card:var(--rtg-card); --card2:var(--rtg-card2); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft);
    --burgundy:#C23A5E; --gold:#A98F1C;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:3rem;}
  h1,h2,h3{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  a{color:inherit;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),rgba(12,12,11,.86));backdrop-filter:blur(8px);padding:1rem 1.1rem .7rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.8rem;}
  header .ey{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
  header h1{font-size:1.4rem;margin-top:.05rem;}
  .terug{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:.4rem .7rem;font:inherit;font-size:.8rem;cursor:pointer;}
  main{padding:1.1rem;max-width:760px;margin:0 auto;}
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem;margin-top:1rem;}
  .sec{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:1.6rem 0 .3rem;}
  .knop{background:var(--gold);color:#0C0C0B;border:none;border-radius:11px;padding:.55rem 1rem;font:inherit;font-weight:600;font-size:.85rem;cursor:pointer;}
  .knop.stil{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:500;}
  .knop:active{transform:scale(.98);}
  input,select{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:.5rem .6rem;font:inherit;font-size:.9rem;}
  label{font-size:.72rem;color:var(--soft);display:block;margin-bottom:.3rem;}
  .rij{display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end;}
  .leeg{color:var(--muted);font-size:.9rem;padding:1rem 0;text-align:center;}
  .rek{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .rek:last-child{border-bottom:none;}
  .rek .sald{font-family:'Bodoni Moda',serif;font-size:1.3rem;color:var(--gold);}
  .rek .iban{font-size:.72rem;color:var(--soft);letter-spacing:.04em;}
  .rek .soort{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .mini{font-size:.75rem;padding:.32rem .6rem;}
  /* AI-bankier, prominent bovenaan */
  .ai{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--gold);border-radius:18px;padding:1.1rem;margin-top:1rem;}
  .ai h2{font-size:1.1rem;display:flex;align-items:center;gap:.5rem;}
  .ai .we{font-size:.8rem;color:var(--muted);line-height:1.55;margin-top:.35rem;white-space:pre-wrap;}
  .ai .snel{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.7rem;}
  .ai .snel button{background:rgba(169,143,28,.14);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:.3rem .7rem;font:inherit;font-size:.76rem;cursor:pointer;}
  .ai .vraag{display:flex;gap:.5rem;margin-top:.7rem;}
  .ai .vraag input{flex:1;}
  .tips{margin-top:.6rem;font-size:.8rem;color:var(--muted);line-height:1.6;}
  .tips li{margin-left:1rem;}
  .banner{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.6rem;text-align:center;margin-top:2rem;}
  .banner h2{font-size:1.3rem;margin-bottom:.5rem;}
  .banner p{color:var(--muted);font-size:.9rem;line-height:1.6;}
  /* het financiele hart: een afschrift over alles, met een klein bronlabel */
  .hrow{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.82rem;}
  .hrow:last-child{border-bottom:none;}
  .hrow .oms{color:var(--txt);}
  .hrow .sub{color:var(--soft);font-size:.7rem;margin-top:.1rem;}
  .hrow .bed{font-family:'Bodoni Moda',serif;font-size:1rem;white-space:nowrap;}
  .pil{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:.06rem .5rem;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:.4rem;vertical-align:middle;}
  .pil.rtg{color:var(--gold);border-color:rgba(169,143,28,.5);}
  .gratis{font-size:.78rem;color:var(--muted);margin-top:.4rem;line-height:1.55;}
  .staaf{height:6px;background:rgba(169,143,28,.16);border-radius:3px;overflow:hidden;margin-top:.25rem;}
  .staaf i{display:block;height:100%;background:var(--gold);}
</style>
<link href="/shared/dagkleur.css" rel="stylesheet">
<link href="/shared/desktopframe.css" rel="stylesheet">
<script src="/shared/seizoen.js" defer></script>
<script src="/shared/desktopframe.js" defer></script>

</head>
<body class="rtg-stijl">
<header>
  <button class="terug" id="terug">←</button>
  <div><div class="ey">RTG · Eigen rekening</div><h1>RTG Rekening</h1></div>
</header>
<main id="app"><div class="leeg">Laden…</div></main>

<script>
const $ = s => document.querySelector(s);
const esc = t => String(t==null?'':t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro = c => '€ ' + ((Number(c)||0)/100).toFixed(2);
let TOKEN = null; try { TOKEN = localStorage.getItem('rtg_member_token'); } catch (e) {}
$('#terug').addEventListener('click', () => { location.href = '/apps/app.html'; });
const api = (pad, body) => fetch('/api/' + pad, {
  method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
  body: JSON.stringify(body || {})
}).then(async r => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Er ging iets mis.'); return d; });

let OV = null, HART = null;
/* Meenemen (shared/uitvoer.js): het financiele hart is de lijst die deze app
   ECHT bezit -- alle boekingen over al je rekeningen plus je RTG Pay-wallet,
   met het bronlabel erbij. De CSV-knop per rekening blijft wat hij was: het
   afschrift van EEN IBAN, door de server gebouwd. Dit is het geheel, met de
   velden los in plaats van de regel "− € 37,00 · taxi (Ibiza Executive
   Cars)" die op het scherm staat.

   De datum komt uit het grootboek als een GETAL (Date.now(), millisecondes);
   dat is hier eerst als tekst afgeknipt en dan stond er "1785764826" in het
   bestand. Dus dezelfde weg als het scherm: via new Date(). */
const isoDag = w => { const d = new Date(w); return isNaN(d) ? '' : d.toISOString().slice(0, 10); };
if (window.RTGUitvoer) RTGUitvoer.bron(() => {
  if (!HART || !HART.length) return null;
  return {
    naam: 'financieel-hart',
    kolommen: ['datum', 'omschrijving', 'soort', 'bron', 'tegenrekening', 'af of bij', 'bedrag'],
    rijen: HART.map(r => [isoDag(r.at), r.oms || '', r.soort || '',
      r.bron || '', r.tegen || '', r.af ? 'af' : 'bij', ((Number(r.centen) || 0) / 100).toFixed(2)])
  };
});
async function laad(){
  try { OV = await api('bank/overzicht'); render(); }
  catch (e) { $('#app').innerHTML = '<div class="banner"><h2>Even niet bereikbaar</h2><p>' + esc(e.message) + '</p></div>'; }
}

function render(){
  if (!OV.online) {
    $('#app').innerHTML = '<div class="banner"><h2>Binnenkort</h2><p>RTG Rekening opent hier zodra RTG hem live zet. Je RTG Pay-wallet werkt gewoon door.</p></div>';
    return;
  }
  if (!OV.akkoord) {
    $('#app').innerHTML =
      '<div class="banner"><h2>Open je RTG Rekening</h2>' +
      '<p>Je eigen rekening binnen RTG: een echt IBAN, met tegoedrente van ' + (OV.spaarrentePct) + '% rente, passen en meer. Gebouwd op hetzelfde grootboek als RTG Pay. Alle premium functies zijn inbegrepen -- gratis. Heb je de Business Pass, dan komt je zakelijke rekening er automatisch bij. Ga je akkoord, dan openen we meteen je betaalrekening.</p>' +
      '<div style="margin-top:1rem;"><button class="knop" id="akk">Ik ga akkoord en open mijn rekening</button></div></div>';
    $('#akk').addEventListener('click', async () => {
      try { await api('bank/akkoord'); OV = await api('bank/overzicht'); render(); ai(); }
      catch (e) { alert(e.message); }
    });
    return;
  }
  const reks = OV.rekeningen || [];
  $('#app').innerHTML =
    '<div class="ai" id="ai"><h2>De AI-bankier</h2><div class="we" id="aiWe">Ik kijk mee met je rekeningen en geef eerlijk advies. Ik adviseer; beslissen doe jij.</div>' +
      '<div class="snel">' +
        '<button data-q="Hoe kan ik het beste sparen?">Beter sparen?</button>' +
        '<button data-q="Sta ik ergens rood en wat kan ik doen?">Sta ik rood?</button>' +
        '<button data-q="Wat kost een lening bij jullie en hoe werkt het?">Lening?</button>' +
      '</div>' +
      '<div class="vraag"><input id="aiV" placeholder="Vraag de AI-bankier iets…"><button class="knop" id="aiB">Vraag</button></div>' +
      '<ul class="tips" id="aiTips"></ul></div>' +
    '<div class="sec">Mijn rekeningen · totaal ' + euro(OV.totaalCenten) + '</div>' +
    '<div class="kaart" id="reks">' + (reks.length ? reks.map(rekHtml).join('') : '<div class="leeg">Nog geen rekeningen.</div>') + '</div>' +
    '<div class="sec">Nieuwe rekening</div>' +
    '<div class="kaart"><div class="rij">' +
      '<span><label for="nsoort">Soort</label><select id="nsoort"><option value="betaal">Betaalrekening</option><option value="spaar">Spaarrekening</option><option value="zakelijk">Zakelijke rekening</option></select></span>' +
      '<button class="knop stil" id="nopen">Open rekening</button></div></div>' +
    '<div class="sec">Overboeken tussen mijn rekeningen</div>' +
    '<div class="kaart"><div class="rij">' +
      '<span><label for="ovan">Van</label>' + rekSelect('ovan') + '</span>' +
      '<span><label for="onaar">Naar</label>' + rekSelect('onaar') + '</span>' +
      '<span><label for="obed">Bedrag (€)</label><input id="obed" type="number" min="0" step="0.01" style="width:7rem;"></span>' +
      '<button class="knop stil" id="odoe">Overboek</button></div></div>' +
    '<div class="sec">Het financiële hart</div>' +
    '<div class="kaart"><div class="gratis">Alles op één afschrift: je bankrekeningen, je RTG Pay-wallet en betalingen die via een derde lopen -- die dragen alleen een klein bronlabel, verder staan ze er als elke eigen betaling.</div>' +
      '<div id="hart" style="margin-top:.5rem;"><div class="leeg">Laden…</div></div></div>' +
    '<div class="sec">Premium, inbegrepen · gratis</div>' +
    '<div class="kaart"><h3 style="font-size:1rem;">Inzichten</h3><div class="gratis">Je uitgaven van deze maand, per soort.</div><div id="inz" style="margin-top:.5rem;"></div></div>' +
    '<div class="kaart"><h3 style="font-size:1rem;">Vaste-lasten-radar</h3><div class="gratis">Terugkerende afschrijvingen, automatisch herkend.</div><div id="vast" style="margin-top:.5rem;"></div></div>' +
    '<div class="kaart"><h3 style="font-size:1rem;">Wisselgeld sparen</h3><div class="gratis">Elke uitgave rekenen we af naar de hele euro; één veeg zet het wisselgeld van deze maand op je spaarrekening. Geen spaarrekening? Die komt er dan automatisch bij.</div>' +
      '<div class="rij" style="margin-top:.6rem;"><button class="knop stil" id="veeg">Veeg mijn wisselgeld</button><span id="veegUit" class="gratis"></span></div></div>';
  bindBank(reks);
  hartLaad();
  if (!STIL) ai();
  STIL = false;
}

/* ---- het financiele hart + de premium-kaarten ---- */
async function hartLaad(){
  try {
    const h = await api('bank/hart', { limit: 25 });
    HART = h.regels || [];
    $('#hart').innerHTML = (h.regels && h.regels.length) ? h.regels.map(r =>
      '<div class="hrow"><div><span class="oms">' + esc(r.oms || r.soort) + '</span>' +
        '<span class="pil' + (r.bron === 'RTG Rekening' || r.bron === 'RTG Pay' ? ' rtg' : '') + '">' + esc(r.bron) + '</span>' +
        '<div class="sub">' + new Date(r.at).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' }) + ' · ' + esc(r.tegen) + '</div></div>' +
      '<div class="bed">' + (r.af ? '−' : '+') + ' ' + euro(r.centen) + '</div></div>').join('')
      : '<div class="leeg">Nog geen boekingen.</div>';
  } catch (e) { const el = $('#hart'); if (el) el.innerHTML = '<div class="leeg">' + esc(e.message) + '</div>'; }
  try {
    const i = await api('bank/inzichten');
    const top = (i.perSoort || []).slice(0, 6), max = top.length ? top[0].centen : 1;
    $('#inz').innerHTML = '<div class="gratis">' + i.maand + ' · ' + i.posten + ' posten · totaal ' + euro(i.uitgavenCenten) + '</div>' +
      (top.length ? top.map(s => '<div style="margin-top:.45rem;font-size:.78rem;">' + esc(s.soort) + ' · ' + euro(s.centen) +
        '<div class="staaf"><i style="width:' + Math.max(4, Math.round(100 * s.centen / max)) + '%;"></i></div></div>').join('')
        : '<div class="leeg">Nog geen uitgaven deze maand.</div>');
  } catch (e) { const el = $('#inz'); if (el) el.innerHTML = '<div class="leeg">' + esc(e.message) + '</div>'; }
  try {
    const v = await api('bank/vastelasten');
    $('#vast').innerHTML = (v.vasteLasten && v.vasteLasten.length) ? v.vasteLasten.map(l =>
      '<div class="hrow"><div><span class="oms">' + esc(l.oms || l.tegen) + '</span><div class="sub">' + esc(l.tegen) + ' · ' + l.maanden + ' maanden gezien</div></div>' +
      '<div class="bed">' + euro(l.centen) + '</div></div>').join('')
      : '<div class="leeg">Nog geen vaste lasten herkend.</div>';
  } catch (e) { const el = $('#vast'); if (el) el.innerHTML = '<div class="leeg">' + esc(e.message) + '</div>'; }
  const vg = $('#veeg');
  if (vg && !vg._b) { vg._b = 1; vg.addEventListener('click', async () => {
    try {
      const r = await api('bank/veeg');
      $('#veegUit').textContent = r.geveegdCenten ? euro(r.geveegdCenten) + ' naar je spaarpot geveegd.' : (r.melding || 'Niets te vegen.');
      if (r.geveegdCenten) await herlaad();
    } catch (e) { $('#veegUit').textContent = e.message; }
  }); }
}

const rekSelect = id => '<select id="' + id + '">' + (OV.rekeningen||[]).map(r => '<option value="' + r.iban + '">' + esc(r.soortLabel || r.soort) + ' · ' + euro(r.saldoCenten) + '</option>').join('') + '</select>';
function rekHtml(r){
  return '<div class="rek"><div><div class="sald">' + euro(r.saldoCenten) + '</div><div class="soort">' + esc(r.soortLabel || r.soort) + (r.bevroren ? ' · bevroren' : '') + '</div><div class="iban">' + esc(r.iban) + '</div></div>' +
    '<div class="rij">' +
      '<button class="knop stil mini" data-stort="' + r.iban + '">Storten</button>' +
      '<button class="knop stil mini" data-nwallet="' + r.iban + '">Naar wallet</button>' +
      '<button class="knop stil mini" data-pas="' + r.iban + '">Pas</button>' +
      (r.soort === 'spaar' ? '<button class="knop stil mini" data-doel="' + r.iban + '">Spaardoel</button>' : '') +
      '<button class="knop stil mini" data-afschrift="' + r.iban + '">Afschrift</button>' +
      '<button class="knop stil mini" data-csv="' + r.iban + '" title="Download het afschrift als CSV-bestand">CSV</button>' +
    '</div><div class="afschrift" data-blad="' + r.iban + '" hidden style="flex-basis:100%;font-size:.78rem;color:var(--muted);line-height:1.7;"></div></div>';
}
function bindBank(reks){
  $('#nopen').addEventListener('click', async () => { try { await api('bank/rekening/open', { soort: $('#nsoort').value }); await herlaad(); } catch (e) { alert(e.message); } });
  $('#odoe').addEventListener('click', async () => {
    const centen = Math.round(Number($('#obed').value) * 100);
    try { await api('bank/overboek', { vanIban: $('#ovan').value, naarIban: $('#onaar').value, centen }); $('#obed').value=''; await herlaad(); } catch (e) { alert(e.message); }
  });
  document.querySelectorAll('[data-stort]').forEach(b => b.addEventListener('click', async () => {
    const euroS = prompt('Hoeveel storten op deze rekening? (euro)'); if (euroS == null) return;
    try { const r = await api('bank/storten', { iban: b.dataset.stort, centen: Math.round(Number(euroS)*100), idem: RTGIdem('stort') }); alert('Gestort via ' + r.via + '. Saldo: ' + euro(r.saldoCenten)); await herlaad(); } catch (e) { alert(e.message); }
  }));
  document.querySelectorAll('[data-nwallet]').forEach(b => b.addEventListener('click', async () => {
    const euroS = prompt('Hoeveel naar je RTG Pay-wallet? (euro)'); if (euroS == null) return;
    try { await api('bank/naar-wallet', { iban: b.dataset.nwallet, centen: Math.round(Number(euroS)*100) }); await herlaad(); } catch (e) { alert(e.message); }
  }));
  document.querySelectorAll('[data-pas]').forEach(b => b.addEventListener('click', async () => {
    try { const r = await api('bank/pas/uitgeven', { iban: b.dataset.pas, soort: 'debit' }); alert('Pas uitgegeven: ' + r.pas.nummer); } catch (e) { alert(e.message); }
  }));
  document.querySelectorAll('[data-doel]').forEach(b => b.addEventListener('click', async () => {
    const euroS = prompt('Wat is je spaardoel? (euro)'); if (euroS == null) return;
    try { const r = await api('bank/spaardoel', { iban: b.dataset.doel, euro: Number(euroS) }); alert('Spaardoel gezet. Je bent op ' + r.pct + '%.'); } catch (e) { alert(e.message); }
  }));
  // afschrift-export: het volledige afschrift als CSV-download. Via fetch met
  // de Authorization-header (nooit het token in een URL) en dan een blob.
  document.querySelectorAll('[data-csv]').forEach(b => b.addEventListener('click', async () => {
    try {
      const r = await fetch('/api/bank/afschrift.csv', {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
        body: JSON.stringify({ iban: b.dataset.csv })
      });
      if (!r.ok) { const f = await r.json().catch(() => ({})); throw new Error(f.error || 'Export mislukt.'); }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(await r.blob());
      a.download = 'rtg-afschrift-' + b.dataset.csv + '-' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch (e) { alert(e.message); }
  }));
  // het afschrift: de laatste boekingen van deze rekening, uitklapbaar
  document.querySelectorAll('[data-afschrift]').forEach(b => b.addEventListener('click', async () => {
    const blad = document.querySelector('.afschrift[data-blad="' + b.dataset.afschrift + '"]');
    if (!blad) return;
    if (!blad.hidden) { blad.hidden = true; return; }
    try {
      const r = await api('bank/afschrift', { iban: b.dataset.afschrift, limit: 15 });
      blad.innerHTML = (r.regels && r.regels.length)
        ? r.regels.map(x => '<div>' + (x.af ? '− ' : '+ ') + euro(x.centen) + ' · ' + esc(x.oms || x.soort) + ' <span style="color:var(--soft);">(' + esc(x.tegen) + ')</span></div>').join('')
        : '<div>Nog geen boekingen.</div>';
      blad.hidden = false;
    } catch (e) { alert(e.message); }
  }));
}
async function herlaad(){ OV = await api('bank/overzicht'); render(); }

/* Live: de server stuurt een seintje (SSE, scope 'bank') bij elke boeking die
   deze rekeninghouder raakt -- rente, een tik-dekking vanaf de bank, een
   binnenkomende overboeking. Het scherm ververst dan vanzelf, zonder de
   AI-bankier opnieuw aan het woord te laten (STIL) en met een korte demper
   zodat een reeks boekingen één verversing wordt. */
let STIL = false, ES = null, EST = null;
function live(){
  if (!window.EventSource || ES) return;
  try { ES = new EventSource('/api/stream?token=' + encodeURIComponent(TOKEN)); } catch (e) { return; }
  ES.addEventListener('sync', e => {
    let scope = null; try { scope = JSON.parse(e.data).scope; } catch (x) {}
    if (scope !== 'bank' || !OV) return;
    clearTimeout(EST);
    EST = setTimeout(() => { STIL = true; herlaad().catch(() => { STIL = false; }); }, 400);
  });
}

/* de AI-bankier, diep geworteld: laadt bij het openen meteen een analyse, en
   antwoordt op vragen met de volle context van de eigen rekeningen. */
async function ai(vraag){
  const we = $('#aiWe'), tips = $('#aiTips'); if (!we) return;
  we.textContent = 'Even kijken…';
  try {
    const r = await api('bank/advies', vraag ? { vraag } : {});
    we.textContent = r.antwoord || r.samenvatting || '';
    tips.innerHTML = (r.tips || []).map(t => '<li>' + esc(t) + '</li>').join('');
  } catch (e) { we.textContent = e.message; }
  const vBtn = $('#aiB'), vIn = $('#aiV');
