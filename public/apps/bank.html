<!-- Bank is een stand van RTG Geld geworden (PLATFORM.md par. 0: acht apps,
     niet drieentachtig). De stand roept exact dezelfde routes aan als deze
     pagina dat deed; alleen de schil is samengevoegd.

     Dit pad blijft bestaan omdat er van buiten naar gelinkt kan zijn -- een
     bladwijzer, een gedeelde link, een als PWA geinstalleerd icoon -- en een
     dood pad is erger dan een omleiding. De hash wijst de schil meteen naar de
     juiste stand.

     De querystring gaat VOOR de hash mee. Andersom is de query geen query meer
     maar een stuk van de hash, en dan komt hij nergens aan; die fout stond in
     de veilig-omleidingen een commit lang. -->
<meta http-equiv="refresh" content="0; url=/apps/geld.html#bank">
<link rel="canonical" href="/apps/geld.html#bank">
<script>location.replace('/apps/geld.html' + location.search + '#bank');</script>
</head>
<body style="background:#0C0C0B;color:#F4F1EC;font-family:Inter,system-ui,sans-serif;padding:2rem;">
<p>Bank staat nu in RTG Geld. <a href="/apps/geld.html#bank" style="color:#C9A24B;">Ga verder</a>.</p>
</body>
