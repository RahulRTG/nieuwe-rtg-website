<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berichten · RTG</title>
<link rel="icon" href="/icons/partners.svg">
<link rel="manifest" href="/manifests/berichten.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Berichten">
<link href="/fonts/fonts.css" rel="stylesheet">
  <link href="/shared/rtg-uniform.css" rel="stylesheet">
<style>
  :root{ --bg:#0C0C0B; --card:#151312; --card2:#1B1817; --line:rgba(255,255,255,0.10);
    --txt:#F4F1EC; --muted:rgba(244,241,236,0.68); --soft:rgba(244,241,236,0.5); --burgundy:#C23A5E; --gold:#A98F1C; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;padding-bottom:5.5rem;}
  h1,h2,h3{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),rgba(12,12,11,.86));backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 1rem) 1.1rem .7rem;border-bottom:1px solid var(--line);}
  .kop{display:flex;align-items:flex-end;gap:.8rem;}
  header .ey{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
  header h1{font-size:1.35rem;}
  header .tel{font-size:.72rem;background:var(--burgundy);color:#fff;border-radius:999px;padding:.15rem .6rem;}
  select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit;font-size:.85rem;padding:.5rem .7rem;}
  input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  #zoekveld{width:100%;margin-top:.7rem;}
  .filters{display:flex;gap:.4rem;margin-top:.6rem;overflow-x:auto;padding-bottom:.15rem;}
  .filters button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:.3rem .8rem;font:inherit;font-size:.76rem;white-space:nowrap;cursor:pointer;}
  .filters button[aria-pressed="true"]{background:var(--burgundy);border-color:var(--burgundy);color:#fff;}
  main{padding:1.1rem;max-width:680px;margin:0 auto;}
  .rijk{display:flex;gap:.8rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem .9rem;margin-bottom:.6rem;transition:border-color .15s;text-decoration:none;color:inherit;width:100%;text-align:left;font:inherit;cursor:pointer;}
  .rijk:hover{border-color:var(--gold);}
  .rijk .ic{font-size:1.4rem;width:2.4rem;height:2.4rem;display:grid;place-items:center;background:var(--card2);border-radius:12px;flex-shrink:0;}
  .rijk .b{flex:1;min-width:0;}
  .rijk .nm{font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:.4rem;}
  .rijk .lt{font-size:.82rem;color:var(--soft);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rijk .tijd{font-size:.7rem;color:var(--soft);white-space:nowrap;}
  .badge{background:var(--burgundy);color:#fff;font-size:.66rem;border-radius:999px;padding:.08rem .45rem;}
  .merk{font-size:.62rem;color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:.02rem .4rem;}
  .beheer{display:flex;gap:.3rem;flex-shrink:0;}
  .beheer button{background:none;border:1px solid var(--line);color:var(--soft);border-radius:9px;width:1.9rem;height:1.9rem;font-size:.72rem;cursor:pointer;}
  .beheer button[aria-pressed="true"]{color:var(--gold);border-color:var(--gold);}
  .leeg{color:var(--soft);font-size:.9rem;text-align:center;padding:2.5rem 1rem;line-height:1.6;}
  .noot{font-size:.72rem;color:var(--soft);text-align:center;margin-top:1rem;line-height:1.5;}
  .inlog{text-align:center;padding:3rem 1rem;}
  /* het gesprek */
  .terug{background:none;border:none;color:var(--gold);font:inherit;font-size:.8rem;cursor:pointer;padding:0 0 .6rem;}
  .draad{display:flex;flex-direction:column;gap:.5rem;margin:.4rem 0 1rem;}
  .bel{max-width:80%;padding:.55rem .8rem;border-radius:14px;font-size:.9rem;line-height:1.45;word-break:break-word;}
  .bel.van-mij{align-self:flex-end;background:var(--burgundy);color:#fff;border-bottom-right-radius:4px;}
  .bel.van-ander{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .bel .mt{display:block;font-size:.63rem;opacity:.7;margin-top:.25rem;}
  .werkbalk{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem;}
  .werkbalk button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:.35rem .8rem;font:inherit;font-size:.78rem;cursor:pointer;}
  .werkbalk button:hover{border-color:var(--gold);}
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem;margin-bottom:.8rem;font-size:.88rem;line-height:1.55;white-space:pre-wrap;}
  .kaart h3{font-size:.95rem;margin-bottom:.4rem;}
  .kaart .rij{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem 0;border-top:1px solid var(--line);}
  .kaart .rij:first-of-type{border-top:none;}
  .kaart .rij button{background:none;border:1px solid var(--line);color:var(--gold);border-radius:9px;padding:.2rem .6rem;font:inherit;font-size:.72rem;cursor:pointer;flex-shrink:0;}
  .stuur{display:flex;gap:.5rem;align-items:flex-end;}
  .stuur textarea{flex:1;resize:none;min-height:2.6rem;max-height:8rem;}
  .stuur button{background:var(--burgundy);border:none;color:#fff;border-radius:10px;padding:.65rem 1rem;font:inherit;font-size:.85rem;cursor:pointer;}
  /* de AI-balk: onderaan, altijd bereikbaar */
  .aibalk{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(0deg,var(--bg) 60%,rgba(12,12,11,.7));border-top:1px solid var(--line);padding:.6rem 1.1rem calc(env(safe-area-inset-bottom) + .6rem);}
  .aibalk form{display:flex;gap:.5rem;max-width:680px;margin:0 auto;}
  .aibalk input{flex:1;}
  .aibalk button{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:.5rem .9rem;font:inherit;font-size:.82rem;cursor:pointer;}
  .aibalk .uit{max-width:680px;margin:0 auto .5rem;font-size:.82rem;color:var(--muted);line-height:1.5;max-height:9rem;overflow:auto;}
  .wacht{opacity:.55;pointer-events:none;}
</style>
<link href="/shared/dagkleur.css" rel="stylesheet">
<link href="/shared/desktopframe.css" rel="stylesheet">
<script src="/shared/seizoen.js" defer></script>
<script src="/shared/desktopframe.js" defer></script>
<script src="/shared/realtime.js" defer></script>
</head>
<body>
<header>
  <div class="kop">
    <div><div class="ey">Alles op een plek</div><h1>Berichten</h1></div>
    <select id="taalKies" hidden style="margin-left:auto;max-width:9.5rem;" aria-label="Moedertaal"></select>
    <span class="tel" id="tel" hidden></span>
  </div>
  <input id="zoekveld" type="search" placeholder="Zoek in al je gesprekken" aria-label="Zoek in al je gesprekken" hidden>
  <div class="filters" id="filters" role="group" aria-label="Filter op soort" hidden></div>
</header>
<main id="main"><div class="leeg">Laden…</div></main>
<div class="aibalk" id="aibalk" hidden>
  <div class="uit" id="aiuit" hidden aria-live="polite"></div>
  <form id="aiform">
    <input id="aiin" placeholder="Zeg wat er moet gebeuren" aria-label="Zeg Rahul wat er moet gebeuren" autocomplete="off">
    <button type="submit">Rahul</button>
  </form>
</div>
<script>
/* De Berichten-app. Drie schermen in een pagina: de lijst, een gesprek, en de
   zoekuitslag. De AI-balk staat er altijd onder: je typt wat er moet gebeuren
   en Rahul doet het, want elke handeling in deze app is een gewone API-route
   die het stuur (kern/stuur.js) ook zelf kan aanroepen.

   Wat de AI hier NIET doet: iets versturen. "Stel een antwoord op" zet de tekst
   in het invoerveld; jij leest het en drukt zelf op versturen. */
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=null; try{ TOKEN=localStorage.getItem('rtg_member_token'); }catch(e){}
let KANALEN=[], FILTER='alles', ARCHIEF=false, OPEN=null;   // OPEN = {key, naam} van het geopende gesprek

const SOORTEN=[['alles','Alles'],['dm','Mensen'],['werk','Werk'],['officieel','Officieel'],['archief','Archief']];
const inFilter=k=> FILTER==='alles' ? true
  : FILTER==='dm' ? k.soort==='dm'
  : FILTER==='werk' ? k.soort==='werk'
  : FILTER==='officieel' ? (k.soort==='overheid'||k.soort==='rtmail') : true;

const tijd=iso=>{ if(!iso) return ''; const d=new Date(iso), nu=new Date(); const dag=86400000;
  if(nu-d<dag && d.getDate()===nu.getDate()) return d.toTimeString().slice(0,5);
  if(nu-d<7*dag) return ['zo','ma','di','wo','do','vr','za'][d.getDay()];
  return d.getDate()+'/'+(d.getMonth()+1); };

async function api(pad,body){
  const r=await fetch(pad,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify(body||{})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||d.reden||'Er ging iets mis.');
  return d;
}
function toon(html){ $('#main').innerHTML=html; }

/* ---------- 1. de lijst ---------- */
function tekenFilters(){
  $('#filters').innerHTML=SOORTEN.map(([id,label])=>
    '<button type="button" data-f="'+id+'" aria-pressed="'+((id==='archief'?ARCHIEF:(!ARCHIEF&&FILTER===id))?'true':'false')+'">'+esc(label)+'</button>').join('');
  $('#filters').hidden=false;
  $('#filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(b.dataset.f==='archief'){ ARCHIEF=!ARCHIEF; FILTER='alles'; } else { ARCHIEF=false; FILTER=b.dataset.f; }
    laad();
  });
}
async function laad(){
  if(!TOKEN){ toon('<div class="inlog"><h2>Log eerst in</h2><p style="color:var(--muted);margin-top:.6rem;font-size:.9rem;">Open de RTG-app en log in; daarna staan al je gesprekken hier.</p></div>'); return; }
  let d;
  try{ d=await api('/api/member/berichten',{archief:ARCHIEF}); }
  catch(e){ toon('<div class="leeg">'+esc(e.message)+'</div>'); return; }
  KANALEN=d.kanalen||[];
  $('#zoekveld').hidden=false; $('#aibalk').hidden=false; tekenFilters();
  if(d.ongelezen){ $('#tel').textContent=d.ongelezen; $('#tel').hidden=false; } else $('#tel').hidden=true;
  const lijst=KANALEN.filter(inFilter);
  if(!lijst.length){ toon('<div class="leeg">'+(ARCHIEF?'Niets gearchiveerd.':'Nog geen gesprekken.<br>Start er een in De Salon, bij je vrienden of via Rahul.')+'</div>'); return; }
  toon(lijst.map(k=>{
    const knop = k.soort==='dm'
      ? '<button class="rijk" type="button" data-open="'+esc(k.key)+'" data-naam="'+esc(k.titel)+'">'
      : '<a class="rijk" href="'+esc(k.link)+'">';
    const eind = k.soort==='dm' ? '</button>' : '</a>';
    return '<div style="display:flex;gap:.5rem;align-items:center;margin-bottom:.6rem;">'+
      knop+'<span class="ic">'+esc(k.icoon)+'</span><span class="b"><span class="nm">'+esc(k.titel)+
      (k.vast?' <span class="merk">vast</span>':'')+(k.stil?' <span class="merk">stil</span>':'')+
      (k.stemming?' '+esc(k.stemming):'')+
      (k.ongelezen&&!k.stil?' <span class="badge">'+k.ongelezen+'</span>':'')+
      '</span><span class="lt">'+esc(k.laatste)+'</span></span><span class="tijd">'+tijd(k.at)+'</span>'+eind+
      '<span class="beheer">'+
      '<button type="button" title="Vastzetten" aria-label="Vastzetten" data-vlag="vast" data-id="'+esc(k.id)+'" aria-pressed="'+(k.vast?'true':'false')+'">V</button>'+
      '<button type="button" title="Stil" aria-label="Stil zetten" data-vlag="stil" data-id="'+esc(k.id)+'" aria-pressed="'+(k.stil?'true':'false')+'">S</button>'+
      '<button type="button" title="Archiveren" aria-label="Archiveren" data-vlag="weg" data-id="'+esc(k.id)+'" aria-pressed="'+(k.weg?'true':'false')+'">A</button>'+
      '</span></div>';
  }).join('')+'<div class="noot">Je socials, je werk en de overheid op een plek. Vastgezette gesprekken staan bovenaan; gearchiveerde blijven bestaan, je ziet ze alleen niet meer staan.</div>');
  $('#main').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>opengesprek(b.dataset.open,b.dataset.naam));
  $('#main').querySelectorAll('[data-vlag]').forEach(b=>b.onclick=async()=>{
    const aan=b.getAttribute('aria-pressed')!=='true';
    try{ await api('/api/member/berichten/vlag',{id:b.dataset.id,vlag:b.dataset.vlag,aan}); laad(); }
    catch(e){ meld(e.message); }
  });
}

/* ---------- 2. een gesprek ---------- */
async function opengesprek(key,naam){
  OPEN={key,naam};
  toon('<div class="leeg">Gesprek laden…</div>');
  let d;
  try{ d=await api('/api/member/dm',{withKey:key}); }
  catch(e){ toon('<div class="leeg">'+esc(e.message)+'</div>'); return; }
  const naamNu=d.codename||naam;
  toon('<button class="terug" type="button" id="terug">Terug naar de lijst</button>'+
    '<h2 style="font-size:1.1rem;margin-bottom:.2rem;">'+esc(naamNu)+'</h2>'+
    '<p style="color:var(--soft);font-size:.75rem;margin-bottom:.8rem;">Op codenaam. '+(d.taal?'Berichten worden voor je vertaald.':'')+'</p>'+
    '<div class="werkbalk">'+
      '<button type="button" id="bSamen">Vat samen</button>'+
      '<button type="button" id="bConcept">Stel een antwoord op</button>'+
      '<button type="button" id="bAfspraak">Wat is er afgesproken</button>'+
    '</div>'+
    '<div id="aiplek"></div>'+
    '<div class="draad" id="draad"></div>'+
    '<form class="stuur" id="stuurform"><textarea id="stuurtekst" rows="1" placeholder="Schrijf een bericht" aria-label="Schrijf een bericht" maxlength="500"></textarea><button type="submit">Stuur</button></form>');
  tekenDraad(d.messages||[]);
  $('#terug').onclick=()=>{ OPEN=null; laad(); };
  $('#stuurform').onsubmit=async ev=>{
    ev.preventDefault();
    const t=$('#stuurtekst').value.trim(); if(!t) return;
    $('#stuurform').classList.add('wacht');
    try{ await api('/api/member/dm/send',{toKey:key,text:t}); $('#stuurtekst').value=''; opengesprek(key,naamNu); }
    catch(e){ meld(e.message); }
    finally{ $('#stuurform').classList.remove('wacht'); }
  };
  $('#bSamen').onclick=()=>aiTaak('samenvatting','Samenvatting',r=>'<h3>Samenvatting</h3>'+esc(r.samenvatting));
  $('#bConcept').onclick=()=>aiTaak('concept','Concept',r=>{
    $('#stuurtekst').value=r.concept;
    return '<h3>Concept klaargezet</h3>Het staat in het invoerveld. Lees het na, pas het aan, en druk zelf op Stuur. Rahul verstuurt nooit iets namens jou.';
  });
  /* Alleen een agendaknop als er ECHT een datum uit het gesprek komt. Zonder
     datum weigert de agenda de afspraak, en dan is een knop een belofte die
     stukloopt; die afspraak staat er dus wel, maar zonder knop. */
  $('#bAfspraak').onclick=()=>aiTaak('afspraken','Afspraken',r=> r.afspraken.length
    ? '<h3>Afspraken uit dit gesprek</h3>'+r.afspraken.map((a,i)=>
        '<span class="rij"><span style="flex:1;">'+esc(a.wat)+
        (a.datum?' <span style="color:var(--soft);">('+esc(a.datum)+(a.tijd?' '+esc(a.tijd):'')+')</span>':
                 ' <span style="color:var(--soft);">(geen datum genoemd)</span>')+'</span>'+
        (a.datum?'<button type="button" data-agenda="'+i+'">In agenda</button>':'')+'</span>').join('')
    : '<h3>Afspraken</h3>Ik vond geen concrete afspraken in dit gesprek.', r=>{
      $('#aiplek').querySelectorAll('[data-agenda]').forEach(b=>b.onclick=async()=>{
        const a=r.afspraken[Number(b.dataset.agenda)];
        try{ await api('/api/agenda/toevoegen',{titel:a.wat,datum:a.datum,tijd:a.tijd||null,notitie:'Uit een gesprek in Berichten'});
          b.textContent='Staat erin'; b.disabled=true; }
        catch(e){ meld(e.message); }
      });
    });
}
/* Welke bel staat rechts? De server zegt het (m.mij): de client kent zijn eigen
   sessiesleutel niet en hoort die ook niet te kennen. */
function tekenDraad(msgs){
  $('#draad').innerHTML = msgs.length ? msgs.map(m=>
    '<div class="bel '+(m.mij?'van-mij':'van-ander')+'">'+esc(m.text||'(gedeelde post)')+
      '<span class="mt">'+tijd(m.at)+(m.vertaaldUit?' · vertaald':'')+'</span></div>'
  ).join('') : '<div class="leeg">Nog geen berichten. Zeg iets.</div>';
  window.scrollTo(0,document.body.scrollHeight);
}
/* De drie AI-taken delen dezelfde afhandeling: knop uit, vragen, uitslag tonen,
   en eerlijk melden als de AI niet bereikbaar is. */
async function aiTaak(pad,label,teken,daarna){
  const plek=$('#aiplek');
  plek.innerHTML='<div class="kaart">'+label+' wordt opgehaald…</div>';
  try{
    const r=await api('/api/member/berichten/'+pad,{id:'dm:'+OPEN.key});
    plek.innerHTML='<div class="kaart">'+teken(r)+'</div>';
    if(daarna) daarna(r);
  }catch(e){ plek.innerHTML='<div class="kaart">'+esc(e.message)+'</div>'; }
}

/* ---------- 3. zoeken over alle kanalen ---------- */
let zoekTimer=null;
function zoekOp(){
  clearTimeout(zoekTimer);
  const v=$('#zoekveld').value.trim();
  if(v.length<2){ if(!OPEN) laad(); return; }
  zoekTimer=setTimeout(async()=>{
    try{
      const d=await api('/api/member/berichten/zoek',{vraag:v});
      OPEN=null;
      toon(d.treffers.length
        ? '<p style="color:var(--soft);font-size:.78rem;margin-bottom:.7rem;">'+d.totaal+' treffer(s) voor "'+esc(d.vraag)+'"</p>'+
          d.treffers.map(t=>'<a class="rijk" href="'+esc(t.link)+'"><span class="b"><span class="nm">'+esc(t.titel)+
            ' <span class="merk">'+esc(t.soort)+'</span></span><span class="lt" style="white-space:normal;">'+esc(t.tekst)+'</span></span><span class="tijd">'+tijd(t.at)+'</span></a>').join('')
        : '<div class="leeg">Niets gevonden voor "'+esc(d.vraag)+'".</div>');
    }catch(e){ toon('<div class="leeg">'+esc(e.message)+'</div>'); }
  },250);
}

/* ---------- de AI-balk: typen is genoeg ---------- */
function meld(t){ const u=$('#aiuit'); u.hidden=false; u.textContent=t; }
$('#aiform').onsubmit=async ev=>{
  ev.preventDefault();
  const t=$('#aiin').value.trim(); if(!t) return;
  $('#aiform').classList.add('wacht'); meld('Rahul denkt na…');
  try{
    const d=await api('/api/chat/send',{text:t});
    const m=(d.messages||[]).filter(x=>x.from==='rahul').pop();
    meld(m?m.text:'Rahul heeft het opgepakt.');
    $('#aiin').value='';
    if(!OPEN) laad();               // hij kan iets veranderd hebben in de lijst
  }catch(e){ meld(e.message); }
  finally{ $('#aiform').classList.remove('wacht'); }
};

/* De moedertaal van het account: jij typt in jouw taal, de ander leest in de
   zijne. De kiezer toont de actieve wereldtalen; de chat vertaalt vanaf dat
   moment automatisch per lezer. */
async function taalLaad(){
  if(!TOKEN) return;
  try{
    const d=await api('/api/member/taal',{});
    const kies=$('#taalKies');
    kies.innerHTML='<option value="">Moedertaal…</option>'+d.talen.map(t=>'<option value="'+t.code+'"'+(d.taal===t.code?' selected':'')+'>'+esc(t.naam)+'</option>').join('');
    kies.hidden=false;
    kies.onchange=async()=>{ if(!kies.value) return;
      try{ await api('/api/member/taal/zet',{code:kies.value}); }catch(e){}
    };
  }catch(e){}
}

$('#zoekveld').addEventListener('input',zoekOp);
/* Met ?met=<sleutel> openen we meteen dat gesprek. Dan NIET ook de lijst laden:
   twee schermen die tegelijk binnenkomen, overschrijven elkaar in willekeurige
   volgorde en dan is het toeval wat je ziet. */
const startMet=new URLSearchParams(location.search).get('met');
if(TOKEN && startMet) opengesprek(startMet,''); else laad();
taalLaad();
// live: komt er een bericht binnen, dan werkt het scherm zichzelf bij
window.addEventListener('load',()=>{
  if(!TOKEN || !window.RTGRealtime) return;
  try{
    RTGRealtime.start(TOKEN,{ onSocial:(e)=>{
      if(!e || e.kind!=='dm') return;
      if(OPEN && e.from===OPEN.key) opengesprek(OPEN.key,OPEN.naam); else if(!OPEN) laad();
    }});
  }catch(e){}
});
// zachtjes verversen wanneer de app weer in beeld komt (geen polling-storm)
