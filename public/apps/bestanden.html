<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Bestanden</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bestanden">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --card2:var(--rtg-card2); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft);
    --burgundy:#C23A5E; --gold:#A98F1C; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;padding-bottom:3rem;}
  h1,h2{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),rgba(12,12,11,.9));
    backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + .9rem) 1.1rem .7rem;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;}
  header .ey{display:block;font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
  header h1{font-size:1.15rem;}
  header a.terug{color:var(--muted);text-decoration:none;font-size:1.1rem;}
  main{padding:1rem 1.1rem;max-width:1000px;margin:0 auto;}
  .knop{background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);
    font:inherit;font-size:.8rem;font-weight:600;padding:.45rem .8rem;cursor:pointer;text-decoration:none;display:inline-block;}
  .knop:hover{border-color:var(--gold);}
  .knop.vol{background:var(--gold);border-color:var(--gold);color:#0C0C0B;}
  .knop.aan{border-color:var(--gold);color:var(--gold);}
  .knop:focus-visible,input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .rij{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
  .stil{color:var(--soft);font-size:.82rem;line-height:1.55;}
  .veld,select.veld{background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--txt);
    font:inherit;font-size:.85rem;padding:.45rem .6rem;}
  .kop{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:1.2rem 0 .5rem;}

  /* het quotum: een dunne eerlijke meter */
  .meter{height:4px;background:var(--card2);border-radius:2px;overflow:hidden;margin:.3rem 0 .9rem;}
  .meter i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s;}

  /* het pad en de mappen */
  #pad{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted);margin-bottom:.6rem;}
  /* min-height erbij: .15rem boven en onder bracht de knop net niet op 24 (WCAG 2.5.8) */
  #pad button{background:none;border:none;color:var(--muted);font:inherit;cursor:pointer;padding:.15rem .2rem;min-height:24px;}
  #pad button:hover{color:var(--gold);}
  #pad .hier{color:var(--txt);font-weight:600;}
  .mapkaart{display:inline-flex;align-items:center;gap:.45rem;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:.5rem .75rem;margin:0 .5rem .5rem 0;cursor:pointer;font-size:.84rem;}
  .mapkaart:hover{border-color:var(--gold);}
  .mapkaart .mp{width:.95rem;height:.75rem;border:1.5px solid var(--gold);border-radius:2px 4px 3px 3px;
    border-top-width:4px;opacity:.85;}

  /* de bestandenlijst */
  .item{display:flex;align-items:center;gap:.7rem;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:.55rem .7rem;margin-bottom:.45rem;cursor:pointer;}
  .item:hover{border-color:var(--gold);}
  .item .ext{flex:0 0 auto;width:2.3rem;height:2.3rem;border:1px solid var(--line);border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:.56rem;font-weight:700;
    letter-spacing:.06em;color:var(--gold);background:var(--card2);text-transform:uppercase;}
  .item .wat{flex:1;min-width:0;}
  .item .wat b{display:block;font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .wat span{font-size:.68rem;color:var(--soft);display:flex;gap:.55rem;flex-wrap:wrap;}
  .item .wat .goud{color:var(--gold);}
  .item.weg .wat b{text-decoration:line-through;color:var(--muted);}
  .sleep{border:2px dashed var(--gold);border-radius:14px;padding:2rem 1rem;text-align:center;color:var(--gold);
    display:none;margin-bottom:.7rem;}
  body.sleept .sleep{display:block;}

  /* het paneel */
  .scrim{position:fixed;inset:0;z-index:20;background:rgba(10,10,9,.86);display:none;
    align-items:flex-start;justify-content:center;padding:1rem;overflow:auto;}
  .scrim.open{display:flex;}
  .paneel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem;
    width:min(560px,100%);margin:auto 0;}
  .paneel input.titel{width:100%;background:none;border:none;border-bottom:1px solid var(--line);
    color:var(--txt);font-family:'Bodoni Moda',serif;font-size:1.15rem;padding:.2rem 0 .5rem;outline:none;}
  .paneel label{display:block;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--soft);margin:.7rem 0 .2rem;}
  #bkKijk{margin-top:.8rem;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card2);}
  #bkKijk img{display:block;max-width:100%;max-height:320px;margin:0 auto;}
  #bkKijk pre{padding:.7rem .8rem;font-size:.78rem;line-height:1.5;color:var(--muted);max-height:280px;
    overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace;}
  .versierij{display:flex;align-items:center;gap:.6rem;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.8rem;color:var(--muted);}
  .versierij .knop{padding:.25rem .55rem;font-size:.7rem;}
  .melding{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--card2);
    border:1px solid var(--line);border-radius:999px;padding:.5rem .95rem;font-size:.82rem;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;}
  .melding.zie{opacity:1;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
<link href="/shared/dagkleur.css" rel="stylesheet">
<script src="/shared/seizoen.js" defer></script>
<link href="/shared/ios.css" rel="stylesheet">
</head>
<body class="rtg-stijl">
<header>
  <a class="terug" href="/apps/app.html" aria-label="Terug naar het bureaublad">&#8592;</a>
  <span><span class="ey">RTG</span><h1>Bestanden</h1></span>
  <span class="rij" style="margin-left:auto;">
    <button class="knop" id="toonBak" type="button">Prullenbak</button>
    <button class="knop" id="nieuwMap" type="button">+ Map</button>
    <button class="knop vol" id="kies" type="button">Upload</button>
    <input type="file" id="bestandkiezer" multiple hidden aria-label="Bestanden kiezen">
  </span>
</header>
<main>
  <div class="rij" style="justify-content:space-between;">
    <span class="stil" id="quotumTekst">&nbsp;</span>
    <select class="veld" id="sorteer" aria-label="Sorteren">
      <option value="nieuw">Nieuwste eerst</option>
      <option value="naam">Op naam</option>
      <option value="groot">Grootste eerst</option>
    </select>
  </div>
  <div class="meter" aria-hidden="true"><i id="quotumBalk"></i></div>
  <input class="veld" id="zoek" type="search" placeholder="Zoek in de kluis" aria-label="Zoeken"
    style="width:100%;margin-bottom:.7rem;">
  <div class="sleep">Laat los om te uploaden</div>
  <nav id="pad" aria-label="Mappenpad"></nav>
  <div id="mappen"></div>
  <div id="lijst" aria-live="polite"></div>
  <div id="gedeeldKop" class="kop" style="display:none;">Met mij gedeeld</div>
  <div id="gedeeldLijst"></div>
  <div id="officeKop" class="kop" style="display:none;">Uit RTG Office · werken doet u daar</div>
  <div id="officeLijst"></div>
  <p class="stil" style="margin-top:.8rem;">Alles in de kluis staat versleuteld opgeslagen. De prullenbak bewaart
    30 dagen en telt mee voor het quotum; delen op codenaam laat de ander kijken en nieuwe versies plaatsen.</p>
</main>

<div class="scrim" id="bkScrim" role="dialog" aria-label="Bestand">
  <div class="paneel">
    <input class="titel" id="bkNaam" maxlength="120" aria-label="Bestandsnaam">
    <p class="stil" id="bkMeta" style="margin-top:.4rem;"></p>
    <div id="bkKijk" style="display:none;"></div>
    <label for="bkMap">In map</label>
    <select class="veld" id="bkMap" style="width:100%;"></select>
    <div id="bkDeelWrap">
      <label for="bkCode">Delen op codenaam (kijken en nieuwe versies)</label>
      <div class="rij"><input class="veld" id="bkCode" maxlength="60" placeholder="Codenaam" style="flex:1;">
        <button class="knop" id="bkDeel" type="button">Deel</button></div>
      <p class="stil" id="bkGedeeld"></p>
    </div>
    <div id="bkVersieWrap" style="display:none;">
      <label>Versies</label>
      <div id="bkVersies"></div>
    </div>
    <div class="rij" style="margin-top:.9rem;">
      <button class="knop vol" id="bkBewaar" type="button">Bewaar</button>
      <button class="knop" id="bkHaal" type="button">Download</button>
      <button class="knop" id="bkNieuwVersie" type="button">Nieuwe versie</button>
      <button class="knop" id="bkSter" type="button">Ster</button>
      <button class="knop" id="bkWeg" type="button">Verwijder</button>
      <span style="flex:1;"></span>
      <button class="knop" id="bkDicht" type="button">Sluit</button>
    </div>
    <div class="rij" style="margin-top:.5rem;">
      <button class="knop" id="bkHerstel" type="button" style="display:none;">Herstel</button>
      <input type="file" id="versiekiezer" hidden aria-label="Nieuwe versie kiezen">
    </div>
  </div>
</div>
<div class="melding" id="melding" role="status"></div>
<script src="/shared/uitvoer.js"></script>
<script src="/apps/bestanden/app.js"></script>
<script src="/apps/bestanden/paneel.js"></script>
<script src="/apps/bestanden/gebaren.js"></script>
<script src="/shared/schermbeeld.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/volscherm.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
