<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bestellen · RTG</title>
<link rel="icon" href="/icons/partners.svg">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<link href="/shared/ios.css" rel="stylesheet">
<script src="/shared/id.js"></script>
<!-- De client-kant van de gegevenspoort. Zonder deze module blijft het bij de
     melding "dat vraag ik even" en wordt er vervolgens niets gevraagd; met hem
     stelt Rahul de vraag en gaat de oorspronkelijke bestelling daarna gewoon
     door. Zelf een tekstje tonen was precies de tweede versie die deze module
     moet voorkomen (keuringsregel: poortpad zonder gegevensgesprek). -->
<script src="/shared/poortgesprek.js" defer></script>
<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --card2:var(--rtg-card2); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft);
    --burgundy:#C23A5E; --gold:#A98F1C; --groen:#4C9A75; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;padding-bottom:11rem;}
  h1,h2{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  header{position:sticky;top:0;z-index:6;background:linear-gradient(180deg,var(--bg),rgba(12,12,11,.9));
    backdrop-filter:blur(8px);padding:1rem 1.1rem .7rem;border-bottom:1px solid var(--line);
    display:flex;align-items:flex-start;gap:.8rem;}
  header .ey{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
  header h1{font-size:1.3rem;margin-top:.1rem;}
  .terug{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:.4rem .7rem;font:inherit;font-size:.8rem;cursor:pointer;}
  main{padding:1.1rem;max-width:760px;margin:0 auto;}
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;margin-bottom:.9rem;}
  .kaart h2{font-size:1.02rem;margin-bottom:.6rem;}
  .lbl{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);display:block;margin:.6rem 0 .3rem;}
  input,select{font:inherit;width:100%;background:var(--card2);color:var(--txt);
    border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--txt);padding:.55rem .9rem;}
  button.prim{background:var(--burgundy);border-color:var(--burgundy);color:#fff;font-weight:600;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .rij{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
  .tabs{display:flex;gap:.4rem;overflow-x:auto;padding:.2rem 0 .6rem;}
  .tabs button{white-space:nowrap;font-size:.85rem;}
  .tabs button[aria-selected="true"]{background:var(--burgundy);border-color:var(--burgundy);color:#fff;}
  .item{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem 0;border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:0;}
  .item .nm{font-weight:600;}
  .item .ds{font-size:.82rem;color:var(--soft);margin-top:.15rem;}
  .item .pr{margin-left:auto;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .item.uit{opacity:.5;}
  .zaakknop{width:100%;text-align:left;margin-bottom:.4rem;}
  .zaakknop[aria-pressed="true"]{border-color:var(--gold);}
  .waarschuw{font-size:.78rem;color:var(--burgundy);margin-top:.2rem;}
  .goed{font-size:.78rem;color:var(--groen);}
  .alg{display:inline-block;font-size:.68rem;border:1px solid var(--line);border-radius:6px;
    padding:.05rem .35rem;margin:.25rem .25rem 0 0;color:var(--soft);}
  /* De balk staat BOVEN de metgezel van Rahul en niet eronder. Die balk hangt
     op `bottom: safe-area + .9rem` met z-index 9980 (shared/metgezel.js), dus
     een actiebalk op bottom:0 verdwijnt eronder: de knop Bestellen was in een
     echte browser niet aan te klikken. Eroverheen gaan met een hogere z-index
     zou Rahul afdekken, en dat is het huis-element; dus wijkt deze balk. In
     gast.html viel dit niet op omdat de metgezel alleen bij een ledensessie
     verschijnt en dat scherm er geen heeft. */
  .mand{position:fixed;left:0;right:0;z-index:7;background:var(--card);
    bottom:calc(env(safe-area-inset-bottom,0px) + 4.3rem);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.8rem 1.1rem;}
  .mand[hidden]{display:none;}
  .mand .rij{max-width:760px;margin:0 auto;}
  .bedrag{font-variant-numeric:tabular-nums;font-weight:600;}
  .melding{background:var(--card2);border:1px solid var(--burgundy);border-radius:10px;
    padding:.6rem .75rem;font-size:.86rem;margin-bottom:.8rem;}
  .melding.ok{border-color:var(--groen);}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:1.25rem;letter-spacing:.1em;color:var(--gold);}

  /* Kleine opmaakklassen in plaats van style="..."-attributen. Dat is geen
     smaak: NORM.json telt die attributen (inlineStijlAttributen) omdat
     style-src-attr in de CSP pas dicht kan als ze weg zijn, en dat getal mag
     alleen omlaag. Deze pagina zette hem omhoog. */
  .mt3{margin-top:.3rem;} .mt35{margin-top:.35rem;} .mt4{margin-top:.4rem;}
  .mt5{margin-top:.5rem;} .mt6{margin-top:.6rem;} .mt7{margin-top:.7rem;}
  .mt8{margin-top:.8rem;} .mt9{margin-top:.9rem;} .mt10{margin-top:1rem;}
  .rechts{margin-left:auto;}
  .catkop{margin:1rem 0 .2rem;}
  .telrij{justify-content:flex-end;margin-top:.35rem;}
  .telnr{min-width:1.4rem;text-align:center;}
  .dnarij{padding:.6rem 0;border-bottom:1px solid var(--line);}
  .smal{width:auto;}
  .wr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>
</head>
<body>
<header>
  <div>
    <span class="ey">Rahul Travel Group</span>
    <h1>Bestellen</h1>
  </div>
  <button class="terug" id="bTerug">Terug</button>
</header>

<main id="main" role="main">
  <div id="melding" hidden></div>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="bestellen">Bestellen</button>
    <button role="tab" aria-selected="false" data-tab="lopend">Mijn bestellingen</button>
  </div>

  <div data-paneel="bestellen">
    <section class="kaart">
      <h2>Hoe wil je het hebben?</h2>
      <label class="wr" for="modus">Manier van bestellen</label>
      <select id="modus">
        <option value="bezorging">Laten bezorgen</option>
        <option value="afhaal">Zelf afhalen</option>
        <option value="foodcourt">Foodcourt: meer loketten in één mandje</option>
      </select>
      <p class="sub mt4" id="modusLet"></p>

      <div id="adresVak">
        <label class="lbl" for="postcode">Postcode van je bezorgadres</label>
        <input id="postcode" maxlength="8" placeholder="1011AB" autocomplete="postal-code">
        <label class="lbl" for="adres">Adres</label>
        <input id="adres" maxlength="120" placeholder="Damstraat 1" autocomplete="street-address">
        <div class="rij mt6"><button id="bCheck">Kan hier bezorgd worden?</button></div>
        <p class="sub mt4" id="zoneUit"></p>
      </div>

      <label class="lbl" for="tijd">Tijd (laat leeg als het niet uitmaakt)</label>
      <select id="tijd"><option value="">Zo snel mogelijk</option></select>
    </section>

    <section class="kaart">
      <h2 id="zakenKop">Waar wil je bestellen?</h2>
      <div id="zaken"></div>
    </section>

    <section class="kaart" id="kaartVak" hidden>
      <h2 id="kaartKop">De kaart</h2>
      <label class="lbl" for="allergie">Allergie of dieet (gaat mee naar de keuken)</label>
      <input id="allergie" maxlength="120" placeholder="bijvoorbeeld: ernstige notenallergie">
      <div id="kaartLijst" class="mt7"></div>
    </section>
  </div>

  <div data-paneel="lopend" hidden>
    <section class="kaart">
      <h2>Wat er loopt</h2>
      <div id="lopendLijst"></div>
    </section>
  </div>
</main>

<div class="mand" id="mand" hidden>
  <div class="rij">
    <span id="mandTekst">Niets gekozen</span>
    <span class="bedrag rechts" id="mandBedrag">€ 0,00</span>
    <button class="prim" id="bBestel" disabled>Bestellen</button>
  </div>
</div>

<script>
/* Bestellen bij RTG-horeca buiten de deur: bezorgen, afhalen en de foodcourt.

   WAAROM DIT EEN ANDER SCHERM IS DAN /apps/gast.html. Dat scherm hoort bij een
   QR op een tafel of een kamer: je bent er, en of je lid bent doet er niet toe.
   Hier is het omgekeerd: er is geen tafel om aanwezigheid mee te bewijzen, en
   er moet iemand bereikbaar zijn als de bezorger voor de deur staat. De poort
   is dus de ledensessie, en dat is precies waarom het twee schermen zijn en
   geen twee standen van hetzelfde scherm.

   Wat eronder ligt is wel hetzelfde: dezelfde rekening, dezelfde keuken,
   dezelfde audit. */
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var euro = function (c) { return '€ ' + ((c || 0) / 100).toFixed(2).replace('.', ','); };
  var TOKEN = null; try { TOKEN = localStorage.getItem('rtg_member_token'); } catch (e) {}
  var ZAKEN = [], KAARTEN = {}, MAND = {}, GEKOZEN = null, ZONE = null;

  function meld(t, ok) {
    var el = $('#melding');
    if (!t) { el.hidden = true; return; }
    el.className = 'melding' + (ok ? ' ok' : '');
    el.textContent = t; el.hidden = false;
    if (ok) setTimeout(function () { el.hidden = true; }, 5000);
  }

  /* 428 is geen fout maar een opdracht: "dit mag, maar er ontbreekt nog iets".
     Die wordt hier NIET zelf afgehandeld met een tekstje maar doorgegeven aan
     shared/poortgesprek.js: Rahul stelt de vraag, en als het rond is doet die
     module de oorspronkelijke aanroep gewoon opnieuw. Zelf een melding tonen
     zou een belofte zijn ("dat vraag ik even") die niemand nakomt. */
  function api(pad, body, herkans) {
    return fetch(pad, { method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
      body: JSON.stringify(body || {}) }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        j._status = r.status;
        if (!herkans && window.RTGGegevensPoort) {
          var p = window.RTGGegevensPoort.vang(j, r.status, function () { return api(pad, body, true); }, api);
          if (p) return p;
        }
        if (!r.ok && r.status !== 207) { j._fout = j.error || 'Er ging iets mis.'; j._code = j.code || null; }
        return j;
      });
    });
  }

  var modus = function () { return $('#modus').value; };

  function modusGewisseld() {
    var m = modus();
    $('#adresVak').hidden = (m !== 'bezorging');
    $('#zakenKop').textContent = m === 'foodcourt' ? 'Kies een loket (je kunt er meer doen)' : 'Waar wil je bestellen?';
    $('#modusLet').textContent = m === 'bezorging'
      ? 'Voor een bezorging hebben we je adres en telefoonnummer nodig; die vraagt Rahul één keer.'
      : (m === 'afhaal'
        ? 'Je krijgt een korte code; daarmee ligt je tas klaar aan de balie.'
        : 'Eén mandje bij meer loketten. Per loket krijg je een eigen code, en je ziet wanneer alles klaar is.');
    tekenMand();
  }
  $('#modus').addEventListener('change', modusGewisseld);

  /* ---------- de zaken ---------- */
  function laadZaken() {
    if (!TOKEN) { meld('Log in bij RTG om te kunnen bestellen.'); return; }
    api('/api/foodcourt', {}).then(function (j) {
      if (j._fout) return meld(j._fout);
      ZAKEN = j.restaurants || [];
      tekenZaken();
    });
  }

  function tekenZaken() {
    $('#zaken').innerHTML = ZAKEN.map(function (z) {
      return '<button class="zaakknop" data-zaak="' + esc(z.code) + '" aria-pressed="' +
        (GEKOZEN === z.code ? 'true' : 'false') + '">' +
        '<span class="nm">' + esc(z.naam) + '</span>' +
        '<div class="ds">' + esc(z.keuken || '') + (z.stad ? ' · ' + esc(z.stad) : '') + '</div></button>';
    }).join('') || '<p class="ds">Er zijn hier geen eetgelegenheden gevonden.</p>';
  }

  $('#zaken').addEventListener('click', function (e) {
    var knop = e.target.closest && e.target.closest('[data-zaak]');
    if (!knop) return;
    kiesZaak(knop.getAttribute('data-zaak'));
  });

  function kiesZaak(code) {
    GEKOZEN = code;
    tekenZaken();
    var zaak = ZAKEN.filter(function (z) { return z.code === code; })[0] || { naam: code };
    $('#kaartKop').textContent = 'De kaart van ' + zaak.naam;
    api('/api/gast/bezorg/kaart', { zaak: code }).then(function (j) {
      if (j._fout) return meld(j._fout);
      KAARTEN[code] = j.kaart || [];
      $('#kaartVak').hidden = false;
      if (!KAARTEN[code].length) {
        $('#kaartLijst').innerHTML = '<p class="ds">Deze zaak heeft (nog) geen kaart in RTG staan. Reserveren kan wel.</p>';
        return;
      }
      tekenKaart();
    });
  }

  function tekenKaart() {
    var lijst = KAARTEN[GEKOZEN] || [];
    $('#kaartLijst').innerHTML = lijst.map(function (m) {
      var n = (MAND[GEKOZEN] && MAND[GEKOZEN][m.id]) || 0;
      return '<div class="item' + (m.uitverkocht ? ' uit' : '') + '">' +
        '<div><span class="nm">' + esc(m.naam) + '</span>' +
        (m.uitleg ? '<div class="ds">' + esc(m.uitleg) + '</div>' : '') +
        (m.allergenen || []).map(function (a) { return '<span class="alg">' + esc(a) + '</span>'; }).join('') +
        (m.uitverkocht ? '<div class="waarschuw">Door de keuken op uitverkocht gezet.</div>' : '') +
        (m.alcohol ? '<div class="waarschuw">Alcohol: dit loopt via een medewerker.</div>' : '') +
        '</div><div class="pr">' + euro(m.centen) +
        (m.uitverkocht || m.alcohol ? '' :
          '<div class="rij telrij">' +
          '<button data-min="' + esc(m.id) + '" aria-label="Eén minder">−</button>' +
          '<span class="telnr">' + n + '</span>' +
          '<button data-plus="' + esc(m.id) + '" aria-label="Eén meer">+</button></div>') +
        '</div></div>';
    }).join('');
    tekenMand();
  }

  $('#kaartLijst').addEventListener('click', function (e) {
    var plus = e.target.getAttribute && e.target.getAttribute('data-plus');
    var min = e.target.getAttribute && e.target.getAttribute('data-min');
    if (!plus && !min) return;
    /* In de foodcourt-modus blijft het mandje van andere loketten staan; bij
       bezorgen en afhalen niet: die gaan per definitie over één zaak, en een
       stil meegesleept mandje van een andere zaak zou bij het bestellen
       verrassend opduiken. */
    if (modus() !== 'foodcourt') {
      Object.keys(MAND).forEach(function (z) { if (z !== GEKOZEN) delete MAND[z]; });
    }
    if (!MAND[GEKOZEN]) MAND[GEKOZEN] = {};
    var id = plus || min;
    var n = MAND[GEKOZEN][id] || 0;
    MAND[GEKOZEN][id] = Math.max(0, Math.min(20, n + (plus ? 1 : -1)));
    if (!MAND[GEKOZEN][id]) delete MAND[GEKOZEN][id];
    if (!Object.keys(MAND[GEKOZEN]).length) delete MAND[GEKOZEN];
    tekenKaart();
  });

  function mandRegels() {
    var uit = [];
    Object.keys(MAND).forEach(function (zaak) {
      Object.keys(MAND[zaak]).forEach(function (id) {
        var m = (KAARTEN[zaak] || []).filter(function (x) { return x.id === id; })[0];
        if (m) uit.push({ zaak: zaak, itemId: id, aantal: MAND[zaak][id], centen: m.centen });
      });
    });
    return uit;
  }

  function tekenMand() {
    var regels = mandRegels();
    var n = regels.reduce(function (t, r) { return t + r.aantal; }, 0);
    var som = regels.reduce(function (t, r) { return t + r.centen * r.aantal; }, 0);
    var loketten = Object.keys(MAND).length;
    $('#mandTekst').textContent = n
      ? n + ' × gekozen' + (loketten > 1 ? ' bij ' + loketten + ' loketten' : '')
      : 'Niets gekozen';
    $('#mandBedrag').textContent = euro(som);
    $('#bBestel').disabled = !n;
    $('#mand').hidden = !n;
  }

  /* ---------- de bezorgzone ---------- */
  $('#bCheck').addEventListener('click', function () {
    if (!GEKOZEN) return meld('Kies eerst waar je wilt bestellen.');
    var regels = mandRegels();
    var som = regels.reduce(function (t, r) { return t + r.centen * r.aantal; }, 0);
    api('/api/gast/bezorg/check', { zaak: GEKOZEN, postcode: $('#postcode').value, bedragCenten: som })
      .then(function (j) {
        if (j._fout) { $('#zoneUit').innerHTML = '<span class="waarschuw">' + esc(j._fout) + '</span>'; return; }
        ZONE = j;
        if (!j.bezorgbaar) {
          $('#zoneUit').innerHTML = '<span class="waarschuw">' + esc(j.reden || j.redenDicht) + '</span>';
          return;
        }
        var t = 'Bezorging ' + (j.gratisBezorging ? 'gratis' : euro(j.kostenCenten)) +
          ' · ongeveer ' + j.zone.minuten + ' minuten';
        if (!j.haaltMinimum) t += ' · nog ' + euro(j.tekort) + ' te gaan voor het minimum';
        $('#zoneUit').innerHTML = '<span class="' + (j.haaltMinimum ? 'goed' : 'waarschuw') + '">' + esc(t) + '</span>';
        var sel = $('#tijd');
        sel.innerHTML = '<option value="">Zo snel mogelijk</option>' +
          (j.sloten || []).map(function (s) { return '<option value="' + esc(s.tijd) + '">' + esc(s.tijd) + '</option>'; }).join('');
      });
  });

  /* ---------- bestellen ---------- */
  $('#bBestel').addEventListener('click', function () {
    var regels = mandRegels();
    if (!regels.length) return;
    var m = modus();
    var idem = window.RTGId ? RTGId('bestel') : 'b' + regels.map(function (r) { return r.zaak + r.itemId + r.aantal; }).join('');
    $('#bBestel').disabled = true;

    var pad, body;
    if (m === 'foodcourt') {
      pad = '/api/gast/foodcourt/bestel';
      body = { items: regels.map(function (r) { return { zaak: r.zaak, itemId: r.itemId, aantal: r.aantal }; }),
        allergie: $('#allergie').value, tijd: $('#tijd').value, idem: idem };
    } else {
      var zaak = regels[0].zaak;
      if (Object.keys(MAND).length > 1) {
        $('#bBestel').disabled = false;
        return meld('Bij bezorgen en afhalen bestel je bij één zaak. Kies de foodcourt-modus voor meer loketten.');
      }
      pad = m === 'bezorging' ? '/api/gast/bezorg/bestel' : '/api/gast/afhaal/bestel';
      body = { zaak: zaak, items: regels.map(function (r) { return { itemId: r.itemId, aantal: r.aantal }; }),
        allergie: $('#allergie').value, tijd: $('#tijd').value, idem: idem,
        postcode: $('#postcode').value, adres: $('#adres').value };
    }

    api(pad, body).then(function (j) {
      $('#bBestel').disabled = false;
      if (j._fout) return meld(j._fout + (j.eerstvolgende ? ' Om ' + j.eerstvolgende + ' is er nog ruimte.' : ''));
      if (!j || !j.mandje && !j.afhaal && !j.rekening) return meld('Er kwam geen bevestiging terug. Probeer het opnieuw.');
      MAND = {}; tekenKaart();
      if (j.mandje) {
        var codes = j.mandje.delen.map(function (d) { return d.naam + ': ' + d.afhaalcode; }).join(' · ');
        meld((j.mislukt ? 'Deels gelukt. ' + j.let + ' ' : '') + 'Je codes: ' + codes, !j.mislukt);
      } else if (j.afhaal) {
        meld('Klaar. Je afhaalcode is ' + j.afhaal.code + '.', true);
      } else {
        meld('Je bestelling staat bij de keuken.' + (j.tekort ? ' Let op: nog ' + euro(j.tekort) + ' onder het minimum.' : ''), true);
      }
      laadLopend();
    }).catch(function (e) {
      /* Hier komt ook de AFGEBROKEN gegevenspoort binnen: `vang()` gooit als
         het lid het gesprek wegklikt (poortgesprek.js regel 183). Zonder deze
         vangst bleef de knop voor altijd uitgeschakeld en verdween de reden in
         een onafgehandelde belofte -- het scherm leek dan stuk terwijl er
         gewoon iets niet was ingevuld. */
      $('#bBestel').disabled = false;
      meld(e && e.message ? e.message : 'Dan gaat het niet door.');
    });
  });

  /* ---------- wat er loopt ---------- */
  function laadLopend() {
    Promise.all([api('/api/gast/bezorg/mijn', {}), api('/api/gast/foodcourt/mijn', {})]).then(function (uit) {
      var los = (uit[0].bestellingen || []).filter(function (b) { return !b.mandjeId; });
      var mandjes = uit[1].mandjes || [];
      var h = '';
      mandjes.forEach(function (m) {
        h += '<div class="item"><div><span class="nm">Foodcourt · ' + m.delen.length + ' loketten</span>' +
          '<div class="ds">' + m.delen.map(function (d) {
            return esc(d.naam) + ' <span class="code">' + esc(d.afhaalcode || '·') + '</span>' + (d.klaar ? ' klaar' : ' bezig');
          }).join(' · ') + '</div>' +
          (m.allesKlaar ? '<div class="goed">Alles klaar: je kunt gaan halen.</div>'
            : '<div class="ds">Nog niet alles klaar.</div>') +
          '</div><div class="pr">' + euro(m.totaal) + '</div></div>';
      });
      los.forEach(function (b) {
        h += '<div class="item"><div><span class="nm">' + esc(b.kanaal === 'bezorging' ? 'Bezorging' : 'Afhalen') + '</span>' +
          '<div class="ds">' + esc(b.zaakcode) + ' · ' + b.regels + ' regel(s) · ' + esc(b.status) +
          (b.afhaal && b.afhaal.code ? ' · code <span class="code">' + esc(b.afhaal.code) + '</span>' : '') +
          (b.bezorg && b.bezorg.tijd ? ' · ' + esc(b.bezorg.tijd) : '') + '</div></div>' +
          '<div class="pr">' + euro(b.totalen.teBetalen) + '</div></div>';
      });
      $('#lopendLijst').innerHTML = h || '<p class="ds">Er loopt nu niets.</p>';
    });
  }

  document.querySelector('.tabs').addEventListener('click', function (e) {
    var t = e.target.getAttribute && e.target.getAttribute('data-tab');
    if (!t) return;
    document.querySelectorAll('[role="tab"]').forEach(function (b) {
      b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === t));
    });
    document.querySelectorAll('[data-paneel]').forEach(function (p) {
      p.hidden = p.getAttribute('data-paneel') !== t;
    });
    $('#mand').hidden = t !== 'bestellen' || !mandRegels().length;
    if (t === 'lopend') laadLopend();
  });

  $('#bTerug').addEventListener('click', function () { history.back(); });

  modusGewisseld();
  laadZaken();
})();
</script>
