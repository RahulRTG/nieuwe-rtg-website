<style>

     /shared/rtg-ui.css en wordt door de hele familie gedeeld. Wat overblijft is
     het beetje dat alleen de boardroom nodig heeft. */
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--rtg-bg);color:var(--rtg-txt);font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;}

<body data-osbar="Boardroom" data-oswereld="lid" data-osterug="apps/app.html">
<main class="rtg-wrap" id="hoofd">
  <a class="rtg-terug" href="/apps/app.html" data-i18n="bo.terug">← naar de app</a>
  <div class="rtg-intro">
    <h1 data-i18n="bo.h">Jouw boardroom</h1>
    <p data-i18n="bo.sub">Zet zelf aan wat je gebruikt en uit wat je niet wilt. Gevoelige deel-functies staan bewust standaard uit. Je keuzes reizen mee naar al je toestellen, en wat je hier uitzet gaat ook echt dicht.</p>
  </div>
  <div class="rtg-melder" id="melder" role="status" aria-live="polite"></div>
  <div id="bord"><p class="rtg-leeg" id="melding" data-i18n="bo.laden">Boardroom laden&hellip;</p></div>
</main>

<script>
