<!doctype html>
<html lang="nl">
<head>
<script src="/shared/id.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Command · het kantoor in één app</title>
<meta name="theme-color" content="#0C0C0B">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icons/backoffice.svg" type="image/svg+xml">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<style>
  /* RTG Command draagt de huisstijl, maar rustig: dit is een kantoor waar
     cijfers en tekst het werk doen. Bordeaux blijft accent, goud alleen op de
     hoofdknop, en verder zwart-wit ritme met veel lucht. */
  :root{--bg:var(--rtg-bg);--card:var(--rtg-card);--card2:var(--rtg-card2);--line:var(--rtg-line);
    --txt:var(--rtg-txt);--muted:var(--rtg-muted);--soft:var(--rtg-soft);
    --acc:#C23A5E;--gold:#A98F1C;--groen:#4C9A75;--amber:#C99A2E;--rood:#DE6E92;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column;}
  h1,h2,h3{font-family:'Bodoni Moda',Georgia,serif;font-weight:500;letter-spacing:-.01em;}
  button{font:inherit;cursor:pointer;color:inherit;}
  a{color:inherit;}

  /* ---- de kop: één balk, met de stand van het hele platform erin ---- */
  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + .8rem) 1.1rem .8rem;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;}
  header h1{font-family:'Bodoni Moda',Georgia,serif;font-size:1.15rem;line-height:1.1;}
  header .ey{font-size:.56rem;letter-spacing:.24em;text-transform:uppercase;color:var(--rtg-leesgoud,var(--gold));}
  .stand{display:inline-flex;align-items:center;gap:.45rem;font-size:.72rem;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:0;padding:.25rem .7rem;}
  .stand i{width:8px;height:8px;border-radius:50%;background:var(--groen);display:block;}
  .stand.let i{background:var(--amber);} .stand.storing i{background:var(--acc);} .stand.leeg i{background:var(--soft);}
  .zoekbalk{flex:1 1 16rem;min-width:12rem;display:flex;gap:.4rem;}
  .zoekbalk input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:0;
    color:var(--txt);font:inherit;font-size:.86rem;padding:.5rem .75rem;}
  .zoekbalk input:focus{outline:2px solid var(--acc);outline-offset:1px;}

  /* ---- de rail: één app, tien werkplekken ---- */
  .schil{flex:1;display:grid;grid-template-columns:14.5rem 1fr;min-height:0;}
  nav#rail{border-right:1px solid var(--line);padding:1.1rem .8rem 3rem;overflow-y:auto;}
  nav#rail .csec{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);
    margin:1.3rem .4rem .45rem;}
  nav#rail .csec:first-child{margin-top:0;}
  nav#rail button{display:flex;align-items:baseline;gap:.5rem;width:100%;text-align:left;background:none;
    border:1px solid transparent;border-radius:0;padding:.45rem .55rem;font-size:.87rem;color:var(--muted);}
  nav#rail button:hover{color:var(--txt);border-color:var(--line);}
  nav#rail button[aria-current="page"]{color:var(--txt);border-color:var(--line);background:var(--card);}
  nav#rail button .tel{margin-left:auto;font-size:.7rem;color:var(--soft);font-variant-numeric:tabular-nums;}
  nav#rail button .tel.op{color:var(--acc);}
  main{min-width:0;padding:1.4rem clamp(1.1rem,3vw,2.2rem) 4rem;overflow-x:hidden;}
  @media (max-width:860px){
    .schil{grid-template-columns:1fr;}
    nav#rail{border-right:none;border-bottom:1px solid var(--line);display:flex;gap:.4rem;overflow-x:auto;padding:.7rem .8rem;}
    nav#rail .csec{display:none;}
    nav#rail button{width:auto;white-space:nowrap;border-color:var(--line);}
  }

  /* ---- de onderdelen ---- */
  /* De werkplekkop. Met opzet op twee selectors en niet op een kale `.ckop`:
     de kit schildert `body.rtg-stijl main > h2` als klein kapitaaltjes-label,
     en dat is specifieker dan `.ckop`. Een kale klasse zou hier dus stil
     verliezen -- precies de fout die deze pagina eerder maakte, en die je
     alleen op het scherm ziet en nooit in een toets op de server. */
  body.rtg-stijl .ckop,body.rtg-stijl main > h2.ckop{
    font-family:'Bodoni Moda',Georgia,serif;font-weight:500;letter-spacing:-.01em;
    font-size:1.5rem;text-transform:none;color:var(--txt);margin:0 0 .35rem;}
  .lead{color:var(--muted);font-size:.9rem;line-height:1.65;max-width:52rem;margin-bottom:1.6rem;}
  /* .kaart, .knop, .veld, .meta en .leeg komen uit de UI-kit (rtg-ui.css) en
     staan hier bewust NIET nog eens. De kit schildert ze met `body.rtg-stijl
     .kaart`, en dat is specifieker dan een kale `.kaart` hier: een eigen versie
     zou er stil naast liggen zonder ooit te winnen. Dat is precies waarom deze
     pagina zijn eigen namen (.ckop, .csec, .crij, .ctab, .cniveau,
     .cmelding) in een eigen naamruimte zet -- geen botsing, geen dode regel. */
  .kaart h3{font-size:1.02rem;margin-bottom:.3rem;font-family:'Bodoni Moda',Georgia,serif;}
  .kaart p{font-size:.85rem;color:var(--muted);line-height:1.6;}
  .rooster{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.85rem;margin-bottom:1.2rem;}
  .tegel{background:var(--card);border:1px solid var(--line);border-radius:0;padding:1rem 1.1rem;}
  .tegel .l{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);}
  .tegel .v{font-family:'Bodoni Moda',Georgia,serif;font-size:1.75rem;margin-top:.3rem;font-variant-numeric:tabular-nums;}
  .tegel .v.acc{color:var(--acc);} .tegel .v.gold{color:var(--rtg-leesgoud,var(--gold));} .tegel .v.groen{color:var(--groen);}
  .tegel .u{font-size:.78rem;color:var(--muted);margin-top:.35rem;line-height:1.5;}
  .crij{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
  body.rtg-stijl .crij .knop{font-size:.78rem;padding:.35rem .8rem;}
  body.rtg-stijl textarea.veld{width:100%;min-height:4.5rem;resize:vertical;}
  label.lb{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:.7rem 0 .25rem;}
  .lijn{border-top:1px solid var(--line);padding:.6rem 0;font-size:.85rem;}
  .lijn:last-child{border-bottom:0;}
  .cniveau{display:inline-block;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--line);border-radius:0;padding:.1rem .5rem;color:var(--muted);}
  .cniveau.auto{border-color:var(--groen);color:var(--groen);}
  .cniveau.assist{border-color:var(--amber);color:var(--amber);}
  .cniveau.hand{border-color:var(--acc);color:var(--acc);}
  /* De drie standen van een servicedoel (command-10.js). "Onbekend" heeft een
     eigen kleur en niet de groene: een leeg venster mag hier nooit lezen als
     een gehaald doel. */
  .cniveau.ok{border-color:var(--groen);color:var(--groen);}
  .cniveau.mis{border-color:var(--acc);color:var(--acc);}
  .cniveau.onbekend{border-color:var(--amber);color:var(--amber);}
  /* De gezondheidskaart (command-17.js). "Niet vast te stellen" krijgt GEEN
     kleur -- niet groen, niet amber, niet rood. Een vermogen waarover we niets
     weten hoort visueel stil te zijn; elke kleur die het wel krijgt, wordt
     binnen een week als een oordeel gelezen. En .cgraad staat naast de stand en
     niet erin: de vraag "is het gezond" en de vraag "hoe hard weten we dat"
     zijn twee vragen, en dat verschil is de hele reden dat dit scherm bestaat.

     En de stand heet `geen` en niet `stil`: de UI-kit heeft zelf een `.stil`
     (body.rtg-stijl .stil, .8rem lopende tekst) en die is SPECIFIEKER dan een
     `.cniveau.stil` hier. De pil zou dan stil op .8rem gaan staan naast de
     andere op .62rem -- precies de val waar de opmerking hierboven over de kit
     voor waarschuwt, en die je alleen op het scherm ziet. */
  .cniveau.geen{border-color:var(--line);color:var(--soft);}
  .cgraad{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);}
  .cgraad.bewezen{color:var(--groen);}
  .cgraad.gemeten{color:var(--muted);}
  .czegt{font-size:.78rem;color:var(--soft);line-height:1.55;border-left:2px solid var(--line);
    padding-left:.7rem;margin:.35rem 0 .6rem;}
  /* De hersteltransactie (command-05.js): de droogloop met zijn voorcontrole.
     Als klasse en niet als style="" -- elk style-attribuut in public/ houdt
     style-src-attr open in de CSP, en NORM.json telt ze. */
  .h-droog{margin-top:.6rem;border-top:1px solid var(--line);padding-top:.5rem;}
  .h-keten{list-style:none;padding:0;margin:.4rem 0 .2rem;}
  .h-keten li{padding:.25rem 0;font-size:.8rem;color:var(--muted);line-height:1.5;}
  /* Vier veldbreedtes en een marge, in plaats van een style="" per invoerveld.
     Dat is geen smaak: elk style-attribuut in public/ houdt style-src-attr open
     in de CSP, en NORM.json telt ze (inlineStijlAttributen). Vier klassen zijn
     genoeg voor elk formulier in deze app. */
  .veld.kort{width:5.5rem;} .veld.smal{width:9rem;} .veld.mid{width:13rem;} .veld.breed{width:18rem;}
  .mt{margin-top:.7rem;}
  .staaf{height:.4rem;background:var(--card2);border-radius:0;overflow:hidden;margin-top:.45rem;}
  .staaf i{display:block;height:100%;background:var(--gold);}
  .cmelding{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--card2);
    border:1px solid var(--line);border-radius:0;padding:.6rem 1rem;font-size:.85rem;opacity:0;
    transition:opacity .3s;z-index:60;pointer-events:none;max-width:min(90vw,34rem);text-align:center;}
  table.ctab{width:100%;border-collapse:collapse;font-size:.84rem;}
  table.ctab th{text-align:left;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--soft);font-weight:400;padding:.4rem .5rem;border-bottom:1px solid var(--line);}
  table.ctab td{padding:.45rem .5rem;border-bottom:1px solid var(--line);vertical-align:top;}
  .schuif{overflow-x:auto;}
  .werkplek{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.7rem;}
  .werkplek a{display:block;background:var(--card);border:1px solid var(--line);border-radius:0;
    padding:.8rem .9rem;text-decoration:none;}
  .werkplek a:hover{border-color:var(--acc);}
  .werkplek a b{display:block;font-size:.9rem;font-weight:600;}
  .werkplek a span{display:block;font-size:.75rem;color:var(--soft);margin-top:.2rem;line-height:1.45;}
</style>
<link href="/shared/dagkleur.css" rel="stylesheet">
<script src="/shared/kantoorgesprek.js"></script>
<link href="/shared/ios.css" rel="stylesheet">
</head>
<body class="rtg-stijl">
<!-- De kop volgt het contract van de iOS-laag (shared/ios.js): die bouwt elke
     `body > header` ter plekke om tot een navigatiebalk en pakt de <h1> als
     titel. Een eigen woordmerk-div werd daar stilzwijgend uit gegooid -- vandaar
     dat de naam hier een echte h1 is en de eyebrow een .ey, precies zoals de
     andere kantoorschermen het doen. De zoekbalk en de stand dragen een id en
     blijven daarom staan; de iOS-laag houdt alles wat de app zelf aanspreekt. -->
<header>
  <div class="ey">RTG &amp; RTF · één kantoor</div>
  <h1>RTG Command</h1>
  <div class="zoekbalk"><input id="q" type="search" placeholder="Zoek alles: naam, code, kenteken, plaats, status…" aria-label="Zoek over alle domeinen"></div>
  <span class="stand" id="stand" aria-live="polite"><i></i><span>laden…</span></span>
</header>
<div class="schil">
  <nav id="rail" aria-label="Werkplekken"></nav>
  <main id="main"><div class="leeg">Laden…</div></main>
</div>
<div class="cmelding" id="melding" role="status"></div>
<script src="/apps/command.js"></script>
<script src="/shared/schermbeeld.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/volscherm.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
