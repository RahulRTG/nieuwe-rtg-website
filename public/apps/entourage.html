<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entourage · Lifestyle Pass</title>
<link rel="icon" href="/icons/partners.svg">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --card2:var(--rtg-card2); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft); --burgundy:#C23A5E; --gold:#A98F1C; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;padding-bottom:3rem;}
  h1,h2{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),rgba(12,12,11,.86));backdrop-filter:blur(8px);padding:1rem 1.1rem .7rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.8rem;}
  header .ey{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
  header h1{font-size:1.35rem;}
  .terug{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:0;padding:.4rem .7rem;font:inherit;font-size:.8rem;cursor:pointer;}
  main{padding:1.1rem;max-width:760px;margin:0 auto;}
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:0;padding:1rem 1.1rem;margin-bottom:.9rem;}
  .kaart h2{font-size:1.05rem;margin-bottom:.5rem;}
  .attn{background:linear-gradient(135deg,rgba(194,58,94,.12),rgba(169,143,7,.06));border:1px solid rgba(194,58,94,.3);border-radius:0;padding:.85rem 1.1rem;margin-bottom:.9rem;}
  .attn h2{font-size:.95rem;margin-bottom:.4rem;color:var(--burgundy);}
  .attn .r{font-size:.85rem;color:var(--muted);padding:.2rem 0;}
  .attn .r b{color:var(--txt);}
  .veld,select.veld{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:0;color:var(--txt);font:inherit;font-size:.9rem;padding:.5rem .7rem;}
  select.veld{appearance:none;}
  .rij{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem;}
  .rij>*{flex:1;min-width:6rem;}
  .knop{background:var(--gold);color:#000;border:none;border-radius:0;font:inherit;font-weight:600;font-size:.85rem;padding:.5rem 1rem;cursor:pointer;}
  .item{border-top:1px solid var(--line);padding:.55rem 0;display:flex;gap:.6rem;align-items:flex-start;font-size:.9rem;}
  .item:first-child{border-top:0;}
  .item .b{flex:1;min-width:0;}
  .item .b small{color:var(--soft);display:block;margin-top:.15rem;}
  .band{font-size:.66rem;padding:.1rem .5rem;border-radius:0;border:1px solid var(--line);color:var(--muted);white-space:nowrap;text-transform:capitalize;}
  .weg{background:transparent;border:1px solid var(--line);color:var(--soft);border-radius:0;width:1.8rem;height:1.8rem;cursor:pointer;flex-shrink:0;}
  .weg:hover{border-color:var(--gold);color:var(--txt);}
  .leeg{color:var(--soft);font-size:.86rem;padding:.4rem 0;}
  .melding{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:0;padding:.6rem 1rem;font-size:.85rem;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none;}
  .inlog{text-align:center;padding:2.5rem 1rem;}
</style>
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/dagkleur.css" rel="stylesheet">
<script src="/shared/seizoen.js" defer></script>
<link href="/shared/ios.css" rel="stylesheet">
</head>
<body class="rtg-stijl">
<header><div><div class="ey">Lifestyle Pass</div><h1>Entourage</h1></div><a class="terug" href="/apps/lifestyle.html">&#8592; kantoor</a></header>
<main id="main"><div class="leeg">Laden…</div></main>
<div class="melding" id="melding"></div>
<script src="/shared/deur.js"></script>
<script src="/shared/uitvoer.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=null; try{ TOKEN=localStorage.getItem('rtg_member_token'); }catch(e){}
function meld(t){ const m=$('#melding'); m.textContent=t; m.style.opacity='1'; clearTimeout(m._t); m._t=setTimeout(()=>m.style.opacity='0',2600); }
const api=(pad,body)=>fetch('/api/member/rechterhand/'+pad,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify(body||{})}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'Er ging iets mis.');e.status=r.status;throw e;}return d;});
const MND=['','jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const dt=d=>{ if(!d)return ''; const[y,m,dd]=d.split('-'); return Number(dd)+' '+MND[Number(m)]+' '+y; };
const AIBOX=app=>'<div class="kaart"><h2>Vraag de reissecretaris</h2><div style="display:flex;gap:.5rem;"><input class="veld h-flex1" id="aiV" placeholder="'+app+'"><button class="knop" id="aiK">Vraag</button></div><div id="aiA" style="margin-top:.6rem;font-size:.92rem;line-height:1.55;color:var(--muted);"></div></div>';
function bindAi(app){ const k=$('#aiK'); if(!k)return; k.onclick=async()=>{ const v=$('#aiV').value.trim(); if(!v)return; $('#aiA').textContent='Een ogenblik…'; try{ const r=await api('ai',{app,vraag:v}); $('#aiA').textContent=r.antwoord; $('#aiV').value=''; }catch(e){ $('#aiA').textContent=e.message; } }; $('#aiV').addEventListener('keydown',e=>{ if(e.key==='Enter') k.click(); }); }
/* Meenemen (shared/uitvoer.js): het gezelschap zoals het op de kaart staat --
   naam, band en de reisgegevens die u zelf heeft ingevuld. Dit is een lijst die
   men anders met de hand bijhoudt; hij hoort dus mee te kunnen. */
let GEZELSCHAP=[];
if(window.RTGUitvoer) RTGUitvoer.bron(()=>({
  naam:'gezelschap',
  kolommen:['naam','band','telefoon','dieet','voorkeuren','documenten'],
  rijen:GEZELSCHAP.map(p=>[p.naam, p.band, p.telefoon||'', p.dieet||'', p.voorkeuren||'',
    (p.documenten||[]).map(x=>x.soort+' tot '+x.tot).join(' | ')])
}));
async function laad(){
  if(!TOKEN){ $('#main').innerHTML='<div class="inlog"><h2>Log eerst in</h2></div>'; return; }
  let d; try{ d=await api('entourage'); }catch(e){ if(e.status===403){ RTGDeur.toon($('#main'), { soort:'pas', pas:'Lifestyle' }); return; } $('#main').innerHTML='<div class="leeg">Kon het gezelschap niet laden.</div>'; return; }
  GEZELSCHAP=d.gezelschap||[];
  let h='';
  if(d.attenties.length){ h+='<div class="attn"><h2>Documenten die aandacht vragen</h2>'+d.attenties.map(a=>'<div class="r"><b>'+esc(a.naam)+'</b> · '+esc(a.soort)+' '+(a.verlopen?'verlopen':'geldig tot')+' '+dt(a.tot)+'</div>').join('')+'<small style="display:block;margin-top:.4rem;opacity:.75;">'+esc(d.bron)+'</small></div>'; }
  h+='<div class="kaart"><h2>Iemand toevoegen</h2><div class="rij"><input class="veld" id="pN" placeholder="naam"><select class="veld" id="pB">'+d.banden.map(b=>'<option>'+b+'</option>').join('')+'</select></div><div class="rij"><input class="veld" id="pT" placeholder="telefoon"><input class="veld" id="pDi" placeholder="dieet"></div><div class="rij"><input class="veld" id="pP" type="date" title="paspoort geldig tot"><input class="veld" id="pV" placeholder="voorkeuren"></div><div class="h-mt60"><button class="knop" id="pAdd">+ toevoegen</button></div><div style="font-size:.72rem;color:var(--soft);margin-top:.35rem;">De datum is de geldigheid van het paspoort.</div></div>';
  h+='<div class="kaart"><h2>Uw gezelschap <small style="font-size:.75rem;color:var(--soft);">('+d.aantal+')</small></h2>'+(d.gezelschap.length?d.gezelschap.map(p=>'<div class="item"><div class="b"><b>'+esc(p.naam)+'</b> <span class="band">'+esc(p.band)+'</span><small>'+[p.telefoon,p.dieet?'dieet: '+esc(p.dieet):'',esc(p.voorkeuren)].filter(Boolean).join(' · ')+'</small>'+((p.documenten||[]).length?'<small>'+(p.documenten||[]).map(x=>esc(x.soort)+' tot '+dt(x.tot)).join(' · ')+'</small>':'<small style="opacity:.7;">nog geen documenten</small>')+'</div><input type="checkbox" data-mee="'+p.id+'" aria-label="meenemen" style="margin-right:.5rem;"><button class="knop" data-doc="'+p.id+'" style="margin-right:.4rem;">+ document</button><button class="weg" data-p="'+p.id+'">×</button></div>').join(''):'<div class="leeg">Nog niemand in het gezelschap.</div>')+'</div>';
  /* Het gezelschap samenstellen met een gereedheidscheck: elders de betaalde
     kant van een reisapp, hier de lijst die u anders met de hand maakt. */
  h+='<div class="kaart"><h2>Gezelschap samenstellen</h2><p style="color:var(--soft);font-size:.8rem;">Vink hierboven aan wie er meegaat.</p><div class="h-mt60"><button class="knop" id="gZ">controleer</button></div><div class="h-mt60" id="gU"></div></div>';
  h+=AIBOX('Bijv. wie kan er mee naar Ibiza dit weekend?');
  $('#main').innerHTML=h;
  bindAi('entourage');
  $('#pAdd').onclick=async()=>{ const naam=$('#pN').value.trim(); if(!naam) return meld('Naam?'); try{ await api('entourage/persoon',{naam,band:$('#pB').value,telefoon:$('#pT').value,dieet:$('#pDi').value,paspoortTot:$('#pP').value,voorkeuren:$('#pV').value}); laad(); }catch(e){ meld(e.message); } };
  document.querySelectorAll('[data-p]').forEach(b=> b.onclick=async()=>{ try{ await api('entourage/persoon/weg',{id:b.dataset.p}); laad(); }catch(e){ meld(e.message); } });
  document.querySelectorAll('[data-doc]').forEach(b=> b.onclick=async()=>{
    const soort=prompt('Welk document? (' + d.soorten.join(', ') + ')','paspoort'); if(soort===null) return;
    const tot=prompt('Geldig tot? (2029-04-01)'); if(!tot) return;
    try{ await api('entourage/doc',{id:b.dataset.doc,soort,tot}); laad(); }catch(e){ meld(e.message); } });
  $('#gZ').onclick=async()=>{
    const ids=[...document.querySelectorAll('[data-mee]:checked')].map(x=>x.dataset.mee);
    try{
      const g=await api('entourage/gezelschap',{ids});
      $('#gU').innerHTML='<b>'+esc(g.tekst)+'</b>'+
        (g.punten.length?'<div class="h-mt50">'+g.punten.map(x=>'<div class="r">'+esc(x.naam)+': '+esc(x.wat)+'</div>').join('')+'</div>':'')+
        (g.dieten.length?'<div style="margin-top:.5rem;color:var(--muted);font-size:.85rem;">Voor de tafel: '+g.dieten.map(x=>esc(x.naam)+' ('+esc(x.dieet)+')').join(', ')+'</div>':'');
    }catch(e){ meld(e.message); }
  };
}
laad();
</script>
<script src="/shared/deelmenu.js" defer></script>
<script src="/shared/schermbeeld.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/volscherm.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
