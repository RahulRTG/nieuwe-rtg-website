<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Festival &middot; de poort</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<link href="/shared/rtg-ontwerp.css" rel="stylesheet">
<link href="/shared/ios.css" rel="stylesheet">
<style>
/* De poort is een INSTRUMENT en geen pagina. Er staat een mens met vier
   seconden, vaak in het donker, vaak met handschoenen aan. Daarom: een
   uitslagvlak dat het halve scherm vult, een invoerveld dat altijd de focus
   heeft, en verder zo min mogelijk.

   Geen eigen palet: alles komt uit de tokens van rtg-ui.css en
   rtg-ontwerp.css. Een tweede kleurenset naast die twee is precies wat
   ONTWERP.md par. 4 verbiedt. */
/* Alles hier rekent met de rand mee. Zonder dit loopt een veld met padding en
   flex:1 buiten het scherm, en dat is precies wat er bij de eerste proef in de
   browser gebeurde. */
.fp *,.fp *::before,.fp *::after{box-sizing:border-box;}
body.fp{background:var(--rtg-bg);color:var(--rtg-txt);margin:0;overflow-x:hidden;
  font-family:Inter,system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;}
.fp header{display:flex;gap:var(--rtg-ruim-klein);align-items:center;flex-wrap:wrap;
  padding:var(--rtg-ruim);border-bottom:1px solid var(--rtg-line);}
.fp .ey{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rtg-goud);}
.fp select{min-height:44px;max-width:100%;padding:0 .6rem;font:inherit;}
.fp .rek{margin-left:auto;}

.fp main{flex:1;display:flex;flex-direction:column;padding:var(--rtg-ruim);gap:var(--rtg-ruim);
  min-width:0;}

/* HET UITSLAGVLAK. De kleur is de DERDE laag: er staat altijd een woord en een
   teken (ONTWERP.md par. 5), zodat het leesbaar blijft voor wie kleur niet ziet
   en op een zwart-witte print. */
#uitslag{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;border:1px solid var(--rtg-line);border-radius:0;
  padding:var(--rtg-ruim);min-height:38dvh;width:100%;min-width:0;}
#uitslagWoord{font-size:clamp(2rem,10vw,4.5rem);line-height:1;letter-spacing:.04em;font-weight:600;
  max-width:100%;overflow-wrap:anywhere;}
#uitslagZin{margin-top:1rem;font-size:clamp(1rem,3.4vw,1.4rem);max-width:32ch;color:var(--rtg-txt);}
#uitslagBij{margin-top:.6rem;font-size:.85rem;color:var(--rtg-soft);
  font-variant-numeric:var(--rtg-cijfers);}
#uitslag[data-sig="gezond"]  {border-color:var(--rtg-sig-gezond);}
#uitslag[data-sig="aandacht"]{border-color:var(--rtg-sig-aandacht);}
#uitslag[data-sig="incident"]{border-color:var(--rtg-sig-incident);}
#uitslag[data-sig="gezond"]   #uitslagWoord{color:var(--rtg-sig-gezond);}
#uitslag[data-sig="aandacht"] #uitslagWoord{color:var(--rtg-sig-aandacht);}
#uitslag[data-sig="incident"] #uitslagWoord{color:var(--rtg-sig-incident);}
#uitslagWoord::after{content:attr(data-teken);margin-left:.4em;font-size:.8em;}

.invoer{display:flex;gap:var(--rtg-ruim-klein);width:100%;min-width:0;}
/* min-width:0 op het veld: een flexkind mag standaard niet kleiner worden dan
   zijn inhoud, en dan duwt een grote letter het hele scherm scheef. */
#code{flex:1 1 auto;min-width:0;min-height:64px;padding:0 1rem;
  font-size:clamp(1.1rem,4.5vw,1.7rem);letter-spacing:.16em;text-transform:uppercase;
  font-variant-numeric:var(--rtg-cijfers);}
#code:focus-visible{outline:2px solid var(--rtg-goud);outline-offset:2px;}
/* De vorm van veld, knop en keuzelijst komt UIT de gedeelde stijl (rtg-ui.css
   via body.rtg-stijl) en wordt hier niet overschreven. Alleen de MAAT wordt
   gezet, want aan een hek moet een duim raak zijn. Een eigen vorm zou dit
   scherm het enige afwijkende van 291 maken, en dat is geen ontwerp maar een
   ongeluk. (Terzijde, en het is een echte tegenspraak: CLAUDE.md zegt "geen
   ronde hoeken", de gedeelde stijl zet .knop op 999px. Dat verschil is ouder
   dan dit scherm en hoort in een eigen ronde te worden beslecht, niet hier.) */
body.fp .knop{flex:0 0 auto;min-height:64px;min-width:44px;padding:0 1.4rem;
  white-space:nowrap;cursor:pointer;}

.voet{display:flex;gap:var(--rtg-ruim);align-items:center;flex-wrap:wrap;width:100%;
  border-top:1px solid var(--rtg-line);padding-top:var(--rtg-ruim);font-size:.85rem;}
.teller{font-variant-numeric:var(--rtg-cijfers);color:var(--rtg-soft);}
.teller b{color:var(--rtg-txt);font-weight:600;}
</style>
</head>
<body class="rtg-stijl fp" data-rtg-modus="command">
<header>
  <a class="terug" href="/apps/leverancier.html" aria-label="Terug naar de zaak">&#8592;</a>
  <select id="kiesPlek" aria-label="Bij welke poort staat u"></select>
  <select id="kiesRichting" aria-label="Naar binnen of naar buiten">
    <option value="in">Naar binnen</option>
    <option value="uit">Naar buiten</option>
  </select>
  <span class="rek teller" id="wie"></span>
</header>

<main id="main">
  <div id="uitslag" role="status" aria-live="assertive" data-sig="stil">
    <div id="uitslagWoord" data-teken="">GEREED</div>
    <div id="uitslagZin">Scan een pas of typ de code.</div>
    <div id="uitslagBij"></div>
  </div>

  <form class="invoer" id="scanForm">
    <input id="code" name="code" autocomplete="off" autocapitalize="characters"
      spellcheck="false" maxlength="16" aria-label="Pascode" placeholder="PASCODE">
    <button class="knop" type="submit">Scan</button>
  </form>

  <div class="voet">
    <span class="teller" id="binnen"></span>
    <span class="teller rek" id="wachtrij"></span>
    <button class="knop" id="synchroniseer" type="button" hidden>Wachtrij versturen</button>
  </div>
</main>

<script src="/apps/festival/poort.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
