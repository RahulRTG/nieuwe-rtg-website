<!doctype html>
<html lang="nl">
<head>
<script src="/shared/id.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Flits</title>
<meta name="theme-color" content="#F4EFE7">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/ds/rtg-ds.css" rel="stylesheet">
<script src="/ds/shell.js"></script>
</head>
<!-- TravelOS op het RTG Design System (TRAVELOS-MIGRATIE.md, batch 4):
     Collectie (wat het netwerk rond u meldt) en Taak (melden met een tik).
     Geen eigen stijl: alles komt uit /ds/rtg-ds.css. De vooruitblik rekent
     vast voor Ibiza, en dat staat er ook bij. -->
<body class="ds-scherm" data-rtg-world="travel" data-ds-schermtype="collectie">
<header class="ds-kop">
  <button class="ds-kop__actie" type="button" data-ds-zoek aria-label="Spring naar een functie"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
  <a class="ds-kop__merk" href="/apps/reizen.html" aria-label="RTG TravelOS">RTG</a>
  <a class="ds-kop__actie" href="/apps/ik.html" aria-label="Uw account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></a>
</header>

<main class="ds-collectie" id="main">
  <div class="ds-collectie__kop">
    <p class="ds-label">Het netwerk meldt · geen spel</p>
    <h1 class="ds-titel ds-titel--scherm">RTG Flits</h1>
  </div>

  <section id="vPoort" hidden>
    <div class="ds-status ds-status--binnen">
      <p class="ds-status__tekst" id="poortReden">RTG Flits hoort bij uw lidmaatschap; log eerst in via de app.</p>
      <a class="ds-knop ds-knop--stil ds-status__actie" href="/apps/app.html">Naar de app</a>
    </div>
  </section>

  <section id="vRit" class="ds-paneel" hidden>
    <div class="ds-taak__kop">
      <p class="ds-titel" id="snelheid" aria-live="off">0</p>
      <p class="ds-label">km/u · gps</p>
    </div>

    <div class="ds-kaart" id="alarm" role="alert" hidden>
      <div class="ds-kaart__inhoud">
        <p class="ds-kaart__titel"><span id="alarmIcoon" aria-hidden="true"></span> <span id="alarmWat"></span></p>
        <p class="ds-kaart__sub" id="alarmSub"></p>
        <div class="ds-chips">
          <button class="ds-knop ds-knop--stil ds-knop--klein" type="button" id="stemKlopt">Klopt</button>
          <button class="ds-knop ds-knop--stil ds-knop--klein" type="button" id="stemWeg">Weg</button>
        </div>
      </div>
    </div>

    <div class="ds-veldgroep" role="group" aria-label="Melden met een tik" id="meldrij"></div>
    <p class="ds-meta" id="landRegel"></p>

    <h2 class="ds-label">In de buurt</h2>
    <ul class="ds-lijst" id="lijst"><li class="ds-meta">Nog niets gemeld in de buurt.</li></ul>

    <h2 class="ds-label">Vooruitblik · Ibiza</h2>
    <p class="ds-meta">Deze vooruitblik rekent vast voor Ibiza, niet voor waar u nu bent.</p>
    <svg id="uren" role="img" aria-label="Drukteverwachting per uur in Ibiza" viewBox="0 0 240 80" width="100%" height="80" hidden></svg>
    <p class="ds-meta" id="urenSub"></p>
    <p class="ds-meta" id="bron"></p>
  </section>
</main>

<p class="ds-melding" id="melding" role="status" aria-live="polite"></p>
<!-- plek.js VOOR de schermcode: gpsStart() vraagt via RTGPlek om je
     positie. Defer mag: gpsStart draait op DOMContentLoaded. -->
<script src="/shared/plek.js" defer></script>
<script src="/shared/uitvoer.js"></script>
<script src="/apps/flits-voorzijde.js"></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/cookie.js" defer></script>
</body>
</html>
