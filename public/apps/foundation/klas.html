<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTFoundation · Klas-PDA</title>

<style>
  :root{--bg:var(--rtg-bg);--paneel:#151312;--line:var(--rtg-line);--txt:var(--rtg-txt);--zacht:rgba(244,241,236,.66);--goud:#C39B4A;--groen:#3E7A4E;--rood:#8A3038;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  .topnav{display:flex;align-items:center;gap:.7rem;padding:1rem 1.1rem;border-bottom:1px solid var(--line);}
  .topnav .brand{font-family:'Bodoni Moda',serif;font-size:1.05rem;}
  .topnav a{color:var(--zacht);text-decoration:none;font-size:.85rem;margin-left:auto;}
  .wrap{max-width:640px;margin:0 auto;padding:1.2rem;}
  h1{font-family:'Bodoni Moda',serif;font-weight:500;font-size:1.5rem;}
  .stil{color:var(--zacht);font-size:.9rem;line-height:1.6;}
  .veld{width:100%;background:var(--paneel);border:1px solid #333;border-radius:0;color:var(--txt);font:inherit;font-size:1.15rem;padding:.85rem 1rem;margin-top:.6rem;}
  #vCode .veld{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-family:ui-monospace,monospace;}
  .knop{width:100%;margin-top:.8rem;background:var(--goud);color:#000;border:none;border-radius:0;padding:1rem;font:700 1.1rem Inter,sans-serif;cursor:pointer;}
  .kaart{background:var(--paneel);border:1px solid var(--line);border-radius:0;padding:1.1rem 1.2rem;margin-top:1rem;}
  .opties{display:grid;gap:.7rem;margin-top:1rem;}
  @media(min-width:520px){.opties{grid-template-columns:1fr 1fr;}}
  .optie{background:var(--paneel);border:2px solid var(--line);border-radius:0;color:var(--txt);font:600 1.05rem Inter,sans-serif;padding:1.2rem 1rem;text-align:left;cursor:pointer;min-height:4.2rem;}
  .optie .ltr{display:inline-block;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--goud);color:#000;text-align:center;line-height:1.7rem;margin-right:.6rem;font-size:.95rem;}
  .optie:disabled{opacity:.55;}
  .optie.gekozen{border-color:var(--goud);}
  .groot{font-family:'Bodoni Moda',serif;font-size:1.8rem;text-align:center;padding:1.4rem 0;}
  .goed{color:#9CCB9C;} .fout{color:#E39AA2;}
  .score{position:sticky;top:0;background:var(--bg);padding:.6rem 0;display:flex;justify-content:space-between;font-size:.9rem;color:var(--zacht);}
  .score b{color:var(--rtg-leesgoud,var(--goud));font-size:1.05rem;}
  .stap{display:none;} .stap.aan{display:block;}
</style>
<link href="/shared/ios.css" rel="stylesheet">
<link rel="stylesheet" href="premium.css">
<style data-rtg-stijlattr>
/* Wat hier staat, stond als style="..." op de elementen zelf (in de markup
   of in de sjablonen van de scripts die deze pagina laadt). Een stijlattribuut
   houdt style-src-attr 'unsafe-inline' open in de CSP; een klasse niet
   (NORM.json inlineStijlAttributen). De declaraties zijn letterlijk wat er
   stond. :not(#_#_#_) geeft de klasse de voorrang die het attribuut had: hij
   wint van elke gewone regel in de bladen, verliest net als het attribuut van
   !important, en een el.style-schrijfactie wint er nog steeds van. */
.s-12izg7a:not(#_#_#_){color:var(--rtg-leesgoud,var(--goud))}
.s-16e2z3i:not(#_#_#_){font-size:1.25rem;text-align:center}
.s-1m13bt8:not(#_#_#_){font-size:1.2rem;margin-top:0.5rem}
.s-1m9a70q:not(#_#_#_){text-align:center}
.s-1uq6r6e:not(#_#_#_){color:#E39AA2;margin-top:.6rem}
.s-251prt:not(#_#_#_){text-transform:none;letter-spacing:normal;text-align:left;font-family:inherit}
.s-3oo9fl:not(#_#_#_){text-align:center;margin-top:.4rem}
.s-3oq6e6:not(#_#_#_){text-align:center;margin-top:.7rem}
.s-hf0w5b:not(#_#_#_){font-size:1.25rem}
</style>
<script src="/shared/rtg-world-desktop.js" defer></script>
<link id="rtgHeritageCss" href="/shared/rtg-heritage.css" rel="stylesheet">
<script src="/shared/rtg-heritage-transition.js" blocking="render"></script>
</head>
<body data-rtg-context-bron="foundation.klas" class="rtg-stijl" data-rtg-world="foundation" data-rtg-skin="heritage" data-rtg-layout="standard">
<div class="topnav"><span class="brand">Rahul Travel <b>Foundation</b></span><a href="index.html">← Foundation</a></div>
<div class="wrap" role="main">
  <!-- meedoen -->
  <section class="stap aan" id="vCode">
    <h1>Jouw klas. Live en veilig.</h1>
    <p class="stil">Vul de klascode en je voornaam in. Dan kun je direct veilig meedoen.</p>
    <input class="veld" id="cCode" maxlength="6" autocomplete="off" placeholder="KLASCODE" aria-label="Klascode">
    <input class="veld s-251prt" id="cNaam" maxlength="24" autocomplete="off" placeholder="Je voornaam" aria-label="Je voornaam">
    <button class="knop" id="cGo" data-hoofdactie>Start de les →</button>
    <p class="stil s-1uq6r6e" id="cFout" role="alert"></p>
  </section>

  <!-- de les -->
  <section class="stap" id="vLes">
    <div class="score"><span id="sNaam"></span><span>goed beantwoord <b id="sScore">0</b></span></div>
    <div class="kaart" id="kInhoud"><p class="stil">Even wachten…</p></div>
    <div class="opties" id="kOpties"></div>
  </section>
</div>
<!-- uitvoer.js staat hier voor het eigen script (de vaste plek in dit huis),
     maar deze pagina meldt bewust GEEN bron aan: dit is de leerlingkant van
     een spelletje in de les, met alleen de vraag van dit moment. De klas als
     lijst hoort bij de meester of juf, en die staat al in bord.html. -->
<script src="/shared/uitvoer.js"></script>
<script src="sessie.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t==null?'':t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = (pad, body) => fetch(pad, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) })
  .then(async r => { const d = await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||'Er ging iets mis.'); return d; });

let CODE=null, NAAM=null, TOKEN=null, LES=null, laatsteVraag=-2, gekozen=null;

$('#cGo').addEventListener('click', async () => {
  $('#cFout').textContent = '';
  try {
    const d = await api('/api/les/mee', { code: $('#cCode').value.trim().toUpperCase(), naam: $('#cNaam').value });
    CODE = $('#cCode').value.trim().toUpperCase(); NAAM = d.naam; TOKEN = d.deelnemerToken; LES = d.les;
    $('#vCode').classList.remove('aan'); $('#vLes').classList.add('aan');
    $('#sNaam').textContent = '' + NAAM;
    teken(); setInterval(kijk, 2500);
  } catch(e){ $('#cFout').textContent = e.message; }
});

async function kijk(){
  try { LES = (await api('/api/les/kijk', { code: CODE, naam: NAAM, deelnemerToken: TOKEN })).les; teken(); } catch(e){}
}
function teken(){
  $('#sScore').textContent = LES.score;
  const inhoud = $('#kInhoud'), opties = $('#kOpties');
  if (LES.fase === 'lobby'){
    inhoud.innerHTML = '<h1 class="s-hf0w5b">'+esc(LES.titel)+'</h1><p class="stil h-mt60">'+esc(LES.uitleg||'')+'</p>'+
      '<p class="stil h-mt80">De juf of meester start zo de eerste vraag. Lees de uitleg alvast rustig door.</p>';
    opties.innerHTML = ''; laatsteVraag = -2; return;
  }
  if (LES.fase === 'klaar'){
    inhoud.innerHTML = '<div class="groot">✓</div><h1 class="s-16e2z3i">De les is klaar!</h1>'+
      '<p class="stil s-3oo9fl">Je had <b class="s-12izg7a">'+LES.score+'</b> vragen goed. Kijk vooral welke stap je nu beter begrijpt.</p>'+
      '<p class="stil s-3oq6e6">Er is bewust geen podium: leren is geen wedstrijd.</p>';
    opties.innerHTML = ''; return;
  }
  if (LES.fase === 'vraag' && LES.vraag){
    if (LES.vraagIx !== laatsteVraag){ gekozen = null; laatsteVraag = LES.vraagIx; }
    if (LES.beantwoord){
      inhoud.innerHTML = '<div class="groot '+(LES.goedFout?'goed':'fout')+'">'+(LES.goedFout?'✓ Goed!':'Helaas')+'</div>'+
        '<p class="stil s-1m9a70q">Wacht op de volgende vraag…</p>';
      opties.innerHTML = ''; return;
    }
    inhoud.innerHTML = '<span class="stil">Vraag '+(LES.vraagIx+1)+' van '+LES.totaalVragen+'</span>'+
      '<h1 class="s-1m13bt8">'+esc(LES.vraag.v)+'</h1>';
    opties.innerHTML = LES.vraag.opties.map((o,i) =>
      '<button class="optie" data-k="'+i+'"><span class="ltr">'+'ABCD'[i]+'</span>'+esc(o)+'</button>').join('');
    opties.querySelectorAll('.optie').forEach(b => b.addEventListener('click', async () => {
      if (gekozen != null) return; gekozen = Number(b.dataset.k);
      b.classList.add('gekozen');
      opties.querySelectorAll('.optie').forEach(x => x.disabled = true);
      try {
        const r = await api('/api/les/antwoord', { code: CODE, naam: NAAM, deelnemerToken: TOKEN, keuze: gekozen });
        $('#sScore').textContent = r.score;
        $('#kInhoud').innerHTML = '<div class="groot '+(r.goed?'goed':'fout')+'">'+(r.goed?'✓ Goed!':'Nog niet')+'</div>'+
          '<p class="stil s-1m9a70q">Wacht op de volgende vraag…</p>';
        opties.innerHTML = '';
      } catch(e){ gekozen = null; opties.querySelectorAll('.optie').forEach(x => x.disabled = false); }
    }));
  }
}
</script>
