<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foundation OS · RTFoundation</title>
<link rel="icon" href="/icons/foundation.svg">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<style>
  :root{--bg:var(--rtg-bg);--card:var(--rtg-card);--line:var(--rtg-line);--txt:var(--rtg-txt);--muted:var(--rtg-muted);--soft:var(--rtg-soft);--burgundy:#A6002F;--gold:#C39B4A;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;padding-bottom:3rem;}
  h1,h2,h3{font-family:'Bodoni Moda',serif;font-weight:500;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 86%,transparent));backdrop-filter:blur(8px);padding:.9rem 1rem .6rem;border-bottom:1px solid var(--line);display:flex;align-items:end;gap:.8rem;flex-wrap:wrap;}
  header .ey{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--burgundy);}
  header h1{font-size:1.25rem;margin-top:.1rem;}
  header a{margin-left:auto;color:var(--muted);font-size:.78rem;text-decoration:none;}
  main{padding:1rem;max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:.9rem;}
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:0;padding:.85rem .95rem;}
  .kaart + .kaart{margin-top:.7rem;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));gap:.7rem;}
  .deel{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:1.4rem 0 .4rem;}
  .sec{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:.2rem 0 .45rem;}
  .rij{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;}
  .rij.tussen{justify-content:space-between;}
  .veld{flex:1;min-width:7rem;background:var(--bg);border:1px solid var(--line);border-radius:0;color:var(--txt);font:inherit;font-size:.88rem;padding:.55rem .7rem;}
  select.veld{min-width:9rem;}
  .knop{background:var(--txt);color:#000;border:none;border-radius:0;padding:.55rem .9rem;font:inherit;font-weight:600;font-size:.84rem;cursor:pointer;}
  .knop.stil{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:500;}
  .knop.aan{background:var(--burgundy);color:#fff;}
  .stad{cursor:pointer;}
  .stad h2{font-size:1rem;}
  .mi{font-size:.74rem;color:var(--muted);margin:.25rem 0 .4rem;line-height:1.45;}
  .pil{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:0;padding:.15rem .55rem;color:var(--muted);}
  .pil.goed{color:#7FC79B;border-color:#2F5E42;}
  .pil.let{color:var(--rtg-leesgoud,var(--gold));border-color:#5C4E10;}
  .pil.fout{color:var(--burgundy);border-color:#5C1B2C;}
  .tabs{display:flex;gap:.35rem;flex-wrap:wrap;margin:.2rem 0 .3rem;}
  .tabs button{background:transparent;border:1px solid var(--line);border-radius:0;color:var(--muted);font:inherit;font-size:.76rem;padding:.35rem .75rem;cursor:pointer;}
  .tabs button.aan{color:var(--txt);border-color:var(--burgundy);}
  .lijnrij{display:flex;gap:.5rem;align-items:baseline;padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.85rem;flex-wrap:wrap;}
  .lijnrij:last-child{border-bottom:none;}
  .lijnrij .naam{flex:1;min-width:9rem;}
  .lijnrij .sub{font-size:.74rem;color:var(--muted);width:100%;}
  .leeg{color:var(--muted);font-size:.85rem;padding:.5rem 0;}
  .stat{flex:1;min-width:6.5rem;text-align:center;padding:.3rem 0;}
  .stat b{font-size:1.2rem;display:block;}
  .stat i{font-style:normal;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);}
  .melder{font-size:.82rem;border-radius:0;padding:.5rem .7rem;margin-top:.5rem;border:1px solid var(--line);}
  .melder.fout{color:#F0A9BB;border-color:#5C1B2C;}
  .melder.goed{color:#9FD6B4;border-color:#2F5E42;}
  .verborgen{display:none;}
  .modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:.35rem;}
  .modules button{text-align:left;}
  .uitleg{font-size:.78rem;color:var(--muted);line-height:1.55;}
  .breed{width:100%;}
</style>
<link rel="stylesheet" href="premium.css">
</head>
<body class="rtg-stijl">
<header>
  <div><div class="ey">RTFoundation</div><h1>Foundation OS</h1></div>
  <a href="kantoor.html">RTF-kantoor</a>
  <a href="os-portaal.html">Portalen</a>
  <a href="os-bestuur.html">Governance</a>
  <a href="os-veld.html">Veld</a>
  <a href="os-publiek.html">Buurtpagina</a>
</header>
<main id="main">
  <div class="kaart">
    <div class="sec">Wie bent u in dit systeem</div>
    <div id="ik" class="uitleg">Laden...</div>
    <div id="meldingTop"></div>
  </div>

  <div class="deel">Stadsafdelingen</div>
  <div class="kaart" id="landelijkKaart">
    <div class="sec">Landelijk beeld</div>
    <div class="rij" id="landelijk"><div class="leeg">Laden...</div></div>
  </div>
  <div class="grid" id="steden"></div>
  <div class="kaart verborgen" id="nieuweStad">
    <div class="sec">Nieuwe stadsafdeling openen (landelijk)</div>
    <div class="rij">
      <input class="veld" id="nsNaam" placeholder="Stad, bijvoorbeeld IJmuiden" maxlength="60" aria-label="Naam van de stad">
      <input class="veld" id="nsLand" placeholder="Land" value="Nederland" maxlength="40" aria-label="Land">
      <button class="knop" id="nsMaak">Openen</button>
    </div>
    <div class="uitleg">Een nieuwe afdeling start op &quot;verkend&quot;. Pas na activeren kan er in die stad gewerkt worden.</div>
  </div>

  <div id="stadPaneel" class="verborgen">
    <div class="deel" id="stadKop">Stad</div>
    <div class="kaart">
      <div class="rij tussen">
        <h2 id="stadNaam"></h2>
        <button class="knop stil" id="terug">← Alle steden</button>
      </div>
      <div class="rij" id="stadMeta"></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="tabIn"></div>
  </div>
</main>

<script>
/* Het Foundation OS in een scherm.

   EEN PAGINA, DRIE HOOGTEN. Landelijk toezicht, een stadsafdeling, en het werk
   in die stad. Dat zijn geen drie apps: het is dezelfde organisatie op drie
   afstanden, en wie ze uit elkaar trekt, laat het stadsbestuur elke dag tussen
   twee tabbladen heen en weer lopen.

   HET SCHERM VERZINT GEEN RECHTEN. Alles wat hier verschijnt komt uit
   /api/rtfos/ik en /api/rtfos/boom; wat u niet mag, komt niet terug van de
   server. De knoppen die de server toch zou weigeren, worden verborgen -- maar
   dat is beleefdheid, geen beveiliging. De poort staat in kern/rtfos/basis.js.

   FOUTEN WORDEN GETOOND, NIET GESLIKT. Elke afgewezen handeling zet de zin van
   de server in beeld. Juist die zinnen dragen dit systeem: "dit geld is
   geoormerkt voor X", "u heeft deze uitgave zelf aangevraagd", "voor dit
   project is een geldige VOG verplicht". Ze wegvangen zou van een grendel een
   raadsel maken. */
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => (Number(n) || 0).toLocaleString('nl-NL', { style: 'currency', currency: 'EUR' });

let TOKEN = null; try { TOKEN = localStorage.getItem('rtg_office_token'); } catch (e) {}
function uitgelogd() {
  var naar = '/apps/personeel.html?kantoor=1&terug=' + encodeURIComponent(location.pathname);
  if (!window.RTGDeur) { location.replace(naar); return; }
  setTimeout(function () {
    RTGDeur.toon(document.getElementById('main') || document.body, { soort: 'personeel', naar: naar });
  }, 0);
}
if (!TOKEN) uitgelogd();

const api = (pad, body) => fetch('/api/rtfos/' + pad, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
  body: JSON.stringify(body || {})
}).then(async r => {
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 401) uitgelogd(); throw new Error(d.error || 'Er ging iets mis.'); }
  return d;
});

let IK = null, STAD = null, TAB = 'overzicht';

/* De meldplek: binnen een geopende stad staat hij boven het tabblad, daarbuiten
   bovenaan de pagina. Een gedeelde functie en geen twee, want een foutzin die
   in een element belandt dat net is overschreven, is een foutzin die niemand
   ziet -- en dat is precies waar dit scherm het van moet hebben. */
function melding(tekst, goed) {
  const el = document.getElementById('melding') || document.getElementById('meldingTop');
  if (!el) return;
  el.innerHTML = '<div class="melder ' + (goed ? 'goed' : 'fout') + '">' + esc(tekst) + '</div>';
  el.scrollIntoView({ block: 'nearest' });
}
// Elke handeling langs een plek: fout in beeld, daarna opnieuw tekenen.
function doe(pad, body, na) {
  return api(pad, body).then(r => { if (na) na(r); }).catch(e => melding(e.message, false));
}

/* ---------- het bovenste beeld ---------- */
async function laad() {
  IK = await api('ik');
  const zetels = (IK.zetels || []).map(z => z.stadNaam + ' (' + z.rol + ')').join(', ');
  $('#ik').innerHTML = IK.landelijk
    ? 'U spreekt namens het <b>landelijke RTF-bestuur</b>. U ziet alle steden, keurt partners en grote uitgaven goed, zet modules aan of uit en leest het auditspoor.'
    : (zetels
      ? 'U heeft een zetel in: <b>' + esc(zetels) + '</b>. U ziet alleen die stad; het landelijke bestuur houdt toezicht.'
      : 'U heeft nog geen zetel in een stadsafdeling. Het landelijke bestuur kent die toe.');
  $('#nieuweStad').classList.toggle('verborgen', !IK.landelijk);
  await tekenSteden();
  if (IK.landelijk) tekenLandelijk(); else $('#landelijkKaart').classList.add('verborgen');
}

async function tekenSteden() {
  const b = await api('boom');
  const el = $('#steden');
  if (!b.steden.length) {
    el.innerHTML = '<div class="kaart"><div class="leeg">Er is nog geen stadsafdeling. ' +
      (IK.landelijk ? 'Open er hieronder een.' : 'Het landelijke bestuur opent ze.') + '</div></div>';
    return;
  }
  el.innerHTML = b.steden.map(s => {
    const t = s.tellers || {};
    const pil = s.status === 'actief' ? 'goed' : (s.status === 'geblokkeerd' ? 'fout' : 'let');
    return '<div class="kaart stad" data-stad="' + esc(s.id) + '">' +
      '<div class="rij tussen"><h2>RTF ' + esc(s.naam) + '</h2><span class="pil ' + pil + '">' + esc(s.status) + '</span></div>' +
      '<div class="mi">' + (s.rol ? 'Uw rol: ' + esc(s.rol) : 'Toezicht') + ' &middot; ' + (s.vlaggen || []).length + ' modules aan</div>' +
      '<div class="rij"><span class="pil">' + (t.projecten || 0) + ' projecten</span>' +
      '<span class="pil">' + (t.partners || 0) + ' partners</span>' +
      '<span class="pil">' + (t.vrijwilligers || 0) + ' vrijwilligers</span>' +
      (t.casussen ? '<span class="pil let">' + t.casussen + ' open hulpvragen</span>' : '') + '</div></div>';
  }).join('');
  el.querySelectorAll('[data-stad]').forEach(k => k.addEventListener('click', () => openStad(k.dataset.stad)));
}

async function tekenLandelijk() {
  try {
    const r = await api('rapport/landelijk');
    const t = r.totaal;
    $('#landelijk').innerHTML =
      stat(t.steden, 'steden') + stat(t.projectenActief, 'projecten actief') +
      stat(t.uniekGeholpen, 'mensen geholpen') + stat(t.vrijwilligers, 'vrijwilligers') +
      stat(Math.round(t.vrijwilligersuren), 'uren') + stat(eur(t.besteed), 'besteed') +
      stat(t.openMeldingen, 'open meldingen') + stat(t.kritiekeMeldingen, 'kritiek') +
      (t.stedenZonderIndicatoren ? stat(t.stedenZonderIndicatoren, 'steden meten niets') : '');
  } catch (e) { $('#landelijk').innerHTML = '<div class="leeg">' + esc(e.message) + '</div>'; }
}
const stat = (waarde, label) => '<div class="stat"><b>' + esc(waarde) + '</b><i>' + esc(label) + '</i></div>';

/* ---------- een stad open ---------- */
const TABS = [
  ['overzicht', 'Impact'], ['projecten', 'Projecten'], ['partners', 'Partners'],
  ['vrijwilligers', 'Vrijwilligers'], ['geld', 'Geld'], ['casussen', 'Hulpvragen'],
  ['meldingen', 'Integriteit'], ['gemeente', 'Gemeente'], ['ondernemers', 'Ondernemers'],
  ['subsidies', 'Subsidies'], ['voorraad', 'Voorraad'], ['activiteiten', 'Activiteiten'],
  ['berichten', 'Communicatie'], ['netwerk', 'Netwerk'], ['bestuur', 'Bestuur']
];

async function openStad(id) {
  const r = await api('stad', { id }).catch(e => { melding(e.message, false); return null; });
  if (!r) return;
  STAD = r.stad;
  STAD.rol = r.rol;
  $('#stadPaneel').classList.remove('verborgen');
  $('#stadKop').textContent = 'RTF ' + STAD.naam;
  $('#stadNaam').textContent = 'RTF ' + STAD.naam;
  $('#stadMeta').innerHTML =
    '<span class="pil">' + esc(STAD.status) + '</span>' +
    '<span class="pil">rol: ' + esc(STAD.rol || 'toezicht') + '</span>' +
    '<span class="pil">projectleider tot ' + eur(STAD.limieten.projectleider) + '</span>' +
    '<span class="pil">stadsbestuur tot ' + eur(STAD.limieten.stadsbestuur) + '</span>';
  $('#tabs').innerHTML = TABS.map(([k, n]) => '<button data-tab="' + k + '" class="' + (k === TAB ? 'aan' : '') + '">' + esc(n) + '</button>').join('');
  $('#tabs').querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { TAB = b.dataset.tab; openStad(STAD.id); }));
  window.scrollTo({ top: $('#stadPaneel').offsetTop - 60, behavior: 'smooth' });
  tekenTab();
}

$('#terug').addEventListener('click', () => { $('#stadPaneel').classList.add('verborgen'); STAD = null; });

function raam(binnen) { $('#tabIn').innerHTML = '<div id="melding"></div>' + binnen; }

async function tekenTab() {
  try {
    if (TAB === 'overzicht') return await tabImpact();
    if (TAB === 'projecten') return await tabProjecten();
    if (TAB === 'partners') return await tabPartners();
    if (TAB === 'vrijwilligers') return await tabVrijwilligers();
    if (TAB === 'geld') return await tabGeld();
    if (TAB === 'casussen') return await tabCasussen();
    if (TAB === 'meldingen') return await tabMeldingen();
    if (TAB === 'gemeente') return await tabGemeente();
    if (TAB === 'ondernemers') return await tabOndernemers();
    if (TAB === 'subsidies') return await tabSubsidies();
    if (TAB === 'voorraad') return await tabVoorraad();
    if (TAB === 'activiteiten') return await tabActiviteiten();
    if (TAB === 'berichten') return await tabBerichten();
    if (TAB === 'netwerk') return await tabNetwerk();
    if (TAB === 'bestuur') return await tabBestuur();
  } catch (e) { raam('<div class="kaart"><div class="melder fout">' + esc(e.message) + '</div></div>'); }
}

/* ---------- impact ---------- */
async function tabImpact() {
  const r = await api('rapport', { stad: STAD.id });
  const c = r.cijfers;
  raam('<div class="kaart"><div class="sec">Mensen</div><div class="rij">' +
    (c.mensen.gemeten
      ? stat(c.mensen.uniekGeholpen, 'uniek geholpen') + stat(c.mensen.herhaaldGeholpen, 'herhaald')
      : '<div class="leeg">Er is nog niet ingevuld hoeveel mensen er zijn geholpen. Dat is geen nul: het is niet gemeten.</div>') +
    stat(c.mensen.vrijwilligers, 'vrijwilligers') + stat(Math.round(c.mensen.vrijwilligersuren), 'uren') +
    stat(c.mensen.vogGeldig, 'met geldige VOG') + '</div></div>' +
  '<div class="kaart"><div class="sec">Doelen</div>' +
    (c.doelen.gemeten
      ? '<div class="rij">' + stat(c.doelen.doel, 'doel') + stat(c.doelen.bereikt, 'bereikt') +
        stat(c.doelen.doorgestroomd, 'doorgestroomd') + stat(c.doelen.inTraject, 'in traject') +
        stat(c.doelen.uitgevallen, 'uitgevallen') + '</div>'
      : '<div class="leeg">Nog geen indicatoren ingevuld. Zet ze per project onder Projecten.</div>') + '</div>' +
  '<div class="kaart"><div class="sec">Geld</div><div class="rij">' +
    stat(eur(c.geld.binnen), 'binnen') + stat(eur(c.geld.besteed), 'besteed') +
    stat(eur(c.geld.geoormerkt), 'geoormerkt') +
    stat(c.geld.kostenPerPersoon === null ? '--' : eur(c.geld.kostenPerPersoon), 'per geholpen persoon') +
    stat(c.geld.openAanvragen, 'open aanvragen') + '</div>' +
    (c.geld.kostenPerPersoon === null ? '<div class="uitleg">Kosten per geholpen persoon staat er pas als er zowel besteed geld als geholpen mensen zijn. Een deling zonder beide kanten is geen cijfer.</div>' : '') +
    '</div>' +
  '<div class="kaart"><div class="sec">Hulpvragen en meldingen</div><div class="rij">' +
    stat(c.hulpvragen.totaal, 'hulpvragen') + stat(c.hulpvragen.open, 'open') +
    stat(c.hulpvragen.afgerond, 'afgerond') + stat(c.meldingen.open, 'open meldingen') +
    stat(c.meldingen.kritiek, 'kritiek') + '</div></div>');
}

/* ---------- projecten ---------- */
async function tabProjecten() {
  const r = await api('projecten', { stad: STAD.id });
  const soorten = r.soorten.map(s => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join('');
  raam('<div class="kaart"><div class="sec">Nieuw project</div>' +
    '<div class="rij"><input class="veld" id="pNaam" placeholder="Naam van het project" maxlength="120" aria-label="Naam">' +
    '<select class="veld" id="pSoort" aria-label="Soort">' + soorten + '</select></div>' +
    '<div class="rij"><input class="veld" id="pDoelgroep" placeholder="Doelgroep" maxlength="120" aria-label="Doelgroep">' +
    '<input class="veld" id="pBudget" type="number" min="0" step="0.01" placeholder="Budget in euro" aria-label="Budget">' +
    '<button class="knop" id="pMaak">Toevoegen</button></div>' +
    '<div class="uitleg">Een project begint als idee. De keten is: idee → aanvraag → beoordeling → goedgekeurd → actief. Goedkeuren doet een ander dan aanvragen, en boven uw limiet beslist het landelijke bestuur.</div></div>' +
  '<div class="kaart"><div class="sec">' + r.projecten.length + ' projecten</div>' +
    (r.projecten.length ? r.projecten.map(projectRij).join('') : '<div class="leeg">Nog geen projecten.</div>') + '</div>');

  $('#pMaak').addEventListener('click', () => doe('project/maak', {
    stad: STAD.id, naam: $('#pNaam').value, soort: $('#pSoort').value,
    doelgroep: $('#pDoelgroep').value, budget: $('#pBudget').value || 0
  }, tekenTab));
  $('#tabIn').querySelectorAll('[data-status]').forEach(b => b.addEventListener('click', () =>
    doe('project/status', { id: b.dataset.id, status: b.dataset.status }, tekenTab)));
  $('#tabIn').querySelectorAll('[data-ind]').forEach(b => b.addEventListener('click', () => {
    const w = document.getElementById('ind-' + b.dataset.ind);
    doe('project/indicator', { id: b.dataset.ind, naam: w.querySelector('.iNaam').value,
      doel: w.querySelector('.iDoel').value, bereikt: w.querySelector('.iBereikt').value,
      doorgestroomd: w.querySelector('.iDoor').value, uitgevallen: w.querySelector('.iUit').value }, tekenTab);
  }));
}

function projectRij(p) {
  const volgende = { idee: 'aanvraag', aanvraag: 'beoordeling', beoordeling: 'goedgekeurd', goedgekeurd: 'actief', actief: 'afgerond' }[p.status];
  const ind = (p.indicatoren || []).map(i =>
    '<div class="sub">' + esc(i.naam) + ': ' + i.bereikt + ' van ' + i.doel + ' bereikt, ' +
    i.doorgestroomd + ' doorgestroomd, ' + i.uitgevallen + ' uitgevallen, ' + i.actief + ' in traject</div>').join('');
  return '<div class="lijnrij"><span class="naam"><b>' + esc(p.naam) + '</b> &middot; ' + esc(p.soort) + '</span>' +
    '<span class="pil">' + esc(p.status) + '</span><span class="pil">' + eur(p.budget) + '</span>' +
    (volgende ? '<button class="knop stil" data-status="' + esc(volgende) + '" data-id="' + esc(p.id) + '">→ ' + esc(volgende) + '</button>' : '') +
    '<div class="sub">' + esc(p.doelgroep || 'geen doelgroep ingevuld') + ' &middot; ' + p.vrijwilligers + ' vrijwilligers &middot; ' + p.deelnemersUniek + ' geholpen' +
    (p.besluit ? ' &middot; goedgekeurd door ' + esc(p.besluit.rol) : '') + '</div>' + ind +
    '<div class="rij breed" id="ind-' + esc(p.id) + '">' +
      '<input class="veld iNaam" placeholder="Indicator" maxlength="120" aria-label="Indicator">' +
      '<input class="veld iDoel" type="number" min="0" placeholder="doel" aria-label="Doel">' +
      '<input class="veld iBereikt" type="number" min="0" placeholder="bereikt" aria-label="Bereikt">' +
      '<input class="veld iDoor" type="number" min="0" placeholder="doorgestroomd" aria-label="Doorgestroomd">' +
      '<input class="veld iUit" type="number" min="0" placeholder="uitgevallen" aria-label="Uitgevallen">' +
      '<button class="knop stil" data-ind="' + esc(p.id) + '">Meten</button></div></div>';
}

/* ---------- partners ---------- */
async function tabPartners() {
  const r = await api('partners', { stad: STAD.id });
  raam('<div class="kaart"><div class="sec">Nieuwe partnerstichting</div>' +

}

/* De uren die de vrijwilliger zelf heeft doorgegeven in os-vrijwilliger.html.
   Ze staan met opzet in de rij van die vrijwilliger en niet op een aparte
   stapel "te bevestigen": een lijst die je apart moet openen, open je niet.
   Bevestigen is een besluit -- uren dragen het jaarverslag en de
   subsidieverantwoording, en dan is "hij typte het zelf in" geen bron. */
function urenMeldingen(v) {
  const m = v.gemeldeUren || [];
  if (!m.length) return '';
  return '<div class="rij breed">' + m.map(u =>
    '<button class="knop stil" data-vuren="' + esc(v.id) + '" data-melding="' + esc(u.id) + '">' +
      'Bevestig ' + esc(u.uren) + ' uur op ' + esc(String(u.datum || '').slice(0, 10)) +
      (u.km ? ' (' + esc(u.km) + ' km)' : '') + '</button>').join('') +
    '<span class="uitleg">' + m.length + ' door de vrijwilliger gemeld; telt pas mee na uw bevestiging.</span></div>';
}

function subsidieRij(s) {
  const volgende = { kans: 'in_voorbereiding', in_voorbereiding: 'aangevraagd', aangevraagd: 'toegekend', toegekend: 'verantwoord' }[s.status];
  return '<div class="lijnrij" id="s-' + esc(s.id) + '"><span class="naam"><b>' + esc(s.naam) + '</b> &middot; ' + esc(s.verstrekker || s.soort) + '</span>' +
    '<span class="pil">' + esc(s.status) + '</span>' +
    '<span class="pil">' + eur(s.toegekend || s.aangevraagd) + '</span>' +
    (s.gemist ? '<span class="pil fout">deadline gemist</span>' : '') +
    (s.risico === 'hoog' ? '<span class="pil let">terugbetaalrisico hoog</span>' : '') +
    (volgende ? '<button class="knop stil" data-sstatus="' + esc(volgende) + '" data-id="' + esc(s.id) + '">→ ' + esc(volgende) + '</button>' : '') +
    '<div class="sub">' + (s.deadline ? 'deadline ' + esc(s.deadline) + ' &middot; ' : '') +
      s.openMomenten + ' open rapportagemomenten &middot; ' + (s.bewijs || []).length + ' bewijsstukken' +
      (s.bronId ? ' &middot; geoormerkte bron aangemaakt' : '') + '</div>' +
    (s.momenten || []).map(m => '<div class="sub">' + (m.af ? '&check; ' : '&#9675; ') + esc(m.wat) +
      (m.datum ? ' (' + esc(m.datum) + ')' : '') +
      (m.af ? '' : ' <button class="knop stil" data-momentaf="' + esc(m.id) + '" data-id="' + esc(s.id) + '">afvinken</button>') + '</div>').join('') +
    '<div class="rij breed"><input class="veld mWat" placeholder="Rapportagemoment" maxlength="200" aria-label="Rapportagemoment">' +
    '<input class="veld mDatum" type="date" aria-label="Datum">' +
    '<button class="knop stil" data-smoment="' + esc(s.id) + '">+ moment</button>' +
    '<input class="veld bNaam" placeholder="Bewijsstuk" maxlength="120" aria-label="Bewijsstuk">' +
    '<button class="knop stil" data-sbewijs="' + esc(s.id) + '">+ bewijs</button></div></div>';
}

          '<input class="veld bReden" id="rd-' + esc(b.id) + '" placeholder="reden bij afkeuren" maxlength="300" aria-label="Reden">' +
          '<button class="knop stil" data-bnee="' + esc(b.id) + '">Afkeuren</button>' : '') +
        '<div class="sub">' + esc(b.tekst) + '</div></div>').join('') + '</div>' : '') +
    '<div class="kaart"><div class="sec">Berichten</div>' +
      (r.berichten.length ? r.berichten.map(b => '<div class="lijnrij"><span class="naam">' + esc(b.onderwerp) + '</span>' +
        '<span class="pil">' + esc(b.doelgroep) + '</span><span class="pil">' + esc(b.status) + '</span>' +
        (b.naarBuiten ? '<span class="pil let">naar buiten</span>' : '') +
        (['concept', 'goedgekeurd'].includes(b.status) ? '<button class="knop stil" data-bverzend="' + esc(b.id) + '">Verzenden</button>' : '') +
        '<div class="sub">' + esc(b.tekst) +
          (b.besluit && b.besluit.reden ? ' &middot; landelijk: ' + esc(b.besluit.reden) : '') + '</div></div>').join('')
        : '<div class="leeg">Nog geen berichten.</div>') + '</div>');

  $('#brMaak').addEventListener('click', () => doe('bericht/maak', {
    stad: STAD.id, doelgroep: $('#brDoel').value, kanaal: $('#brKanaal').value,
    onderwerp: $('#brOnderwerp').value, tekst: $('#brTekst').value, spoed: $('#brSpoed').checked
  }, tekenTab));
  $('#tabIn').querySelectorAll('[data-bverzend]').forEach(b => b.addEventListener('click', () =>
    api('bericht/verzend', { id: b.dataset.bverzend })
      .then(res => { melding(res.melding, !res.voorgelegd ? true : false); tekenTab(); })
      .catch(e => melding(e.message, false))));
  $('#tabIn').querySelectorAll('[data-bja]').forEach(b => b.addEventListener('click', () =>
    doe('bericht/besluit', { id: b.dataset.bja, akkoord: true, reden: 'akkoord' }, tekenTab)));
  $('#tabIn').querySelectorAll('[data-bnee]').forEach(b => b.addEventListener('click', () => {
    const veld = document.getElementById('rd-' + b.dataset.bnee);
    doe('bericht/besluit', { id: b.dataset.bnee, akkoord: false, reden: veld ? veld.value : '' }, tekenTab);
  }));
}

/* ---------- netwerk: delen, samen kopen, uitlenen, campagnes ---------- */
async function tabNetwerk() {
  const [bd, ink, uit, camp, bord, bench] = await Promise.all([
    api('blauwdrukken', {}), api('inkoop', {}), api('uitleen', { stad: STAD.id }),
    api('campagnes', {}), api('koppelbord', {}), api('benchmark', {})
  ]);
  const pr = await api('projecten', { stad: STAD.id });
  const projOpties = pr.projecten.map(p => '<option value="' + esc(p.id) + '">' + esc(p.naam) + '</option>').join('');

  raam('<div class="kaart"><div class="sec">Blauwdrukken: wat elders werkte</div>' +
      (bd.blauwdrukken.length ? bd.blauwdrukken.map(b => '<div class="lijnrij"><span class="naam"><b>' + esc(b.naam) + '</b> &middot; ' + esc(b.soort) + '</span>' +
        '<span class="pil">uit ' + esc(b.vanStad || '?') + '</span>' +
        (b.overgenomen ? '<span class="pil">' + b.overgenomen + 'x overgenomen</span>' : '') +
        (b.eigen ? '' : '<button class="knop stil" data-overnemen="' + esc(b.id) + '">Overnemen in ' + esc(STAD.naam) + '</button>') +
        '<div class="sub">' + esc(b.aanpak) + '</div>' +
        '<div class="sub">Geleerd: ' + esc(b.geleerd) + (b.doorlooptijd ? ' &middot; ' + esc(b.doorlooptijd) : '') + '</div></div>').join('')
        : '<div class="leeg">Nog geen blauwdrukken. Deel er een vanuit een project dat draait en gemeten is.</div>') +
      '<div class="rij breed"><select class="veld" id="bdProject" aria-label="Project">' + projOpties + '</select>' +
      '<input class="veld" id="bdAanpak" placeholder="De aanpak: wat doet een andere stad maandag als eerste?" maxlength="1500" aria-label="Aanpak">' +
      '<input class="veld" id="bdGeleerd" placeholder="Wat ging er mis of anders dan verwacht?" maxlength="1000" aria-label="Geleerd">' +
      '<input class="veld" id="bdDuur" placeholder="doorlooptijd" maxlength="60" aria-label="Doorlooptijd">' +
      '<button class="knop" id="bdDeel">Delen</button></div>' +
      '<div class="uitleg">Wie een blauwdruk overneemt, begint bij &quot;idee&quot; en loopt zijn eigen goedkeuring. Het budget en de resultaten van de andere stad reizen niet mee: dat zijn feiten van daar.</div></div>' +

    '<div class="kaart"><div class="sec">Gezamenlijke inkoop</div>' +
      (ink.inkoop.length ? ink.inkoop.map(i => '<div class="lijnrij" id="i-' + esc(i.id) + '"><span class="naam"><b>' + esc(i.wat) + '</b></span>' +
        '<span class="pil">' + esc(i.status) + '</span><span class="pil">' + i.stuks + ' ' + esc(i.eenheid) + '</span>' +
        '<span class="pil">' + i.deelnames.length + ' steden</span>' +
        (i.totaal ? '<span class="pil">' + eur(i.totaal) + '</span>' : '') +
        '<div class="sub">geopend door ' + esc(i.openerStad || '?') + ' &middot; indicatie ' + eur(i.indicatiePerStuk) + ' per stuk' +
          (i.sluitDatum ? ' &middot; sluit ' + esc(i.sluitDatum) : '') + '</div>' +
        i.deelnames.map(d => '<div class="sub">' + esc(d.stad) + ': ' + d.aantal + ' &middot; ' + eur(d.deel) +
          (d.uitgaveId ? ' (aanvraag klaar)' : '') + '</div>').join('') +
        (i.status === 'open' ? '<div class="rij breed">' +
          '<select class="veld iProject" aria-label="Project">' + projOpties + '</select>' +
          '<input class="veld iAantal" type="number" min="1" placeholder="aantal" aria-label="Aantal">' +
          '<input class="veld iBron" placeholder="bron-id" maxlength="20" aria-label="Bron">' +
          '<button class="knop stil" data-inschrijf-inkoop="' + esc(i.id) + '">Meedoen</button>' +
          '<input class="veld iPrijs" type="number" min="0" step="0.01" placeholder="definitieve prijs" aria-label="Prijs">' +
          '<input class="veld iExtra" type="number" min="0" step="0.01" placeholder="bijkomende kosten" aria-label="Bijkomende kosten">' +
          '<button class="knop stil" data-sluit-inkoop="' + esc(i.id) + '">Sluiten</button></div>' : '') +
        '</div>').join('') : '<div class="leeg">Nog geen gezamenlijke inkoop.</div>') +
      '<div class="rij breed"><input class="veld" id="ikWat" placeholder="Wat kopen we samen" maxlength="120" aria-label="Wat">' +
      '<input class="veld" id="ikEenheid" placeholder="eenheid" maxlength="20" aria-label="Eenheid">' +
      '<input class="veld" id="ikPrijs" type="number" min="0" step="0.01" placeholder="indicatie per stuk" aria-label="Indicatie">' +
      '<input class="veld" id="ikLev" placeholder="leverancier" maxlength="120" aria-label="Leverancier">' +
      '<button class="knop" id="ikMaak">Openen</button></div>' +
      '<div class="uitleg">Elke stad betaalt uit eigen bronnen; sluiten maakt per stad een gewone uitgave-aanvraag die daar nog door de vier ogen moet. Een gezamenlijke order is een bestelling, geen betaling.</div></div>' +

    '<div class="kaart"><div class="sec">Vrijwilligers tussen steden</div>' +
      (uit.uitgeleend.length || uit.geleend.length
        ? uit.uitgeleend.concat(uit.geleend).map(u => '<div class="lijnrij"><span class="naam">' + esc(u.naam) + '</span>' +
          '<span class="pil">' + esc(u.vanStad || '?') + ' &rarr; ' + esc(u.naarStad || '?') + '</span>' +
          '<span class="pil">' + esc(u.status) + (u.loopt ? ', loopt' : '') + '</span>' +
          '<span class="pil">tot ' + esc(u.tot || '?') + '</span>' +
          (u.status === 'gevraagd' ? '<input class="veld uTekst" id="ut-' + esc(u.id) + '" placeholder="wat zegt de vrijwilliger?" maxlength="300" aria-label="Toestemming">' +
            '<button class="knop stil" data-uja="' + esc(u.id) + '">Akkoord</button>' +
            '<button class="knop stil" data-unee="' + esc(u.id) + '">Niet akkoord</button>' : '') +
          (u.status === 'lopend' ? '<button class="knop stil" data-ustop="' + esc(u.id) + '">Beeindigen</button>' : '') +
          '<div class="sub">' + esc(u.reden) + '</div></div>').join('')
        : '<div class="leeg">Geen uitleen in of uit deze stad.</div>') +
      (uit.gasten.length ? '<div class="sub">Nu hier aan het werk vanuit een andere stad: ' +
        uit.gasten.map(g => esc(g.naam) + ' (' + esc(g.eigenStad || '?') + ')').join(', ') + '</div>' : '') +
      '<div class="uitleg">Een vrijwilliger wordt gevraagd, niet verplaatst. Zonder vastgelegde toestemming loopt de uitleen niet, en de ontvangende stad ziet vaardigheden en beschikbaarheid &mdash; geen evaluaties en geen urenhistorie.</div></div>' +

    '<div class="kaart"><div class="sec">Landelijke campagnes</div>' +
      (camp.campagnes.length ? camp.campagnes.map(c => '<div class="lijnrij"><span class="naam"><b>' + esc(c.naam) + '</b></span>' +
        '<span class="pil">' + esc(c.status) + '</span><span class="pil">' + eur(c.opgehaald) + ' opgehaald</span>' +
        '<span class="pil ' + (c.sluitend ? 'goed' : 'fout') + '">sleutel ' + (c.sluitend ? 'sluit' : 'sluit NIET') + '</span>' +
        '<div class="sub">' + c.sleutel.map(s => esc(s.stadNaam) + ' ' + s.procent + '%').join(' &middot; ') + '</div></div>').join('')
        : '<div class="leeg">Nog geen landelijke campagne.</div>') +
      '<div class="uitleg">De verdeelsleutel telt op tot exact 100% en de verdeling verliest geen cent. Campagnegeld landt als bron in de stad zelf, niet vastgeklonken aan een project.</div></div>' +

    '<div class="kaart"><div class="sec">Benchmark</div>' +
      (bench.landelijk
        ? '<div class="sub">' + esc(bench.uitleg) + '</div>' +
          bench.steden.map(s => '<div class="lijnrij"><span class="naam">' + esc(s.naam) + '</span>' +
            (s.gemeten
              ? '<span class="pil">' + s.geholpen + ' geholpen</span>' +
                '<span class="pil">' + (s.geholpenPerProject === null ? '--' : s.geholpenPerProject) + ' per actief project</span>' +
                '<span class="pil">' + (s.urenPerVrijwilliger === null ? '--' : s.urenPerVrijwilliger) + ' uur per vrijwilliger</span>'
              : '<span class="pil let">niet gemeten</span>') + '</div>').join('') +
          (bench.signalen.length ? bench.signalen.map(x => '<div class="sub">' + esc(x.stad) + ': ' + esc(x.wat) + ' &mdash; ' + esc(x.vraag) + '</div>').join('') : '')
        : '<div class="rij">' + stat(bench.eigen.geholpen, 'geholpen') +
          stat(bench.eigen.geholpenPerProject === null ? '--' : bench.eigen.geholpenPerProject, 'per actief project') +
          stat(bench.mediaan.geholpenPerProject === null ? '--' : bench.mediaan.geholpenPerProject, 'landelijke mediaan') + '</div>' +
          '<div class="uitleg">' + esc(bench.uitleg) + '</div>') + '</div>' +

    '<div class="kaart"><div class="sec">Koppelingen met RTG</div>' +
      bord.koppelingen.map(k => '<div class="lijnrij"><span class="naam">' + esc(k.naam) + '</span>' +
        '<span class="pil ' + (k.werkt ? 'goed' : 'let') + '">' + (k.werkt ? 'werkt' : 'nog niet') + '</span>' +
        '<div class="sub">' + esc(k.wat) + (k.nodig ? ' &mdash; ' + esc(k.nodig) : '') + '</div></div>').join('') +
      '<div class="uitleg">Wat hier op &quot;nog niet&quot; staat, doet ook echt niets: een knop die stilletjes niets doet is erger dan geen knop. Een activiteit in uw eigen RTG-agenda zetten kan wel, vanaf het tabblad Activiteiten.</div></div>');

  $('#bdDeel').addEventListener('click', () => doe('blauwdruk/deel', {
    projectId: $('#bdProject').value, aanpak: $('#bdAanpak').value,
    geleerd: $('#bdGeleerd').value, doorlooptijd: $('#bdDuur').value
  }, tekenTab));
  $('#tabIn').querySelectorAll('[data-overnemen]').forEach(b => b.addEventListener('click', () =>
    api('blauwdruk/overnemen', { id: b.dataset.overnemen, stad: STAD.id })
      .then(r => { melding(r.melding, true); tekenTab(); })
      .catch(e => melding(e.message, false))));
  $('#ikMaak').addEventListener('click', () => doe('inkoop/maak', {
    stad: STAD.id, wat: $('#ikWat').value, eenheid: $('#ikEenheid').value,
    indicatie: $('#ikPrijs').value, leverancier: $('#ikLev').value
  }, tekenTab));
  $('#tabIn').querySelectorAll('[data-inschrijf-inkoop]').forEach(b => b.addEventListener('click', () => {
    const w = document.getElementById('i-' + b.dataset.inschrijfInkoop);
    doe('inkoop/inschrijven', { id: b.dataset.inschrijfInkoop, projectId: w.querySelector('.iProject').value,
      aantal: w.querySelector('.iAantal').value, bronId: w.querySelector('.iBron').value }, tekenTab);
  }));
  $('#tabIn').querySelectorAll('[data-sluit-inkoop]').forEach(b => b.addEventListener('click', () => {
    const w = document.getElementById('i-' + b.dataset.sluitInkoop);
    api('inkoop/sluit', { id: b.dataset.sluitInkoop, perStuk: w.querySelector('.iPrijs').value,
      extra: w.querySelector('.iExtra').value || 0 })
      .then(r => { melding(r.melding, true); tekenTab(); })
      .catch(e => melding(e.message, false));
  }));
  $('#tabIn').querySelectorAll('[data-uja]').forEach(b => b.addEventListener('click', () => {
    const veld = document.getElementById('ut-' + b.dataset.uja);
    doe('uitleen/toestemming', { id: b.dataset.uja, akkoord: true, tekst: veld ? veld.value : '' }, tekenTab);
  }));
  $('#tabIn').querySelectorAll('[data-unee]').forEach(b => b.addEventListener('click', () =>
    doe('uitleen/toestemming', { id: b.dataset.unee, akkoord: false }, tekenTab)));
  $('#tabIn').querySelectorAll('[data-ustop]').forEach(b => b.addEventListener('click', () =>
    doe('uitleen/beeindig', { id: b.dataset.ustop }, tekenTab)));
}

/* ---------- bestuur: modules, limieten, zetels ---------- */
async function tabBestuur() {
  const landelijk = IK.landelijk;
  const modules = (IK.vlaggen || []).map(v => {
    const aan = (STAD.vlaggen || []).includes(v);
    return '<button class="knop stil ' + (aan ? 'aan' : '') + '" data-module="' + esc(v) + '" data-aan="' + (aan ? '' : '1') + '"' +
      (landelijk ? '' : ' disabled') + '>' + (aan ? '● ' : '○ ') + esc(v) + '</button>';
  }).join('');
  raam('<div class="kaart"><div class="sec">Modules in deze stad</div>' +
    '<div class="modules">' + modules + '</div>' +
    '<div class="uitleg">' + (landelijk
      ? 'Wat hier uit staat, kan in deze stad niet worden aangemaakt of gewijzigd -- dat is wat een module-schakelaar hoort te betekenen.'
      : 'Modules zet het landelijke bestuur aan of uit.') + '</div></div>' +
  '<div class="kaart"><div class="sec">Status van de afdeling</div>' +
    '<div class="rij">' + ['verkend', 'in_oprichting', 'actief', 'geblokkeerd', 'beeindigd']
      .map(s => '<button class="knop stil ' + (STAD.status === s ? 'aan' : '') + '" data-stadstatus="' + s + '"' + (landelijk ? '' : ' disabled') + '>' + s + '</button>').join('') + '</div>' +
    '<div class="uitleg">Een geblokkeerde stad blijft leesbaar maar is niet meer schrijfbaar: toezicht stopt de uitvoering en wist de geschiedenis niet.</div></div>' +
  '<div class="kaart"><div class="sec">Goedkeuringslimieten</div>' +
    '<div class="rij"><input class="veld" id="lProj" type="number" min="0" step="0.01" value="' + STAD.limieten.projectleider + '" aria-label="Limiet projectleider">' +
    '<button class="knop stil" data-limiet="projectleider"' + (landelijk ? '' : ' disabled') + '>Projectleider</button>' +
    '<input class="veld" id="lStad" type="number" min="0" step="0.01" value="' + STAD.limieten.stadsbestuur + '" aria-label="Limiet stadsbestuur">' +
    '<button class="knop stil" data-limiet="stadsbestuur"' + (landelijk ? '' : ' disabled') + '>Stadsbestuur</button></div>' +
    '<div class="uitleg">Een stad kan zijn limiet verlagen, nooit verhogen. Boven de hoogste trede beslist het landelijke bestuur.</div></div>' +
  '<div class="kaart"><div class="sec">Zetels</div>' +
    (STAD.zetels.length ? STAD.zetels.map(z => '<div class="lijnrij"><span class="naam">' + esc(z.naam) + '</span>' +
      '<span class="pil">' + esc(z.rol) + '</span><button class="knop stil" data-zetelweg="' + esc(z.id) + '">Intrekken</button></div>').join('')
      : '<div class="leeg">Nog geen zetels in deze stad.</div>') +
    '<div class="rij"><input class="veld" id="zKey" placeholder="Accountsleutel (user-123)" maxlength="80" aria-label="Sleutel">' +
    '<input class="veld" id="zNaam" placeholder="Naam" maxlength="60" aria-label="Naam">' +
    '<select class="veld" id="zRol" aria-label="Rol">' + (IK.rollen || []).map(r => '<option>' + esc(r) + '</option>').join('') + '</select>' +
    '<button class="knop" id="zZet">Toekennen</button></div>' +
    '<div class="uitleg">Een zetel hangt aan een echte inlog. De gedeelde kantoorcode krijgt er nooit een: een stad besturen en geld goedkeuren horen herleidbaar te zijn tot een mens.</div></div>' +
  (landelijk ? '<div class="kaart"><div class="sec">Auditspoor (landelijk)</div><div id="auditIn"><div class="leeg">Laden...</div></div></div>' : ''));

  $('#tabIn').querySelectorAll('[data-module]').forEach(b => b.addEventListener('click', () =>
    doe('stad/module', { id: STAD.id, vlag: b.dataset.module, aan: b.dataset.aan === '1' }, () => openStad(STAD.id))));
  $('#tabIn').querySelectorAll('[data-stadstatus]').forEach(b => b.addEventListener('click', () =>
    doe('stad/status', { id: STAD.id, status: b.dataset.stadstatus }, () => openStad(STAD.id))));
  $('#tabIn').querySelectorAll('[data-limiet]').forEach(b => b.addEventListener('click', () =>
    doe('stad/limiet', { id: STAD.id, rol: b.dataset.limiet, bedrag: (b.dataset.limiet === 'projectleider' ? $('#lProj') : $('#lStad')).value }, () => openStad(STAD.id))));
  $('#tabIn').querySelectorAll('[data-zetelweg]').forEach(b => b.addEventListener('click', () =>
    doe('zetel/weg', { id: b.dataset.zetelweg }, () => openStad(STAD.id))));
  $('#zZet').addEventListener('click', () =>
    doe('zetel', { stad: STAD.id, key: $('#zKey').value, naam: $('#zNaam').value, rol: $('#zRol').value }, () => openStad(STAD.id)));
  if (landelijk) {
    api('audit').then(r => {
      $('#auditIn').innerHTML = (r.regels.length
        ? r.regels.slice(0, 40).map(a => '<div class="lijnrij"><span class="naam">' + esc(a.wat) + ' &middot; ' + esc(a.doel) + '</span>' +
          '<span class="pil">' + esc(a.wie) + '</span><div class="sub">' + esc(a.extra) + ' &middot; ' + esc(a.at) + '</div></div>').join('')
        : '<div class="leeg">Nog niets geregistreerd.</div>') +
        (r.afgekapt ? '<div class="uitleg">' + r.afgekapt + ' oudere regels zijn uit het geheugen gelopen; dat aantal staat hier zodat &quot;er staat niets meer&quot; nooit leest als &quot;er is nooit iets geweest&quot;.</div>' : '');
    }).catch(e => { $('#auditIn').innerHTML = '<div class="leeg">' + esc(e.message) + '</div>'; });
  }
}

/* ---------- starten ---------- */
$('#nsMaak').addEventListener('click', () => doe('stad/maak', { naam: $('#nsNaam').value, land: $('#nsLand').value }, () => {
  $('#nsNaam').value = '';
  tekenSteden();
}));

if (TOKEN) {
  laad().catch(e => { $('#ik').innerHTML = '<div class="melder fout">' + esc(e.message) + '</div>'; });
}
