<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTFoundation · De Speelhal</title>
<meta name="theme-color" content="#14283C">
<link rel="manifest" href="/manifests/foundation.webmanifest">
<link rel="apple-touch-icon" href="/icons/foundation.svg">
<link rel="icon" href="/icons/foundation.svg" type="image/svg+xml">
<link rel="stylesheet" href="stijl.css">
<script src="palet.js"></script>
<style>
  /* de speelhal voor 6 t/m 12: vrolijk, maar met echte uitdaging */
  :root{--h-geel:#F6C445;--h-koraal:#F0715C;--h-zee:#3FB8AF;--h-lila:#9C7BD8;--h-gras:#7DC95E;--h-blauw:#5AA7E8;--h-nacht:#14283C;}
  html,body{height:100%;}
  body{overflow:hidden;background:var(--h-nacht);}
  #doek{position:fixed;inset:0;display:block;touch-action:none;cursor:pointer;}
  .bovenrij{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;}
  .terugknop{background:rgba(20,40,60,.85);border:2px solid var(--h-geel);color:#FFF;border-radius:999px;
    padding:.55rem 1.1rem;font:inherit;font-size:1rem;font-weight:700;cursor:pointer;}
  .opdracht{flex:1;text-align:center;color:#FFF;font-size:1.2rem;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.5);min-height:1.6rem;}
  .menu{position:fixed;inset:0;z-index:10;background:linear-gradient(180deg,#1C3C58,#14283C);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.8rem;padding:1.2rem;overflow-y:auto;}
  .menu::before{content:'';flex:1 0 .2rem;}
  .menu::after{content:'';flex:1 0 .2rem;}
  .menu.weg{display:none;}
  .menu h1{font-family:var(--serif);font-weight:500;color:#FFF;font-size:2rem;margin:0 0 .2rem;}
  .menu .sub{color:#BFD4EA;margin-bottom:.8rem;text-align:center;}
  .spelkaartje{width:min(26rem,92vw);border:0;border-radius:22px;padding:1.1rem 1.3rem;cursor:pointer;
    display:flex;align-items:center;gap:1rem;font:inherit;text-align:left;color:#14283C;}
  .spelkaartje b{font-size:1.3rem;display:block;}
  .spelkaartje span{font-size:.92rem;opacity:.85;}
  .spelkaartje svg{width:3.2rem;height:3.2rem;flex:0 0 auto;}
  .h1k{background:var(--h-geel);}
  .h2k{background:var(--h-zee);color:#0E2A28;}
  .h3k{background:var(--h-koraal);color:#3A0F08;}
  .h4k{background:var(--h-blauw);color:#0C2440;}
  .menu .naarhuis{background:transparent;border:2px solid #BFD4EA;color:#BFD4EA;border-radius:999px;
    padding:.55rem 1.3rem;font:inherit;font-size:.95rem;cursor:pointer;margin-top:.6rem;}
</style>
<link href="/shared/rtg-uniform.css" rel="stylesheet">
</head>
<body>
<canvas id="doek" aria-label="Het speelveld"></canvas>

<div class="bovenrij" hidden id="bovenrij">
  <button class="terugknop" id="terugMenu" type="button">← Klaar</button>
  <div class="opdracht" id="opdracht" aria-live="polite"></div>
</div>

<div class="menu" id="menu" role="main">
  <h1>De Speelhal</h1>
  <div class="sub">Vier spellen die steeds een beetje moeilijker durven. Voor wie de Speeltuin al te klein is.</div>
  <button class="spelkaartje h1k" data-spel="sommen" type="button">
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="16" cy="30" r="10" fill="#F0715C"/><circle cx="33" cy="17" r="8" fill="#3FB8AF"/><path d="M12 30h8M16 26v8" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/></svg>
    <span><b>Flitssommen</b><span>Tik de ballon met het goede antwoord</span></span>
  </button>
  <button class="spelkaartje h2k" data-spel="echo" type="button">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="6" width="17" height="17" rx="4" fill="#F6C445"/><rect x="25" y="6" width="17" height="17" rx="4" fill="#F0715C"/><rect x="6" y="25" width="17" height="17" rx="4" fill="#7DC95E"/><rect x="25" y="25" width="17" height="17" rx="4" fill="#9C7BD8"/></svg>
    <span><b>Kleurenecho</b><span>Kijk, luister en doe de reeks na</span></span>
  </button>
  <button class="spelkaartje h3k" data-spel="letters" type="button">
    <svg viewBox="0 0 48 48" aria-hidden="true"><text x="7" y="30" font-size="22" font-weight="700" fill="#14283C" font-family="sans-serif">A</text><text x="22" y="22" font-size="16" font-weight="700" fill="#3FB8AF" font-family="sans-serif">B</text><text x="31" y="38" font-size="19" font-weight="700" fill="#F6C445" font-family="sans-serif">C</text></svg>
    <span><b>Letterjacht</b><span>Vang de letters van het woord, op volgorde</span></span>
  </button>
  <button class="spelkaartje h4k" data-spel="sterren" type="button">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6l5 11 12 1-9 8 3 12-11-7-11 7 3-12-9-8 12-1z" fill="#F6C445"/><ellipse cx="36" cy="38" rx="8" ry="4.5" fill="#C9D2E0"/></svg>
    <span><b>Sterrenvanger</b><span>Vang de sterren, laat de wolken met rust</span></span>
  </button>
  <button class="naarhuis" id="naarhuis" type="button">Terug naar de app</button>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const doek = $('#doek'), ctx = doek.getContext('2d');
  let W = 0, H = 0, DPR = 1, SPEL = null;
  const KLEUREN = ['#F6C445', '#F0715C', '#3FB8AF', '#9C7BD8', '#7DC95E'];
  const LET = 'system-ui, sans-serif';
  function maat() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    doek.width = W * DPR; doek.height = H * DPR;
    doek.style.width = W + 'px'; doek.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', maat);
  const FEEST = [];
  function feest(x, y, n) {
    for (let i = 0; i < n; i++) FEEST.push({ x, y, vx: (Math.random() - 0.5) * 5,
      vy: -2 - Math.random() * 3.5, k: KLEUREN[i % KLEUREN.length], r: 3 + Math.random() * 4, t: 1 });
  }
  function tekenFeest() {
    for (let i = FEEST.length - 1; i >= 0; i--) {
      const f = FEEST[i];
      f.x += f.vx; f.y += f.vy; f.vy += 0.12; f.t -= 0.013;
      if (f.t <= 0) { FEEST.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, f.t); ctx.fillStyle = f.k;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function lucht(boven, onder) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, boven); g.addColorStop(1, onder);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  let AUDIO = null;
  function toon(f, duur) {
    try {
      if (!AUDIO) AUDIO = new (window.AudioContext || window.webkitAudioContext)();
      const o = AUDIO.createOscillator(), g = AUDIO.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.2, AUDIO.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, AUDIO.currentTime + (duur || 0.45));
      o.connect(g); g.connect(AUDIO.destination);
      o.start(); o.stop(AUDIO.currentTime + (duur || 0.45) + 0.05);
    } catch (e) {}
  }

  /* ---------- spel 1: flitssommen ---------- */
  const SOM = { a: 0, b: 0, teken: '+', uitkomst: 0, ballen: [], goed: 0 };
  function somNieuw() {
    const n = SOM.goed;
    if (n < 5) { SOM.a = 1 + Math.floor(Math.random() * 9); SOM.b = 1 + Math.floor(Math.random() * (10 - SOM.a)); SOM.teken = '+'; }
    else if (n < 10) {
      if (Math.random() < 0.5) { SOM.a = 5 + Math.floor(Math.random() * 15); SOM.b = 1 + Math.floor(Math.random() * Math.min(SOM.a, 10)); SOM.teken = '-'; }
      else { SOM.a = 5 + Math.floor(Math.random() * 10); SOM.b = 1 + Math.floor(Math.random() * 10); SOM.teken = '+'; }
    } else { SOM.a = [2, 3, 4, 5, 10][Math.floor(Math.random() * 5)]; SOM.b = 1 + Math.floor(Math.random() * 10); SOM.teken = 'x'; }
    SOM.uitkomst = SOM.teken === '+' ? SOM.a + SOM.b : SOM.teken === '-' ? SOM.a - SOM.b : SOM.a * SOM.b;
    const set = new Set([SOM.uitkomst]);
    while (set.size < 3) set.add(Math.max(0, SOM.uitkomst + Math.floor(Math.random() * 9) - 4));
    const antwoorden = [...set].sort(() => Math.random() - 0.5);
    SOM.ballen = antwoorden.map((v, i) => ({ v, x: W * (0.2 + i * 0.3), y: H * 0.62, w: Math.random() * 6, mis: 0 }));
    $('#opdracht').textContent = SOM.goed + ' goed';
  }
  function somLus() {
    lucht('#1C3C58', '#14283C');
    ctx.textAlign = 'center'; ctx.fillStyle = '#FFF';
    ctx.font = '700 64px ' + LET;
    ctx.fillText(SOM.a + ' ' + SOM.teken + ' ' + SOM.b, W / 2, H * 0.3);
    ctx.font = '600 15px ' + LET; ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('tik de ballon met het antwoord', W / 2, H * 0.36);
    for (const b of SOM.ballen) {
      b.w += 0.03;
      const x = b.x + (b.mis > 0 ? Math.sin(b.mis * 40) * 6 : 0), y = b.y + Math.sin(b.w) * 10;
      if (b.mis > 0) b.mis -= 0.05;
      ctx.fillStyle = KLEUREN[SOM.ballen.indexOf(b) % KLEUREN.length];
      ctx.beginPath(); ctx.arc(x, y, 46, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#14283C'; ctx.font = '700 30px ' + LET;
      ctx.fillText(String(b.v), x, y + 10);
    }
    tekenFeest();
  }
  function somTik(x, y) {
    for (const b of SOM.ballen) {
      if (Math.hypot(x - b.x, y - (b.y + Math.sin(b.w) * 10)) < 56) {
        if (b.v === SOM.uitkomst) { SOM.goed++; feest(b.x, b.y, 24); toon(784, 0.3); setTimeout(somNieuw, 500); }
        else { b.mis = 1; toon(196, 0.3); }
        return;
      }
    }
  }

  /* ---------- spel 2: kleurenecho ---------- */
  const ECHO = { reeks: [], stap: 0, fase: 'kijk', t0: 0, lengte: 2, licht: -1 };
  const ECHOKLEUR = ['#F6C445', '#F0715C', '#7DC95E', '#9C7BD8'];
  const ECHOTOON = [329.63, 392, 523.25, 659.25];
  function echoNieuw(lengte) {
    ECHO.lengte = lengte; ECHO.reeks = [];
    for (let i = 0; i < lengte; i++) ECHO.reeks.push(Math.floor(Math.random() * 4));
    ECHO.fase = 'kijk'; ECHO.stap = 0; ECHO.t0 = performance.now() + 700; ECHO.licht = -1;
    $('#opdracht').textContent = 'Kijk en luister... (' + lengte + ' kleuren)';
  }
  function echoVak(i) {
    const bh = (H - 70) / 2;
    return [i % 2 ? W / 2 + 5 : 10, 70 + (i > 1 ? bh + 5 : 0), W / 2 - 15, bh - 10];
  }
  function echoLus() {
    lucht('#1A2E28', '#101C18');
    const nu = performance.now();
    if (ECHO.fase === 'kijk') {
      const idx = Math.floor((nu - ECHO.t0) / 650);
      ECHO.licht = (nu - ECHO.t0) % 650 < 420 ? idx : -1;
      if (idx >= 0 && idx < ECHO.reeks.length && ECHO.licht === idx && !ECHO.reeks['t' + idx]) {
        ECHO.reeks['t' + idx] = 1; toon(ECHOTOON[ECHO.reeks[idx]], 0.35);
      }
      if (idx >= ECHO.reeks.length) { ECHO.fase = 'doe'; ECHO.stap = 0; ECHO.licht = -1; $('#opdracht').textContent = 'Nu jij!'; }
    }
    for (let i = 0; i < 4; i++) {
      const [x, y, b, h] = echoVak(i);
      const aan = ECHO.fase === 'kijk' && ECHO.licht >= 0 && ECHO.licht < ECHO.reeks.length && ECHO.reeks[ECHO.licht] === i;
      ctx.globalAlpha = aan || ECHO.fase === 'doe' ? 1 : 0.45;
      ctx.fillStyle = ECHOKLEUR[i];
      ctx.beginPath(); ctx.roundRect(x, y, b, h, 22); ctx.fill();
      ctx.globalAlpha = 1;
    }
    tekenFeest();
  }
  function echoTik(x, y) {
    if (ECHO.fase !== 'doe') return;
    for (let i = 0; i < 4; i++) {
      const [vx, vy, b, h] = echoVak(i);
      if (x >= vx && x <= vx + b && y >= vy && y <= vy + h) {
        toon(ECHOTOON[i], 0.3);
        if (i === ECHO.reeks[ECHO.stap]) {
          ECHO.stap++; feest(x, y, 6);
          if (ECHO.stap >= ECHO.reeks.length) { feest(W / 2, H / 2, 40); setTimeout(() => echoNieuw(ECHO.lengte + 1), 800); $('#opdracht').textContent = 'Goed zo! De reeks wordt langer...'; ECHO.fase = 'wacht'; }
        } else {
          $('#opdracht').textContent = 'Bijna! De reeks was ' + ECHO.reeks.length + ' lang. Nog een keer.';
          ECHO.fase = 'wacht'; setTimeout(() => echoNieuw(2), 1400);
        }
        return;
      }
    }
  }

  /* ---------- spel 3: letterjacht ---------- */
  const WOORDEN = ['ZON', 'STER', 'MAAN', 'RAKET', 'TIJGER', 'APPEL', 'FEEST', 'DRAAK', 'PIRAAT', 'WOLK'];
  const JACHT = { woord: '', plek: 0, letters: [], af: 0 };
  function jachtNieuw() {
    JACHT.woord = WOORDEN[Math.floor(Math.random() * WOORDEN.length)];
    JACHT.plek = 0; JACHT.letters = []; JACHT.af = 0;
    const alfabet = 'ABCDEFGHIJKLMNOPRSTUVWZ';
    const chars = JACHT.woord.split('');
    for (let i = 0; i < 6; i++) chars.push(alfabet[Math.floor(Math.random() * alfabet.length)]);
    chars.sort(() => Math.random() - 0.5).forEach((c, i) => {
      JACHT.letters.push({ c, x: 40 + Math.random() * (W - 80), y: H * 0.28 + Math.random() * H * 0.55,
        k: KLEUREN[i % KLEUREN.length], w: Math.random() * 6, vx: (Math.random() - 0.5) * 0.6, mis: 0 });
    });
    $('#opdracht').textContent = 'Vang het woord';
  }
  function jachtLus() {
    lucht('#3A2438', '#1E1220');
    // het woord bovenin: gevangen letters vol, de rest als streepjes
    ctx.textAlign = 'center'; ctx.font = '700 44px ' + LET;
    const bx = W / 2 - (JACHT.woord.length - 1) * 24;
    JACHT.woord.split('').forEach((c, i) => {
      ctx.fillStyle = i < JACHT.plek ? '#F6C445' : 'rgba(255,255,255,0.35)';
      ctx.fillText(i < JACHT.plek ? c : '_', bx + i * 48, H * 0.18);
    });
    for (const l of JACHT.letters) {
      l.w += 0.02; l.x += l.vx;
      if (l.x < 30 || l.x > W - 30) l.vx = -l.vx;
      const x = l.x + (l.mis > 0 ? Math.sin(l.mis * 40) * 6 : 0), y = l.y + Math.sin(l.w) * 12;
      if (l.mis > 0) l.mis -= 0.05;
      ctx.fillStyle = l.k;
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#14283C'; ctx.font = '700 26px ' + LET;
      ctx.fillText(l.c, x, y + 9);
    }
    if (JACHT.af > 0) {
      JACHT.af -= 0.012;
      ctx.fillStyle = '#F6C445'; ctx.font = '700 52px ' + LET;
      ctx.globalAlpha = Math.min(1, JACHT.af);
      ctx.fillText(JACHT.woord + '!', W / 2, H * 0.5);
      ctx.globalAlpha = 1;
    }
    tekenFeest();
  }
  function jachtTik(x, y) {
    if (JACHT.af > 0) return;
    for (const l of JACHT.letters) {
      if (Math.hypot(x - l.x, y - (l.y + Math.sin(l.w) * 12)) < 38) {
        if (l.c === JACHT.woord[JACHT.plek]) {
          JACHT.letters.splice(JACHT.letters.indexOf(l), 1);
          JACHT.plek++; feest(l.x, l.y, 12); toon(659, 0.25);
          if (JACHT.plek >= JACHT.woord.length) { JACHT.af = 2; feest(W / 2, H * 0.4, 50); setTimeout(jachtNieuw, 1800); }
        } else { l.mis = 1; toon(196, 0.25); }
        return;
      }
    }
  }

  /* ---------- spel 4: sterrenvanger ---------- */
  const VANG = { dingen: [], sterren: 0, wieb: 0, hoera: 0 };
  function vangLus() {
    lucht('#101A33', '#080D1C');
    if (Math.random() < 0.035 && VANG.dingen.length < 9)
      VANG.dingen.push({ ster: Math.random() < 0.62, x: 40 + Math.random() * (W - 80), y: -40,
        v: 1.1 + Math.random() * 1.4, w: Math.random() * 6 });
    const schud = VANG.wieb > 0 ? Math.sin(VANG.wieb * 40) * 7 : 0;
    if (VANG.wieb > 0) VANG.wieb -= 0.04;
    for (let i = VANG.dingen.length - 1; i >= 0; i--) {
      const d = VANG.dingen[i];
      d.y += d.v; d.w += 0.05;
      if (d.y > H + 50) { VANG.dingen.splice(i, 1); continue; }
      const x = d.x + schud;
      if (d.ster) {
        ctx.fillStyle = '#F6C445';
        ctx.beginPath();
        for (let k = 0; k < 10; k++) {
          const rr = k % 2 ? 12 : 26, a = -Math.PI / 2 + k * Math.PI / 5 + d.w * 0.3;
          ctx[k ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, d.y + Math.sin(a) * rr);
        }
        ctx.closePath(); ctx.fill();
      } else {
        ctx.fillStyle = '#8A96AC';
        ctx.beginPath(); ctx.ellipse(x, d.y, 30, 17, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x - 16, d.y + 5, 18, 12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 16, d.y + 5, 18, 12, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (VANG.hoera > 0) {
      VANG.hoera -= 0.012;
      ctx.globalAlpha = Math.min(1, VANG.hoera);
      ctx.fillStyle = '#F6C445'; ctx.font = '700 54px ' + LET; ctx.textAlign = 'center';
      ctx.fillText('Vijftien sterren!', W / 2, H * 0.4);
      ctx.globalAlpha = 1;
    }
    tekenFeest();
  }
  function vangTik(x, y) {
    for (let i = VANG.dingen.length - 1; i >= 0; i--) {
      const d = VANG.dingen[i];
      if (Math.hypot(x - d.x, y - d.y) < 40) {
        if (d.ster) {
          VANG.dingen.splice(i, 1); VANG.sterren++; feest(d.x, d.y, 14); toon(880, 0.25);
          if (VANG.sterren % 15 === 0) { VANG.hoera = 2; feest(W / 2, H * 0.42, 60); }
          $('#opdracht').textContent = VANG.sterren + ' sterren';
        } else { VANG.wieb = 1; toon(147, 0.3); } // een wolk laat je schrikken, meer niet
        return;
      }
    }
  }

  /* ---------- de lus en de bediening ---------- */
  function lus() {
    requestAnimationFrame(lus);
    if (SPEL === 'sommen') somLus();
    else if (SPEL === 'echo') echoLus();
    else if (SPEL === 'letters') jachtLus();
    else if (SPEL === 'sterren') vangLus();
  }
  requestAnimationFrame(lus);
  function start(spel) {
    SPEL = spel; maat();
    $('#menu').classList.add('weg');
    $('#bovenrij').hidden = false;
    if (spel === 'sommen') { SOM.goed = 0; somNieuw(); }
    if (spel === 'echo') echoNieuw(2);
    if (spel === 'letters') jachtNieuw();
    if (spel === 'sterren') { VANG.dingen = []; VANG.sterren = 0; $('#opdracht').textContent = 'Vang de sterren'; }
  }
  document.querySelectorAll('[data-spel]').forEach(b => b.addEventListener('click', () => start(b.dataset.spel)));
  $('#terugMenu').addEventListener('click', () => { SPEL = null; $('#menu').classList.remove('weg'); $('#bovenrij').hidden = true; });
  $('#naarhuis').addEventListener('click', () => { location.href = 'index.html'; });
  doek.addEventListener('pointerdown', ev => {
    if (SPEL === 'sommen') somTik(ev.clientX, ev.clientY);
    if (SPEL === 'echo') echoTik(ev.clientX, ev.clientY);
    if (SPEL === 'letters') jachtTik(ev.clientX, ev.clientY);
    if (SPEL === 'sterren') vangTik(ev.clientX, ev.clientY);
  });
  maat();
})();
</script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/levendekleur.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
</body>
</html>
