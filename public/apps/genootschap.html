<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --card2:var(--rtg-card2); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft); --burgundy:#C23A5E; --gold:#A98F1C; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;padding-bottom:6rem;}
  h1,h2,h3{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 86%,transparent));backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 1rem) 1.1rem .7rem;border-bottom:1px solid var(--line);}
  header .ey{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--rtg-leesgoud,var(--gold));}
  header h1{font-size:1.35rem;}
  input,textarea,select,button{font:inherit;}
  input,textarea,select{background:var(--card);border:1px solid var(--line);border-radius:0;color:var(--txt);font-size:.85rem;padding:.5rem .7rem;width:100%;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .skip{position:absolute;left:.6rem;top:-3rem;z-index:120;background:var(--gold);color:#0C0C0B;padding:.45rem .9rem;border-radius:0;text-decoration:none;font-size:.8rem;}
  .skip:focus{top:0;}
  label{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:.7rem 0 .25rem;}
  /* De tabs in de kop (Mijn genootschappen / Mijn agenda / Zoeken / Oprichten)
     zijn de eigen schakelaar van deze app: een scherm tegelijk, precies wat het
     deelmenu elders doet. Ze horen in de kop te blijven, want main wordt bij elke
     handeling opnieuw getekend. Alleen de vorm gaat mee met het huis: een rustige
     balk met kleine kapitalen en een gouden streep onder het deel waar je staat.
     De balk zakt met een negatieve ondermarge precies op de onderrand van de kop,
     zodat er EEN lijn staat en niet twee. De selector moet dieper dan
     `.tabs button`: de kit tekent die rij al met `body.rtg-stijl .tabs > button`. */
  body.rtg-stijl .tabs{display:flex;flex-wrap:wrap;gap:.15rem;margin:.7rem 0 -.7rem;padding:0;
    overflow:visible;border-bottom:1px solid var(--line);}
  body.rtg-stijl .tabs > button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
    border-radius:0;cursor:pointer;padding:.5rem .7rem .55rem;
    font-family:'Inter',system-ui,sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap;}
  body.rtg-stijl .tabs > button:hover{color:var(--txt);border-bottom-color:transparent;}
  body.rtg-stijl .tabs > button[aria-pressed="true"]{color:var(--txt);border-bottom-color:var(--gold);}
  main{padding:1.1rem;max-width:660px;margin:0 auto;}
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:0;padding:.9rem 1rem;margin-bottom:.8rem;}
  .kaart h2{font-size:1rem;margin-bottom:.4rem;}
  .knoppen{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem;}
  .knop{background:var(--burgundy);border:1px solid var(--burgundy);color:#fff;border-radius:0;padding:.4rem 1rem;font-size:.8rem;cursor:pointer;}
  .knop.stil{background:none;border-color:var(--line);color:var(--muted);}
  .mini{background:none;border:none;color:var(--rtg-leesgoud,var(--gold));font-size:.75rem;cursor:pointer;padding:0;text-decoration:underline;}
  .rij{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line);}
  .rij:last-child{border-bottom:0;}
  .rij .tx{flex:1;min-width:0;}
  .rij b{font-weight:600;font-size:.9rem;}
  .rij small{display:block;color:var(--soft);font-size:.75rem;margin-top:.1rem;line-height:1.45;}
  .merk{display:inline-block;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--soft);border-radius:0;padding:.05rem .45rem;margin-left:.35rem;}
  .merk.op{border-color:var(--gold);color:var(--rtg-leesgoud,var(--gold));}
  .staaf{height:6px;border-radius:0;background:var(--card2);overflow:hidden;margin-top:.25rem;}
  .staaf i{display:block;height:100%;background:var(--burgundy);}
  .leeg{color:var(--soft);font-size:.85rem;padding:.6rem 0;}
  .uit{background:var(--card2);border:1px solid var(--line);border-radius:0;padding:.6rem .8rem;margin-top:.6rem;font-size:.85rem;line-height:1.5;white-space:pre-wrap;}
  .beheer-uitleg{color:var(--soft);font-size:.78rem;line-height:1.5;}
  .beheer-nodig{display:flex;gap:.45rem;}
  .beheer-leden{margin-top:.7rem;}
  .aibalk{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(0deg,var(--bg) 60%,color-mix(in srgb,var(--bg) 70%,transparent));border-top:1px solid var(--line);padding:.6rem 1.1rem calc(env(safe-area-inset-bottom) + .6rem);}
  .aibalk form{display:flex;gap:.5rem;max-width:660px;margin:0 auto;}
</style>

<body class="rtg-stijl">
<a href="#main" class="skip">Naar de inhoud</a>
<header>
  <div class="ey">Van RTG</div>
  <h1>Genootschap</h1>
  <div class="tabs" id="tabs" role="group" aria-label="Onderdelen"></div>
</header>
<main id="main"><div class="leeg">Laden…</div></main>
<div class="aibalk" id="aibalk" hidden>
  <div class="uit" id="aiuit" hidden aria-live="polite"></div>
  <form id="aiform" class="rtg-duimeind">
    <input id="aiin" placeholder="Zeg wat er moet gebeuren" aria-label="Zeg Rahul wat er moet gebeuren" autocomplete="off">
    <button class="knop hoofd" type="submit" data-hoofdactie>Vraag</button>
  </form>
</div>
<script src="/shared/basis.js"></script>
<script src="/shared/uitvoer.js"></script>
<script src="/shared/aibalk.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/volscherm.js" defer></script>
<script>
(function(){
  var TOKEN = localStorage.getItem('rtg_member_token') || '';
  var TAB = 'mijn', OPEN = null;
  var TABS = [['mijn','Mijn genootschappen'],['agenda','Mijn agenda'],['zoek','Zoeken'],['nieuw','Oprichten']];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function $(s){ return document.querySelector(s); }
  function api(pad, body){
    return fetch('/api'+pad, { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+TOKEN },
      body: JSON.stringify(body||{}) }).then(function(r){ return r.json().then(function(d){ d.__status=r.status; return d; }); });
  }
  function toon(html){ $('#main').innerHTML = html; }
  function melding(t){ var u=$('#aiuit'); u.hidden=false; u.textContent=t; }
  function tekenTabs(){
    $('#tabs').innerHTML = TABS.map(function(t){
      return '<button type="button" data-t="'+t[0]+'" aria-pressed="'+(TAB===t[0]?'true':'false')+'">'+esc(t[1])+'</button>';
    }).join('');
  }
  var SOORT = { openbaar:'Openbaar', besloten:'Besloten', geheim:'Geheim' };

  function groepRij(g, knop){
    return '<div class="rij"><div class="tx"><b>'+esc(g.naam)+'</b>'+
      '<span class="merk'+(g.soort==='geheim'?' op':'')+'">'+esc(SOORT[g.soort]||g.soort)+'</span>'+
      (g.mijnRol==='beheerder'?'<span class="merk op">Beheerder</span>':'')+
      '<small>'+esc(g.over||'geen omschrijving')+' · '+g.leden+' leden</small></div>'+
      (knop||'')+'</div>';
  }

  function tekenMijn(d){
    var html = '';
    if ((d.uitnodigingen||[]).length) {
      html += '<div class="kaart"><h2>Uitnodigingen</h2>'+
        d.uitnodigingen.map(function(g){ return groepRij(g, '<button class="mini" data-binnen="'+g.id+'">binnentreden</button>'); }).join('')+
        '<p style="color:var(--soft);font-size:.78rem;margin-top:0.5rem;">Een uitnodiging is nog geen lidmaatschap: je zegt zelf ja.</p></div>';
    }
    html += '<div class="kaart"><h2>Mijn genootschappen</h2>'+
      ((d.groepen||[]).length ? d.groepen.map(function(g){ return groepRij(g, '<button class="mini" data-open="'+g.id+'">openen</button>'); }).join('')
        : '<div class="leeg">Je zit nog nergens in. Richt er een op, of zoek een openbaar genootschap.</div>')+'</div>';
    toon(html);
  }

  function tekenGroep(d, agenda){
    var g = d.groep, b = d.berichten||[];
    var html = '<div class="kaart"><h2>'+esc(g.naam)+'</h2>'+
      '<small style="color:var(--soft);">'+esc(SOORT[g.soort]||g.soort)+' · '+g.leden+' leden'+(g.mijnRol?' · jij bent '+esc(g.mijnRol):'')+'</small>'+
      (g.over?'<p style="margin-top:0.5rem;font-size:.88rem;line-height:1.55;color:var(--muted);">'+esc(g.over)+'</p>':'')+
      (g.regels?'<p style="margin-top:0.5rem;font-size:.82rem;line-height:1.5;color:var(--soft);"><b>Huisregels:</b> '+esc(g.regels)+'</p>':'')+
      '<div class="knoppen"><button class="knop stil" id="bterug" type="button">Terug</button>'+
      '<button class="knop stil" id="bleden" type="button">Leden</button>'+
      '<button class="knop stil" id="bmee" type="button">Neem mijn inbreng mee</button>'+
      (g.mijnRol==='beheerder'?'<button class="knop stil" id="bgezond" type="button">Hoe staat het ervoor</button>'+
        '<button class="knop stil" id="balles" type="button">Neem alles mee</button>':'')+
      '<button class="knop stil" id="bvertrek" type="button">Vertrekken</button></div>'+
      '<div class="uit" id="ugezond" hidden></div></div><div class="kaart" id="kbeheer" hidden></div>';

    /* Wat heb je gemist? Met een bodem: staat er niets, dan zegt de app dat, in
       plaats van iets te verzinnen om je bezig te houden. */
    html += '<div class="kaart" id="kbij"><h2>Sinds je laatste bezoek</h2>'+
      '<div class="leeg" id="ubij">Kijken…</div></div>';

    html += '<div class="kaart"><h2>Bijeenkomsten</h2>'+
      ((agenda.komt||[]).length ? agenda.komt.map(function(x){
        return '<div class="rij"><div class="tx"><b>'+esc(x.wat)+'</b>'+(x.vol?'<span class="merk">Vol</span>':'')+
          '<small>'+esc(x.datum)+(x.tijd?' om '+esc(x.tijd):'')+(x.waar?' · '+esc(x.waar):'')+
          ' · gastheer '+esc(x.gastheer)+'<br>ja '+x.ja+' · misschien '+x.misschien+' · nee '+x.nee+
          (x.plaatsen?' · '+x.plaatsen+' plaatsen':'')+'</small>'+
          '<div class="knoppen">'+['ja','misschien','nee'].map(function(w){
            return '<button class="knop'+(x.mijnAntwoord===w?'':' stil')+'" data-antw="'+x.id+'" data-w="'+w+'">'+w+'</button>';
          }).join('')+
          (x.vanMij?'<button class="mini" data-afgelast="'+x.id+'" style="margin-left:0.5rem;">afgelasten</button>':'')+
          '</div></div></div>';
      }).join('') : '<div class="leeg">Nog niets gepland.</div>')+
      '<label for="bwat">Roep een bijeenkomst uit</label><input id="bwat" maxlength="90" placeholder="Waarvoor komen jullie samen?">'+
      '<div style="display:flex;gap:.4rem;margin-top:0.5rem;"><input id="bdatum" type="date" aria-label="Datum"><input id="btijd" type="time" aria-label="Tijd"></div>'+
      '<input class="h-mt40" id="bwaar" maxlength="120" placeholder="Waar?">'+
      '<input class="h-mt40" id="bplaatsen" inputmode="numeric" placeholder="Aantal plaatsen (mag leeg)" aria-label="Aantal plaatsen">'+
      '<div class="knoppen"><button class="knop" id="broep" type="button">Uitnodigen</button>'+
      '<button class="knop stil" id="bdatumai" type="button">Welke dag past de meesten?</button></div>'+
      '<div class="uit" id="udatum" hidden></div></div>';

    html += '<div class="kaart"><h2>Prikbord</h2>'+
      '<label for="ptekst">Wat wil je melden?</label><textarea id="ptekst" rows="3" maxlength="800"></textarea>'+
      '<label for="pkeuzes">Peiling (keuzes met komma\'s, mag leeg)</label><input id="pkeuzes" placeholder="Vrijdag, Zaterdag">'+
      '<div class="knoppen"><button class="knop" id="bprik" type="button">Op het prikbord</button>'+
      '<button class="knop stil" id="baankondig" type="button">Rahul schrijft het</button>'+
      '<button class="knop stil" id="bsamen" type="button">Vat het prikbord samen</button></div>'+
      '<div class="uit" id="uprik" hidden></div>'+
      (b.length ? b.map(function(x){
        return '<div class="rij"><div class="tx"><b>'+esc(x.van)+'</b><small>'+esc(x.tekst)+'</small>'+
          (x.peiling ? '<div class="h-mt40">'+x.peiling.keuzes.map(function(k,i){
            var pct = x.peiling.totaal ? Math.round(k.aantal/x.peiling.totaal*100) : 0;
            return '<button class="mini" data-stem="'+x.id+'" data-k="'+i+'" style="display:block;text-align:left;">'+
              esc(k.naam)+' · '+k.aantal+(x.peiling.mijnStem===i?' (jouw stem)':'')+'</button>'+
              '<div class="staaf"><i style="width:'+pct+'%;"></i></div>';
          }).join('')+'<small class="h-mt30">'+x.peiling.totaal+' stemmen</small></div>' : '')+
          (x.reacties.length ? '<div class="h-mt40">'+x.reacties.map(function(r){
            return '<small><b>'+esc(r.van)+':</b> '+esc(r.tekst)+
              (r.vanMij||g.mijnRol==='beheerder'?' <button class="mini" data-reactie-weg="'+x.id+'" data-reactie-id="'+r.id+'">verwijder reactie</button>':'')+
              '</small>'; }).join('')+'</div>' : '')+
          '<div class="knoppen"><input data-reactie="'+x.id+'" placeholder="Reageren" aria-label="Reageren op dit bericht" style="max-width:60%;">'+
          '<button class="mini" data-reageer="'+x.id+'">plaatsen</button>'+
          (x.vanMij||g.mijnRol==='beheerder'?'<button class="mini" data-prikweg="'+x.id+'">weg</button>':'')+'</div></div></div>';
      }).join('') : '<div class="leeg">Het prikbord is nog leeg.</div>')+
      (d.meer ? '<button class="knop stil" id="bmeer" data-na="'+esc(d.volgende)+'" type="button">Meer laden</button>' : (b.length?'<div class="leeg">Je bent bij.</div>':''))+
      '</div>';
    toon(html);
    tekenBijgepraat(g.id);
  }

  /* De bestaande beheerroutes krijgen hier hun menselijke werkplek. De server
     blijft beslissen wat mag; het scherm toont alleen de codenamen en grenzen
     die `mijn` al teruggeeft. */
  function tekenLeden(g){
    var host = $('#kbeheer'); if (!host) return;
    var beheer = g.mijnRol === 'beheerder';
    var magNodigen = beheer || g.soort === 'openbaar';
    var nauwer = ['openbaar','besloten','geheim'].filter(function(s){
      return ['openbaar','besloten','geheim'].indexOf(s) >= ['openbaar','besloten','geheim'].indexOf(g.soort);
    });
    host.hidden = false;
    host.innerHTML = '<h2>Leden en toegang</h2><p class="beheer-uitleg">Codenamen beschermen de identiteit. Een uitnodiging wordt nooit automatisch lidmaatschap.</p>'+
      (beheer?'<div class="uit"><label for="gnaam">Genootschap beheren</label><input id="gnaam" maxlength="70" value="'+esc(g.naam)+'">'+
        '<label for="gsoort">Zichtbaarheid kan alleen strenger</label><select id="gsoort">'+nauwer.map(function(s){ return '<option value="'+s+'"'+(s===g.soort?' selected':'')+'>'+esc(SOORT[s])+'</option>'; }).join('')+'</select>'+
        '<label for="gover">Waarover</label><textarea id="gover" rows="2" maxlength="600">'+esc(g.over)+'</textarea>'+
        '<label for="gregels">Huisregels</label><textarea id="gregels" rows="2" maxlength="800">'+esc(g.regels)+'</textarea><div class="knoppen"><button class="knop" id="bgroepbewaar" type="button">Wijzigingen bewaren</button></div></div>':'')+
      (magNodigen?'<div class="uit"><label for="guitnodig">Uitnodigen op codenaam</label><div class="beheer-nodig"><input id="guitnodig" maxlength="80" placeholder="codenaam"><button class="knop" id="bnodig" type="button">Uitnodigen</button></div></div>':'')+
      '<div class="beheer-leden">'+(g.ledenlijst||[]).map(function(l){
        return '<div class="rij"><div class="tx"><b>'+esc(l.codenaam)+(l.ikZelf?' (jij)':'')+'</b><small>'+esc(l.rol)+' · sinds '+esc(String(l.sinds||'').slice(0,10))+'</small></div>'+
          (beheer&&!l.ikZelf?'<button class="mini" data-rol="'+esc(l.codenaam)+'" data-nieuwerol="'+(l.rol==='beheerder'?'lid':'beheerder')+'">'+(l.rol==='beheerder'?'maak lid':'maak beheerder')+'</button><button class="mini" data-eruit="'+esc(l.codenaam)+'">eruit</button>':'')+'</div>';
      }).join('')+'</div>';
  }

  /* Bijgepraat: een korte lijst met een einde. Geen teller die oploopt en geen
     melding die je terughaalt -- je ziet het als je er zelf bent. */
  function tekenBijgepraat(groep){
    api('/genootschap/bijgepraat', { groep:groep }).then(function(d){
      var u = $('#ubij'); if (!u) return;
      if (d.error) { u.textContent = d.error; return; }
      if (d.bij) { u.textContent = d.tekst; return; }
      u.className = '';
      u.innerHTML =
        ((d.nieuw||d.nieuweReacties) ? '<p style="font-size:.88rem;line-height:1.55;">'+
          (d.nieuw?d.nieuw+' nieuwe berichten':'')+(d.nieuw&&d.nieuweReacties?' · ':'')+
          (d.nieuweReacties?d.nieuweReacties+' nieuwe reacties':'')+'</p>' : '')+
        ((d.peilingen||[]).length ? '<p style="font-size:.84rem;color:var(--muted);margin-top:0.5rem;">Nog niet gestemd: '+
          d.peilingen.map(function(p){ return esc(p.tekst); }).join(' · ')+'</p>' : '')+
        ((d.bijeenkomsten||[]).length ? '<p style="font-size:.84rem;color:var(--muted);margin-top:0.5rem;">Nog niet beantwoord: '+
          d.bijeenkomsten.map(function(b){ return esc(b.wat)+' ('+esc(b.datum)+')'; }).join(' · ')+'</p>' : '')+
        '<div class="knoppen"><button class="knop stil" id="bgezien" type="button">Gezien</button></div>';
    });
  }

  // Een uitvoer op de schijf zetten. Zelfde patroon als elders in het huis.
  function bewaarUitvoer(d, naam){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' }));
    a.download = naam; a.click(); URL.revokeObjectURL(a.href);
  }

  function openGroep(id, na){
    OPEN = id;
    Promise.all([api('/genootschap/prikbord', { groep:id, na:na||null }), api('/genootschap/agenda', { groep:id })])
      .then(function(r){
        if (r[0].error) return melding(r[0].error);
        tekenGroep(r[0], r[1] || {});
      });
  }

  /* Meenemen (shared/uitvoer.js): deze app houdt twee registers vast die van het
     lid zelf zijn -- de genootschappen waar hij in zit, en de bijeenkomsten die
     eraan komen. Je neemt mee wat je voor je hebt: staat je in de agenda, dan is
     dat de agenda; anders de lijst genootschappen. De eigen knoppen "Neem mijn
     inbreng mee" en "Neem alles mee" blijven wat ze waren: die halen het hele
     prikbord bij de server op. */
  var MIJN = null, AGENDA = null;
  if (window.RTGUitvoer) RTGUitvoer.bron(function(){
    if (TAB === 'agenda' && AGENDA && (AGENDA.komt||[]).length) {
      return { naam:'bijeenkomsten', kolommen:['datum','tijd','wat','genootschap','waar','mijn antwoord'],
        rijen: AGENDA.komt.map(function(x){
          return [x.datum||'', x.tijd||'', x.wat||'', x.groep||'', x.waar||'', x.mijnAntwoord||'nog niets']; }) };
    }
    if (MIJN && (MIJN.groepen||[]).length) {
      return { naam:'genootschappen', kolommen:['naam','soort','mijn rol','leden','waarover'],
        rijen: MIJN.groepen.map(function(g){
          return [g.naam||'', SOORT[g.soort]||g.soort||'', g.mijnRol||'lid', g.leden, g.over||'']; }) };
    }
    return null;
  });

  function laad(){
    tekenTabs();
    if (TAB === 'mijn') { api('/genootschap/mijn').then(function(d){ if(d.error) return toon('<div class="leeg">'+esc(d.error)+'</div>'); MIJN = d; tekenMijn(d); }); return; }
    if (TAB === 'agenda') {
      api('/genootschap/mijn-agenda').then(function(d){
        AGENDA = d;
        toon('<div class="kaart"><h2>Wat er aankomt</h2>'+
          ((d.komt||[]).length ? d.komt.map(function(x){
            return '<div class="rij"><div class="tx"><b>'+esc(x.wat)+'</b><span class="merk">'+esc(x.groep)+'</span>'+
              '<small>'+esc(x.datum)+(x.tijd?' om '+esc(x.tijd):'')+(x.waar?' · '+esc(x.waar):'')+
              ' · jouw antwoord: '+esc(x.mijnAntwoord||'nog niets')+'</small></div>'+
              '<button class="mini" data-open="'+x.groepId+'">openen</button></div>';
          }).join('') : '<div class="leeg">Er staat niets in je agenda.</div>')+'</div>');
      });
      return;
    }
    if (TAB === 'zoek') {
      toon('<div class="kaart"><label for="zveld">Zoek een genootschap</label>'+
        '<input id="zveld" type="search" placeholder="Op naam of onderwerp">'+
        '<div class="knoppen"><button class="knop" id="bzoek" type="button">Zoeken</button></div>'+
        '<p style="color:var(--soft);font-size:.78rem;margin-top:0.5rem;">Geheime genootschappen staan hier niet in. Die vind je alleen met een uitnodiging.</p></div>'+
        '<div class="kaart" id="zuit"><div class="leeg">Zoek op een naam of een onderwerp.</div></div>');
      return;
    }
    toon('<div class="kaart"><h2>Een genootschap oprichten</h2>'+
      '<label for="nnaam">Naam</label><input id="nnaam" maxlength="70" placeholder="Het Zeilgezelschap">'+
      '<label for="nsoort">Wie mag erbij</label><select id="nsoort">'+
      '<option value="besloten">Besloten · te vinden, op uitnodiging</option>'+
      '<option value="openbaar">Openbaar · iedereen kan binnenlopen</option>'+
      '<option value="geheim">Geheim · staat in geen enkele lijst</option></select>'+
      '<label for="nover">Waar gaat het over</label><textarea id="nover" rows="3" maxlength="600"></textarea>'+
      '<label for="nregels">Huisregels (mag leeg)</label><textarea id="nregels" rows="2" maxlength="800"></textarea>'+
      '<div class="knoppen"><button class="knop" id="bnieuw" type="button">Oprichten</button></div></div>');
  }

  document.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-t]');
    if (t) { TAB = t.getAttribute('data-t'); OPEN = null; laad(); return; }
    var id = ev.target.id;

    if (id === 'bnieuw') return api('/genootschap/richt-op', { naam:$('#nnaam').value, soort:$('#nsoort').value,
      over:$('#nover').value, regels:$('#nregels').value }).then(function(d){
        melding(d.error||'Opgericht. Jij bent de beheerder.'); if(!d.error){ TAB='mijn'; laad(); } });
    if (id === 'bzoek') return api('/genootschap/zoek', { zoek:$('#zveld').value }).then(function(d){
      $('#zuit').innerHTML = (d.groepen||[]).length ? d.groepen.map(function(g){
        return groepRij(g, g.ikBenLid ? '<button class="mini" data-open="'+g.id+'">openen</button>'
          : (g.soort==='openbaar'||g.uitgenodigd ? '<button class="mini" data-binnen="'+g.id+'">binnentreden</button>'
            : '<small style="color:var(--soft);">op uitnodiging</small>'));
      }).join('') : '<div class="leeg">Niets gevonden.</div>'; });
    if (id === 'bterug') { TAB='mijn'; OPEN=null; return laad(); }
    if (id === 'bvertrek') return api('/genootschap/vertrek', { groep:OPEN }).then(function(d){
      melding(d.error||'Je bent vertrokken.'); if(!d.error){ TAB='mijn'; OPEN=null; laad(); } });
    if (id === 'bleden') return api('/genootschap/mijn').then(function(d){
      var g = (d.groepen||[]).filter(function(x){ return String(x.id)===String(OPEN); })[0];
      if (!g) return melding('Kon de ledenlijst niet laden.');
      tekenLeden(g);
    });
    if (id === 'bgroepbewaar') return api('/genootschap/pas-aan', { groep:OPEN, naam:$('#gnaam').value,
      soort:$('#gsoort').value, over:$('#gover').value, regels:$('#gregels').value }).then(function(d){
        melding(d.error||'Genootschap bijgewerkt.'); if(!d.error) openGroep(OPEN); });
    if (id === 'bnodig') return api('/genootschap/nodig-uit', { groep:OPEN, wie:$('#guitnodig').value }).then(function(d){
      melding(d.error||d.uitgenodigd+' is uitgenodigd en beslist zelf.');
      if(!d.error) api('/genootschap/mijn').then(function(m){ var g=(m.groepen||[]).find(function(x){return String(x.id)===String(OPEN);}); if(g) tekenLeden(g); });
    });
    if (id === 'bgezien') return api('/genootschap/gezien', { groep:OPEN })
      .then(function(d){ if(d.error) return melding(d.error); tekenBijgepraat(OPEN); });

    if (id === 'bgezond') return api('/genootschap/gezondheid', { groep:OPEN }).then(function(d){
      var u = $('#ugezond'); if (!u) return;
      if (d.error) { u.hidden=false; u.textContent = d.error; return; }
      u.hidden = false;
      u.innerHTML = '<b>'+d.actief.leden+' van de '+d.actief.vanTotaal+' leden waren actief in '+esc(d.actief.periode)+'</b><br>'+
        'Prikbord: '+d.prikbord.totaal+' berichten ('+d.prikbord.dezeMaand+' deze maand, '+d.prikbord.vorigeMaand+' de maand ervoor) · '+
        d.prikbord.reacties+' reacties · '+d.prikbord.peilingen+' peilingen met '+d.prikbord.stemmen+' stemmen<br>'+
        '<b>'+d.prikbord.zonderReactie+'</b> berichten bleven zonder reactie.<br>'+
        'Bijeenkomsten: '+d.bijeenkomsten.komend+' komend'+
        (d.bijeenkomsten.eerstvolgende ? ' · '+esc(d.bijeenkomsten.eerstvolgende.wat)+': '+
          d.bijeenkomsten.eerstvolgende.geantwoord+' van de '+d.bijeenkomsten.eerstvolgende.vanTotaal+' antwoordden' : '')+
        (d.ritme ? '<br>De meeste berichten komen op '+esc(d.ritme.drukste)+'.' : '')+
        '<br><small style="color:var(--soft);">'+esc(d.uitleg)+'</small>';
    });

    if (id === 'balles') return api('/genootschap/uitvoer', { groep:OPEN }).then(function(d){
      if (d.error) return melding(d.error);
      bewaarUitvoer(d, 'genootschap-' + String(d.genootschap.naam).toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json');
      melding('Meegegeven: het hele genootschap op codenaam, zonder echte namen en zonder sleutels.');
    });

    if (id === 'bmee') return api('/genootschap/mijn-uitvoer', { groep:OPEN }).then(function(d){
      if (d.error) return melding(d.error);
      bewaarUitvoer(d, 'mijn-inbreng-' + String(d.genootschap.naam).toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json');
      melding('Meegegeven: alleen wat jij zelf schreef, stemde of antwoordde.');
    });

    if (id === 'bprik') {
      var keuzes = $('#pkeuzes').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
      return api('/genootschap/prik', { groep:OPEN, tekst:$('#ptekst').value, keuzes:keuzes })
        .then(function(d){ melding(d.error||'Op het prikbord.'); if(!d.error) openGroep(OPEN); });
    }
    if (id === 'baankondig') return api('/genootschap/ai/aankondiging', { groep:OPEN, steekwoorden:$('#ptekst').value })
      .then(function(d){ var u=$('#uprik'); u.hidden=false; u.textContent = d.aankondiging || d.reden || 'Geen antwoord.';
        if (d.aankondiging) $('#ptekst').value = d.aankondiging; });
    if (id === 'bsamen') return api('/genootschap/ai/prikbord', { groep:OPEN })
      .then(function(d){ var u=$('#uprik'); u.hidden=false; u.textContent = d.samenvatting || d.reden || 'Geen antwoord.'; });
    if (id === 'bdatumai') return api('/genootschap/ai/datum', { groep:OPEN }).then(function(d){
      var u=$('#udatum'); u.hidden=false;
      u.textContent = d.tekst || (d.meting && d.meting.length ? 'De meeste ja-antwoorden staan op ' + d.beste + '.' : (d.reden||'Geen antwoord.')); });
    if (id === 'broep') return api('/genootschap/roep-bijeen', { groep:OPEN, wat:$('#bwat').value, datum:$('#bdatum').value,
      tijd:$('#btijd').value, waar:$('#bwaar').value, plaatsen:$('#bplaatsen').value })
      .then(function(d){ melding(d.error||'De leden hebben bericht.'); if(!d.error) openGroep(OPEN); });
    if (id === 'bmeer') return openGroep(OPEN, ev.target.getAttribute('data-na'));

    var o = ev.target.closest('[data-open]');
    if (o) { return openGroep(o.getAttribute('data-open')); }
    var bi = ev.target.closest('[data-binnen]');
    if (bi) return api('/genootschap/binnen', { groep:bi.getAttribute('data-binnen') })
      .then(function(d){ melding(d.error||'Welkom.'); if(!d.error){ TAB='mijn'; laad(); } });
    var aw = ev.target.closest('[data-antw]');
    if (aw) return api('/genootschap/antwoord', { groep:OPEN, id:aw.getAttribute('data-antw'), antwoord:aw.getAttribute('data-w') })
      .then(function(d){ if(d.error) return melding(d.error); openGroep(OPEN); });
    var af = ev.target.closest('[data-afgelast]');
    if (af) return api('/genootschap/afgelast', { groep:OPEN, id:af.getAttribute('data-afgelast') })
      .then(function(d){ melding(d.error||'Afgelast. De aanwezigen hebben bericht.'); openGroep(OPEN); });
    var st = ev.target.closest('[data-stem]');
    if (st) return api('/genootschap/stem', { groep:OPEN, id:st.getAttribute('data-stem'), keuze:Number(st.getAttribute('data-k')) })
      .then(function(d){ if(d.error) return melding(d.error); openGroep(OPEN); });
    var re = ev.target.closest('[data-reageer]');
    if (re) {
      var veld = document.querySelector('[data-reactie="'+re.getAttribute('data-reageer')+'"]');
      return api('/genootschap/reageer', { groep:OPEN, id:re.getAttribute('data-reageer'), tekst: veld ? veld.value : '' })
        .then(function(d){ if(d.error) return melding(d.error); openGroep(OPEN); });
    }
    var pw = ev.target.closest('[data-prikweg]');
    if (pw) return api('/genootschap/prik-weg', { groep:OPEN, id:pw.getAttribute('data-prikweg') })
      .then(function(d){ if(d.error) return melding(d.error); openGroep(OPEN); });
    var rw = ev.target.closest('[data-reactie-weg]');
    if (rw) return api('/genootschap/reactie-weg', { groep:OPEN, id:rw.getAttribute('data-reactie-weg'),
      reactieId:rw.getAttribute('data-reactie-id') }).then(function(d){ if(d.error) return melding(d.error); openGroep(OPEN); });
    var rz = ev.target.closest('[data-rol]');
    if (rz) return api('/genootschap/rol', { groep:OPEN, wie:rz.getAttribute('data-rol'), rol:rz.getAttribute('data-nieuwerol') })
      .then(function(d){ melding(d.error||'Rol aangepast.'); if(!d.error) openGroep(OPEN); });
    var eu = ev.target.closest('[data-eruit]');
    if (eu) {
      if (!confirm(eu.getAttribute('data-eruit')+' uit dit genootschap zetten?')) return;
      return api('/genootschap/eruit', { groep:OPEN, wie:eu.getAttribute('data-eruit') })
        .then(function(d){ melding(d.error||'Lid verwijderd.'); if(!d.error) openGroep(OPEN); });
    }
  });

  $('#aiform').addEventListener('submit', function(ev){
    ev.preventDefault();
    var t = $('#aiin').value.trim();
    if (!t) return;
    $('#aiin').value = '';
    melding('Rahul denkt mee…');
    api('/chat/send', { text: t }).then(function(d){ melding(d.reply || d.error || 'Geen antwoord.'); laad(); })
      .catch(function(){ melding('Rahul is nu niet bereikbaar.'); });
  });

  if (!TOKEN) { toon('<div class="kaart"><h2>Meld je eerst aan</h2><p style="color:var(--muted);font-size:.88rem;">Genootschappen horen bij je RTG-account. Open het OS en meld je aan.</p></div>'); tekenTabs(); }
  else { $('#aibalk').hidden = false; laad(); }
})();
</script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
