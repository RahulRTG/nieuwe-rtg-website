<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Gereedschap</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gereedschap">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --card2:var(--rtg-card2); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft);
    --burgundy:#C23A5E; --gold:#A98F1C; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;padding-bottom:3rem;}
  h1,h2{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 90%,transparent));
    backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + .9rem) 1.1rem .7rem;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;}
  header .ey{display:block;font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--rtg-leesgoud,var(--gold));}
  header h1{font-size:1.15rem;}
  header a.terug{color:var(--muted);text-decoration:none;font-size:1.1rem;}
  main{padding:1rem 1.1rem;max-width:760px;margin:0 auto;}
  .knop{background:var(--card);border:1px solid var(--line);border-radius:0;color:var(--txt);
    font:inherit;font-size:.8rem;font-weight:600;padding:.45rem .8rem;cursor:pointer;}
  .knop:hover{border-color:var(--gold);}
  .knop.vol{background:var(--gold);border-color:var(--gold);color:#0C0C0B;}
  .knop.aan{border-color:var(--gold);color:var(--rtg-leesgoud,var(--gold));}
  .knop:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .rij{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
  .stil{color:var(--soft);font-size:.82rem;line-height:1.55;}
  .veld{background:var(--card2);border:1px solid var(--line);border-radius:0;color:var(--txt);
    font:inherit;font-size:.85rem;padding:.45rem .6rem;}
  .kop{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--rtg-leesgoud,var(--gold));margin:1.2rem 0 .5rem;}
  .paneel{display:none;}
  .paneel.open{display:block;}
  /* Het gereedschap houdt zijn eigen schakelaar in de kop (Rekenmachine / Wekker
     en timer / Stopwatch en wereld): een paneel tegelijk, precies wat het deelmenu
     elders doet. Alleen de vorm gaat mee met het huis -- geen randje om een knop,
     maar een rustige tab met een gouden streep onder het deel waar je staat. De
     balklijn is hier de onderrand van de kop zelf; een tweede streep erboven zou
     alleen maar drukte zijn. De selector moet dieper dan `.knop`: de kit tekent
     die knop al met `body.rtg-stijl .knop`, en die is specifieker. */
  body.rtg-stijl header nav .knop{background:none;border:0;border-bottom:2px solid transparent;
    border-radius:0;padding:.45rem .55rem .5rem;font-size:.72rem;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap;}
  body.rtg-stijl header nav .knop:hover{color:var(--txt);border-bottom-color:transparent;}
  body.rtg-stijl header nav .knop.aan{color:var(--txt);border-bottom-color:var(--gold);}

  /* de rekenmachine */
  #rkScherm{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:0;
    color:var(--txt);font:500 1.6rem 'Inter',sans-serif;text-align:right;padding:.9rem .9rem;
    font-variant-numeric:tabular-nums;}
  #rkUitkomst{text-align:right;color:var(--rtg-leesgoud,var(--gold));font-size:1rem;min-height:1.5rem;margin:.3rem .2rem .6rem;}
  #rkToetsen{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;}
  #rkToetsen button{background:var(--card);border:1px solid var(--line);border-radius:0;color:var(--txt);
    font:600 1.05rem 'Inter',sans-serif;padding:.85rem 0;cursor:pointer;}
  #rkToetsen button:hover{border-color:var(--gold);}
  #rkToetsen .op{color:var(--rtg-leesgoud,var(--gold));}
  #rkToetsen .gelijk{background:var(--gold);border-color:var(--gold);color:#0C0C0B;grid-column:span 2;}
  /* minmax(0,1fr) en niet 1fr: een rasterkolom zakt anders nooit onder de
   breedte van zijn inhoud, en dan duwt een lange regel het hele scherm open
   (op 390px liep dit tot 605px, buiten beeld). */
.zaak{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6rem;margin-top:.8rem;}
  .zaak .vak{background:var(--card);border:1px solid var(--line);border-radius:0;padding:.7rem .8rem;}
  .zaak .vak b{display:block;font-size:.72rem;color:var(--rtg-leesgoud,var(--gold));letter-spacing:.08em;text-transform:uppercase;margin-bottom:.35rem;}
  .zaak .uitkomst{font-size:.82rem;color:var(--muted);margin-top:.4rem;line-height:1.5;}

  /* wekkers, timers, klokken */
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:0;padding:.7rem .85rem;
    margin-bottom:.5rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;}
  .kaart .tijd{font:600 1.3rem 'Inter',sans-serif;font-variant-numeric:tabular-nums;}
  .kaart .wat{flex:1;color:var(--muted);font-size:.8rem;}
  .kaart.uitstand{opacity:.5;}
  #swTijd{font:600 3rem 'Inter',sans-serif;text-align:center;font-variant-numeric:tabular-nums;
    padding:1rem 0 .4rem;}
  #swRondes{margin-top:.6rem;}
  #swRondes .ronde{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);
    padding:.3rem .2rem;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;}
  .alarm{position:fixed;inset:0;z-index:40;background:rgba(8,8,7,.95);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding:2rem;}
  .alarm.open{display:flex;}
  .alarm h2{font-size:2rem;}
  .melding{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--card2);
    border:1px solid var(--line);border-radius:0;padding:.5rem .95rem;font-size:.82rem;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;}
  .melding.zie{opacity:1;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
<link href="/shared/dagkleur.css" rel="stylesheet">
<script src="/shared/seizoen.js" defer></script>
<link href="/shared/ios.css" rel="stylesheet">
</head>
<body class="rtg-stijl">
<header>
  <a class="terug" href="/apps/app.html" aria-label="Terug naar het bureaublad">&#8592;</a>
  <span><span class="ey">RTG</span><h1>Gereedschap</h1></span>
  <nav class="rij" style="margin-left:auto;" aria-label="Gereedschappen">
    <button class="knop aan" data-tab="reken" type="button">Rekenmachine</button>
    <button class="knop" data-tab="wekker" type="button">Wekker &amp; timer</button>
    <button class="knop" data-tab="tijd" type="button">Stopwatch &amp; wereld</button>
  </nav>
</header>
<main>
  <section class="paneel open" id="tab-reken" aria-label="Rekenmachine">
    <input id="rkScherm" class="veld" inputmode="none" aria-label="Som" placeholder="0">
    <div id="rkUitkomst" aria-live="polite"></div>
    <div id="rkToetsen"></div>
    <div class="zaak">
      <div class="vak"><b>Btw</b>
        <div class="rij"><input class="veld" id="btwBedrag" inputmode="decimal" placeholder="Bedrag" style="flex:1;min-width:0;">
          <select class="veld" id="btwPct" aria-label="Btw-tarief"><option value="21">21%</option><option value="9">9%</option></select>
          <select class="veld" id="btwKant" aria-label="Inclusief of exclusief"><option value="ex">ex &#8594; incl</option><option value="in">incl &#8594; ex</option></select></div>
        <div class="uitkomst" id="btwUit"></div>
      </div>
      <div class="vak"><b>Rekening delen</b>
        <div class="rij"><input class="veld" id="splitBedrag" inputmode="decimal" placeholder="Bedrag" style="flex:1;min-width:0;">
          <input class="veld" id="splitPersonen" inputmode="numeric" placeholder="Personen" style="width:5.5rem;">
          <select class="veld" id="splitFooi" aria-label="Fooi"><option value="0">0%</option><option value="5">5%</option><option value="10">10%</option></select></div>
        <div class="uitkomst" id="splitUit"></div>
      </div>
    </div>
  </section>

  <section class="paneel" id="tab-wekker" aria-label="Wekker en timer">
    <div class="kop">Wekkers · de server telt, ook als de app dicht is</div>
    <div class="rij">
      <input class="veld" id="wkTijd" type="time" aria-label="Wekkertijd">
      <input class="veld" id="wkLabel" maxlength="60" placeholder="Waarvoor?" style="flex:1;min-width:8rem;">
      <select class="veld" id="wkDagen" aria-label="Herhaling">
        <option value="">Een keer</option><option value="1,2,3,4,5">Doordeweeks</option>
        <option value="0,6">Weekend</option><option value="0,1,2,3,4,5,6">Elke dag</option>
      </select>
      <button class="knop vol" id="wkZet" type="button">Zet de wekker</button>
    </div>
    <div class="h-mt70" id="wekkers" aria-live="polite"></div>
    <div class="kop">Timers</div>
    <div class="rij">
      <input class="veld" id="tmMin" inputmode="numeric" placeholder="Minuten" style="width:6.5rem;">
      <input class="veld" id="tmLabel" maxlength="60" placeholder="Waarvoor?" style="flex:1;min-width:8rem;">
      <button class="knop vol" id="tmStart" type="button">Start</button>
    </div>
    <div class="h-mt70" id="timers" aria-live="polite"></div>
    <p class="stil">Rahul kan dit ook: zeg "maak me morgen om 7 uur wakker" en de wekker staat er.</p>
  </section>

  <section class="paneel" id="tab-tijd" aria-label="Stopwatch en wereldklok">
    <div class="kop">Stopwatch</div>
    <div id="swTijd">0:00,0</div>
    <div class="rij" style="justify-content:center;">
      <button class="knop vol" id="swStart" type="button">Start</button>
      <button class="knop" id="swRonde" type="button">Ronde</button>
      <button class="knop" id="swReset" type="button">Terug naar nul</button>
    </div>
    <div id="swRondes"></div>
    <div class="kop">Wereldklok</div>
    <div class="rij">
      <select class="veld" id="wkStad" aria-label="Stad kiezen"></select>
      <button class="knop" id="wkErbij" type="button">Voeg toe</button>
    </div>
    <div class="h-mt70" id="klokken"></div>
  </section>
</main>

<div class="alarm" id="alarm" role="alertdialog" aria-label="Alarm">
  <h2 id="alarmKop">Wekker</h2>
  <p id="alarmTekst" class="stil" style="font-size:1rem;"></p>
  <button class="knop vol" id="alarmStil" type="button" style="font-size:1rem;padding:.8rem 2rem;">Ik ben er</button>
</div>
<div class="melding" id="melding" role="status"></div>
<script src="/shared/rekenkern.js"></script>
<script src="/shared/uitvoer.js"></script>
<script src="/apps/gereedschap/reken.js"></script>
<script src="/apps/gereedschap/klok.js"></script>
<script src="/apps/gereedschap/tijd.js"></script>

<script src="/shared/basis.js" defer></script>

</body>
</html>
