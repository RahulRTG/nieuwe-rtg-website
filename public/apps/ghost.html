<!doctype html>
<html lang="nl">
<head>
<script src="/shared/id.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghost Driver</title>
<meta name="theme-color" content="#F4EFE7">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/ds/rtg-ds.css" rel="stylesheet">
<script src="/ds/shell.js"></script>
</head>
<!-- De Ghost Driver op het RTG Design System (TRAVELOS-MIGRATIE.md par. 1b,
     stroom E): een zaakscherm op de werklaag. Collectie (de waarschuwingen)
     en het uurbeeld als rustige meters. Het weerbeeld is een demo en heet zo
     (par. 1d): dat komt van de server en blijft in beeld. Geen eigen stijl. -->
<body class="ds-scherm" data-rtg-world="travel" data-ds-schermtype="collectie">
<header class="ds-kop">
  <button class="ds-kop__actie" type="button" data-ds-zoek aria-label="Spring naar een functie"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
  <a class="ds-kop__merk" href="/apps/leverancier.html" aria-label="Terug naar de zaak-app">RTG</a>
  <a class="ds-kop__actie" href="/apps/leverancier.html" aria-label="Uw zaak-app"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></a>
</header>

<main class="ds-collectie" id="inhoud">
  <div class="ds-collectie__kop">
    <p class="ds-label">RTG Mobility</p>
    <h1 class="ds-titel ds-titel--scherm">Ghost Driver</h1>
    <p class="ds-meta">Kijkt 12 uur vooruit</p>
  </div>

  <section class="ds-status ds-status--binnen" id="vPoort" hidden>
    <h2 class="ds-status__titel">Eerst uw zaak-inlog</h2>
    <p class="ds-status__tekst">Log eerst in op de zaak-app; de Ghost Driver rijdt op de inlog van uw zaak.</p>
    <a class="ds-knop ds-knop--primair ds-status__actie" href="/apps/leverancier.html">Naar de zaak-app</a>
  </section>

  <div class="ds-panelen ds-panelen--twee" id="vGhost" hidden>
    <div class="ds-paneel">
      <p class="ds-meta" id="uitleg"></p>
      <section class="ds-paneel" aria-labelledby="kopUren">
        <h2 class="ds-label" id="kopUren">De komende 12 uur</h2>
        <ul class="ds-lijst ds-veldgroep" id="uren" aria-label="Drukteverwachting per uur"></ul>
        <p class="ds-meta" id="urenSub"></p>
      </section>
      <section class="ds-paneel" aria-labelledby="kopBouw">
        <h2 class="ds-label" id="kopBouw">Waar de spookrit op let</h2>
        <p class="ds-meta" id="bouwstenen"></p>
      </section>
    </div>
    <section class="ds-paneel" aria-labelledby="kopWaarschuwingen">
      <h2 class="ds-label" id="kopWaarschuwingen">Waarschuwingen</h2>
      <div class="ds-paneel" id="lijst"><p class="ds-meta">De spookrit kijkt vooruit…</p></div>
    </section>
  </div>
</main>

<script src="/shared/uitvoer.js"></script>
<script src="/apps/ghost-voorzijde.js"></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/cookie.js" defer></script>
</body>
</html>
