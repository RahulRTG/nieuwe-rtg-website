<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Hardware PDA</title>
<link rel="icon" href="/icons/partners.svg">
<link href="/fonts/fonts.css" rel="stylesheet">
  <link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rosthema.css" rel="stylesheet">
<script src="/shared/glyf.js"></script>
<script src="/shared/levendekleur.js" defer></script>
<script src="/shared/rosthema.js" defer></script>
<link href="/shared/rtg-ui.css" rel="stylesheet">
<script src="/shared/uitvoer.js"></script>
<script src="/shared/deur.js"></script>
<style>
  :root{
    --bg:var(--rtg-bg); --card:var(--rtg-card); --card2:var(--rtg-card2); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft);
    --burgundy:#C23A5E; --gold:#A98F1C; --green:#4C9A75;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:2rem;}
  h1,h2{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  a{color:inherit;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),rgba(12,12,11,.86));backdrop-filter:blur(8px);padding:.9rem 1rem .6rem;border-bottom:1px solid var(--line);}
  header .ey{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);}
  header h1{font-size:1.25rem;margin-top:.1rem;}
  main{padding:1rem;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:.9rem;}
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.85rem .95rem;}
  .veld{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit;font-size:.9rem;padding:.6rem .7rem;}
  select.veld{color-scheme:dark;}
  .knop{background:var(--txt);color:#000;border:none;border-radius:11px;padding:.6rem .9rem;font:inherit;font-weight:600;font-size:.86rem;cursor:pointer;}
  .knop.stil{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:500;}
  /* De disciplinekiezer is de eigen schakelaar van dit werkscherm: je ziet de
     conceptenlijst van EEN discipline tegelijk, precies wat het deelmenu elders
     doet. Alleen de vorm gaat mee met het huis -- een rustige balk met kleine
     kapitalen en een gouden streep onder de discipline waar je staat, in plaats
     van een rij pillen. De selector moet dieper dan `.chip`: de kit tekent die rij
     zelf al met `body.rtg-stijl .chip`, en die is specifieker. */
  body.rtg-stijl .chips{display:flex;flex-wrap:wrap;gap:.15rem;margin:0 0 .1rem;padding:0 0 .1rem;
    overflow:visible;border-bottom:1px solid var(--line);}
  body.rtg-stijl .chips > .chip{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
    border-radius:0;cursor:pointer;padding:.55rem .7rem .6rem;
    font-family:'Inter',system-ui,sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap;}
  body.rtg-stijl .chips > .chip:hover{color:var(--txt);border-bottom-color:transparent;}
  /* het gevulde pilletje van de kit uitzetten: `body.rtg-stijl .chips > button.aan`
     is specifieker dan een kale `.chip`, dus de vulling moet hier weg */
  body.rtg-stijl .chips > .chip.aan{background:none;color:var(--txt);border-bottom-color:var(--gold);}
  .pil{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:.15rem .55rem;color:var(--muted);}
  .swatch{width:1.6rem;height:1.6rem;border-radius:7px;border:1px solid var(--line);}
  .rij{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;}
  .sec{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:.2rem 0;}
  .leeg{color:var(--muted);font-size:.85rem;padding:.6rem 0;}
  .melding{position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%);background:#000;border:1px solid var(--gold);color:var(--txt);padding:.55rem .9rem;border-radius:10px;font-size:.82rem;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;}
</style>
</head>
<body class="rtg-stijl">
<header>
  <div class="ey">RTG Hardwarelab</div>
  <h1>Hardware PDA</h1>
</header>
<main id="main">
  <div class="kaart" id="briefKaart">
    <div class="sec">Snel briefen</div>
    <div class="rij" style="margin-bottom:.5rem;">
      <select class="veld" id="pCat" style="flex:1;min-width:9rem;" aria-label="Discipline"></select>
    </div>
    <input class="veld" id="pNaam" placeholder="Naam van het concept" maxlength="100" style="margin-bottom:.5rem;">
    <input class="veld" id="pBrief" placeholder="Brief: gebruik, formaat, aansluitingen" maxlength="600" style="margin-bottom:.5rem;">
    <button class="knop prim" id="pMaak" style="width:100%;">Concept + AI</button>
  </div>
  <div class="chips" id="pFilters"></div>
  <div id="pLijst"><div class="leeg">Laden...</div></div>
</main>
<div class="melding" id="melding" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t==null?'':t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN = null; try { TOKEN = localStorage.getItem('rtg_office_token'); } catch (e) {}
/* De deur op de app zelf, in plaats van wegsturen. Wie hier uitgelogd komt
   verloor met een location.replace() waar hij heen wilde: je landde op de
   personeels-app zonder te zien welke app je had geopend (TAKEN 5.5). De
   gedeelde poort toont wat deze app is en waar de inlog zit, met de weg terug
   in de link. Laadt de poort onverhoopt niet, dan doen we alsnog wat we eerst
   deden -- een dichte app zonder uitleg is erger dan een omweg. */
function uitgelogd(){
  var naar = '/apps/personeel.html?kantoor=1&terug=' + encodeURIComponent(location.pathname);
  if (!window.RTGDeur) { location.replace(naar); return; }
  /* Pas op de volgende tick tekenen. De deur vervangt #main, en dit script
     bindt daarna nog listeners aan knoppen binnen #main -- die zijn dan weg en
     dat gaf een reeks "Cannot read properties of null". De listeners hangen nu
     netjes aan elementen die daarna verdwijnen: geen fout, en de deur staat er
     zodra de pagina klaar is met opbouwen. */
  setTimeout(function () {
    var el = document.getElementById('main') || document.body;
    RTGDeur.toon(el, { soort: 'personeel', naar: naar });
  }, 0);
}
if (!TOKEN) uitgelogd();
const api = (pad, body) => fetch('/api/office/' + pad, {
  method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
  body: JSON.stringify(body || {})
}).then(async r => { const d = await r.json().catch(() => ({})); if (!r.ok) { if (r.status === 401) uitgelogd(); throw new Error(d.error || 'Er ging iets mis.'); } return d; });
function meld(t){ const m = $('#melding'); m.textContent = t; m.style.opacity = '1'; clearTimeout(m._t); m._t = setTimeout(() => m.style.opacity = '0', 2400); }

let DATA = null, filter = '';
/* Meenemen (shared/uitvoer.js): de conceptenlijst is het register van dit lab.
   De filterkeuze telt mee -- wat je voor je hebt is wat je meeneemt -- en de
   velden gaan los mee: de behuizing en de chip komen uit het concept, de datum
   uit o.at als YYYY-MM-DD. */
if (window.RTGUitvoer) RTGUitvoer.bron(function(){
  if (!DATA || !(DATA.ontwerpen||[]).length) return null;
  const l = DATA.ontwerpen.filter(o => !filter || o.discipline === filter);
  if (!l.length) return null;
  return {
    naam: 'concepten',
    kolommen: ['datum','naam','discipline','status','huis','behuizing','chip'],
    rijen: l.map(function(o){
      const c = o.concept || {};
      return [String(o.at||'').slice(0,10), o.naam||'', o.disciplineLabel||'', o.status||'',
        o.huis||'', c.behuizing||'', c.chip||''];
    })
  };
});
async function laad(){
  try { DATA = await api('hardware'); } catch(e){ $('#pLijst').innerHTML = '<div class="leeg">'+esc(e.message)+'</div>'; return; }
  const sel = $('#pCat');
  if (!sel.options.length) sel.innerHTML = DATA.disciplines.map(c => '<option value="'+c.id+'">'+esc(c.label)+'</option>').join('');
  render();
}
function statusPil(s){ const g = s==='productie'?'var(--gold)':(s==='archief'?'var(--muted)':'var(--txt)'); return '<span class="pil" style="color:'+g+';">'+esc(s)+'</span>'; }
function volgende(s){ const i = DATA.statussen.indexOf(s); return (i>=0 && i < DATA.statussen.length-1) ? DATA.statussen[i+1] : null; }
function render(){
  $('#pFilters').innerHTML = '<button class="chip'+(filter===''?' aan':'')+'" data-f="">Alle</button>' +
    DATA.disciplines.map(c => '<button class="chip'+(filter===c.id?' aan':'')+'" data-f="'+c.id+'">'+RTGGlyf.tekst(c.icon)+' '+esc(c.label)+(c.aantal?' ('+c.aantal+')':'')+'</button>').join('');
  $('#pFilters').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { filter = b.dataset.f; render(); }));
  const lijst = DATA.ontwerpen.filter(o => !filter || o.discipline === filter);
  $('#pLijst').innerHTML = lijst.length ? lijst.map(o => {
    const c = o.concept; const nx = volgende(o.status);
    return '<div class="kaart" style="margin-bottom:.7rem;">'+
      '<div class="rij" style="justify-content:space-between;">'+
        '<h2 style="font-size:1.02rem;">'+RTGGlyf.tekst(o.icon)+' '+esc(o.naam)+'</h2>'+statusPil(o.status)+'</div>'+
      '<div style="font-size:.72rem;color:var(--muted);margin-bottom:.4rem;">'+esc(o.disciplineLabel)+(o.huis?' · '+esc(o.huis):'')+'</div>'+
      (c ? '<div class="rij" style="margin-bottom:.4rem;">'+(c.kleuren||[]).map(k => '<span class="swatch" title="'+esc(k.naam)+'" style="background:'+esc(k.hex)+';"></span>').join('')+'</div>'+
        '<div style="font-size:.82rem;line-height:1.55;"><b>'+esc(c.behuizing)+'</b> · '+esc(c.chip)+'</div>'
        : '<div class="leeg">Nog geen concept.</div>')+
      (o.kritiek ? '<div style="margin-top:.45rem;border-left:2px solid var(--gold);padding-left:.6rem;font-size:.8rem;line-height:1.5;">'+esc(o.kritiek)+'</div>' : '')+
      '<div class="rij" style="margin-top:.6rem;">'+
        '<button class="knop stil" data-concept="'+o.id+'">'+(c?'Herteken':'Teken')+'</button>'+
        '<button class="knop stil" data-kritiek="'+o.id+'">Kritiek</button>'+
        (nx?'<button class="knop" data-next="'+o.id+'" data-s="'+nx+'" style="margin-left:auto;">→ '+nx+'</button>':'')+
      '</div></div>';
  }).join('') : '<div class="leeg">Geen concepten in deze discipline.</div>';
  bind();
}
function vervang(o){ const i = DATA.ontwerpen.findIndex(x => x.id === o.id); if (i>=0) DATA.ontwerpen[i] = o; render(); }
function bind(){
  document.querySelectorAll('[data-concept]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true; b.textContent = 'Tekent...';
    try { vervang((await api('hardware/concept', { id: b.dataset.concept })).ontwerp); } catch(e){ meld(e.message); b.disabled = false; }
  }));
  document.querySelectorAll('[data-kritiek]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true; b.textContent = '...';
    try { vervang((await api('hardware/kritiek', { id: b.dataset.kritiek })).ontwerp); } catch(e){ meld(e.message); b.disabled = false; }
  }));
  document.querySelectorAll('[data-next]').forEach(b => b.addEventListener('click', async () => {
    try { vervang((await api('hardware/zet', { id: b.dataset.next, status: b.dataset.s })).ontwerp); meld('Naar '+b.dataset.s); } catch(e){ meld(e.message); }
  }));
}
$('#pMaak').addEventListener('click', async () => {
  const naam = $('#pNaam').value.trim(); if (!naam){ meld('Geef het concept een naam.'); return; }
  try {
    const r = await api('hardware/maak', { discipline: $('#pCat').value, naam, brief: $('#pBrief').value.trim() });
    $('#pNaam').value = ''; $('#pBrief').value = '';
    DATA.ontwerpen.unshift(r.ontwerp);
    try { vervang((await api('hardware/concept', { id: r.ontwerp.id })).ontwerp); } catch(e){ render(); }
    meld('Concept aangemaakt; de chef-engineer tekent het uit.');
  } catch(e){ meld(e.message); }
});
/* Zonder kantoorsessie staat de deur er al; doorstarten levert dan
   alleen 401-en op die de poort weer zouden overschrijven. */
if (TOKEN) {
  laad();
}
</script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/volscherm.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
</body>
</html>
