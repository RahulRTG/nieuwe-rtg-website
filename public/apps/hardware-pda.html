<body class="ds-scherm" data-rtg-world="work" data-rtg-skin="heritage" data-rtg-layout="standard" data-ds-schermtype="taak" data-ds-nadruk="gereedschap">
<!-- DIT SCHERM IS DUN GEWORDEN, EN DAT IS DE HELE WINST. De drie bureau-PDA's
     (studio, hardware, architect) waren drie kopieën van hetzelfde ontwerp die
     uit elkaar waren gelopen: andere chip-stijl, andere uitvoerkolommen, de
     deur op een andere plek. De werking staat nu één keer in
     /shared/bureaupda.js; wat dit bureau eigen is (naam, brief-hint, de twee
     velden die een concept samenvatten, de kolommen) staat daar als gegeven in
     één tabel. Een vierde bureau is een regel in die tabel plus een pagina als
     deze. -->

<header class="ds-kop">
  <a class="ds-kop__merk" href="/apps/leverancier.html">← Mijn bedrijf</a>
</header>
<main class="ds-taak" id="main">
<div class="ds-taak__kop">
  <div class="ey ds-label">RTG Hardwarelab</div>
  <h1 class="ds-titel">Hardware PDA</h1>
</div>
  <div class="ds-sectie ds-sectie--open" id="briefKaart">
    <div class="ds-label">Snel briefen</div>
    <div class="ds-velden">
      <select class="ds-invoer" id="pCat" aria-label="Discipline"></select>
    </div>
    <input class="ds-invoer" id="pNaam" aria-label="Naam van het concept" placeholder="Naam van het concept" maxlength="100">
    <input class="ds-invoer" id="pBrief" aria-label="Brief voor het concept" placeholder="Brief: gebruik, formaat, aansluitingen" maxlength="600">
    <button class="ds-knop" id="pMaak">Concept + AI</button>
  </div>
  <div class="ds-chips" id="pFilters"></div>
  <div id="pLijst"><div class="ds-meta">Laden...</div></div>
<nav class="ds-handelingen" aria-label="WorkOS hoofdmenu">
<a class="ds-knop ds-knop--stil" href="/apps/werk.html">Vandaag</a>
<a class="ds-knop ds-knop--stil" href="/apps/werkruimte.html">Werkruimtes</a>
<a class="ds-knop ds-knop--stil" href="/apps/leverancier.html" aria-current="page">Werk</a>
<a class="ds-knop ds-knop--stil" href="/apps/comm.html">Berichten</a>
<a class="ds-knop ds-knop--stil" href="/apps/ik.html">Profiel</a>
</nav>
</main>

<script src="/shared/ios.js" defer></script>
</body>
</html>
