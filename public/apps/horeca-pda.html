<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Horeca: PDA Service</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<link href="/shared/zaakscherm.css" rel="stylesheet">
<link href="/shared/ios.css" rel="stylesheet">
<style>
  /* PDA SERVICE. Een hand, staand, in beweging, in een donkere zaak. Dat is een
     andere vorm dan een tablet aan de pas -- geen kolommen, geen tabel, en geen
     enkel raakvlak onder 44 pixels (HORECA.md, de vorm per werkplek). */
  :root{--pda-lijn:var(--rtg-line);--pda-kaart:var(--rtg-card);--pda-txt:var(--rtg-txt);
        --pda-stil:var(--rtg-soft);--pda-accent:#C23A5E;}
  body.rtg-stijl main#main{padding:0 max(.7rem,env(safe-area-inset-left)) 5rem;}
  .pda-modi{display:flex;gap:.35rem;padding:.5rem 0;position:sticky;top:0;z-index:5;
            background:var(--rtg-bg);border-bottom:1px solid var(--pda-lijn);}
  .pda-modi button{flex:1;min-height:44px;border:1px solid var(--pda-lijn);border-radius:10px;
                   background:transparent;color:var(--pda-txt);font:500 14px Inter,system-ui;cursor:pointer;}
  .pda-modi button[aria-pressed=true]{border-color:var(--pda-accent);
                   background:linear-gradient(180deg,rgba(194,58,94,.18),transparent);}
  .pda-groep{margin-top:1.1rem;}
  .pda-groep>h2{font:600 13px Inter,system-ui;letter-spacing:.16em;text-transform:uppercase;
                color:var(--pda-stil);margin-bottom:.5rem;}
  .pda-taak{border:1px solid var(--pda-lijn);border-radius:14px;background:var(--pda-kaart);
            padding:.85rem .9rem;margin-bottom:.6rem;}
  .pda-taak.over{border-left:3px solid var(--pda-accent);}
  .pda-kop{display:flex;align-items:baseline;gap:.6rem;}
  .pda-tafel{font:600 17px Inter,system-ui;color:var(--pda-txt);}
  .pda-min{margin-left:auto;font:600 17px Inter,system-ui;color:var(--pda-txt);white-space:nowrap;}
  .pda-wat{font-size:15px;line-height:1.45;margin-top:.25rem;color:var(--pda-txt);}
  .pda-som{font-size:13px;line-height:1.5;color:var(--pda-stil);margin-top:.35rem;}
  .pda-borden{margin:.45rem 0 0;padding:0;list-style:none;font-size:14px;line-height:1.6;}
  .pda-borden li{display:flex;gap:.5rem;}
  .pda-borden em{font-style:normal;color:var(--pda-stil);}
  .pda-allergie{display:inline-block;margin-top:.4rem;border:1px solid var(--pda-accent);
                border-radius:999px;padding:.15rem .6rem;font-size:13px;color:var(--pda-txt);}
  .pda-door{font-size:13px;color:var(--pda-stil);margin-top:.35rem;}
  .pda-acties{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem;}
  .pda-acties button{min-height:44px;flex:1 1 8rem;border:1px solid var(--pda-lijn);border-radius:10px;
                     background:transparent;color:var(--pda-txt);font:500 14px Inter,system-ui;cursor:pointer;}
  .pda-acties button.p{border-color:var(--pda-accent);background:rgba(194,58,94,.14);}
  .pda-leeg{border:1px dashed var(--pda-lijn);border-radius:14px;padding:1.1rem;
            font-size:14px;line-height:1.6;color:var(--pda-stil);}
  .pda-voet{margin-top:1.4rem;font-size:13px;line-height:1.6;color:var(--pda-stil);}
</style>
</head>
<body class="rtg-stijl">
<header>
  <a class="terug" href="/apps/horeca.html" aria-label="Terug naar zaal en keuken">&#8592;</a>
  <span><span class="ey">RTG Horeca</span><h1>PDA Service</h1></span>
  <span class="h-flex1"></span>
  <button class="knop" id="pVerversNu" type="button">Ververs</button>
</header>
<main id="main">
  <div class="pda-modi" id="pModi" role="group" aria-label="Werkstand"></div>

  <section class="pda-groep" aria-labelledby="pNuKop">
    <h2 id="pNuKop">Nu &mdash; over de grens</h2>
    <div id="pNu"></div>
  </section>

  <section class="pda-groep" aria-labelledby="pOpenKop">
    <h2 id="pOpenKop">Ook open</h2>
    <div id="pOpen"></div>
  </section>

  <p class="pda-voet" id="pUitleg"></p>
  <p class="pda-voet">Deze lijst toont de hele zaak. Een wijkindeling bestaat hier
  nog niet, dus er wordt niet gedaan alsof: wat u ziet is alles wat open staat.</p>
</main>
<div class="melding" id="melding" role="status"></div>
<script src="/shared/deur.js"></script>
<script src="/apps/horeca/kern.js"></script>
<script src="/apps/horeca/pda.js"></script>
<script src="/shared/schermbeeld.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/volscherm.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
