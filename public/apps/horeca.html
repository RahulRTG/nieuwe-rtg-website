<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Horeca</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --card2:var(--rtg-card2); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft);
    --burgundy:#C23A5E; --gold:#A98F1C; --goed:#69B891; --laat:#C2703A; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;padding-bottom:3rem;}
  h1,h2,h3{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),rgba(12,12,11,.92));
    backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + .9rem) 1.1rem .7rem;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;}
  header .ey{display:block;font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
  header h1{font-size:1.15rem;}
  header a.terug{color:var(--muted);text-decoration:none;font-size:1.1rem;}
  main{padding:1rem 1.1rem;max-width:920px;margin:0 auto;}
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.8rem;}
  .kop{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 .5rem;}
  .stil{color:var(--soft);font-size:.82rem;line-height:1.55;}
  .rij{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
  .veld{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);
    font:inherit;font-size:.86rem;padding:.55rem .7rem;min-width:0;flex:1;}
  .knop{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);
    font:inherit;font-size:.8rem;font-weight:600;padding:.5rem .85rem;cursor:pointer;}
  .knop.p{background:var(--burgundy);border-color:transparent;color:#fff;}
  .knop:hover{border-color:var(--gold);}
  .knop:focus-visible,.veld:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .tabs{display:flex;gap:.4rem;margin-bottom:.9rem;}
  .tabs button{flex:1;}
  .tabs button[aria-selected="true"]{border-color:var(--gold);color:#fff;}
  .item{display:flex;gap:.6rem;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:.55rem 0;flex-wrap:wrap;}
  .item:first-of-type{border-top:0;}
  .tag{font-size:.66rem;border:1px solid var(--line);border-radius:999px;padding:.12rem .5rem;color:var(--muted);}
  .tag.aan{color:var(--goed);border-color:var(--goed);}
  .tag.laat{color:var(--laat);border-color:var(--laat);}
  .bon{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;margin-bottom:.5rem;}
  .bon b{font-size:.95rem;}
  .bon .allergie{display:inline-block;border:1px solid var(--laat);color:var(--laat);border-radius:6px;
    padding:.05rem .4rem;font-size:.72rem;font-weight:700;margin-left:.3rem;}
  .melding{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--card2);
    border:1px solid var(--line);border-radius:999px;padding:.5rem .95rem;font-size:.82rem;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw;}
  .melding.zie{opacity:1;}
  [hidden]{display:none !important;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
<link href="/shared/dagkleur.css" rel="stylesheet">
<link href="/shared/desktopframe.css" rel="stylesheet">
<script src="/shared/glyf.js" defer></script>
<script src="/shared/desktopframe.js" defer></script>
</head>
<body class="rtg-stijl">
<header>
  <a class="terug" href="/apps/index.html" aria-label="Terug naar het bureaublad">&#8592;</a>
  <span><span class="ey">RTG Horeca</span><h1>Zaal en keuken</h1></span>
  <span style="flex:1;"></span>
  <button class="knop" id="ververs" type="button">Ververs</button>
</header>
<main id="main">
  <div class="tabs" role="tablist" aria-label="Weergave">
    <button class="knop" id="tabZaal" role="tab" aria-selected="true" type="button">Zaal</button>
    <button class="knop" id="tabKeuken" role="tab" aria-selected="false" type="button">Keuken</button>
  </div>

  <section id="vZaal" aria-label="De zaal">
    <div class="kaart">
      <div class="kop">Nieuwe rekening</div>
      <div class="rij">
        <input class="veld" id="zTafel" maxlength="30" placeholder="Tafel of plek" aria-label="Tafel of plek">
        <input class="veld" id="zGasten" type="number" min="1" max="99" value="2" aria-label="Aantal gasten" style="flex:0 1 6rem;">
        <select class="veld" id="zKanaal" aria-label="Kanaal" style="flex:0 1 9rem;">
          <option value="tafel">Tafel</option><option value="bar">Bar</option>
          <option value="terras">Terras</option><option value="club">Club</option>
          <option value="afhaal">Afhaal</option><option value="roomservice">Roomservice</option>
        </select>
        <button class="knop p" id="zOpen" type="button">Open</button>
      </div>
      <p class="stil" style="margin-top:.4rem;">Per tafel staat er hooguit een rekening open. Splitsen en samenvoegen verplaatsen alleen; er komt geen cent bij of af.</p>
    </div>
    <div class="kaart">
      <div class="kop">Open rekeningen</div>
      <div id="zLijst"></div>
    </div>
    <div class="kaart" id="zDetailKaart" hidden>
      <div class="kop" id="zDetailKop">Rekening</div>
      <div id="zDetail"></div>
      <div class="rij" style="margin-top:.6rem;">
        <input class="veld" id="zNaam" maxlength="80" placeholder="Wat wordt er besteld?" aria-label="Product">
        <input class="veld" id="zPrijs" type="number" min="0" step="0.01" placeholder="Prijs" aria-label="Prijs" style="flex:0 1 7rem;">
        <input class="veld" id="zAantal" type="number" min="1" max="99" value="1" aria-label="Aantal" style="flex:0 1 5rem;">
        <input class="veld" id="zGang" type="number" min="0" max="9" value="1" aria-label="Gang" style="flex:0 1 5rem;">
        <input class="veld" id="zStation" maxlength="30" placeholder="Station" aria-label="Station" style="flex:0 1 7rem;">
        <input class="veld" id="zAllergie" maxlength="120" placeholder="Allergie" aria-label="Allergie" style="flex:0 1 9rem;">
        <button class="knop p" id="zRegel" type="button">Zet erop</button>
      </div>
      <div class="rij" style="margin-top:.6rem;">
        <input class="veld" id="zVrijGang" type="number" min="0" max="9" value="1" aria-label="Gang vrijgeven" style="flex:0 1 5rem;">
        <input class="veld" id="zServeerOm" maxlength="5" placeholder="Serveren om" aria-label="Serveertijd" style="flex:0 1 7rem;">
        <button class="knop" id="zVrij" type="button">Gang vrijgeven</button>
        <input class="veld" id="zSplits" type="number" min="2" max="20" placeholder="Splits in" aria-label="Splitsen per persoon" style="flex:0 1 6rem;">
        <button class="knop" id="zSplitsGa" type="button">Splits per persoon</button>
        <button class="knop p" id="zBetaal" type="button">Afrekenen (pin)</button>
      </div>
    </div>
  </section>

  <section id="vKeuken" aria-label="De keuken" hidden>
    <div class="kaart">
      <div class="kop">Stationsbord</div>
      <div class="rij">
        <input class="veld" id="kStation" maxlength="30" placeholder="Station (leeg = alle)" aria-label="Station">
        <button class="knop" id="kToon" type="button">Toon</button>
        <span class="stil" id="kTelling"></span>
      </div>
    </div>
    <div id="kBord"></div>
    <div class="kaart">
      <div class="kop">Regie</div>
      <div id="kRegie"></div>
    </div>
  </section>
</main>
<div class="melding" id="melding" role="status"></div>
<script src="/shared/deur.js"></script>
<script src="/apps/horeca/zaal.js"></script>
<script src="/apps/horeca/keuken.js"></script>
<script src="/apps/horeca/app.js"></script>
<script src="/shared/schermbeeld.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/volscherm.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
</body>
</html>
