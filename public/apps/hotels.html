</header>
<main id="main">
  <div class="tabs" id="tabs" aria-label="Verblijfsmoment">
    <button class="tab aan" type="button" data-t="zoeken">Verblijven</button>
    <button class="tab" type="button" data-t="mijn">Mijn reizen</button>

</main>

<nav class="rtg-deep-nav" aria-label="TravelOS reisflow" style="--deep-nav-count:3">

<section class="verblijf-blad" id="verblijfBlad" aria-label="Verblijf aanvragen" hidden>
  <div class="blad-kop"><button class="terug" id="bladTerug" type="button">Terug</button><div><span class="ey" id="bladMeta"></span><h2 id="bladNaam"></h2></div></div>
  <div class="boek-paneel">
    <p class="blad-verhaal" id="bladVerhaal"></p>
    <div class="kamers" id="kamers"></div>
    <div class="boek-velden">
      <label>Aankomst<input class="veld" id="rAan" type="date"></label>
      <label>Vertrek<input class="veld" id="rVer" type="date"></label>
      <label>Gasten<select class="veld" id="rAantal"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label>
    </div>
    <div class="boeksom" id="rTotaal"></div>
    <button class="knop" id="rBoek" type="button" disabled>Kies eerst een kamer</button>
    <p class="menselijke-grens">U vraagt het verblijf aan. Het huis bevestigt persoonlijk.</p>
  </div>
</section>
