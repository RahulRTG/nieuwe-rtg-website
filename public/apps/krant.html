<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --line:var(--rtg-line); --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft); --gold:#A98F1C; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;}
  h1,h2,h3{font-family:'Bodoni Moda',serif;font-weight:500;}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 90%,transparent));backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.5rem;padding:calc(env(safe-area-inset-top) + .55rem) .9rem .55rem;}
  .nav{width:34px;height:34px;border-radius:0;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;display:grid;place-items:center;font-size:1rem;flex:0 0 auto;}
  .nav:hover{border-color:var(--gold);}
  .titel{flex:1;font-family:'Bodoni Moda',serif;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ey{font-size:.56rem;letter-spacing:.26em;text-transform:uppercase;color:var(--rtg-leesgoud,var(--gold));}
  main{min-height:calc(100dvh - 56px);}
  .feed{max-width:900px;margin:0 auto;padding:1.6rem 1.1rem 4rem;}
  .rubriek-lint{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 1.2rem;}
  .chip{font:inherit;font-size:.76rem;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:0;padding:.3rem .8rem;cursor:pointer;}
  .chip.aan{border-color:var(--acc,var(--gold));color:var(--txt);}
  .lead{display:grid;grid-template-columns:1.3fr 1fr;gap:1.2rem;border-bottom:1px solid var(--line);padding-bottom:1.4rem;margin-bottom:1.4rem;cursor:pointer;}
  .lead .beeld{aspect-ratio:16/10;border-radius:0;overflow:hidden;background:var(--card);}
  .lead .beeld img{width:100%;height:100%;object-fit:cover;display:block;}
  .lead h2{font-size:clamp(1.5rem,3vw,2.2rem);line-height:1.1;}
  .lead .chapo{color:var(--muted);margin-top:.6rem;line-height:1.6;}
  .lead .meta{color:var(--soft);font-size:.76rem;margin-top:.6rem;letter-spacing:.04em;text-transform:uppercase;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.2rem;}
  .kaart{cursor:pointer;border-top:2px solid var(--acc,var(--gold));padding-top:.7rem;}
  .kaart .rub{color:var(--acc,var(--gold));font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;}
  .kaart h3{font-size:1.1rem;line-height:1.15;margin:.25rem 0;}
  .kaart .chapo{color:var(--muted);font-size:.86rem;line-height:1.5;}
  .kaart .meta{color:var(--soft);font-size:.72rem;margin-top:.4rem;}
  .leeg{text-align:center;color:var(--soft);padding:3rem 1rem;}
  /* een artikel lezen */
  .lezen{max-width:720px;margin:0 auto;padding:2rem 1.1rem 4rem;}
  .lezen .rub{color:var(--acc,var(--gold));font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;}
  .lezen h1{font-size:clamp(1.8rem,4vw,3rem);line-height:1.08;margin:.3rem 0 .5rem;}
  .lezen .chapo{color:var(--muted);font-size:1.1rem;line-height:1.6;}
  .lezen .meta{color:var(--soft);font-size:.8rem;margin:.7rem 0 1.2rem;border-bottom:1px solid var(--line);padding-bottom:1rem;}
  .lezen .beeld{border-radius:0;overflow:hidden;margin-bottom:1.3rem;} .lezen .beeld img{width:100%;display:block;}
  .lezen .inhoud p{line-height:1.8;margin-bottom:1.1rem;font-size:1.05rem;color:var(--txt);}
  /* de gids van kranten */
  .gids{max-width:900px;margin:0 auto;padding:2.2rem 1.1rem 4rem;}
  .gids h1{font-size:clamp(1.8rem,5vw,2.8rem);text-align:center;}
  .gids .lead2{text-align:center;color:var(--muted);max-width:48ch;margin:.4rem auto 1.8rem;line-height:1.6;}
  .krantkaart{display:block;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:0;padding:1rem;cursor:pointer;color:var(--txt);border-left:3px solid var(--gold);}
  .krantkaart:hover{border-color:var(--gold);}
  .krantkaart .nm{font-family:'Bodoni Moda',serif;font-size:1.2rem;}
  .krantkaart .po{color:var(--muted);font-size:.84rem;margin-top:.15rem;}
  .krantkaart .mt{color:var(--soft);font-size:.72rem;margin-top:.5rem;}
</style>

<header>
  <button class="nav" id="terug" title="Terug" aria-label="Terug">‹</button>
  <div style="flex:1;min-width:0;"><div class="ey">RTG Krant</div><div class="titel" id="kop">Nieuws</div></div>
</header>
<main id="hoofd"></main>
<!-- uitvoer.js zonder defer en voor het eigen script: dat meldt hieronder zijn eigen model aan -->
<script src="/shared/uitvoer.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(pad,body)=>fetch('/api/krant/'+pad,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Er ging iets mis.');return d;});
let ZAAK=(new URLSearchParams(location.search).get('zaak')||'').toUpperCase();
let KRANT=null, RUBRIEK='alle', GIDS=[];
/* Meenemen: wat er open ligt. Staat er een krant open, dan de artikelen van
   die krant; staat de gids open, dan de titels die er online staan. */
if (window.RTGUitvoer) RTGUitvoer.bron(function(){
  if (KRANT && (KRANT.artikelen||[]).length) {
    return { naam:'krant-artikelen', kolommen:['titel','rubriek','auteur','gelezen'],
      rijen:KRANT.artikelen.map(function(a){ return [a.titel, a.rubriek, a.auteur||'Redactie', a.gelezen||0]; }) };
  }
  if (GIDS.length) {
    return { naam:'kranten', kolommen:['krant','payoff','artikelen'],
      rijen:GIDS.map(function(k){ return [k.naam, k.payoff||'', k.artikelen]; }) };
  }
  return null;
});

$('#terug').addEventListener('click',()=>{ if(location.hash){ location.hash=''; } if(document.body.dataset.view==='artikel'){ toonKrant(); } else { ZAAK=''; gids(); } });

/* ---- versie voor de site-blokken (zelfde als de browser) ---- */
function versieNu(){ const w=Math.min(window.innerWidth,1080); return w<=640?'telefoon':(w<=1000?'tablet':'desktop'); }
function toonBlok(b,v){ if(v==='desktop')return b; const o=b.varianten&&b.varianten[v]; return o?Object.assign({},b,o):b; }
function ordenSite(site,v){ const vs=site.volgorde&&site.volgorde[v]; if(v!=='desktop'&&vs&&vs.length){const m={};(site.blokken||[]).forEach(b=>m[b.id]=b);const u=[];vs.forEach(id=>{if(m[id]){u.push(m[id]);delete m[id];}});(site.blokken||[]).forEach(b=>{if(m[b.id])u.push(b);});return u;} return (site.blokken||[]).slice(); }
function tk(el,v){el.textContent=v||'';return el;}
function blokEl(b,v){ const T=toonBlok(b,v),s=document.createElement('section');s.className='wb-blok';const t=b.type;
  if(t==='hero'){s.classList.add('b-hero');s.appendChild(tk(document.createElement('h1'),T.kop));const p=document.createElement('div');p.className='sub';tk(p,T.sub);s.appendChild(p);if(T.knop){const a=document.createElement('span');a.className='b-knop';tk(a,T.knop);s.appendChild(a);}}
  else if(t==='kop'){s.classList.add('b-kop');s.appendChild(tk(document.createElement('h2'),T.tekst));}
  else if(t==='tekst'){s.classList.add('b-tekst');const d=document.createElement('div');tk(d,T.tekst);s.appendChild(d);}
  else if(t==='knop'){s.classList.add('b-knoprij');const a=document.createElement('span');a.className='b-knop';tk(a,T.tekst);s.appendChild(a);}
  else if(t==='beeld'){s.classList.add('b-beeld');const im=document.createElement('img');im.src=b.src;im.alt=T.bijschrift||'';s.appendChild(im);if(T.bijschrift){const bb=document.createElement('div');bb.className='bij';tk(bb,T.bijschrift);s.appendChild(bb);}}
  else if(t==='kolommen'){s.classList.add('b-kol');[['lk','lt'],['rk','rt']].forEach(pr=>{const c=document.createElement('div');c.appendChild(tk(document.createElement('h3'),T[pr[0]]));const q=document.createElement('div');q.className='kt';tk(q,T[pr[1]]);c.appendChild(q);s.appendChild(c);});}
  else if(t==='galerij'){s.classList.add('b-gal');(b.beelden||[]).forEach(src=>{const im=document.createElement('img');im.src=src;im.alt='';s.appendChild(im);});}
  else if(t==='citaat'){s.classList.add('b-citaat');const q=document.createElement('div');q.className='q';tk(q,T.tekst);s.appendChild(q);const br=document.createElement('div');br.className='bron';tk(br,T.bron);s.appendChild(br);}
  else if(t==='ruimte'){s.style.height=(b.hoogte||40)+'px';}
  else if(t==='voettekst'){s.classList.add('b-voet');tk(s,T.tekst);}
  return s; }
let _doek=null;
function schilderSite(){ if(!_doek||!KRANT)return; const v=versieNu(); if(_doek.dataset.ver===v)return; _doek.dataset.ver=v; _doek.textContent=''; ordenSite(KRANT.site||{},v).forEach(b=>{ if((b.verberg||[]).includes(v))return; _doek.appendChild(blokEl(b,v)); }); }
window.addEventListener('resize',()=>{ clearTimeout(window._t); window._t=setTimeout(schilderSite,120); });

/* ---- de krant tonen ---- */
async function toonKrant(){
  document.body.dataset.view='krant';
  if(!KRANT){ try{ KRANT=await api('open',{code:ZAAK}); }catch(e){ $('#hoofd').innerHTML='<div class="leeg">'+esc(e.message)+'</div>'; return; } }
  const acc=KRANT.huisstijl.accent||'#7F1634';
  document.documentElement.style.setProperty('--acc',acc);
  $('#kop').textContent=KRANT.huisstijl.naam;
  const h=$('#hoofd'); h.innerHTML='';
  // kop-site in eigen huisstijl (als er blokken zijn)
  if((KRANT.site&&(KRANT.site.blokken||[]).length)){
    const wrap=document.createElement('div'); const doek=document.createElement('div'); doek.className='doek'; doek.dataset.thema=KRANT.huisstijl.thema||'donker'; doek.dataset.ver=''; doek.style.setProperty('--acc',acc);
    wrap.appendChild(doek); h.appendChild(wrap); _doek=doek; schilderSite();
  } else { _doek=null; }
  const feed=document.createElement('div'); feed.className='feed'; feed.style.setProperty('--acc',acc); h.appendChild(feed);
  // rubriek-lint
  const rubs=['alle'].concat(KRANT.rubrieken||[]);
  const lint=document.createElement('div'); lint.className='rubriek-lint';
  rubs.forEach(r=>{ const c=document.createElement('button'); c.className='chip'+(r===RUBRIEK?' aan':''); c.textContent=r==='alle'?'Alles':r; c.addEventListener('click',()=>{RUBRIEK=r;toonKrant();}); lint.appendChild(c); });
  feed.appendChild(lint);
  let arts=(KRANT.artikelen||[]); if(RUBRIEK!=='alle') arts=arts.filter(a=>a.rubriek===RUBRIEK);
  if(!arts.length){ const l=document.createElement('div'); l.className='leeg'; l.textContent='Nog geen artikelen in deze rubriek.'; feed.appendChild(l); return; }
  // lead + grid
  const lead=arts[0];
  const le=document.createElement('div'); le.className='lead'; le.addEventListener('click',()=>lees(lead.id));
  le.innerHTML=(lead.beeld?'<div class="beeld"><img src="'+esc(lead.beeld)+'" alt=""></div>':'<div></div>')+
    '<div><div class="kaart" style="border:0;padding:0;"><div class="rub" style="color:'+esc(acc)+';">'+esc(lead.rubriek)+'</div></div><h2>'+esc(lead.titel)+'</h2><div class="chapo">'+esc(lead.chapo||'')+'</div><div class="meta">'+esc(lead.auteur||'Redactie')+' · '+(lead.gelezen||0)+' gelezen</div></div>';
  feed.appendChild(le);
  const grid=document.createElement('div'); grid.className='grid';
  arts.slice(1).forEach(a=>{ const k=document.createElement('div'); k.className='kaart'; k.addEventListener('click',()=>lees(a.id));
    k.innerHTML='<div class="rub">'+esc(a.rubriek)+'</div><h3>'+esc(a.titel)+'</h3><div class="chapo">'+esc(a.chapo||'')+'</div><div class="meta">'+esc(a.auteur||'Redactie')+'</div>'; grid.appendChild(k); });
  feed.appendChild(grid);
}
async function lees(id){
  try{ const d=await api('artikel',{code:ZAAK,id}); const a=d.artikel; document.body.dataset.view='artikel';
    document.documentElement.style.setProperty('--acc',a.accent||'#7F1634');
    $('#kop').textContent=a.naam;
    const paras=String(a.inhoud||'').split(/\n{2,}|\n/).filter(x=>x.trim()).map(p=>'<p>'+esc(p)+'</p>').join('')||'<p class="chapo">'+esc(a.chapo||'')+'</p>';
    $('#hoofd').innerHTML='<article class="lezen"><div class="rub" style="color:'+esc(a.accent||'#7F1634')+';">'+esc(a.rubriek)+'</div><h1>'+esc(a.titel)+'</h1>'+
      (a.chapo?'<div class="chapo">'+esc(a.chapo)+'</div>':'')+'<div class="meta">'+esc(a.naam)+' · '+esc(a.auteur||'Redactie')+'</div>'+
      (a.beeld?'<div class="beeld"><img src="'+esc(a.beeld)+'" alt=""></div>':'')+'<div class="inhoud">'+paras+'</div></article>';
    window.scrollTo(0,0);
  }catch(e){ alert(e.message); }
}

/* ---- de gids van RTG-kranten ---- */
async function gids(){
  document.body.dataset.view='gids'; $('#kop').textContent='RTG Krant';
  const h=$('#hoofd'); h.innerHTML='<div class="gids"><h1>RTG Krant</h1><p class="lead2">De kranten die nieuwsbedrijven binnen RTG uitgeven. Kies een titel om te lezen.</p><div class="grid" id="krantgrid"><div class="leeg">Laden…</div></div></div>';
  try{ const d=await api('gids'); GIDS=d.lijst||[]; const g=$('#krantgrid'); g.innerHTML='';
    if(!(d.lijst||[]).length){ g.innerHTML='<div class="leeg">Nog geen kranten online.</div>'; return; }
    d.lijst.forEach(k=>{ const b=document.createElement('button'); b.className='krantkaart'; b.style.borderLeftColor=k.accent||'#7F1634';
      b.innerHTML='<div class="nm">'+esc(k.naam)+'</div><div class="po">'+esc(k.payoff||'')+'</div><div class="mt">'+k.artikelen+' artikel'+(k.artikelen===1?'':'en')+'</div>';
      b.addEventListener('click',()=>{ ZAAK=k.code; KRANT=null; RUBRIEK='alle'; toonKrant(); }); g.appendChild(b);
    });
  }catch(e){ $('#krantgrid').innerHTML='<div class="leeg">'+esc(e.message)+'</div>'; }
}

if(ZAAK) toonKrant(); else gids();
</script>
