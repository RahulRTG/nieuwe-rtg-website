<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aanvragen uit de Mall</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<link href="/shared/dagkleur.css" rel="stylesheet">
<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft);
    --burgundy:#C23A5E; --gold:#A98F1C; --green:#4C9A75; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:3rem;}
  h1,h2,h3{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  a{color:inherit;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),rgba(12,12,11,.86));backdrop-filter:blur(8px);
    padding:calc(env(safe-area-inset-top) + 1rem) 1.1rem .7rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.8rem;}
  header .ey{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
  header h1{font-size:1.3rem;margin-top:.05rem;}
  .terug{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:.4rem .7rem;font:inherit;font-size:.8rem;text-decoration:none;}
  main{padding:1.1rem;max-width:820px;margin:0 auto;}
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.7rem;}
  .kaart h3{font-size:1.05rem;}
  .rij{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.55rem;}
  .knop{background:var(--txt);color:#000;border:none;border-radius:10px;padding:.45rem .8rem;font:inherit;font-weight:600;font-size:.8rem;cursor:pointer;}
  .knop.stil{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:500;}
  .veld{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit;font-size:.9rem;padding:.5rem .7rem;}
  .meta{font-size:.74rem;color:var(--soft);}
  .oms{font-size:.84rem;color:var(--muted);line-height:1.55;}
  .leeg{color:var(--muted);font-size:.9rem;padding:1.8rem 0;text-align:center;}
  .mijn{border-left:2px solid var(--green);padding-left:.6rem;margin-top:.5rem;}
  .melding{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#000;border:1px solid var(--gold);color:var(--txt);
    padding:.55rem .9rem;border-radius:10px;font-size:.82rem;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;z-index:30;}
  .inlog{max-width:420px;margin:4rem auto;text-align:center;padding:0 1.2rem;}
  .inlog a{color:var(--gold);border-bottom:1px solid var(--gold);}
  /* Vervangen style="..."-attributen. Ze staan hier als klasse omdat de CSP
     style-src-attr pas dicht kan als public/ er geen meer heeft; NORM.json telt
     ze en dat getal mag alleen omlaag. Zelfde maten als de attributen hadden. */
  .lees{max-width:62ch;}
  .groei{flex:1;min-width:12rem;}
  .groei-breed{flex:1;min-width:14rem;}
  .smal{max-width:10rem;}
  .smaller{max-width:8rem;}
  .duw{flex:1;}
  .strak{margin-top:0;}
  .ruim{margin-top:.5rem;}
  .ruimer{margin-top:.6rem;}
  .ruimst{margin-top:1rem;}
  .goed{color:var(--green);}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
<link href="/shared/ios.css" rel="stylesheet">
</head>
<body class="rtg-stijl">
<header>
  <a class="terug" href="/apps/leverancier.html">&#8592; Zaak</a>
  <div><div class="ey">Uit de Mall</div><h1>Aanvragen</h1></div>
</header>
<main id="main">
  <p class="oms lees" id="uitleg">Leden die iets zoeken en het niet vinden, plaatsen hier hun vraag. U ziet alleen wat bij uw vak en uw werkgebied past.</p>
  <div id="lijst"></div>
</main>
<div class="melding" id="melding" role="status"></div>
<script src="/apps/leverancier-aanvragen.js"></script>
<script src="/shared/schermbeeld.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
