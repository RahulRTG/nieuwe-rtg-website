<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTMAIL zaak · RTG</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RTMAIL zaak">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<style>
  :root{ --bg:#0C0C0B; --card:#151312; --card2:#1B1817; --line:rgba(255,255,255,0.10);
    --txt:#F4F1EC; --muted:rgba(244,241,236,0.68); --soft:rgba(244,241,236,0.5); --burgundy:#C23A5E; --gold:#A98F1C; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;padding-bottom:3rem;}
  h1,h2{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),rgba(12,12,11,.86));backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 1rem) 1.1rem .7rem;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:.8rem;}
  header .ey{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
  header h1{font-size:1.35rem;}
  header .tel{margin-left:auto;font-size:.72rem;background:var(--burgundy);color:#fff;border-radius:999px;padding:.15rem .6rem;}
  main{padding:1.1rem;max-width:640px;margin:0 auto;}
  .schakel{display:flex;gap:.4rem;margin-bottom:1rem;}
  .schakel button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--muted);font:inherit;font-size:.82rem;font-weight:600;border-radius:10px;padding:.5rem;cursor:pointer;}
  .schakel button.aan{background:var(--card2);border-color:var(--gold);color:var(--txt);}
  .rij{display:flex;gap:.8rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.85rem .9rem;margin-bottom:.6rem;cursor:pointer;transition:border-color .15s;width:100%;text-align:left;color:inherit;font:inherit;}
  .rij:hover{border-color:var(--gold);}
  .rij .ic{width:2.4rem;height:2.4rem;display:grid;place-items:center;background:var(--card2);border-radius:12px;flex-shrink:0;font-size:.72rem;font-weight:600;}
  .rij .b{flex:1;min-width:0;}
  .rij .nm{font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:.45rem;}
  .rij.ongelezen .nm::before{content:'';width:.5rem;height:.5rem;border-radius:50%;background:var(--burgundy);flex:0 0 auto;}
  .rij .lt{font-size:.82rem;color:var(--soft);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rij .tijd{font-size:.7rem;color:var(--soft);white-space:nowrap;}
  .terug{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer;margin-bottom:.8rem;padding:.2rem 0;}
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.15rem;}
  .kaart h2{font-size:1.15rem;margin-bottom:.3rem;}
  .kaart .meta{font-size:.72rem;color:var(--soft);margin-bottom:.9rem;}
  .kaart .body{font-size:.92rem;line-height:1.65;white-space:pre-wrap;color:var(--muted);}
  .knop{display:inline-block;background:var(--burgundy);color:#fff;border:0;border-radius:10px;font:inherit;font-size:.85rem;font-weight:600;padding:.55rem 1rem;cursor:pointer;margin-top:1rem;}
  .knop.rand{background:transparent;border:1px solid var(--line);color:var(--muted);}
  .veld{display:block;width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:.9rem;border-radius:10px;padding:.6rem .7rem;margin-top:.6rem;}
  textarea.veld{min-height:8rem;resize:vertical;line-height:1.5;}
  label.lab{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:.9rem;}
  .nieuwbtn{margin-left:.4rem;font-size:.72rem;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:.15rem .7rem;cursor:pointer;font:inherit;}
  .leeg{color:var(--soft);font-size:.9rem;text-align:center;padding:2.5rem 1rem;line-height:1.6;}
  .inlog{text-align:center;padding:3rem 1rem;}
  .noot{font-size:.72rem;color:var(--soft);text-align:center;margin-top:1rem;line-height:1.5;}
  .fout{color:var(--burgundy);font-size:.8rem;margin-top:.6rem;}
</style>
</head>
<body>
<header><div><div class="ey">Postvak van de zaak</div><h1>RTMAIL</h1></div>
  <span class="tel" id="tel" hidden></span></header>
<main id="main"><div class="leeg">Laden…</div></main>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=null; try{ TOKEN=localStorage.getItem('rtg_sup_token'); }catch(e){}
let LIJST=[], MAP='inbox', ADRES=null;
const tijd=iso=>{ if(!iso) return ''; const d=new Date(iso), nu=new Date(), dag=86400000;
  if(nu-d<dag && d.getDate()===nu.getDate()) return d.toTimeString().slice(0,5);
  if(nu-d<7*dag) return ['zo','ma','di','wo','do','vr','za'][d.getDay()];
  return d.getDate()+'/'+(d.getMonth()+1); };
const langTijd=iso=>{ try{ return new Date(iso).toLocaleString('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };
async function api(pad, body){
  const r=await fetch('/api/supplier/rtmail/'+pad,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify(body||{})});
  const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||'Er ging iets mis.'); return d;
}
function schakelBalk(){
  return '<div class="schakel"><button id="tabIn" class="'+(MAP==='inbox'?'aan':'')+'">Ontvangen</button>'+
    '<button id="tabUit" class="'+(MAP==='verzonden'?'aan':'')+'">Verzonden</button>'+
    '<button id="tabNieuw">Nieuw bericht</button></div>';
}
function bindBalk(){
  const i=$('#tabIn'); if(i) i.addEventListener('click',()=>{ MAP='inbox'; laad(); });
  const u=$('#tabUit'); if(u) u.addEventListener('click',()=>{ MAP='verzonden'; laad(); });
  const n=$('#tabNieuw'); if(n) n.addEventListener('click',()=>opstellen());
}
async function laad(){
  if(!TOKEN){ $('#main').innerHTML='<div class="inlog"><h2>Log eerst in</h2><p style="color:var(--muted);margin-top:.6rem;font-size:.9rem;">Open de leverancier-app en log in met uw zaak; daarna staat het postvak hier.</p></div>'; return; }
  let d; try{ d=await api(MAP==='verzonden'?'verzonden':'inbox'); }catch(e){ $('#main').innerHTML=schakelBalk()+'<div class="leeg">'+esc(e.message)+'</div>'; bindBalk(); return; }
  LIJST=d.berichten||[]; if(d.adres) ADRES=d.adres;
  if(MAP==='inbox' && d.ongelezen){ $('#tel').textContent=d.ongelezen; $('#tel').hidden=false; } else $('#tel').hidden=true;
  const noot='<div class="noot">'+(ADRES?'Uw postadres: '+esc(ADRES)+'. ':'')+'RTMAIL draait op codenamen; echte namen blijven in de kluis.</div>';
  $('#main').innerHTML = schakelBalk() + (LIJST.length ? LIJST.map((m,i)=>
    '<button class="rij'+((MAP==='inbox'&&!m.gelezen)?' ongelezen':'')+'" data-i="'+i+'"><span class="ic">'+(m.van==='rtg@rtmail'?'RTG':esc((MAP==='verzonden'?m.naar:m.van)||'@').replace('@rtmail','').slice(0,4).toUpperCase())+'</span><span class="b"><span class="nm">'+esc(m.onderwerp)+'</span><span class="lt">'+esc(m.tekst)+'</span></span><span class="tijd">'+tijd(m.at)+'</span></button>'
  ).join('')+noot
  : '<div class="leeg">'+(MAP==='verzonden'?'U hebt nog niets verzonden.':'Uw postvak is leeg.<br>Seintjes van RTG en de draaiboeken verschijnen hier.')+'</div>');
  bindBalk();
  $('#main').querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>openBericht(LIJST[+b.dataset.i])));
}
async function openBericht(m){
  let volledig=m;
  if(MAP==='inbox'){ try{ const d=await api('lees',{id:m.id}); if(d.bericht) volledig=d.bericht; }catch(e){} }
  $('#tel').hidden=true;
  const antwoord = (volledig.van && volledig.van!=='rtg@rtmail') ? '<button class="knop rand" id="antwoord">Antwoorden</button>' : '';
  $('#main').innerHTML =
    '<button class="terug" id="terug">← alle berichten</button>'+
    '<div class="kaart"><h2>'+esc(volledig.onderwerp)+'</h2>'+
    '<div class="meta">'+(MAP==='verzonden'?'Aan '+esc(volledig.naar):'Van '+esc(volledig.van))+' · '+esc(langTijd(volledig.at))+'</div>'+
    '<div class="body">'+esc(volledig.tekst)+'</div>'+antwoord+'</div>';
  $('#terug').addEventListener('click', laad);
  const a=$('#antwoord'); if(a) a.addEventListener('click',()=>opstellen({ naar: volledig.van, onderwerp: 'Re: '+volledig.onderwerp }));
}
function opstellen(voor){
  voor=voor||{};
  $('#tel').hidden=true;
  $('#main').innerHTML =
    '<button class="terug" id="terug">← terug</button>'+
    '<div class="kaart"><h2>Nieuw bericht</h2>'+
    '<div class="meta">Stuur naar een andere zaakcode of codenaam. RTMAIL vult "@rtmail" zelf aan.</div>'+
    '<label class="lab">Aan (code of codenaam)</label><input class="veld" id="vNaar" value="'+esc((voor.naar||'').replace('@rtmail',''))+'" placeholder="bijv. groot">'+
    '<label class="lab">Onderwerp</label><input class="veld" id="vOnd" value="'+esc(voor.onderwerp||'')+'">'+
    '<label class="lab">Bericht</label><textarea class="veld" id="vTxt" placeholder="Uw bericht…"></textarea>'+
    '<div class="fout" id="vFout" hidden></div>'+
    '<button class="knop" id="verstuur">Versturen</button></div>';
  $('#terug').addEventListener('click', laad);
  $('#verstuur').addEventListener('click', verstuur);
}
async function verstuur(){
  const naar=$('#vNaar').value.trim(), onderwerp=$('#vOnd').value.trim(), tekst=$('#vTxt').value.trim();
  const f=$('#vFout'); f.hidden=true;
  if(!naar || !tekst){ f.textContent='Vul een ontvanger en een bericht in.'; f.hidden=false; return; }
  const btn=$('#verstuur'); btn.disabled=true; btn.textContent='Versturen…';
  try{ await api('stuur',{naar, onderwerp, tekst}); MAP='verzonden'; laad(); }
  catch(e){ f.textContent=e.message; f.hidden=false; btn.disabled=false; btn.textContent='Versturen'; }
}
laad();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !$('#terug') && !$('#verstuur')) laad(); });
</script>
<script src="/shared/schermbeeld.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/cookie.js" defer></script>
</body>
</html>
