<!doctype html>
<html lang="nl">
<head>
<script src="/shared/id.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hulp van RTG</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<link href="/shared/rtg-ontwerp.css" rel="stylesheet">
<link href="/shared/dagkleur.css" rel="stylesheet">
<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft);
    --merkgoud:var(--rtg-leesgoud,#A98F1C); --sig-let:var(--rtg-sig-aandacht,#A98F1C);
    --sig-ok:var(--rtg-sig-gezond,#4C9A75); }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:3rem;}
  h1{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  h2,h3{font-family:'Inter',system-ui,sans-serif;font-weight:600;}
  a{color:inherit;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 86%,transparent));
    backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 1rem) 1.1rem .7rem;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;}
  header .ey{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--merkgoud);}
  header h1{font-size:1.3rem;margin-top:.05rem;}
  .terug{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:0;
    padding:.5rem .8rem;font:inherit;font-size:.8rem;text-decoration:none;min-height:2.6rem;
    display:inline-flex;align-items:center;}
  main{padding:1.1rem;max-width:820px;margin:0 auto;}
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:0;padding:.95rem 1.1rem;margin-bottom:.75rem;}
  .kaart h2{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--merkgoud);margin-bottom:.4rem;}
  .oms{font-size:.84rem;color:var(--soft);line-height:1.6;max-width:62ch;}
  .rij{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.6rem;}
  .knop{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:0;font:inherit;
    font-size:.82rem;padding:.5rem .8rem;min-height:2.6rem;min-width:2.6rem;cursor:pointer;}
  .knop:hover{border-color:var(--merkgoud);}
  .knop.doe{background:var(--txt);color:#000;border-color:var(--txt);font-weight:600;}
  .veld{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:0;
    padding:.5rem .7rem;font:inherit;font-size:.85rem;min-height:2.6rem;}
  .veld.breed{flex:1 1 14rem;}
  textarea.veld{width:100%;min-height:4.4rem;resize:vertical;}
  select.veld{min-width:11rem;}
  .zaakrij{border-left:2px solid var(--line);padding:.15rem 0 .15rem .6rem;margin-top:.5rem;font-size:.84rem;line-height:1.55;}
  .zaakrij.let{border-left-color:var(--sig-let);}
  .zaakrij .wie{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);}
  .beurt{border-left:2px solid var(--line);padding:.15rem 0 .15rem .6rem;font-size:.83rem;line-height:1.55;margin-top:.45rem;}
  .beurt.melder{border-left-color:var(--merkgoud);}
  .beurt.mens{border-left-color:var(--sig-ok);}
  .beurt.stap{color:var(--soft);font-size:.78rem;}
  .stil{color:var(--soft);font-size:.8rem;line-height:1.6;}
  .melding{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#000;border:1px solid var(--merkgoud);
    color:var(--txt);padding:.55rem .9rem;border-radius:0;font-size:.82rem;opacity:0;transition:opacity .25s;
    pointer-events:none;max-width:90%;z-index:30;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
<link href="/shared/ios.css" rel="stylesheet">
</head>
<body class="rtg-stijl">
<header>
  <a class="terug" href="/apps/leverancier.html">&#8592; Zaak</a>
  <div><div class="ey">RTG Service</div><h1>Hulp van RTG</h1></div>
</header>
<main id="main">
  <p class="oms">Loopt er iets vast met RTG zelf -- een uitbetaling, uw werkplek, een koppeling -- dan meldt u het hier. Wij weten wie u bent; u hoeft geen klantnummer op te zoeken.</p>
  <div id="blad"></div>
</main>
<div class="melding" id="melding" role="status"></div>
<script src="/apps/leverancier-service.js"></script>
<script src="/shared/schermbeeld.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
