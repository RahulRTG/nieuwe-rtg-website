<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Het Privékantoor · Lifestyle Pass</title>
<link rel="icon" href="/icons/partners.svg">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --card2:var(--rtg-card2); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft);
    --burgundy:#C23A5E; --gold:#A98F1C; --green:#4C9A75; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:3rem;}
  h1,h2,h3{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  a{color:inherit;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),rgba(12,12,11,.86));backdrop-filter:blur(8px);padding:1rem 1.1rem .7rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.8rem;}
  header .ey{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
  header h1{font-size:1.4rem;margin-top:.05rem;}
  .terug{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:.4rem .7rem;font:inherit;font-size:.8rem;cursor:pointer;margin-left:auto;}
  main{padding:1.1rem;max-width:820px;margin:0 auto;}
  body.rtg-stijl .chips{display:flex;flex-wrap:nowrap;gap:.15rem;overflow-x:auto;margin:0 0 1.1rem;
    padding:0 0 .1rem;border-bottom:1px solid var(--line);}
  body.rtg-stijl .chips > button.chip{white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;
    border-radius:0;margin-bottom:-1px;padding:.55rem .8rem .6rem;font-family:Inter,system-ui,sans-serif;
    font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;}
  body.rtg-stijl .chips > button.chip:hover{color:var(--txt);border-color:transparent;}
  body.rtg-stijl .chips > button.chip.aan{background:none;color:var(--txt);border-bottom-color:var(--gold);}
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;margin-bottom:1rem;}
  .kaart h2{font-size:1.12rem;margin-bottom:.2rem;}
  .kaart h2 + .sub{color:var(--soft);font-size:.85rem;margin-bottom:.8rem;}
  /* ---- De kop van de Situation Room. Dit is het enige echt grote element op
     de pagina: één zin die zegt of u iets moet doen. Alles eronder onderbouwt
     hem. Geen tweede signatuurelement erbij -- zie CLAUDE.md. ---- */
  .kop{padding:1.6rem 0 1.3rem;border-bottom:1px solid var(--line);margin-bottom:1.2rem;}
  .kop .datum{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);}
  .kop h2{font-size:1.9rem;line-height:1.2;margin-top:.5rem;}
  .kop.hoog h2,.kop.storing h2{color:var(--burgundy);}
  .kop .telling{color:var(--soft);font-size:.85rem;margin-top:.6rem;line-height:1.6;}
  .regel{display:flex;gap:.8rem;align-items:flex-start;border-top:1px solid var(--line);padding:.85rem 0;}
  .regel:first-child{border-top:0;}
  .regel .streep{width:2px;align-self:stretch;background:var(--line);flex-shrink:0;border-radius:2px;}
  .regel.e3 .streep{background:var(--burgundy);}
  .regel.e2 .streep{background:var(--gold);}
  .regel .body{flex:1;min-width:0;}
  .regel b{display:block;font-weight:600;font-size:.94rem;}
  .regel .meta{font-size:.8rem;color:var(--soft);margin-top:.15rem;line-height:1.5;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;margin-bottom:1rem;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;}
  .stat .n{font-family:'Bodoni Moda',serif;font-size:1.6rem;}
  .stat .l{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-top:.15rem;}
  .veld,select.veld,textarea.veld{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit;font-size:.9rem;padding:.55rem .7rem;}
  textarea.veld{min-height:4rem;resize:vertical;}
  .lbl{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:.6rem 0 .25rem;display:block;}
  .knop{background:var(--gold);color:#000;border:none;border-radius:10px;font:inherit;font-weight:600;font-size:.88rem;padding:.55rem 1rem;cursor:pointer;}
  .knop.stil{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:400;}
  .knop.klein{padding:.3rem .6rem;font-size:.78rem;}
  .rij{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end;}
  .rij > div{flex:1;min-width:8rem;}
  .item{border-top:1px solid var(--line);padding:.7rem 0;display:flex;gap:.7rem;align-items:flex-start;}
  .item:first-child{border-top:0;}
  .item .body{flex:1;min-width:0;}
  .item .body b{display:block;}
  .item .meta{font-size:.78rem;color:var(--soft);margin-top:.15rem;line-height:1.5;}
  .status{font-size:.72rem;padding:.15rem .55rem;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;}
  .status.wacht{border-color:var(--gold);color:var(--gold);}
  .status.loopt{border-color:var(--green);color:var(--green);}
  .status.klaar,.status.weg{opacity:.55;}
  .leeg{color:var(--soft);font-size:.88rem;padding:.4rem 0;}
  /* de plattegrond: twintig werelden, de nog-niet-gebouwde ingetogen maar zichtbaar */
  .kamers{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:.7rem;}
  .kamer{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;display:block;text-decoration:none;}
  .kamer h3{font-size:1rem;}
  .kamer .wat{font-size:.78rem;color:var(--soft);margin-top:.3rem;line-height:1.5;}
  .kamer .tel{font-size:.72rem;color:var(--muted);margin-top:.55rem;letter-spacing:.04em;}
  .kamer.aanbouw{opacity:.5;}
  .kamer .apps{margin-top:.5rem;display:flex;gap:.35rem;flex-wrap:wrap;}
  .kamer .apps a{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:.14rem .5rem;color:var(--muted);text-decoration:none;}
  .kamer .apps a:hover{border-color:var(--gold);color:var(--txt);}
  /* de mandaatschuif */
  .niv{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.35rem;}
  .niv button{background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);font:inherit;font-size:.72rem;padding:.25rem .55rem;cursor:pointer;}
  .niv button.aan{border-color:var(--gold);color:var(--gold);}
  .niv button:disabled{opacity:.3;cursor:not-allowed;}
  .chatbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.8rem;min-height:3rem;font-size:.92rem;line-height:1.55;white-space:pre-wrap;}
  .melding{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:.6rem 1rem;font-size:.85rem;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none;}
  .inlog{text-align:center;padding:2.5rem 1rem;}
  /* Kleine hulpklassen in plaats van style="..."-attributen: elk zo'n attribuut
     houdt style-src-attr open in de CSP, en de meter telt ze. Vandaar hier en
     niet in de opbouw van de HTML. */
  .knoprij{display:flex;gap:.4rem;margin-top:.5rem;}
  .goud{color:var(--gold);}
  .rood{color:var(--burgundy);}
  .zacht{opacity:.7;}
  .mt-s{margin-top:.5rem;}
  .mt-m{margin-top:.7rem;}
  .mt-l{margin-top:1rem;}
  .fijn{font-size:.78rem;color:var(--soft);line-height:1.6;}
  .fijn.mt{margin-top:.55rem;}
  .fijner{font-size:.75rem;color:var(--soft);margin-top:.4rem;}
  .fijner.goud{color:var(--gold);margin-top:.45rem;}
  .briefkop{font-family:'Bodoni Moda',serif;font-size:1.15rem;margin:.6rem 0 .2rem;}
  .kaart.let{border-color:var(--burgundy);}
  .verborgen{display:none;}
</style>
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/dagkleur.css" rel="stylesheet">
<script src="/shared/seizoen.js" defer></script>
<link href="/shared/ios.css" rel="stylesheet">
</head>
<body class="rtg-stijl">
<header>
  <div><div class="ey">Lifestyle Pass</div><h1>Het Privékantoor</h1></div>
  <a class="terug" href="/apps/app.html?pas=lifestyle">← app</a>
</header>
<main id="main"><div class="leeg">Laden…</div></main>
<div class="melding" id="melding"></div>

<script src="/shared/deur.js"></script>
<script src="/shared/uitvoer.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=null; try{ TOKEN = localStorage.getItem('rtg_member_token'); }catch(e){}
function meld(t){ const m=$('#melding'); m.textContent=t; m.style.opacity='1'; clearTimeout(m._t); m._t=setTimeout(()=>m.style.opacity='0',2600); }
const api = (pad, body) => fetch('/api/member/bureau/'+pad, {
  method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+TOKEN}, body:JSON.stringify(body||{})
}).then(async r=>{ const d=await r.json().catch(()=>({})); if(!r.ok){ const e=new Error(d.error||'Er ging iets mis.'); e.status=r.status; throw e; } return d; });
const euro = c => '€ ' + Math.round(Number(c||0)/100).toLocaleString('nl-NL');
const MND=['','jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
function datum(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return Number(dd)+' '+MND[Number(m)]+' '+y; }

let tab='nu';
const TABS=[['nu','Nu'],['vooruit','Vooruit'],['zaken','Zaken'],['kantoor','Kantoor'],['woning','Woning'],['mandaat','Mandaat'],['graaf','Overzicht']];

/* Meenemen (shared/uitvoer.js): elk paneel meldt zijn eigen lijst aan, zodat wat
   u exporteert hetzelfde is als wat u ziet. De besloten kamers (gezondheid,
   nalatenschap) leveren hier niets aan: die blijven op het scherm. */
let UIT=null;
function zetUit(naam, kolommen, rijen){ UIT = rijen.length ? { naam:naam, kolommen:kolommen, rijen:rijen } : null; }
if(window.RTGUitvoer) RTGUitvoer.bron(function(){ return UIT; });

async function start(){
  if(!TOKEN){ $('#main').innerHTML='<div class="inlog"><h2>Log eerst in</h2><p class="fijn mt">Het Privékantoor is er voor leden met een Lifestyle Pass. Open de app en log in met uw RTG-account.</p><p class="mt-l"><a href="/apps/app.html">Naar de app →</a></p></div>'; return; }
  try{ await api('overzicht'); }catch(e){
    if(e.status===403){ RTGDeur.toon($('#main'), { soort:'pas', pas:'Lifestyle' }); return; }
    $('#main').innerHTML='<div class="leeg">Kon het Privékantoor niet laden.</div>'; return;
  }
  teken();
}
function teken(){
  $('#main').innerHTML = '<div class="chips" id="chips"></div><div id="paneel"><div class="leeg">Laden…</div></div>';
  $('#chips').innerHTML = TABS.map(([k,l])=>'<button class="chip'+(k===tab?' aan':'')+'" data-t="'+k+'">'+l+'</button>').join('');
  $('#chips').querySelectorAll('.chip').forEach(b=> b.onclick=()=>{ tab=b.dataset.t; teken(); });
  ({nu:vNu, vooruit:vVooruit, zaken:vZaken, kantoor:vKantoor, woning:vWoning, mandaat:vMandaat, graaf:vGraaf}[tab])();
}
const P = h => { $('#paneel').innerHTML = h; };
const fout = e => P('<div class="leeg">'+esc(e.message)+'</div>');

/* ============================ NU -- de Situation Room ============================
   Eén kop, en daaronder alleen regels die die kop waarmaken. De beslissingen
   krijgen hier meteen hun twee knoppen: wie op dit scherm ziet dat er iets op
   hem wacht, hoort het niet ergens anders te moeten gaan zoeken. */
async function vNu(){
  let d; try{ d = await api('nu'); }catch(e){ return fout(e); }
  const t = d.tellingen;
  let h = '<div class="kop '+esc(d.ernst)+'"><div class="datum">'+esc(datum(d.datum))+'</div><h2>'+esc(d.kop)+'</h2>'
    + '<div class="telling">'+t.knopen+' zaken in uw kantoor'
    + (t.lopend? ' · '+t.lopend+' in behandeling':'')
    + (t.dezeWeek? ' · '+t.dezeWeek+' deze week':'')
    + '</div></div>';

  h += '<div class="kaart"><h2>Uw briefing</h2><div class="sub">Eén bericht, geen zevenendertig meldingen.</div>'
    + '<div class="niv"><button class="js-brief aan" data-m="ochtend">Ochtend</button>'
    + '<button class="js-brief" data-m="avond">Avond</button></div><div id="brUit"></div></div>';

  h += '<div class="kaart"><h2>Wij gaan weg</h2><div class="sub">Noem de periode. Wij zoeken op wat daar in uw andere apps mee samenhangt.</div>'
    + '<div class="rij"><div><label class="lbl">Van</label><input class="veld" id="rvV" type="date"></div>'
    + '<div><label class="lbl">Tot</label><input class="veld" id="rvT" type="date"></div>'
    + '<button class="knop stil" id="rvK">Wat raakt dat?</button></div><div id="rvUit"></div></div>';

  h += '<div class="kaart"><h2>Rahul</h2><div class="sub">Zeg wat u geregeld wilt hebben. Hij noteert en legt aan; bevestigen doet een mens.</div>'
    + '<div class="rij"><div><input class="veld" id="aiV" placeholder="Wij gaan in augustus zes weken naar Ibiza…"></div>'
    + '<button class="knop" id="aiK">Vraag</button></div>'
    + '<div class="chatbox verborgen mt-m" id="aiUit"></div></div>';

  if(!d.regels.length){
    h += '<div class="kaart"><div class="leeg">Er staat niets open. Wij houden het in de gaten.</div></div>';
  } else {
    h += '<div class="kaart">' + d.regels.map(r=>{
      const kn = r.soort==='beslissing'
        ? '<div class="knoprij"><button class="knop klein js-ja" data-id="'+esc(r.id)+'">Akkoord</button>'
          + '<button class="knop klein stil js-nee" data-id="'+esc(r.id)+'">Afzien</button></div>' : '';
      return '<div class="regel e'+r.ernst+'"><div class="streep"></div><div class="body">'
        + '<b>'+esc(r.tekst)+'</b><div class="meta">'+esc(r.detail||'')+'</div>'+kn+'</div></div>';
    }).join('') + '</div>';
  }
  P(h);
  zetUit('Nu', ['Soort','Wat','Toelichting'], d.regels.map(r=>[r.soort, r.tekst, r.detail||'']));

  async function brief(moment){
    const u = $('#brUit'); u.innerHTML = '<div class="leeg">Een moment…</div>';
    try{
      const d = await api('briefing', {moment});
      const lijst = (t, a, hoe) => a.length ? '<div class="lbl">'+t+'</div>' + a.map(hoe).join('') : '';
      const punt = x => '<div class="meta">' + esc((x.waarvan? x.waarvan+' · ':'') + x.naam) + ' · ' + esc(datum(x.datum)) + '</div>';
      u.innerHTML = '<div class="briefkop">' + esc(d.kop) + '</div>'
        + (moment==='ochtend'
          ? lijst('Vandaag', d.vandaag, punt) + lijst('Morgen', d.morgen, punt)
            + lijst('Verder deze week', d.restVanDeWeek, punt)
            + lijst('Achterstallig', d.achterstallig, punt)
            + lijst('Wacht op u', d.beslissingen, x=>'<div class="meta">'+esc(x.titel)+' · '+esc(x.reden)+'</div>')
            + lijst('Wij doen vandaag', d.wijDoen, x=>'<div class="meta">'+esc(x.titel)+' ('+esc(x.team.join(', '))+')</div>')
          : lijst('Vandaag gebeurd', d.gebeurd, x=>'<div class="meta">'+esc(x.zaak)+' → '+esc(x.status)+'<br><span class="zacht">'+esc(x.notitie)+'</span></div>')
            + '<div class="meta mt-s">' + d.doorOns + ' door ons, ' + d.doorU + ' door u · ' + d.lopend + ' lopen er nog.</div>'
            + lijst('Morgen', d.morgen, punt)
            + lijst('Wacht op u', d.beslissingen, x=>'<div class="meta">'+esc(x.titel)+'</div>'));
    }catch(e){ u.innerHTML = '<div class="leeg">'+esc(e.message)+'</div>'; }
  }
  $('#paneel').querySelectorAll('.js-brief').forEach(b=> b.onclick=()=>{
    $('#paneel').querySelectorAll('.js-brief').forEach(x=>x.classList.remove('aan'));
    b.classList.add('aan'); brief(b.dataset.m);
  });
  brief('ochtend');
  $('#rvK').onclick = async () => {
    const u = $('#rvUit'); u.innerHTML = '<div class="leeg">Een moment…</div>';
    try{
      const r = await api('raakvlak', { van:$('#rvV').value, tot:$('#rvT').value, domein:'reizen' });
      u.innerHTML = '<div class="lbl">' + r.dagen + ' dagen · ' + r.raakt.length + ' punten uit uw apps</div>'
        + (r.raakt.length ? r.raakt.map(x=>'<div class="regel e2"><div class="streep"></div><div class="body"><b>'
            + esc((x.waarvan? x.waarvan+' · ':'')+x.naam) + '</b><div class="meta">' + esc(x.bron) + ' · ' + esc(datum(x.datum)) + '</div></div></div>').join('')
           : '<div class="leeg">Er valt niets in die periode.</div>')
        + '<div class="lbl mt-m">Wat wij dan oppakken</div>'
        + r.keten.map(k=>'<div class="meta">' + esc(k.wat) + (k.raakt.length? ' <span class="goud">('+k.raakt.length+' concreet)</span>':'')
            + '<br><span class="zacht">' + esc(k.waarom) + '</span></div>').join('')
        + '<div class="meta mt-m rood">Hier hebben wij nog geen zicht op: ' + r.nietGedekt.join(', ') + '.</div>';
    }catch(e){ u.innerHTML = '<div class="leeg">'+esc(e.message)+'</div>'; }
  };
  $('#aiK').onclick = async () => {
    const v = $('#aiV').value.trim(); if(!v) return;
    const u = $('#aiUit'); u.style.display='block'; u.textContent='Een moment…';
    try{ const a = await api('ai', {vraag:v}); u.textContent = a.antwoord; }
    catch(e){ u.textContent = e.message; }
  };
  $('#paneel').querySelectorAll('.js-ja,.js-nee').forEach(b => b.onclick = async () => {
    try{ await api('zaak/beslis', {id:b.dataset.id, akkoord:b.classList.contains('js-ja')});
      meld(b.classList.contains('js-ja')?'Akkoord genoteerd.':'Genoteerd; wij zien ervan af.'); vNu(); }
    catch(e){ meld(e.message); }
  });
}

/* ======================= VOORUIT -- de Control Tower ==========================
   Alle datums uit alle premium-apps, in vier vensters. Achterstallig staat
   bovenaan en apart: dat venster bestond nergens. */
async function vVooruit(){
  let d; try{ d = await api('tower'); }catch(e){ return fout(e); }
  const regel = r => '<div class="item"><div class="body"><b>'+esc((r.waarvan? r.waarvan+' · ':'')+r.naam)+'</b>'
    + '<div class="meta">'+esc(r.bron)+' · '+esc(datum(r.datum))
    + (r.dagen<0 ? ' · <span class="rood">'+Math.abs(r.dagen)+' dagen te laat</span>'
      : r.dagen===0 ? ' · vandaag' : ' · over '+r.dagen+' dagen')
    + '</div></div></div>';
  let h = '';
  if(d.achterstallig.length){
    h += '<div class="kaart let"><h2>Achterstallig</h2>'
      + '<div class="sub">Deze datums zijn voorbij. Ze stonden in uw apps, maar nergens bij elkaar.</div>'
      + d.achterstallig.map(regel).join('') + '</div>';
  }
  for(const v of d.vensters){
    h += '<div class="kaart"><h2>'+esc(v.label)+'</h2><div class="sub">'+v.aantal+(v.aantal===1?' punt':' punten')+'</div>'
      + (v.items.length ? v.items.map(regel).join('') : '<div class="leeg">Niets.</div>') + '</div>';
  }
  h += '<div class="kaart"><div class="leeg">'+d.totaal+' termijnen in beeld'+(d.later? ', waarvan '+d.later+' verder weg dan een jaar':'')
    + '. Alles hierboven komt uit een datum die u zelf ergens heeft ingevuld; wij verzinnen er geen bij.</div></div>';
  P(h);
  const alle = d.achterstallig.concat(...d.vensters.map(v=>v.items));
  zetUit('Vooruit', ['Wat','Waarvan','Bron','Datum','Dagen'], alle.map(r=>[r.naam, r.waarvan, r.bron, r.datum, r.dagen]));
}

/* ============================ ZAKEN -- de cases ============================== */
const SOORT_UITLEG = {
  regulier:'Loopt langs uw mandaat: binnen uw grenzen pakken wij het op, daarbuiten leggen wij het u voor.',
  bijzonder:'Het verzoek dat niet in een formulier past. Gaat altijd langs een van onze mensen, en altijd langs u.',
  warroom:'Er is iets misgegaan. Wij zetten er direct mensen op en vragen pas om een besluit als het nodig is.'
};
async function vZaken(){
  let d, del; try{ [d, del] = await Promise.all([api('zaken'), api('delegatie')]); }catch(e){ return fout(e); }
  const doms = del.domeinen.map(x=>'<option value="'+esc(x.domein)+'">'+esc(x.naam)+'</option>').join('');
  let h = '<div class="kaart"><h2>Een zaak aanleggen</h2><div class="sub">Zegt u wat er moet gebeuren. Wij bepalen wie het oppakt.</div>'
    + '<label class="lbl">Wat wilt u geregeld hebben</label><input class="veld" id="zT" placeholder="Diner voor twaalf, zaterdag, bij ons thuis">'
    + '<label class="lbl">Toelichting</label><textarea class="veld" id="zW" placeholder="Alles wat wij moeten weten."></textarea>'
    + '<div class="rij"><div><label class="lbl">Soort</label><select class="veld" id="zS">'
    + d.soorten.map(s=>'<option value="'+s+'">'+({regulier:'Regulier',bijzonder:'Bijzonder verzoek',warroom:'Incident'}[s])+'</option>').join('')
    + '</select></div><div><label class="lbl">Domein</label><select class="veld" id="zD">'+doms+'</select></div>'
    + '<div><label class="lbl">Richtbedrag (euro)</label><input class="veld" id="zB" type="number" min="0" placeholder="0"></div></div>'
    + '<div class="meta fijn mt" id="zU"></div>'
    + '<div class="mt-m"><button class="knop" id="zK">Aanleggen</button></div></div>';

  h += '<div class="kaart"><h2>Uw zaken</h2><div class="sub">'+d.open+' open · '+d.beslissingen+' wacht op u</div>'
    + (d.zaken.length ? d.zaken.map(z=>{
      const kl = z.status==='wacht op uw akkoord'?'wacht': z.status==='in uitvoering'?'loopt': (z.status==='geregeld'?'klaar':(z.beslissing.gegeven==='afgewezen'||z.status==='ingetrokken'||z.status==='afgewezen'?'weg':''));
      const laatste = z.tijdlijn[z.tijdlijn.length-1] || {};
      return '<div class="item"><div class="body"><b>'+esc(z.titel)+'</b>'
        + '<div class="meta">'+esc(z.team.map(t=>t.rol).join(' · '))
        + (z.bedragCenten? ' · '+euro(z.bedragCenten):'')
        + (z.besloten? ' · <span class="goud">besloten, blijft bij u</span>':'')
        + '<br>'+esc(laatste.notitie||'')+'</div>'
        + (z.beslissing.nodig ? '<div class="knoprij">'
            + '<button class="knop klein js-ja" data-id="'+esc(z.id)+'">Akkoord</button>'
            + '<button class="knop klein stil js-nee" data-id="'+esc(z.id)+'">Afzien</button></div>' : '')
        + '</div><span class="status '+kl+'">'+esc(z.status)+'</span></div>';
    }).join('') : '<div class="leeg">Er lopen nog geen zaken.</div>') + '</div>';
  P(h);
  zetUit('Zaken', ['Titel','Soort','Domein','Status','Bedrag'], d.zaken.map(z=>[z.titel,z.soort,z.domein,z.status,z.bedragCenten/100]));

  const toonUitleg = () => { $('#zU').textContent = SOORT_UITLEG[$('#zS').value] || ''; };
  $('#zS').onchange = toonUitleg; toonUitleg();
  $('#zK').onclick = async () => {
    const titel = $('#zT').value.trim(); if(!titel) return meld('Waarmee kunnen wij u van dienst zijn?');
    try{
      const r = await api('zaak/open', { titel, wat:$('#zW').value.trim(), soort:$('#zS').value,
        domein:$('#zD').value, bedragCenten: Math.round((Number($('#zB').value)||0)*100) });
      meld(r.zaak.beslissing.nodig ? 'Aangelegd. Er ligt een besluit voor u klaar.' : 'Aangelegd. Wij pakken het op.');
      vZaken();
    }catch(e){ meld(e.message); }
  };
  $('#paneel').querySelectorAll('.js-ja,.js-nee').forEach(b => b.onclick = async () => {
    try{ await api('zaak/beslis', {id:b.dataset.id, akkoord:b.classList.contains('js-ja')}); vZaken(); }
    catch(e){ meld(e.message); }
  });
}

/* ==================== KANTOOR -- de plattegrond van twintig ==================== */
async function vKantoor(){
  let d; try{ d = await api('kamers'); }catch(e){ return fout(e); }
  const kaart = k => '<div class="kamer'+(k.status==='in aanbouw'?' aanbouw':'')+'">'
    + '<h3>'+esc(k.naam)+'</h3><div class="wat">'+esc(k.wat)+'</div>'
    + (k.apps.length ? '<div class="apps">'+k.apps.map(a=>'<a href="'+esc(a.url)+'">'+esc(a.naam)+'</a>').join('')+'</div>' : '')
    + '<div class="tel">'+(k.status==='in aanbouw' ? 'In aanbouw'
        : k.gevuld ? k.knopen+' in beeld'+(k.termijnen? ' · '+k.termijnen+' met een datum':'')+(k.waarde? ' · '+euro(k.waarde):'')
        : 'Nog niets vastgelegd')+'</div></div>';
  P('<div class="kaart"><h2>Uw kantoor</h2><div class="sub">'+d.ingericht+' werelden ingericht, '+d.inAanbouw+' in aanbouw. '
    + 'Wat in aanbouw staat, staat er omdat het erbij hoort, niet omdat het er al is.</div></div>'
    + '<div class="kamers">'+d.kamers.map(kaart).join('')+'</div>');
  zetUit('Kantoor', ['Wereld','Status','In beeld','Waarde'], d.kamers.map(k=>[k.naam,k.status,k.knopen,k.waarde/100]));
}

/* ==================== WONING -- de digitale tweeling ==========================
   Per woning uit uw register: ruimtes, en daarin wat er hangt of staat. De
   datums die u hier invult lopen langs dezelfde Control Tower als uw
   verzekeringen -- deze pagina heeft geen eigen waarschuwingen. */
let twinHuis='';
async function vWoning(){
  let d; try{ d = await api('twin', {huisId:twinHuis}); }catch(e){ return fout(e); }
  if(!d.woningen.length) return P('<div class="kaart"><h2>Uw woningen</h2>'
    + '<div class="leeg">U heeft nog geen vastgoed in uw register staan. Leg een woning vast onder Zaken → uw bezittingen, dan kunt u hem hier inrichten.</div></div>');
  let h = '<div class="kaart"><h2>Uw woningen</h2><div class="sub">Kies een woning om hem in te richten.</div>'
    + '<div class="niv">' + d.woningen.map(w=>'<button class="js-huis'+(twinHuis===w.id?' aan':'')+'" data-h="'+esc(w.id)+'">'
      + esc(w.naam) + ' · ' + w.installaties + '</button>').join('') + '</div></div>';
  if(d.gekozen){
    const g = d.gekozen;
    h += '<div class="kaart"><h2>' + esc(g.naam) + '</h2><div class="sub">' + g.ruimtes.length + ' ruimtes</div>'
      + '<div class="rij"><div><input class="veld" id="rNaam" placeholder="Naam van een ruimte (Zwembad)"></div>'
      + '<button class="knop klein" id="rK">Ruimte erbij</button></div></div>';
    for(const r of g.ruimtes){
      h += '<div class="kaart"><h2>' + esc(r.naam) + '</h2>'
        + ((r.installaties||[]).length ? (r.installaties||[]).map(i=>
            '<div class="item"><div class="body"><b>' + esc(i.naam) + '</b><div class="meta">'
            + [i.merk, i.soort, i.geplaatst? 'geplaatst '+datum(i.geplaatst):'', i.leverancier].filter(Boolean).map(esc).join(' · ')
            + (i.onderhoudOp? '<br>Volgende beurt: ' + esc(datum(i.onderhoudOp)) : '')
            + (i.garantieTot? ' · garantie tot ' + esc(datum(i.garantieTot)) : '')
            + ((i.historie||[]).length? '<br>' + i.historie.length + ' beurt(en) bijgeschreven, laatst: ' + esc(i.historie[0].wat) + ' (' + esc(datum(i.historie[0].op)) + ')' : '')
            + '</div></div><button class="knop klein stil js-beurt" data-i="' + esc(i.id) + '">Beurt</button></div>').join('')
          : '<div class="leeg">Nog niets vastgelegd in deze ruimte.</div>')
        + '<div class="rij mt-s"><div><input class="veld js-iNaam" data-r="' + esc(r.id) + '" placeholder="Wat staat hier (Pomp 2)"></div>'
        + '<div><input class="veld js-iMerk" data-r="' + esc(r.id) + '" placeholder="Merk"></div>'
        + '<div><label class="lbl">Volgende beurt</label><input class="veld js-iDat" data-r="' + esc(r.id) + '" type="date"></div>'
        + '<button class="knop klein js-iK" data-r="' + esc(r.id) + '">Erbij</button></div></div>';
    }
  }
  P(h);
  if(d.gekozen) zetUit('Woning', ['Ruimte','Wat','Merk','Volgende beurt','Leverancier'],
    d.gekozen.ruimtes.flatMap(r=>(r.installaties||[]).map(i=>[r.naam,i.naam,i.merk,i.onderhoudOp,i.leverancier])));
  $('#paneel').querySelectorAll('.js-huis').forEach(b=> b.onclick=()=>{ twinHuis=b.dataset.h; vWoning(); });
  const rk = $('#rK'); if(rk) rk.onclick = async () => {
    const naam = $('#rNaam').value.trim(); if(!naam) return meld('Hoe heet de ruimte?');
    try{ await api('twin/ruimte', {huisId:twinHuis, naam}); vWoning(); }catch(e){ meld(e.message); }
  };
  $('#paneel').querySelectorAll('.js-iK').forEach(b=> b.onclick = async () => {
    const q = sel => $('#paneel').querySelector(sel + '[data-r="' + b.dataset.r + '"]');
    const naam = q('.js-iNaam').value.trim(); if(!naam) return meld('Wat staat hier?');
    try{ await api('twin/installatie', {huisId:twinHuis, ruimteId:b.dataset.r, naam,
      merk:q('.js-iMerk').value.trim(), onderhoudOp:q('.js-iDat').value}); vWoning(); }
    catch(e){ meld(e.message); }
  });
  $('#paneel').querySelectorAll('.js-beurt').forEach(b=> b.onclick = async () => {
    const wat = prompt('Wat is er gedaan?'); if(!wat) return;
    const vlg = prompt('Volgende beurt (jjjj-mm-dd, mag leeg)') || '';
    try{ await api('twin/beurt', {huisId:twinHuis, id:b.dataset.i, wat, volgende:vlg}); vWoning(); }
    catch(e){ meld(e.message); }
  });
}

/* ======================== MANDAAT -- de delegatie-engine =======================
   Het scherm waar het lid bepaalt hoeveel kantoor hij koopt. Het dak per domein
   staat erbij: een niveau dat niet kan, is uitgeschakeld en niet stiekem
   weggelaten -- dan zou het lijken of het er nooit was. */
async function vMandaat(){
  let d; try{ d = await api('delegatie'); }catch(e){ return fout(e); }
  let h = '<div class="kaart"><h2>Wat mogen wij zelf?</h2><div class="sub">Per onderwerp bepaalt u hoe ver wij gaan, en tot welk bedrag. '
    + 'Alles staat standaard op voorbereiden: wij doen niets zonder uw akkoord tot u dat verandert.</div>'
    + d.niveaus.map(n=>'<div class="meta fijn"><b>L'+n.n+' '+esc(n.label)+'</b> · '+esc(n.uitleg)+'</div>').join('')
    + '</div>';
  h += d.domeinen.map(x=>'<div class="kaart"><h2>'+esc(x.naam)+'</h2>'
    + '<div class="niv">'+d.niveaus.map(n=>'<button class="js-niv'+(n.n===x.niveau?' aan':'')+'" data-d="'+esc(x.domein)+'" data-n="'+n.n+'"'
        + (n.n>x.dak?' disabled title="Over dit onderwerp beslist u zelf."':'')+'>L'+n.n+' '+esc(n.label)+'</button>').join('')+'</div>'
    + (x.dak<4 ? '<div class="meta fijner goud">Verder dan L'+x.dak+' gaat het hier niet. Over dit onderwerp beslist u zelf.</div>':'')
    + (x.niveau>=3 ? '<label class="lbl">Uw grens per zaak (euro)</label>'
        + '<div class="rij"><div><input class="veld js-grens" data-d="'+esc(x.domein)+'" type="number" min="0" value="'+Math.round(x.grensCenten/100)+'"></div>'
        + '<button class="knop klein js-grensk" data-d="'+esc(x.domein)+'">Vastzetten</button></div>'
        + '<div class="meta fijner">Tot dit bedrag pakken wij het op zonder u te storen. Daarboven leggen wij het voor.</div>' : '')
    + '</div>').join('');
  if(d.log.length){
    h += '<div class="kaart"><h2>Wat u ons gaf</h2><div class="sub">Elke wijziging, met de oude stand erbij.</div>'
      + d.log.map(l=>'<div class="item"><div class="body"><b>'+esc(l.naam)+'</b><div class="meta">L'+l.van+' → L'+l.naar
      + (l.grensNaar!==l.grensVan? ' · grens '+euro(l.grensVan)+' → '+euro(l.grensNaar):'')+' · '+esc(String(l.op).slice(0,10))+'</div></div></div>').join('')+'</div>';
  }
  P(h);
  const zet = async (domein, niveau, grensCenten) => {
    const huidig = d.domeinen.find(x=>x.domein===domein);
    try{ await api('delegatie/zet', { domein, niveau: niveau==null?huidig.niveau:niveau,
      grensCenten: grensCenten==null?huidig.grensCenten:grensCenten });
      meld('Vastgelegd.'); vMandaat(); }
    catch(e){ meld(e.message); }
  };
  $('#paneel').querySelectorAll('.js-niv').forEach(b=> b.onclick=()=> zet(b.dataset.d, Number(b.dataset.n), null));
  $('#paneel').querySelectorAll('.js-grensk').forEach(b=> b.onclick=()=>{
    const inp = $('#paneel').querySelector('.js-grens[data-d="'+b.dataset.d+'"]');
    zet(b.dataset.d, null, Math.round((Number(inp.value)||0)*100));
  });
}

/* ===================== OVERZICHT -- de Life Graph, doorloopbaar =================
   Geen bollenplaatje. De vraag die een mens stelt is "wat raakt dit nog meer?",
   en dat is een lijst: dit ding, waar het onder hangt, en wat eraan hangt. */
let graafKamer='';
async function vGraaf(){
  let d; try{ d = await api('graaf'); }catch(e){ return fout(e); }
  const knopen = d.graaf.knopen;
  const kamers = [...new Set(knopen.map(k=>k.kamer))].sort();
  const zicht = graafKamer ? knopen.filter(k=>k.kamer===graafKamer) : knopen;
  const GEV=['open','persoonlijk','vertrouwelijk','besloten'];
  let h = '<div class="kaart"><h2>Alles wat wij van u weten</h2>'
    + '<div class="sub">'+knopen.length+' zaken uit '+[...new Set(knopen.map(k=>k.bron))].length+' apps. Bij elk staat waar het vandaan komt, '
    + 'wie het mag zien en wanneer het aandacht vraagt. Dit is geen kopie: het staat in de app waar u het invulde.</div>'
    + '<div class="niv"><button class="js-kam'+(graafKamer?'':' aan')+'" data-k="">Alles</button>'
    + kamers.map(k=>'<button class="js-kam'+(graafKamer===k?' aan':'')+'" data-k="'+esc(k)+'">'+esc(k)+'</button>').join('')+'</div></div>';
  h += '<div class="kaart">' + (zicht.length ? zicht.slice(0,300).map(k=>
    '<div class="item"><div class="body"><b>'+esc(k.naam)+'</b><div class="meta">'
    + esc(k.bron)+' · '+esc(k.kamer)+' · '+GEV[k.gevoelig]
    + (k.deel==='lid'? ' · <span class="goud">blijft bij u</span>' : k.deel==='rechterhand'? ' · uw Rechterhand' : ' · ook het bureau')
    + (k.waarde? ' · '+euro(k.waarde):'')
    + (k.vervalt? ' · '+esc(k.vervaltWat)+' '+esc(datum(k.vervalt)):'')
    + '</div></div><button class="knop klein stil js-kn" data-id="'+esc(k.id)+'">Verband</button></div>').join('')
    : '<div class="leeg">Niets in deze kamer.</div>') + '</div>';
  P(h);
  zetUit('Overzicht', ['Naam','Bron','Kamer','Gevoeligheid','Zichtbaar voor','Vervalt'],
    zicht.map(k=>[k.naam,k.bron,k.kamer,GEV[k.gevoelig],k.deel,k.vervalt]));
  $('#paneel').querySelectorAll('.js-kam').forEach(b=> b.onclick=()=>{ graafKamer=b.dataset.k; vGraaf(); });
  $('#paneel').querySelectorAll('.js-kn').forEach(b=> b.onclick=async()=>{
    try{
      const r = await api('knoop',{id:b.dataset.id});
      const lijst = (t,a) => a.length ? '<div class="lbl">'+t+'</div>'+a.map(x=>'<div class="meta">'+esc(x.naam)+' · '+esc(x.bron)+(x.vervalt?' · '+esc(datum(x.vervalt)):'')+'</div>').join('') : '';
      const el = document.createElement('div');
      el.className='kaart'; el.style.borderColor='var(--gold)';
      el.innerHTML = '<h2>'+esc(r.knoop.naam)+'</h2><div class="sub">'+esc(r.knoop.bron)+' · '+esc(r.knoop.kamer)+'</div>'
        + (r.ouder? '<div class="lbl">Hangt onder</div><div class="meta">'+esc(r.ouder.naam)+'</div>':'')
        + lijst('Hieraan hangt', r.kinderen) + lijst('Hier vlakbij', r.naast)
        + (!r.ouder && !r.kinderen.length && !r.naast.length ? '<div class="leeg">Dit staat op zichzelf.</div>':'');
      b.closest('.item').after(el);
      b.remove();
    }catch(e){ meld(e.message); }
  });
}
start();
</script>
