<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTF Living Lab</title>
<link rel="icon" href="/icons/foundation.svg">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rosthema.css" rel="stylesheet">
<script src="/shared/levendekleur.js" defer></script>
<script src="/shared/rosthema.js" defer></script>
<link href="/shared/rtg-ui.css" rel="stylesheet">
<style>
  :root{--bg:var(--rtg-bg);--card:var(--rtg-card);--line:var(--rtg-line);--txt:var(--rtg-txt);--muted:var(--rtg-muted);--soft:var(--rtg-soft);--burgundy:#C23A5E;--gold:#A98F1C;--green:#4C9A75;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;padding-bottom:2rem;}
  h1,h2,h3{font-family:'Bodoni Moda',serif;font-weight:500;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 86%,transparent));backdrop-filter:blur(8px);padding:.9rem 1rem .6rem;border-bottom:1px solid var(--line);display:flex;align-items:end;gap:.8rem;}
  header .ey{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);}
  header h1{font-size:1.25rem;}
  header a{margin-left:auto;color:var(--muted);font-size:.78rem;text-decoration:none;}
  main{padding:1rem;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:.9rem;}
  .kaart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.85rem .95rem;}
  .sec{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:.2rem 0;}
  .rij{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;}
  .veld{flex:1;min-width:8rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit;font-size:.88rem;padding:.55rem .7rem;}
  select.veld{color-scheme:dark;}
  .knop{background:var(--txt);color:#000;border:none;border-radius:11px;padding:.55rem .9rem;font:inherit;font-weight:600;font-size:.84rem;cursor:pointer;}
  .knop.stil{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:500;}
  .chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem;}
  .chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.35rem .8rem;font-size:.8rem;color:var(--txt);cursor:pointer;}
  .chip.aan{background:var(--gold);color:#000;border-color:var(--gold);}
  .pil{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:.15rem .55rem;color:var(--muted);}
  .pil.ok{color:var(--green);border-color:var(--green);}
  .pil.wacht{color:var(--gold);border-color:var(--gold);}
  .pil.let{color:var(--burgundy);border-color:var(--burgundy);}
  .leeg{color:var(--muted);font-size:.85rem;padding:.4rem 0;}
  .log{font-size:.8rem;color:var(--muted);line-height:1.5;padding:.2rem 0;border-bottom:1px solid var(--line);}
  .ai{border-left:2px solid var(--gold);padding-left:.6rem;font-size:.84rem;line-height:1.55;margin-top:.4rem;}
  .deel{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:1.6rem 0 .5rem;}

  /* DE ONDERZOEKSROUTE -- het signatuurelement van deze app.
     De tien stappen als een pad dat je aflegt, niet als een voortgangsbalkje:
     je ziet waar je bent, wat er achter je ligt en wat de volgende stap vraagt.
     Een cyclus die alleen als percentage in beeld komt, leest als een formulier
     dat af moet; als pad leest hij als onderzoek dat ergens heen gaat. */
  .route{display:flex;gap:0;overflow-x:auto;padding:.5rem 0 .3rem;}
  .stap{flex:0 0 auto;display:flex;align-items:center;gap:.35rem;padding-right:.35rem;}
  .stap .bol{width:1.35rem;height:1.35rem;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;font-size:.62rem;color:var(--muted);}
  .stap.af .bol{background:var(--green);border-color:var(--green);color:#000;}
  .stap.nu .bol{background:var(--gold);border-color:var(--gold);color:#000;}
  .stap .nm{font-size:.72rem;color:var(--muted);white-space:nowrap;}
  .stap.nu .nm{color:var(--txt);font-weight:600;}
  .stap .lijn{width:1rem;height:1px;background:var(--line);}

  /* De uitdaging: waar het onderzoek voor een deelnemer mee begint. */
  .uitdaging{border:1px solid var(--gold);border-radius:16px;padding:1rem;background:linear-gradient(180deg,rgba(169,143,7,.08),transparent);}
  .uitdaging h2{font-size:1.15rem;margin-bottom:.3rem;}
  .uitdaging .vraag{font-size:.9rem;color:var(--muted);line-height:1.5;}
  .gebrek{font-size:.82rem;color:var(--burgundy);line-height:1.5;padding:.15rem 0;}
  .graad{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:.15rem .5rem;border:1px solid var(--line);color:var(--muted);}
  .graad.g3,.graad.g4{color:var(--green);border-color:var(--green);}
  .graad.g2{color:var(--gold);border-color:var(--gold);}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));gap:.5rem;}
  .kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;}
  .kpi b{display:block;font-family:'Bodoni Moda',serif;font-size:1.3rem;font-weight:500;}
  .kpi span{font-size:.7rem;color:var(--muted);}
</style>
<link href="/shared/dagkleur.css" rel="stylesheet">
<script src="/shared/seizoen.js" defer></script>
<link href="/shared/ios.css" rel="stylesheet">
</head>
<body class="rtg-stijl">
<header>
  <div><div class="ey">RTFoundation</div><h1>Living Lab</h1></div>
  <a href="/apps/foundation/kantoor.html">RTF-kantoor</a>
  <a href="/apps/lab.html">Onderzoekslab</a>
</header>
<main id="main">
  <div class="rij">
    <select class="veld" id="labKies" style="max-width:16rem;" aria-label="Kies een Living Lab"></select>
    <button class="knop stil" id="labNieuw" type="button">+ Nieuw lab</button>
  </div>

  <div class="kpi" id="kpi"></div>

  <div class="deel">Labbeheer</div>
  <div class="kaart" id="beheer"><div class="leeg">Laden...</div></div>

  <div class="deel">Vragen uit de buurt</div>
  <div class="kaart">
    <div class="sec">Wat bewoners zelf aandragen</div>
    <div id="themas"><div class="leeg">Laden...</div></div>
  </div>

  <div class="deel">Nieuw onderzoek</div>
  <div class="kaart">
    <div class="rij">
      <select class="veld" id="nSoort" style="max-width:13rem;" aria-label="Projectsoort"></select>
      <input class="veld" id="nTitel" placeholder="Titel (bijv. Buurttuin en eenzaamheid)" maxlength="120">
    </div>
    <div class="rij" style="margin-top:.4rem;">
      <input class="veld" id="nVraag" placeholder="Het vraagstuk: wat speelt er werkelijk?" maxlength="600">
      <button class="knop" id="nMaak" type="button">Start</button>
    </div>
    <div class="leeg" id="nUitleg"></div>
  </div>

  <div class="deel">Onderzoeken</div>
  <div class="chips" id="filters"></div>
  <div id="lijst"><div class="leeg">Laden...</div></div>

  <div class="deel">Agenda</div>
  <div class="kaart" id="agenda"><div class="leeg">Laden...</div></div>

  <div class="deel">Apparatuur</div>
  <div class="kaart" id="apparatuur"><div class="leeg">Laden...</div></div>

  <div class="deel">Van onderzoek naar verandering</div>
  <div class="kaart"><div id="pijplijn"><div class="leeg">Laden...</div></div></div>

  <div class="deel">Impact</div>
  <div class="kaart"><div id="impact"><div class="leeg">Laden...</div></div></div>

  <div class="deel">Opbrengst</div>
  <div class="kaart"><div id="opbrengst"><div class="leeg">Laden...</div></div></div>
</main>

<script src="/shared/drie.js"></script>
<script src="/shared/uitvoer.js"></script>
<script src="/shared/deur.js"></script>
<script src="/apps/livinglab-beeld.js"></script>
<script src="/apps/livinglab-ethiek.js"></script>
<script src="/apps/livinglab-mensen.js"></script>
<script src="/apps/livinglab-bewijs.js"></script>
<script src="/apps/livinglab-uitgang.js"></script>
<script src="/apps/livinglab-beheer.js"></script>
<script src="/apps/livinglab-apparatuur.js"></script>
<script src="/apps/livinglab-werkplaats.js"></script>
<script src="/apps/livinglab-toezicht.js"></script>
<script src="/apps/livinglab-coach.js"></script>
<script src="/apps/livinglab-vormen.js"></script>
<script src="/apps/livinglab-kern.js"></script>
<script src="/apps/livinglab-studie.js"></script>
<script>
/* De bootstrap. Alles van betekenis staat in livinglab-kern.js en
   livinglab-studie.js; hier alleen de start en de deur voor wie uitgelogd is. */
(function () {
  var TOKEN = null; try { TOKEN = localStorage.getItem('rtg_office_token'); } catch (e) {}
  if (!TOKEN) {
    /* De deur op de app zelf in plaats van wegsturen: wie hier uitgelogd komt,
       verloor met een location.replace() waar hij heen wilde. Zie lab.html. */
    var naar = '/apps/personeel.html?kantoor=1&terug=' + encodeURIComponent(location.pathname);
    if (!window.RTGDeur) { location.replace(naar); return; }
    setTimeout(function () {
      RTGDeur.toon(document.getElementById('main') || document.body, { soort: 'personeel', naar: naar });
    }, 0);
    return;
  }
  window.LivingLab.start(TOKEN);
})();
</script>
<script src="/shared/deelmenu.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/volscherm.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
