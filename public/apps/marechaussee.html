<!doctype html>
<html lang="nl">
<head>
<script src="/shared/id.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brigade RTG Airport (KMar)</title>
<meta name="theme-color" content="#F4EFE7">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icons/partners.svg">
<link rel="manifest" href="/manifests/marechaussee.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KMar">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/ds/rtg-ds.css" rel="stylesheet">
<script src="/ds/shell.js"></script>
</head>
<!-- De Brigade RTG Airport op het RTG Design System (TRAVELOS-MIGRATIE.md
     par. 1b, de werklaag): Taak (de inlog met pincode, een incident melden),
     Collectie (de cockpit, de posten en hun lijsten). Geen Cover en geen
     fotografie: dit is een werkplek. Geen eigen stijl: alles komt uit
     /ds/rtg-ds.css. -->
<body data-rtg-context-bron="marechaussee" class="ds-scherm" data-rtg-world="travel" data-ds-schermtype="taak">
<header class="ds-kop">
  <button class="ds-kop__actie" type="button" data-ds-zoek aria-label="Spring naar een functie"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
  <a class="ds-kop__merk" href="/apps/reizen.html" aria-label="RTG TravelOS">RTG</a>
  <button class="ds-kop__actie" id="wissel" type="button" aria-label="Wissel van medewerker" title="Wissel" hidden><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button>
</header>
<main class="ds-collectie" id="main">
  <div class="ds-collectie__kop">
    <p class="ds-label">Koninklijke Marechaussee</p>
    <h1 class="ds-titel ds-titel--scherm" id="kop">Brigade RTG Airport</h1>
  </div>
  <section id="login" aria-label="Inloggen">
    <p class="ds-meta">Het kantoor en de PDA van de brigade op het veld: de grensbalie, patrouilles en incidenten. Log in met je persoonlijke pincode.</p>
    <div class="ds-velden">
      <label class="ds-veld"><svg class="ds-veld__icoon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span><span class="ds-veld__label">Medewerker</span><select class="ds-veld__invoer" id="wie"><option value="">Laden…</option></select></span><span></span></label>
      <label class="ds-veld"><svg class="ds-veld__icoon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span><span class="ds-veld__label">Pincode</span><input class="ds-veld__invoer" id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="Pincode"></span><span></span></label>
    </div>
    <button class="ds-knop ds-knop--primair ds-knop--breed ds-taak__actie" id="loginGo" type="button" data-ds-actie="Inloggen">Inloggen</button>
  </section>
  <div id="app" hidden></div>
  <nav class="ds-chips" aria-label="Verder">
    <a class="ds-chip" href="/apps/luchthaven.html">Airport Ops →</a>
  </nav>
</main>
<p class="ds-melding" id="melding" role="status" aria-live="polite"></p>
<script src="/shared/uitvoer.js"></script>
<script src="/apps/werkvloer.js"></script>
<script src="/apps/marechaussee.js"></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<!-- Waar je bent, gezegd door dit scherm zelf (EDGE.md besluit 11): het register en
     apps/schermcontext.js, dat de bron van <body data-rtg-context-bron> publiceert. -->
<script src="/shared/adaptief.js" defer></script>
<script src="/shared/objectverwijzing.js" defer></script>
<script src="/shared/adaptief/vorm.js" defer></script>
<script src="/shared/adaptief/register.js" defer></script>
<script src="/shared/adaptief/brug.js" defer></script>
<script src="/apps/schermcontext.js" defer></script>
</body>
</html>
