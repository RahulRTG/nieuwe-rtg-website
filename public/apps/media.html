<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Media</title>
<meta name="theme-color" content="#0C0C0B">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link href="/fonts/fonts.css" rel="stylesheet">
<script src="/shared/schermrust.js" defer></script>
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<!-- de melding van de mediapoort; tussen de andere bladen zodat hij in DEZELFDE
     stijlbundel meegaat en er geen tweede bundel bijkomt (test/stijlbundel.test.js) -->
<link rel="stylesheet" href="/shared/media.css">
<style>
  :root{--bg:var(--rtg-bg);--card:var(--rtg-card);--card2:var(--rtg-card2);--line:var(--rtg-line);--txt:var(--rtg-txt);
    --soft:var(--rtg-soft);--gold:#C9A24B;--groen:#4C9A75;--rood:#DE6E92;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100dvh;}
  .kop{display:flex;align-items:center;gap:0.7rem;padding:calc(env(safe-area-inset-top,0px) + 0.9rem) 1.1rem 0.4rem;}
  .kop h1{font-family:'Bodoni Moda',serif;font-weight:600;font-size:1.35rem;letter-spacing:0.02em;}
  .kop .rek{flex:1;}
  .kop a{color:var(--txt);text-decoration:none;font-size:1.1rem;}
  .badge{font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--soft);
    border:1px solid var(--line);border-radius:999px;padding:0.25rem 0.6rem;}
  button{font:inherit;cursor:pointer;}
  .knop{background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);
    font-size:0.8rem;padding:0.45rem 0.75rem;}
  .knop.vol{background:var(--gold);border-color:var(--gold);color:#0C0C0B;font-weight:600;}
  .knop.aan{border-color:var(--gold);color:var(--gold);}
  .knop.rood{border-color:rgba(222,110,146,0.55);color:var(--rood);}
  .knop:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .stil{color:var(--soft);font-size:0.8rem;line-height:1.55;}

  /* de drie standen: één wereld, drie manieren om hem te gebruiken */
  .standen{display:flex;gap:0.15rem;padding:0 1.1rem;border-bottom:1px solid var(--line);overflow-x:auto;}
  .standen button{background:none;border:0;padding:0.6rem 0.85rem 0.65rem;margin-bottom:-1px;color:var(--soft);
    font-size:0.72rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;white-space:nowrap;
    border-bottom:2px solid transparent;}
  .standen button[aria-current="true"]{color:var(--txt);border-bottom-color:var(--gold);}

  main{padding:0.9rem 1.1rem calc(env(safe-area-inset-bottom,0px) + 8rem);}
  h2{font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--soft);margin:1.2rem 0 0.6rem;}
  .stukken{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0.7rem;}
  .stuk{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0.8rem 0.85rem;
    display:flex;flex-direction:column;gap:0.35rem;}
  .stuk .vorm{font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);}
  .stuk .t{font-family:'Bodoni Moda',serif;font-size:1.05rem;line-height:1.25;}
  .stuk .m{font-size:0.74rem;color:var(--soft);}
  .stuk .waarom{font-size:0.72rem;color:var(--soft);border-left:2px solid var(--line);padding-left:0.5rem;}
  .stuk .rij{display:flex;gap:0.35rem;flex-wrap:wrap;margin-top:0.35rem;}
  .stuk.mijn{border-color:rgba(201,162,75,0.45);}
  .maker{background:none;border:0;color:var(--txt);padding:0;font-size:0.74rem;text-decoration:underline;text-underline-offset:2px;}

  .kader{border:1px solid var(--line);border-radius:12px;padding:0.75rem 0.85rem;margin:0.8rem 0;background:var(--card2);}
  .kader b{font-weight:600;}
  .bodem{margin-top:1.4rem;border-top:1px solid var(--line);padding-top:0.9rem;}

  /* de blad-lade: hub, maker en bord komen hier binnen */
  .lade{position:fixed;inset:0;background:rgba(12,12,11,0.86);display:none;z-index:20;overflow-y:auto;}
  .lade.open{display:block;}
  .lade .vlak{max-width:52rem;margin:2.5rem auto;background:var(--bg);border:1px solid var(--line);
    border-radius:16px;padding:1.1rem 1.2rem calc(env(safe-area-inset-bottom,0px) + 1.4rem);}
  .lade h2{margin-top:1.1rem;}
  .lade h3{font-family:'Bodoni Moda',serif;font-size:1.4rem;font-weight:600;}

  /* de speler: muziek rekent het toestel zelf uit, video streamt uit het Theater */
  .speler{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(21,19,18,0.96);
    border-top:1px solid var(--line);padding:0.6rem 1.1rem calc(env(safe-area-inset-bottom,0px) + 0.7rem);}
  .speler .rij{display:flex;align-items:center;gap:0.7rem;}
  .speler .info{flex:1;min-width:0;}
  .speler .titel{font-size:0.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .speler .sub{font-size:0.7rem;color:var(--soft);}
  .speler video{width:100%;max-height:36vh;background:#000;border-radius:10px;margin-bottom:0.5rem;display:none;}
  .speler video.zien{display:block;}

  .melding{position:fixed;left:50%;transform:translateX(-50%);bottom:6.5rem;background:var(--card2);
    border:1px solid var(--line);border-radius:10px;padding:0.55rem 0.9rem;font-size:0.8rem;z-index:30;
    opacity:0;pointer-events:none;transition:opacity .2s;}
  .melding.zien{opacity:1;}
</style>
</head>
<body>
<header class="kop">
  <a href="/apps/app.html" aria-label="Terug">&#8592;</a>
  <h1>RTG Media</h1>
  <span class="badge">één wereld</span>
  <span class="rek"></span>
  <button class="knop" id="biebKnop" type="button">Bibliotheek</button>
  <button class="knop" id="bordKnop" type="button">Mijn bord</button>
</header>

<nav class="standen" id="standen" aria-label="Standen"></nav>

<main>
  <p class="stil" id="uitleg">De wereld laadt…</p>
  <div class="stukken" id="stukken"></div>

  <div class="bodem">
    <p class="stil" id="einde"></p>
    <div id="buiten"></div>
    <div id="weggelaten"></div>
    <div class="kader" id="regelaars" hidden>
      <b>Uw eigen regelaars</b>
      <p class="stil">Dit is het hele algoritme: wat u hier zegt, en verder niets. Bij elk stuk staat waarom het er staat.</p>
      <div class="rij" id="regelaarsRij" style="display:flex;gap:0.35rem;flex-wrap:wrap;margin-top:0.6rem;"></div>
      <p class="stil" id="smaakStand" style="margin-top:0.6rem;"></p>
    </div>
  </div>
</main>

<div class="lade" id="lade" role="dialog" aria-label="Details" aria-modal="true">
  <div class="vlak" id="ladeVlak"></div>
</div>

<footer class="speler" aria-label="Speler">
  <video id="film" playsinline controls></video>
  <div class="rij">
    <div class="info">
      <div class="titel" id="spTitel">Nog stil</div>
      <div class="sub" id="spSub">Kies iets uit uw wereld.</div>
    </div>
    <button class="knop" id="spStop" type="button">Stop</button>
  </div>
</footer>

<div class="melding" id="melding" role="status"></div>

<!-- De muziekmotor van het Klankwerk, ongewijzigd hergebruikt: een uitgave
     reist als getallen en klinkt op uw eigen toestel, precies zoals de maker
     hem hoorde. Geen tweede motor ernaast (LAT.md regel 4). -->
<script src="/apps/klankwerk/klanken.js"></script>
<script src="/apps/klankwerk/zang.js"></script>
<script src="/apps/klankwerk/motor.js"></script>
<script src="/apps/media/wereld.js"></script>
<script src="/apps/media/blad.js"></script>
<script src="/shared/deelmenu.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<!-- randen.js hoort BIJ bediening.js: zonder de randen is het paneel niet te
     openen. test/randen.test.js bewaakt dat paar, en zakte hierop. -->
<script src="/shared/randen.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
