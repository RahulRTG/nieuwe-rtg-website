<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Memo</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memo">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<!-- de melding van de mediapoort; tussen de andere bladen zodat hij in DEZELFDE
     stijlbundel meegaat en er geen tweede bundel bijkomt (test/stijlbundel.test.js) -->
<link rel="stylesheet" href="/shared/media.css">
<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --card2:var(--rtg-card2); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft);
    --burgundy:#C23A5E; --gold:#A98F1C; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;padding-bottom:3rem;}
  h1,h2{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 90%,transparent));
    backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + .9rem) 1.1rem .7rem;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;}
  header .ey{display:block;font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--rtg-leesgoud,var(--gold));}
  header h1{font-size:1.15rem;}
  header a.terug{color:var(--muted);text-decoration:none;font-size:1.1rem;}
  main{padding:1rem 1.1rem;max-width:640px;margin:0 auto;}
  .knop{background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);
    font:inherit;font-size:.8rem;font-weight:600;padding:.45rem .8rem;cursor:pointer;}
  .knop:hover{border-color:var(--gold);}
  .knop.vol{background:var(--burgundy);border-color:var(--burgundy);color:#fff;}
  .knop:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .rij{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
  .stil{color:var(--soft);font-size:.82rem;line-height:1.55;}
  .opneemkaart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;text-align:center;}
  #opneem{font-size:.95rem;padding:.7rem 1.4rem;}
  #duur{font-family:'Bodoni Moda',serif;font-size:2rem;font-variant-numeric:tabular-nums;margin:.4rem 0;}
  #luisterWrap{margin-top:.6rem;font-size:.82rem;color:var(--muted);}
  /* een vakje van 13x13 is te klein om te raken (WCAG 2.5.8); het label doet al
     mee als klikvlak, maar het vakje zelf hoort ook te raken te zijn */
  #luister{width:24px;height:24px;vertical-align:-.4rem;margin-right:.2rem;}
  #luisterWrap.uit{opacity:.5;}
  .kop{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--rtg-leesgoud,var(--gold));margin:1.2rem 0 .5rem;}
  .memo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.75rem .9rem;margin-bottom:.55rem;}
  .memo .kop2{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;flex-wrap:wrap;margin-bottom:.4rem;}
  .memo audio{width:100%;height:2.2rem;}
  .melding{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--card2);
    border:1px solid var(--line);border-radius:999px;padding:.5rem .95rem;font-size:.82rem;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;}
  .melding.zie{opacity:1;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
<link href="/shared/dagkleur.css" rel="stylesheet">
<script src="/shared/seizoen.js" defer></script>
<!-- niet defer: dit script draait voor elke inline-body-script en voor elk kader -->
<script src="/shared/media.js"></script>
<link href="/shared/ios.css" rel="stylesheet">
</head>
<body class="rtg-stijl">
<header>
  <a class="terug" href="/apps/app.html" aria-label="Terug naar het bureaublad">&#8592;</a>
  <span><span class="ey">RTG</span><h1>Memo</h1></span>
</header>
<main>
  <div class="opneemkaart">
    <div id="duur" aria-live="off">00:00</div>
    <button class="knop" id="opneem" type="button">Neem op</button>
    <div id="luisterWrap"><label><input type="checkbox" id="luister" checked>
      Meeluisteren voor een transcript (blijft op dit toestel)</label></div>
  </div>

  <div class="kop">Je memo's</div>
  <div id="lijst"><p class="stil">Laden...</p></div>

  <p class="stil h-mt80">Je memo's zijn gewone bestanden in je RTG Bestanden-kluis (map
    Memo's): weggooien is naar de prullenbak, en je kwota is dezelfde. Het transcript blijft op je toestel;
    alleen als je op Samenvatting drukt gaat die tekst (niet de audio) naar Rahul.</p>
</main>
<div class="melding" id="melding" role="status"></div>
<script src="/shared/uitvoer.js"></script>
<script src="/shared/kluismap.js"></script>
<script src="/apps/memo/app.js"></script>
<script src="/shared/schermbeeld.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/volscherm.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
