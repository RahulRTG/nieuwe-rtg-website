<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merken &amp; vestigingen · RTG Kantoor</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --card2:var(--rtg-card2); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft); --burgundy:#C23A5E; --gold:#A98F1C; --green:#4C9A75; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;}
  h1,h2{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  header{display:flex;align-items:center;gap:.7rem;padding:calc(env(safe-area-inset-top) + .9rem) 1.2rem .9rem;border-bottom:1px solid var(--line);}
  header a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:0;padding:.35rem .6rem;font-size:.78rem;}
  header .ey{font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--rtg-leesgoud,var(--gold));}
  main{max-width:820px;margin:0 auto;padding:1.6rem 1.2rem 4rem;}
  .lead{color:var(--muted);line-height:1.65;margin:0 0 1.4rem;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:0;padding:1.1rem;margin-bottom:1rem;}
  .card h2{font-size:1.1rem;}
  .mt{color:var(--soft);font-size:.78rem;margin-top:.3rem;}
  .rij{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.8rem;}
  button{background:var(--card2);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:.85rem;font-weight:600;border-radius:0;padding:.5rem .85rem;cursor:pointer;}
  button:hover{border-color:var(--gold);}
  button.prim{background:#7F1634;border-color:#7F1634;color:#fff;}
  input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:0;color:var(--txt);font:inherit;font-size:.85rem;padding:.45rem .6rem;}
  textarea{width:100%;min-height:7rem;font-family:ui-monospace,monospace;font-size:.75rem;}
  .vest{display:flex;align-items:center;gap:.6rem;border-top:1px solid var(--line);padding:.45rem 0;font-size:.85rem;}
  .vest span{flex:1;}
  .leeg{color:var(--soft);}
  #melding{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#000;border:1px solid var(--gold);color:var(--txt);padding:.55rem .9rem;border-radius:0;font-size:.82rem;opacity:0;transition:opacity .25s;pointer-events:none;}
</style>
<link href="/shared/ios.css" rel="stylesheet">
</head>
<body class="rtg-stijl">
<header>
  <a href="/apps/backoffice.html">&lsaquo; Kantoor</a>
  <div><div class="ey">RTG Web Platform</div><h1 style="font-size:1.1rem;">Merken &amp; vestigingen</h1></div>
</header>
<main id="main"><div class="leeg">Laden…</div></main>
<div id="melding" role="status"></div>
<!-- VOOR het scherm-script, net als op concierge, rtgkantoor en redactiekantoor.
     Hij stond hieronder, en de laatste regel van dat script roept bij een lege
     token meteen inlog() aan -- die greep dan naar een RTGKantoorGesprek dat nog
     niet bestond. Het scherm bleef op "Laden..." staan, zonder zichtbare fout. -->
<script src="/shared/kantoorgesprek.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=null; try{ TOKEN=localStorage.getItem('rtg_office_token'); }catch(e){}
function meld(t){const m=$('#melding');m.textContent=t;m.style.opacity='1';clearTimeout(m._t);m._t=setTimeout(()=>m.style.opacity='0',3400);}
const api=(pad,body)=>fetch('/api/office/'+pad,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify(body||{})})
  .then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'Er ging iets mis.');e.status=r.status;throw e;}return d;});

function inlog(){
  // dezelfde inlog als de andere kantoorschermen: een gesprek met Rahul
  $('#main').innerHTML='<div id="lGesprek"></div>';
  RTGKantoorGesprek.toon($('#lGesprek'),token=>{ TOKEN=token; try{localStorage.setItem('rtg_office_token',TOKEN);}catch(e){} laad(); });
}

let OPEN=null;   // welk merk is uitgeklapt
async function laad(){
  const m=$('#main');
  let d;
  try{ d=await api('merk/lijst'); }catch(e){ if(e.status===401){ inlog(); return; } m.innerHTML='<div class="leeg">'+esc(e.message)+'</div>'; return; }
  m.textContent='';
  const lead=document.createElement('p'); lead.className='lead';
  lead.textContent='Een merk bundelt bestaande zaken tot vestigingen en geeft ze een gedeeld hoofdontwerp. '+
    'De live blokken maken daar vanzelf verschillende sites van: elke vestiging toont haar eigen kaart, foto’s en openingstijden. '+
    'De huisstijl komt van het merk en kan een vestiging niet zelf wijzigen.';
  m.appendChild(lead);

  // nieuw merk
  const nieuw=document.createElement('div'); nieuw.className='card';
  nieuw.innerHTML='<h2>Nieuw merk</h2><div class="rij">'+
    '<input id="nCode" placeholder="CODE" maxlength="30" aria-label="Merkcode">'+
    '<input id="nNaam" placeholder="Naam van het merk" maxlength="80" aria-label="Merknaam">'+
    '<button class="prim" id="nMaak">Maak merk</button></div>';
  m.appendChild(nieuw);
  $('#nMaak').addEventListener('click',async()=>{
    try{ await api('merk/maak',{code:$('#nCode').value,naam:$('#nNaam').value}); meld('Merk aangemaakt.'); laad(); }
    catch(e){ meld(e.message); }
  });

  if(!(d.lijst||[]).length){ const p=document.createElement('p'); p.className='leeg'; p.textContent='Nog geen merken.'; m.appendChild(p); return; }
  d.lijst.forEach(mk=>m.appendChild(kaart(mk)));
}

function kaart(mk){
  const c=document.createElement('div'); c.className='card';
  const h=document.createElement('h2'); h.textContent=mk.naam+' ('+mk.code+')'; c.appendChild(h);
  const s=document.createElement('div'); s.className='mt';
  s.textContent=mk.vestigingen+' vestiging'+(mk.vestigingen===1?'':'en')+' · hoofdontwerp: '+
    (mk.sjabloonBlokken?mk.sjabloonBlokken+' blokken':'nog geen')+' · huisstijl '+mk.huisstijl.thema+' '+mk.huisstijl.accent;
  c.appendChild(s);
  const rij=document.createElement('div'); rij.className='rij';
  const open=document.createElement('button'); open.textContent=OPEN===mk.code?'Sluiten':'Beheren';
  open.addEventListener('click',()=>{ OPEN=OPEN===mk.code?null:mk.code; laad(); });
  rij.appendChild(open);
  const rol=document.createElement('button'); rol.className='prim'; rol.textContent='Uitrollen naar alle vestigingen';
  rol.addEventListener('click',async()=>{
    if(!confirm('Het hoofdontwerp naar alle vestigingen uitrollen? Dit overschrijft wat een vestiging zelf aan haar pagina’s heeft veranderd. Hun eigen inhoud (kaart, foto’s, openingstijden) blijft, en de vorige stand blijft in hun versiegeschiedenis staan.'))return;
    try{ const r=await api('merk/uitrol',{code:mk.code});
      meld('Uitgerold naar '+r.uitgerold.length+' vestiging'+(r.uitgerold.length===1?'':'en')+'.'); }
    catch(e){ meld(e.message); }
  });
  rij.appendChild(rol);
  c.appendChild(rij);
  if(OPEN===mk.code) beheer(c,mk);
  return c;
}

async function beheer(c,mk){
  let d; try{ d=await api('merk/haal',{code:mk.code}); }catch(e){ meld(e.message); return; }
  const merk=d.merk;
  const vak=document.createElement('div'); vak.style.marginTop='1rem';

  const kop=document.createElement('div'); kop.className='mt'; kop.textContent='Vestigingen'; vak.appendChild(kop);
  (merk.vestigingen||[]).forEach(z=>{
    const r=document.createElement('div'); r.className='vest';
    const n=document.createElement('span'); n.textContent=z; r.appendChild(n);
    const w=document.createElement('button'); w.textContent='Ontkoppelen';
    w.addEventListener('click',async()=>{ try{ await api('merk/vestiging',{code:mk.code,zaak:z,aan:false}); meld('Ontkoppeld.'); laad(); }catch(e){ meld(e.message); } });
    r.appendChild(w); vak.appendChild(r);
  });
  const toe=document.createElement('div'); toe.className='rij';
  const inp=document.createElement('input'); inp.placeholder='Zaakcode, bijv. ESVEDRA'; inp.maxLength=30; inp.setAttribute('aria-label','Zaakcode');
  const knop=document.createElement('button'); knop.textContent='Koppel vestiging';
  knop.addEventListener('click',async()=>{ try{ await api('merk/vestiging',{code:mk.code,zaak:inp.value,aan:true}); meld('Gekoppeld.'); laad(); }catch(e){ meld(e.message); } });
  toe.appendChild(inp); toe.appendChild(knop); vak.appendChild(toe);

  const kop2=document.createElement('div'); kop2.className='mt'; kop2.style.marginTop='1rem';
  kop2.textContent='Hoofdontwerp (blokken als JSON; zaakdata-blokken zijn live en vullen zich per vestiging)';
  vak.appendChild(kop2);
  const ta=document.createElement('textarea'); ta.setAttribute('aria-label','Hoofdontwerp');
  ta.value=JSON.stringify({ titel:(merk.sjabloon&&merk.sjabloon.titel)||merk.naam,
    thema:merk.huisstijl.thema, accent:merk.huisstijl.accent, kleuren:merk.huisstijl.kleuren,
    blokken:(merk.sjabloon&&merk.sjabloon.blokken)||[
      {type:'hero',kop:merk.naam,sub:'Welkom bij onze vestiging'},
      {type:'zaakdata',bron:'contact'},{type:'zaakdata',bron:'openingstijden'}],
    paginas:(merk.sjabloon&&merk.sjabloon.paginas)||[] },null,1);
  vak.appendChild(ta);
  const bew=document.createElement('div'); bew.className='rij';
  const bk=document.createElement('button'); bk.textContent='Bewaar hoofdontwerp';
  bk.addEventListener('click',async()=>{
    let ontwerp; try{ ontwerp=JSON.parse(ta.value); }catch(e){ meld('Dit is nog geen geldige JSON.'); return; }
    try{ await api('merk/sjabloon',{code:mk.code,ontwerp}); meld('Bewaard. Rol het uit om het bij de vestigingen te brengen.'); laad(); }
    catch(e){ meld(e.message); }
  });
  bew.appendChild(bk); vak.appendChild(bew);
  c.appendChild(vak);
}

if(!TOKEN) inlog(); else laad();
</script>
<script src="/shared/mond.js"></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
