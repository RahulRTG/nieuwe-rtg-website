<!doctype html>
<html lang="nl">
<head>
<script src="/shared/id.js"></script>
<meta charset="utf-8">
<script>try{if(window.self!==window.top)document.documentElement.dataset.rtgOppervlak='1'}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Move</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Move">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<!-- de tokenlaag van ONTWERP.md; een scherm dat hem niet laadt kan er zeker niets mee -->
<link href="/shared/rtg-ontwerp.css" rel="stylesheet">
<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --card2:var(--rtg-card2); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft);
    --burgundy:#C23A5E; --gold:#A98F1C;
    /* De vier uitkomsten dragen kleur als BETEKENIS en niet als versiering
       (ONTWERP.md). NIET_TE_BEPALEN is met opzet GRIJS en niet rood: "ik weet
       het niet" is geen waarschuwing, en wie er een rode kleur op zet, maakt
       van onwetendheid een alarm. */
    --ruim:#69B891; --krap:#C9A24B; --onhaalbaar:#DE6E92; --onbekend:var(--rtg-soft); }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;
    line-height:1.55;padding-block:0 7rem;padding-left:1rem;padding-right:1rem;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:44rem;margin:0 auto;display:block;}

  header{display:flex;align-items:center;gap:.7rem;
    padding-block:calc(env(safe-area-inset-top,0px) + 1.4rem) 1.1rem;}
  header a.terug{color:var(--txt);text-decoration:none;font-size:1.15rem;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;
    margin-left:-.7rem;}
  header h1{font-family:'Bodoni Moda',serif;font-weight:600;font-size:1.35rem;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* DE DEKKING STAAT BOVENAAN EN NIET ONDERAAN, en dat is een ontwerpbesluit.
     MOVE.md noemt als grootste risico dat iemand een oordeel over de helft van
     een reis voor een oordeel over de reis aanziet. Een dekkingsgetal in de voet
     leest niemand; hier leest hij mee met het oordeel. */
  .stand{border:1px solid var(--line);background:var(--card);padding:1.3rem 1.2rem;margin-bottom:1.6rem;}
  .stand .oordeel{font-family:'Bodoni Moda',serif;font-size:1.7rem;font-weight:600;line-height:1.2;}
  .stand .oordeel[data-u="RUIM"]{color:var(--ruim);}
  .stand .oordeel[data-u="KRAP"]{color:var(--krap);}
  .stand .oordeel[data-u="ONHAALBAAR"]{color:var(--onhaalbaar);}
  .stand .oordeel[data-u="NIET_TE_BEPALEN"],.stand .oordeel[data-u="GEEN_BEWEGING"]{color:var(--txt);}
  .stand p{color:var(--soft);font-size:.88rem;margin-top:.5rem;}
  .meters{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;margin-top:1rem;
    padding-top:.9rem;border-top:1px solid var(--line);}
  .meter{font-size:.75rem;color:var(--soft);}
  .meter b{display:block;font-size:1.05rem;color:var(--txt);font-weight:600;}

  h2{font-family:'Bodoni Moda',serif;font-size:1.05rem;font-weight:600;
    margin:2rem 0 .8rem;}
  .naad{border:1px solid var(--line);background:var(--card);padding:1.1rem 1.1rem;margin-bottom:.7rem;}
  .naad .van{font-size:.8rem;color:var(--soft);}
  .naad .naar{font-size:1rem;font-weight:600;margin-top:.15rem;}
  .naad .uit{display:inline-block;font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;
    border:1px solid currentColor;padding:.22rem .55rem;margin-top:.7rem;}
  .naad .uit[data-u="RUIM"]{color:var(--ruim);}
  .naad .uit[data-u="KRAP"]{color:var(--krap);}
  .naad .uit[data-u="ONHAALBAAR"]{color:var(--onhaalbaar);}
  .naad .uit[data-u="NIET_TE_BEPALEN"]{color:var(--onbekend);}
  .naad .cijfers{font-size:.83rem;color:var(--soft);margin-top:.6rem;}
  .naad .waarom{font-size:.83rem;color:var(--soft);margin-top:.5rem;}
  /* Wat er NIET is gewogen, en wat de drempel is: klein maar aanwezig. Een
     oordeel zonder zijn voorbehoud is een belofte. */
  details{margin-top:.7rem;}
  details summary{font-size:.75rem;color:var(--soft);cursor:pointer;
    min-height:24px;display:flex;align-items:center;}
  details ul{margin:.5rem 0 0 1.1rem;font-size:.78rem;color:var(--soft);}
  .bron{font-size:.72rem;color:var(--soft);margin-top:.6rem;font-style:italic;}

  .leeg{border:1px solid var(--line);background:var(--card);padding:1.6rem 1.2rem;color:var(--soft);font-size:.9rem;}
  .leeg b{display:block;color:var(--txt);font-family:'Bodoni Moda',serif;font-size:1.1rem;
    font-weight:600;margin-bottom:.5rem;}

  /* DE VERDERKNOP IS HIER EEN GEWONE ROUTEACTIE, EN DAT IS EEN BESLUIT.

     De RTG Continue Key bestaat als component (shared/rtg-continue-key.*) maar
     hij hoort bij het Edge 2-systeem van de SCHIL: een 44px-cirkel in de
     schilbalk die opengaat tot een capsule, met zijn eigen materiaalvariabelen.
     Geen enkel routescherm draagt hem, en keuring 58 zegt waarom dat klopt --
     route-inhoud blijft 0, en een afgeronde systeemlaag mag alleen uit de
     centrale Heritage-CSS komen. Een routescherm dat zelf een capsule tekent,
     voert een tweede vormtaal in.

     Wat hier staat doet dus het WERK van de Key (het volgende onderdeel als
     label, en erheen brengen) in de vormtaal die dit scherm mag gebruiken. De
     Key in de schilbalk hangen is schilwerk en staat in MOVE.md par. 6. */
  /* DE BALK RESERVEERT ZIJN RUIMTE, EN DAT IS EEN REPARATIE EN GEEN SMAAK.

     De knop verschijnt pas als /api/move/volgende een plek heeft, dus asynchroon.
     Stond de balk daarvóór op 32px en daarna op 84px, dan meet de cookiemelding
     de VERKEERDE hoogte: zij tilt zichzelf eenmalig boven een vaste onderbalk
     (shared/cookie/cookie-02.js tilBovenBalk) bij het laden en nog een frame
     later, en haar MutationObserver hermeet alleen de inkt. Gevolg, in de
     browser gemeten: de melding lag over de primaire actie en Playwright kon
     hem 60 pogingen lang niet aanraken -- "#rtg-cookie intercepts pointer
     events". Een echt lid had dezelfde knop niet kunnen indrukken.

     Een balk met een vaste hoogte lost dat op bij de bron: de melding meet
     meteen goed. Het scheelt bovendien een sprong onder de duim van de lezer.
     Wat er NIET is opgelost: elk ander scherm met een onderbalk die later
     verschijnt, heeft hetzelfde probleem -- zie MOVE.md par. 6. */
  /* EN DE BALK IS AANRAAKBAAR, want daar hing de reparatie werkelijk aan.

     Een vaste hoogte alleen was niet genoeg: de cookiemelding zoekt wat er
     ACHTER haar ligt met elementsFromPoint, en dat slaat zowel
     `pointer-events:none` als `visibility:hidden` over. Bij het laden vond zij
     dus niets -- de balk was onaanraakbaar en de knop nog leeg -- en tilde
     zichzelf niet op. Met een aanraakbare balk vindt zij hem meteen, klimt naar
     de vaste ouder en gaat erboven staan.

     Wat dat kost: een tik naast de knop bereikt de inhoud eronder niet. Die is
     er niet -- body houdt 7rem voet vrij -- dus dat is hier geen verlies. */
  .verderbalk{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
    align-items:center;min-height:calc(52px + 2rem);
    padding:1rem 1rem calc(env(safe-area-inset-bottom,0px) + 1rem);z-index:20;
    background:linear-gradient(180deg,rgba(12,12,11,0),rgba(12,12,11,.92));}
  .verderbalk>button{min-height:52px;min-width:12rem;
    max-width:min(28rem,calc(100vw - 2rem));font:inherit;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:.6rem;
    padding:.9rem 1.6rem;border:1px solid var(--gold);border-radius:0;
    background:var(--card2);color:var(--txt);box-shadow:0 14px 40px rgba(0,0,0,.55);}
  /* `visibility` en niet `display`: de knop houdt zijn ruimte bezet en valt wel
     uit de tabvolgorde, dus een lezer met een toetsenbord vindt geen knop die
     nergens heen gaat. */
  .verderbalk>button[data-leeg="ja"]{visibility:hidden;}
  @media (prefers-reduced-motion:no-preference){
    .verderbalk>button{transition:border-color .18s;}
  }
</style>
</head>
<body class="rtg-stijl" data-rtg-world="travel" data-rtg-eigenvlak="onyx" data-rtg-skin="heritage">
<main class="wrap">
  <header>
    <a class="terug" href="/apps/reizen.html" aria-label="Terug naar TravelOS">&#8592;</a>
    <h1 id="titel">RTG Move</h1>
  </header>

  <section class="stand" id="stand" aria-live="polite">
    <div class="oordeel" id="oordeel">Uw reis wordt gewogen&hellip;</div>
    <p id="toelichting"></p>
    <div class="meters" id="meters" hidden>
      <span class="meter"><b id="mDekking">&mdash;</b>dekking</span>
      <span class="meter"><b id="mOnderdelen">&mdash;</b>onderdelen</span>
      <span class="meter"><b id="mPlek">&mdash;</b>met plek</span>
      <span class="meter"><b id="mTijd">&mdash;</b>met tijd</span>
    </div>
  </section>

  <h2 id="kopNaden" hidden>De overgangen</h2>
  <div id="naden"></div>
</main>

<div class="verderbalk">
  <button type="button" id="verder" data-leeg="ja" aria-hidden="true">Ga verder</button>
</div>

<script src="/shared/uitvoer.js"></script>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const token = (() => { try { return localStorage.getItem('rtg_member_token'); } catch (e) { return null; } })();
  const api = (pad, body) => fetch('/api/move/' + pad, { method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify(body || {}) }).then(async r => ({ status: r.status, body: await r.json().catch(() => ({})) }));

  const TEKST = {
    RUIM: 'Deze reis heeft lucht',
    KRAP: 'Deze planning is niet betrouwbaar',
    ONHAALBAAR: 'Deze planning gaat niet lukken',
    NIET_TE_BEPALEN: 'Hier valt nog niets over te zeggen',
    GEEN_BEWEGING: 'Er is niets te overbruggen'
  };
  /* De toelichting zegt WAT het oordeel betekent voor de reiziger, en bij KRAP
     staat er met opzet geen advies bij een getal dat we niet hebben. RTG Move
     zet klaar; verzetten doet het domein na een bevestiging (MOVE.md grens 5). */
  const UITLEG = {
    KRAP: 'Eén vertraging en u haalt het volgende onderdeel niet. Bekijk hieronder welke overgang het krapst is.',
    ONHAALBAAR: 'Op de huidige tijden komt u te laat aan. Hieronder staat welke overgang klapt.',
    NIET_TE_BEPALEN: 'Van te weinig onderdelen is bekend waar of wanneer ze zijn. Wat er ontbreekt, staat per overgang.',
    GEEN_BEWEGING: 'U hebt nog geen twee onderdelen die op elkaar volgen.'
  };

  const el = (naam, klasse, tekst) => {
    const e = document.createElement(naam);
    if (klasse) e.className = klasse;
    if (tekst != null) e.textContent = tekst;
    return e;
  };
  const lijstje = (kop, items) => {
    const d = el('details');
    d.appendChild(el('summary', '', kop));
    const ul = el('ul');
    for (const i of items) ul.appendChild(el('li', '', i));
    d.appendChild(ul);
    return d;
  };

  function naadKaart(n) {
    const kaart = el('div', 'naad');
    kaart.appendChild(el('div', 'van', 'van ' + ((n.van && n.van.titel) || 'onbekend')));
    kaart.appendChild(el('div', 'naar', 'naar ' + ((n.naar && n.naar.titel) || 'onbekend')));
    const badge = el('span', 'uit', String(n.uitkomst || '').replace(/_/g, ' ').toLowerCase());
    badge.setAttribute('data-u', n.uitkomst || '');
    kaart.appendChild(badge);

    if (Number.isFinite(n.beschikbaarMin) && Number.isFinite(n.nodigMin)) {
      /* DE MARGE MAG NEGATIEF ZIJN en wordt niet op nul afgekapt: negatief is
         precies hoe "u kunt niet op tijd weg" zich uit. Afkappen zou een echte
         uitkomst wegpoetsen. */
      kaart.appendChild(el('div', 'cijfers',
        n.beschikbaarMin + ' min beschikbaar, ' + n.nodigMin + ' min nodig' +
        (Number.isFinite(n.margeMin) ? ' - marge ' + n.margeMin + ' min' : '')));
    }
    if (n.waarom) kaart.appendChild(el('div', 'waarom', n.waarom));
    if (Array.isArray(n.mist) && n.mist.length) kaart.appendChild(lijstje('Wat hier ontbreekt', n.mist));
    if (Array.isArray(n.nietGewogen) && n.nietGewogen.length) {
      kaart.appendChild(lijstje('Niet meegewogen (' + n.nietGewogen.length + ')', n.nietGewogen));
    }
    /* De drempel draagt zijn GROND mee zodat een huiskeuze niet als meting
       leest -- dezelfde regel als in de motor zelf. */
    if (n.drempel && n.drempel.grond) {
      kaart.appendChild(lijstje('Wanneer heet iets ruim?',
        ['Vanaf ' + n.drempel.ruimMin + ' minuten marge (' + n.drempel.grond + ', geen meting)']));
    }
    if (n.bron) kaart.appendChild(el('div', 'bron', n.bron));
    return kaart;
  }

  function zegStand(uitkomst, extra) {
    const o = $('#oordeel');
    o.textContent = TEKST[uitkomst] || 'Uw reis is niet te wegen';
    o.setAttribute('data-u', uitkomst || '');
    $('#toelichting').textContent = extra || UITLEG[uitkomst] || '';
  }

  async function haal() {
    const r = await api('reis');
    if (r.status === 401) return zegStand(null, 'Meld u aan om uw reis te laten wegen.');
    if (r.status === 403) return zegStand(null, (r.body && r.body.error) || 'RTG Move is voor leden.');
    if (r.status !== 200) return zegStand(null, (r.body && r.body.error) || 'De weging is niet gelukt.');
    const d = r.body || {};

    /* GEEN OORDEEL IS EEN EIGEN STAND en niet stilzwijgend "in orde". `oordeel`
       is null zodra geen enkele overgang te bepalen was. */
    if (!d.onderdelen) {
      zegStand(null, '');
      const leeg = el('div', 'leeg');
      leeg.appendChild(el('b', '', 'Nog geen reis om te wegen'));
      leeg.appendChild(el('div', '', 'Zodra u twee onderdelen hebt die op elkaar volgen - een afspraak en een vlucht, een verblijf en een diner - rekent Move de overgang ertussen door.'));
      $('#naden').appendChild(leeg);
      return;
    }

    zegStand(d.oordeel || 'NIET_TE_BEPALEN');
    $('#mDekking').textContent = Number.isFinite(d.dekking) ? d.dekking + '%' : '\u2014';
    $('#mOnderdelen').textContent = d.onderdelen;
    $('#mPlek').textContent = d.metPlek;
    $('#mTijd').textContent = d.metTijd;
    $('#meters').hidden = false;

    const naden = Array.isArray(d.naden) ? d.naden : [];
    if (naden.length) {
      $('#kopNaden').hidden = false;
      const bak = $('#naden');
      for (const n of naden) bak.appendChild(naadKaart(n));
    }
  }

  async function volgende() {
    const r = await api('volgende');
    if (r.status !== 200 || !r.body || !r.body.volgende) return;   // geen knop zonder bestemming
    const v = r.body.volgende;
    const p = v.plek || {};
    if (!Number.isFinite(p.lat) || !Number.isFinite(p.lng)) return;
    const knop = $('#verder');
    knop.textContent = 'Naar ' + (p.label || v.titel || 'de volgende plek');
    knop.removeAttribute('data-leeg');
    knop.removeAttribute('aria-hidden');
    knop.addEventListener('click', () => {
      /* De Key BRENGT u erheen en voert niets uit. Navigatie krijgt de plek als
         punt mee; die is hier al door de plekkenlaag opgelost, dus er wordt
         niets opnieuw geraden. */
      const q = new URLSearchParams({ naar: p.lat + ',' + p.lng, label: p.label || v.titel || '' });
      window.location.href = '/apps/navigatie.html?' + q.toString();
    });
  }

  haal().catch(() => zegStand(null, 'De weging is niet gelukt.'));
  volgende().catch(() => {});
})();
</script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
