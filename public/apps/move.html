<!doctype html>
<html lang="nl">
<head>
<script src="/shared/id.js"></script>
<meta charset="utf-8">
<script>try{if(window.self!==window.top)document.documentElement.dataset.rtgOppervlak='1'}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Move</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#F4EFE7">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Move">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/ds/rtg-ds.css" rel="stylesheet">
<script src="/shared/poortgesprek.js"></script>
<script src="/ds/shell.js"></script>
</head>
<!-- TravelOS op het RTG Design System (TRAVELOS-MIGRATIE.md, batch 4): Status
     (het oordeel over uw reis, met de dekking ernaast) en een Collectie van
     overgangen. Dezelfde weging als ervoor (/api/move/*); geen eigen stijl.

     DE DEKKING STAAT BOVENAAN EN NIET ONDERAAN, en dat is een ontwerpbesluit.
     MOVE.md noemt als grootste risico dat iemand een oordeel over de helft van
     een reis voor een oordeel over de reis aanziet. Een dekkingsgetal in de voet
     leest niemand; hier leest hij mee met het oordeel.

     De uitkomst draagt haar betekenis in woorden (data-u blijft staan voor wie
     hem leest). NIET_TE_BEPALEN is nooit een alarm en nooit groen. -->
<body class="ds-scherm" data-rtg-world="travel" data-ds-schermtype="status">
<header class="ds-kop">
  <button class="ds-kop__actie" type="button" data-ds-zoek aria-label="Spring naar een functie"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
  <a class="ds-kop__merk" href="/apps/reizen.html" aria-label="Terug naar TravelOS">RTG</a>
  <a class="ds-kop__actie" href="/apps/ik.html" aria-label="Uw account"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></a>
</header>
<main class="ds-collectie" id="main">
  <div class="ds-collectie__kop">
    <p class="ds-label" id="titel">RTG Move</p>
    <section class="ds-taak__kop" id="stand" aria-live="polite">
      <h1 class="ds-titel ds-titel--scherm" id="oordeel">Uw reis wordt gewogen&hellip;</h1>
      <p class="ds-meta" id="toelichting"></p>
      <div id="meters" hidden>
        <div class="ds-veldgroep">
          <div class="ds-veld"><span></span><span><span class="ds-veld__label" id="mDekking">&mdash;</span><span class="ds-veld__waarde">dekking</span></span><span></span></div>
          <div class="ds-veld"><span></span><span><span class="ds-veld__label" id="mOnderdelen">&mdash;</span><span class="ds-veld__waarde">onderdelen</span></span><span></span></div>
          <div class="ds-veld"><span></span><span><span class="ds-veld__label" id="mPlek">&mdash;</span><span class="ds-veld__waarde">met plek</span></span><span></span></div>
          <div class="ds-veld"><span></span><span><span class="ds-veld__label" id="mTijd">&mdash;</span><span class="ds-veld__waarde">met tijd</span></span><span></span></div>
        </div>
      </div>
    </section>
  </div>
  <!-- De verderknop staat er pas als Move een echte plek heeft; tot dan is hij
       er niet, ook niet in de Acties van de Edge. Hij BRENGT u naar Navigatie
       en voert niets uit. -->
  <div id="verderVak" hidden>
    <button class="ds-knop ds-knop--primair ds-knop--breed" type="button" id="verder" data-ds-actie="" data-leeg="ja">Ga verder</button>
  </div>

  <h2 class="ds-titel" id="kopNaden" hidden>De overgangen</h2>
  <div class="ds-collectie__raster" id="naden"></div>
</main>

<script src="/shared/uitvoer.js"></script>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const token = (() => { try { return localStorage.getItem('rtg_member_token'); } catch (e) { return null; } })();
  const api = (pad, body) => fetch('/api/move/' + pad, { method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify(body || {}) }).then(async r => ({ status: r.status, body: await r.json().catch(() => ({})) }));

  const TEKST = {
    RUIM: 'Deze reis heeft lucht',
    KRAP: 'Deze planning is niet betrouwbaar',
    ONHAALBAAR: 'Deze planning gaat niet lukken',
    NIET_TE_BEPALEN: 'Hier valt nog niets over te zeggen',
    GEEN_BEWEGING: 'Er is niets te overbruggen'
  };
  /* De toelichting zegt WAT het oordeel betekent voor de reiziger, en bij KRAP
     staat er met opzet geen advies bij een getal dat we niet hebben. RTG Move
     zet klaar; verzetten doet het domein na een bevestiging (MOVE.md grens 5). */
  const UITLEG = {
    KRAP: 'Eén vertraging en u haalt het volgende onderdeel niet. Bekijk hieronder welke overgang het krapst is.',
    ONHAALBAAR: 'Op de huidige tijden komt u te laat aan. Hieronder staat welke overgang klapt.',
    NIET_TE_BEPALEN: 'Van te weinig onderdelen is bekend waar of wanneer ze zijn. Wat er ontbreekt, staat per overgang.',
    GEEN_BEWEGING: 'U hebt nog geen twee onderdelen die op elkaar volgen.'
  };

  const el = (naam, klasse, tekst) => {
    const e = document.createElement(naam);
    if (klasse) e.className = klasse;
    if (tekst != null) e.textContent = tekst;
    return e;
  };
  const lijstje = (kop, items) => {
    const d = el('details', 'ds-meta');
    d.appendChild(el('summary', '', kop));
    const ul = el('ul', 'ds-detail__gegevens');
    for (const i of items) ul.appendChild(el('li', '', i));
    d.appendChild(ul);
    return d;
  };

  function naadKaart(n) {
    /* Een overgang is een rustige kaart: waar u vandaan komt, waar u heen
       gaat, en de uitkomst als status met stip. */
    /* naad, uit en cijfers zijn haken zonder vorm: scripts/moveproef.js leest
       het scherm daaraan af. De vorm komt uit /ds/. */
    const buiten = el('article', 'ds-kaart naad');
    buiten.setAttribute('data-naad', '');
    const kaart = el('div', 'ds-kaart__inhoud');
    buiten.appendChild(kaart);
    kaart.appendChild(el('p', 'ds-meta', 'van ' + ((n.van && n.van.titel) || 'onbekend')));
    kaart.appendChild(el('h3', 'ds-kaart__titel', 'naar ' + ((n.naar && n.naar.titel) || 'onbekend')));
    const badge = el('p', 'ds-detail__status uit', String(n.uitkomst || '').replace(/_/g, ' ').toLowerCase());
    badge.setAttribute('data-u', n.uitkomst || '');
    kaart.appendChild(badge);

    if (Number.isFinite(n.beschikbaarMin) && Number.isFinite(n.nodigMin)) {
      /* DE MARGE MAG NEGATIEF ZIJN en wordt niet op nul afgekapt: negatief is
         precies hoe "u kunt niet op tijd weg" zich uit. Afkappen zou een echte
         uitkomst wegpoetsen. */
      const cijfers = el('p', 'ds-meta cijfers',
        n.beschikbaarMin + ' min beschikbaar, ' + n.nodigMin + ' min nodig' +
        (Number.isFinite(n.margeMin) ? ' - marge ' + n.margeMin + ' min' : ''));
      cijfers.setAttribute('data-cijfers', '');
      kaart.appendChild(cijfers);
    }
    if (n.waarom) kaart.appendChild(el('p', 'ds-meta', n.waarom));
    if (Array.isArray(n.mist) && n.mist.length) kaart.appendChild(lijstje('Wat hier ontbreekt', n.mist));
    if (Array.isArray(n.nietGewogen) && n.nietGewogen.length) {
      kaart.appendChild(lijstje('Niet meegewogen (' + n.nietGewogen.length + ')', n.nietGewogen));
    }
    /* De drempel draagt zijn GROND mee zodat een huiskeuze niet als meting
       leest -- dezelfde regel als in de motor zelf. */
    if (n.drempel && n.drempel.grond) {
      kaart.appendChild(lijstje('Wanneer heet iets ruim?',
        ['Vanaf ' + n.drempel.ruimMin + ' minuten marge (' + n.drempel.grond + ', geen meting)']));
    }
    if (n.bron) kaart.appendChild(el('p', 'ds-meta', n.bron));
    if (n.van && n.van.kenmerk) kaart.appendChild(uitloopVak(n.van));
    return buiten;
  }

  /* Het woord komt uit de uitkomst zelf, zoals bij de badge van een naad. Geen
     uitkomst is "niet te bepalen" en nooit een gunstig woord. */
  const woord = u => u ? String(u).replace(/_/g, ' ').toLowerCase() : 'niet te bepalen';

  /* Wat als dit onderdeel uitloopt? Een vraag per overgang, op het onderdeel
     waar je VANDAAN komt -- dat is het onderdeel dat later klaar is. */
  function uitloopVak(van) {
    const vak = el('div', 'ds-taak__kop');
    const rij = el('div', 'ds-taak__kop');
    rij.setAttribute('data-uitloop', '');
    const id = RTGId('uit');
    const lab = el('label', 'ds-veldlabel', 'Loopt ' + (van.titel || 'dit onderdeel') + ' uit?');
    lab.htmlFor = id;
    const kies = el('select', 'ds-invoer');
    kies.id = id;
    for (const m of [15, 30, 45, 60, 90]) {
      const o = el('option', '', m + ' min later');
      o.value = String(m);
      if (m === 30) o.selected = true;
      kies.appendChild(o);
    }
    const knop = el('button', 'ds-knop ds-knop--stil ds-knop--klein', 'Reken door');
    knop.type = 'button';
    const uit = el('div', 'ds-taak__kop');
    uit.setAttribute('data-gevolg', '');
    uit.setAttribute('aria-live', 'polite');
    knop.addEventListener('click', async () => {
      knop.disabled = true;
      uit.textContent = 'Move rekent de rest van uw reis door\u2026';
      try {
        const r = await api('gevolg', { kenmerk: van.kenmerk, minuten: Number(kies.value) });
        toonGevolg(uit, r, kies.value);
      } catch (e) {
        uit.textContent = 'Doorrekenen is niet gelukt. Probeer het opnieuw.';
      }
      knop.disabled = false;
    });
    rij.appendChild(lab); rij.appendChild(kies); rij.appendChild(knop);
    vak.appendChild(rij); vak.appendChild(uit);
    return vak;
  }

  function toonGevolg(bak, r, minuten) {
    bak.textContent = '';
    /* Een weigering van de server staat er met haar eigen zin: de reiziger
       hoort te zien WAAROM er geen antwoord is. */
    if (r.status !== 200) {
      bak.textContent = (r.body && r.body.error) || 'Doorrekenen is niet gelukt.';
      return;
    }
    const d = r.body || {};
    const regels = Array.isArray(d.regels) ? d.regels : [];
    /* ONBEKEND IS GEEN "GEEN GEVOLG". Een overgang die Move niet kan bepalen,
       telt nooit als geraakt; zonder deze telling zei de kop "wordt geen
       overgang krapper" over een reis waarvan Move de helft niet kon wegen. */
    const onbekend = regels.filter(g => g.na === 'NIET_TE_BEPALEN').length;
    const meervoud = n => n === 1 ? ' overgang' : ' overgangen';
    const kop = el('p', 'ds-detail__status', (d.geraakt
      ? minuten + ' minuten uitloop raakt ' + d.geraakt + meervoud(d.geraakt) + '.'
      : onbekend ? 'Move ziet geen overgang die krapper wordt, maar kan er niet alles van wegen.'
        : 'Met ' + minuten + ' minuten uitloop wordt geen overgang krapper.') +
      (onbekend ? ' ' + onbekend + meervoud(onbekend) + ' niet te bepalen.' : ''));
    kop.setAttribute('data-kop', '');
    bak.appendChild(kop);
    bak.appendChild(el('p', 'ds-meta', 'Uw reis: ' + woord(d.oordeelVoor) + ' \u2192 ' + woord(d.oordeelNa) +
      (Number.isFinite(d.dekking) ? ' (Move kon ' + d.dekking + '% wegen)' : '')));
    const ul = el('ul', 'ds-detail__gegevens');
    for (const g of regels) {
      const li = el('li', 'ds-taak__kop');
      li.setAttribute('data-geraakt', g.geraakt ? 'ja' : 'nee');
      li.appendChild(el('b', '', (g.titel || 'Onderdeel') + ': ' + woord(g.voor) + ' \u2192 ' + woord(g.na)));
      li.appendChild(el('span', 'ds-meta', g.uitleg || ''));
      /* HET VOORSTEL, NOOIT DE UITVOERING. De link brengt u naar de app waar
         het echte werk hoort; daar bevestigt u zelf. */
      if (g.voorstel && g.voorstel.app) {
        li.appendChild(el('span', 'ds-meta', 'Voorstel: ' + g.voorstel.wat + '.'));
        const a = el('a', '', 'Open waar dit onderdeel staat');
        a.href = g.voorstel.app;
        li.appendChild(a);
        /* De zin volgt het VELD dat het zegt, en niet de aanname dat Move nooit
           iets uitvoert. */
        if (g.voorstel.uitgevoerd === false) {
          li.appendChild(el('span', 'ds-meta', 'Er is niets verzet; dat bevestigt ' + (g.voorstel.bevestigt || 'een mens') + '.'));
        }
      }
      if (g.zonderWeg) li.appendChild(el('span', 'ds-meta', g.zonderWeg));
      ul.appendChild(li);
    }
    bak.appendChild(ul);
    if (Array.isArray(d.nietGewogen) && d.nietGewogen.length) {
      bak.appendChild(lijstje('Niet meegewogen (' + d.nietGewogen.length + ')', d.nietGewogen));
    }
  }

  function zegStand(uitkomst, extra) {
    const o = $('#oordeel');
    o.textContent = TEKST[uitkomst] || 'Uw reis is niet te wegen';
    o.setAttribute('data-u', uitkomst || '');
    $('#toelichting').textContent = extra || UITLEG[uitkomst] || '';
  }

  async function haal() {
    const r = await api('reis');
    if (r.status === 401) return zegStand(null, 'Meld u aan om uw reis te laten wegen.');
    if (r.status === 403) return zegStand(null, (r.body && r.body.error) || 'RTG Move is voor leden.');
    if (r.status !== 200) return zegStand(null, (r.body && r.body.error) || 'De weging is niet gelukt.');
    const d = r.body || {};

    /* GEEN OORDEEL IS EEN EIGEN STAND en niet stilzwijgend "in orde". `oordeel`
       is null zodra geen enkele overgang te bepalen was. */
    if (!d.onderdelen) {
      zegStand(null, '');
      const leeg = el('div', 'ds-status ds-status--binnen');
      const rust = el('img', 'ds-status__beeld'); rust.src = '/campagne/bamboe.jpg'; rust.alt = '';
      leeg.appendChild(rust);
      leeg.appendChild(el('h2', 'ds-status__titel', 'Nog geen reis om te wegen'));
      leeg.appendChild(el('p', 'ds-status__tekst', 'Zodra u twee onderdelen hebt die op elkaar volgen - een afspraak en een vlucht, een verblijf en een diner - rekent Move de overgang ertussen door.'));
      $('#naden').appendChild(leeg);
      return;
    }

    zegStand(d.oordeel || 'NIET_TE_BEPALEN');
    $('#mDekking').textContent = Number.isFinite(d.dekking) ? d.dekking + '%' : '\u2014';
    $('#mOnderdelen').textContent = d.onderdelen;
    $('#mPlek').textContent = d.metPlek;
    $('#mTijd').textContent = d.metTijd;
    $('#meters').hidden = false;

    const naden = Array.isArray(d.naden) ? d.naden : [];
    if (naden.length) {
      $('#kopNaden').hidden = false;
      const bak = $('#naden');
      for (const n of naden) bak.appendChild(naadKaart(n));
    }
  }

  async function volgende() {
    const r = await api('volgende');
    if (r.status !== 200 || !r.body || !r.body.volgende) return;   // geen knop zonder bestemming
    const v = r.body.volgende;
    const p = v.plek || {};
    if (!Number.isFinite(p.lat) || !Number.isFinite(p.lng)) return;
    const knop = $('#verder');
    knop.textContent = 'Naar ' + (p.label || v.titel || 'de volgende plek');
    /* Pas nu, met een echte plek, verschijnt de knop; ook de Edge biedt hem
       dan pas aan (data-ds-actie), en nooit een knop die nergens heen gaat. */
    $('#verderVak').hidden = false;
    knop.removeAttribute('data-leeg');
    knop.addEventListener('click', () => {
      /* De Key BRENGT u erheen en voert niets uit. Navigatie krijgt de plek als
         punt mee; die is hier al door de plekkenlaag opgelost, dus er wordt
         niets opnieuw geraden. */
      const q = new URLSearchParams({ naar: p.lat + ',' + p.lng, label: p.label || v.titel || '' });
      window.location.href = '/apps/navigatie.html?' + q.toString();
    });
  }

  haal().catch(() => zegStand(null, 'De weging is niet gelukt.'));
  volgende().catch(() => {});
})();
</script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/cookie.js" defer></script>
</body>
</html>
