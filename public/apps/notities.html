<!doctype html>
<html lang="nl" data-ds="1">
<head>
<script src="/shared/id.js"></script>
<meta charset="utf-8">
<script>try{if(window.self!==window.top)document.documentElement.dataset.rtgOppervlak='1'}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="dailyField.notesTasksPage">RTG Notities &amp; Taken</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notities">

<script src="/shared/rtg-world-desktop.js" defer></script>

<script src="/ds/shell.js"></script>
<script src="/shared/rtg-heritage-transition.js" blocking="render"></script>
</head>
<body class="ds-scherm ds-dagkamer rtg-stijl rtg-daily" data-kantoor-tool="notities" data-rtg-world="living" data-rtg-skin="heritage" data-rtg-daily="notities" data-rtg-editorial-room="notities" data-rtg-layout="standard">
<script>try{if(window.self!==window.top)document.body.setAttribute('data-ios-uit','')}catch(e){}</script>
<header class="ds-kop ds-dag-kop" data-rtg-menu-host>
  <a class="terug ds-knop" href="/apps/app.html" aria-label="Terug naar het bureaublad" data-i18n-aria="dailyField.backHome">&#8592;</a>
  <span><span class="ey">RTG</span><h1 data-i18n="dailyField.notesTasks">Notities &amp; Taken</h1></span>
  <span class="rij s-7myv37 ds-dag-rij ds-dag-auto">
    <button class="knop ds-knop" id="toonArchief" data-rtg-edge-bar data-ds-actie type="button" data-i18n="dailyField.archive">Archief</button>
    <button class="knop ds-knop" id="nieuwLijst" data-rtg-edge-bar data-ds-actie type="button" data-i18n="dailyField.newList">+ Lijst</button>
  </span>
</header>
<!-- De hoofdhandeling staat onderaan en niet in de kopbalk: GRAMMATICA.md,
     "ik wil iets doen -> mijn duim vindt het onderaan". Op telefoonmaat is dit
     een vaste strook (shared/rtg-ui.css, .rtg-duimbalk); daarboven een gewone
     rij onder de kop. -->
<div class="rtg-duimbalk"><button class="knop vol ds-knop" id="nieuwNotitie" data-rtg-edge-bar data-ds-actie type="button" data-hoofdactie data-i18n="dailyField.newNote">+ Notitie</button></div>
<main class="ds-dag-main">
<section id="dailyIntro" aria-label="Notities" data-i18n-aria="dailyField.notes"></section>
  <div class="daily-content ds-dag-daily-content">
  <input class="ds-invoer veld s-4t7hy3 ds-dag-breed" id="zoek" type="search" placeholder="Zoek in uw notities" data-i18n-ph="daily.noteSearch" aria-label="Zoeken"
 data-i18n-aria="dailyField.search">
  <div id="bord" aria-live="polite"></div>
  <div id="gedeeldKop" class="kop ds-dag-kop" hidden data-i18n="dailyField.sharedEditing">Met mij gedeeld · samen bewerken</div>
  <div id="gedeeldBord"></div>
  <div class="daily-foot ds-dag-daily-foot"><button type="button" class="daily-action ds-knop ds-dag-actie" data-daily-target="nieuwNotitie"><span data-i18n="daily.newNote">Nieuwe notitie</span> <span aria-hidden="true">→</span></button></div>
  <p class="stil ds-dag-marge ds-dag-stil" data-i18n="dailyField.noteHelp">Een notitie met datum en tijd krijgt vanzelf een gekoppelde afspraak
    in RTG Agenda; daar komt ook het seintje vandaan. Delen op codenaam is samen werken: de ander kan afvinken
    en aanvullen.</p>
  </div>
</main>

<dialog class="scrim ds-dag-scrim ds-dag-notitie" id="ntScrim" role="dialog" aria-label="Notitie" data-i18n-aria="dailyField.note">
  <div class="paneel ds-dag-paneel">
    <p id="ntMelding" role="status" class="ds-dag-stil"></p>
    <input class="ds-invoer titel ds-dag-titel" id="ntTitel" maxlength="120" placeholder="Titel" data-i18n-ph="dailyField.title">
    <div id="ntTekstWrap"><textarea class="ds-invoer" id="ntTekst" rows="7" maxlength="4000" placeholder="Schrijf hier." data-i18n-ph="dailyField.writeHere"></textarea></div>
    <div id="ntLijstWrap" hidden>
      <div id="ntTaken"></div>
      <div class="rij ds-dag-marge ds-dag-rij">
        <input class="ds-invoer gewoon ds-dag-rek ds-dag-gewoon" id="ntNieuwTaak" maxlength="200" placeholder="Nieuw punt; Enter voegt toe" data-i18n-ph="dailyField.newItem">
      </div>
    </div>
    <div class="twee ds-dag-twee">
      <span><label for="ntDatum" data-i18n="dailyField.remindOn">Herinner op</label><input class="ds-invoer" type="date" id="ntDatum"></span>
      <span><label for="ntTijd" data-i18n="dailyField.at">Om</label><input class="ds-invoer" type="time" id="ntTijd"></span>
    </div>
    <div id="ntDeelWrap">
      <label for="ntCode" data-i18n="dailyField.shareNote">Delen op codenaam (samen bewerken)</label>
      <div class="rij ds-dag-rij"><input class="ds-invoer gewoon ds-dag-rek ds-dag-gewoon" id="ntCode" maxlength="60" placeholder="Codenaam" data-i18n-ph="dailyField.codename">
        <button class="knop ds-knop" id="ntDeel" type="button" data-i18n="dailyField.share">Deel</button></div>
      <p class="stil ds-dag-stil" id="ntGedeeld"></p>
    </div>
    <div class="rij ds-dag-marge ds-dag-rij">
      <button class="knop vol ds-knop" id="ntBewaar" type="button" data-i18n="dailyField.save">Bewaar</button>
      <button class="knop ds-knop" id="ntVast" type="button" data-i18n="dailyField.pin">Vastpinnen</button>
      <button class="knop ds-knop" id="ntArchief" type="button" data-i18n="dailyField.archiveAction">Archiveer</button>
      <button class="knop ds-knop" id="ntWeg" type="button" data-i18n="dailyField.delete">Verwijder</button>
      <span class="ds-dag-rek"></span>
      <button class="knop ds-knop" id="ntDicht" type="button" data-i18n="dailyField.close">Sluit</button>
    </div>
  </div>
</dialog>
<div class="melding ds-melding" id="melding" role="status"></div>

<script src="/shared/cookie.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
<script src="/shared/ios.js" defer></script>
<script src="/shared/adaptief.js" defer></script>
<script src="/shared/objectverwijzing.js" defer></script>
<script src="/shared/adaptief/vorm.js" defer></script>

</body>
</html>
