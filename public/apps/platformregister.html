<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platformregister</title>
<meta name="theme-color" content="#0C0C0B">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icons/backoffice.svg" type="image/svg+xml">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/dagkleur.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<link href="/shared/rtg-ontwerp.css" rel="stylesheet">
<style>
  body{margin:0;padding-bottom:3rem;}
  main{max-width:64rem;margin:0 auto;padding:1.1rem;}
  header{display:flex;align-items:center;gap:.9rem;padding:1rem 1.1rem .7rem;
    border-bottom:1px solid var(--rtg-line);max-width:64rem;margin:0 auto;}
  header .weg{margin-left:auto;color:var(--rtg-soft);text-decoration:none;font-size:.78rem;}
  header .weg:hover,header .weg:focus-visible{color:var(--rtg-goud);}
  /* Twee wegwijzers naast elkaar: de tweede krijgt zijn lucht uit CSS en niet
     uit een style-attribuut, zodat style-src-attr dicht kan blijven. */
  header .weg + .weg{margin-left:.9rem;}
  .ey{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rtg-goud);}
  h1{font-size:1.3rem;margin:.1rem 0 0;}
  h2{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--rtg-soft);margin:1.7rem 0 .5rem;font-weight:500;}
  .uitleg{color:var(--rtg-muted);font-size:.86rem;line-height:1.65;max-width:46rem;}
  .soorten{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.45rem;}
  .soort{border:1px solid var(--rtg-line);background:var(--rtg-card2);padding:.6rem .7rem;
    text-align:left;font:inherit;color:var(--rtg-txt);cursor:pointer;display:block;width:100%;}
  .soort:hover,.soort:focus-visible{border-color:var(--rtg-goud);}
  .soort[aria-pressed="true"]{border-color:var(--rtg-goud);background:var(--rtg-card);}
  .soort b{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;}
  .soort .n{display:block;font-size:1.05rem;margin:.15rem 0 .25rem;
    font-variant-numeric:var(--rtg-cijfers);}
  .soort small{display:block;font-size:.66rem;color:var(--rtg-soft);line-height:1.5;}
  .zoekrij{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.7rem 0;}
  .zoekrij input,.zoekrij select{border:1px solid var(--rtg-line);background:var(--rtg-card2);
    color:var(--rtg-txt);font:inherit;font-size:.85rem;padding:.5rem .65rem;}
  /* ALLEEN het zoekveld rekt op. Stond hier `.zoekrij input`, dan rekt het
     vinkje in het label mee en komt het los van zijn eigen tekst te staan --
     zichtbaar in de eerste schermproef. */
  .zoekrij input[type="search"]{flex:1;min-width:11rem;}
  .zoekrij input[type="checkbox"]{flex:0 0 auto;margin:0;}
  .zoekrij label{font-size:.8rem;color:var(--rtg-muted);display:flex;align-items:center;gap:.35rem;}
  button{border:1px solid var(--rtg-line);background:transparent;color:var(--rtg-txt);
    font:inherit;font-size:.82rem;padding:.5rem .8rem;cursor:pointer;}
  button:hover:not(:disabled){border-color:var(--rtg-goud);}
  button:disabled{opacity:.4;cursor:default;}
  .ding{cursor:pointer;display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;}
  .ding .srt{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--rtg-soft);min-width:5.4rem;}
  .ding .nm{font-weight:500;}
  .ding .dt{color:var(--rtg-soft);font-size:.78rem;flex:1;min-width:9rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .knop{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid var(--rtg-line);padding:.1rem .4rem;color:var(--rtg-soft);}
  .knop[data-stand="aan"]{color:var(--rtg-txt);border-color:var(--rtg-goud);}
  .knop[data-stand="storing"]{color:var(--rtg-txt);border-color:var(--rtg-bordeaux,#9E1C40);}
  .pager{display:flex;gap:.6rem;align-items:center;justify-content:center;
    margin-top:.7rem;font-size:.8rem;color:var(--rtg-soft);}
  .leeg{color:var(--rtg-soft);font-size:.85rem;padding:.8rem 0;}
  dialog{border:1px solid var(--rtg-line);background:var(--rtg-card);color:var(--rtg-txt);
    max-width:42rem;width:92vw;padding:0;}
  dialog::backdrop{background:rgba(12,12,11,.72);}
  dialog .kop{padding:.9rem 1.1rem;border-bottom:1px solid var(--rtg-line);}
  dialog .lijf{padding:.7rem 1.1rem 1.1rem;max-height:66vh;overflow:auto;}
  dialog .voet{padding:.7rem 1.1rem;border-top:1px solid var(--rtg-line);text-align:right;}
  .veld{border-bottom:1px solid var(--rtg-line);padding:.6rem 0;}
  .veld .lb{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--rtg-soft);}
  .veld .wd{font-size:.86rem;line-height:1.6;margin-top:.15rem;}
  .getallen{display:grid;grid-template-columns:repeat(auto-fit,minmax(6rem,1fr));gap:.35rem;margin-top:.4rem;}
  .getallen div{border:1px solid var(--rtg-line);padding:.35rem .5rem;font-size:.72rem;}
  .getallen b{display:block;font-variant-numeric:var(--rtg-cijfers);}
</style>
</head>
<body class="rtg-stijl" data-rtg-modus="pro">
<a class="skip" href="#inhoud">Naar de inhoud</a>
<header>
  <div><div class="ey">RTG Kantoor</div><h1 class="rtg-ceremonie">Platformregister</h1></div>
  <a class="weg" href="/apps/routedossier.html">Routedossier -&gt;</a>
  <a class="weg" href="/apps/kantoor.html">&lt;- Kantoor</a>
</header>
<main id="inhoud">
  <!-- WAT DIT SCHERM BEANTWOORDT. Vier vragen per ding: wat is het, wat doet het,
       staat het aan, en wat weten we ervan. Die vier stonden op vier plekken en
       de vierde bestond alleen op routeniveau, waar niemand in denkt. -->
  <p class="uitleg">Van elk ding in dit huis: <b>wat het is</b>, <b>wat het doet</b>,
    <b>of het aan staat</b> en <b>wat we ervan weten</b>. Vier soorten dingen op een rij.
    Kijken doe je hier; schakelen doe je in de boardroom.</p>
  <p class="uitleg" id="samenvatting">Laden…</p>

  <h2>De vier soorten</h2>
  <div class="soorten" id="soorten"></div>

  <h2>Alle dingen</h2>
  <div class="zoekrij">
    <input id="zoek" type="search" placeholder="zoek op naam of wat het doet" aria-label="Zoek een ding">
    <select id="staat" aria-label="Filter op status">
      <option value="">elke status</option>
    </select>
    <label><input type="checkbox" id="aandacht"> alleen wat aandacht vraagt</label>
    <button id="zoeken">Zoeken</button>
    <button id="wis">Wis filter</button>
  </div>
  <p class="uitleg" id="filteruitleg"></p>
  <div class="rtg-register" id="lijst"><div class="leeg">Laden…</div></div>
  <div class="pager">
    <button id="vorige">&lt;- Vorige</button>
    <span id="paginatel"></span>
    <button id="volgende">Volgende -&gt;</button>
  </div>
</main>

<dialog id="kaart">
  <div class="kop"><div class="ey" id="kSoort"></div><b id="kNaam"></b></div>
  <div class="lijf" id="kLijf"></div>
  <div class="voet"><button id="kSluit">Sluiten</button></div>
</dialog>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const naarInlog = () => location.replace('/apps/personeel.html?kantoor=1&terug=' +
    encodeURIComponent(location.pathname));
  let TOKEN = null;
  try { TOKEN = localStorage.getItem('rtg_office_token'); } catch (e) { TOKEN = null; }
  if (!TOKEN) return naarInlog();

  let pagina = 1, soort = '', laatste = null;

  async function haal(lijf) {
    const r = await fetch('/api/office/platformregister', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
      body: JSON.stringify(lijf)
    });
    if (r.status === 401) return naarInlog();
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Het register is niet op te halen.');
    return d;
  }

  /* Welke statussen om aandacht vragen. Dezelfde lijst als de server gebruikt;
     hier alleen om ze in de vulling te kunnen tellen. */
  const AANDACHT = ['gezakt', 'zonder routes', 'ongemeten', 'nooit geopend', 'register ontbreekt', 'verouderd bewijs'];

  function tekenSoorten(d) {
    $('#soorten').innerHTML = d.soorten.map(s => {
      const p = d.perSoort[s.id];
      const werk = Object.entries(p.telling)
        .filter(([k]) => AANDACHT.includes(k))
        .reduce((a, [, n]) => a + n, 0);
      return '<button class="soort" type="button" data-soort="' + esc(s.id) + '"' +
        ' aria-pressed="' + (soort === s.id) + '" title="' + esc(s.wat) + '">' +
        '<b>' + esc(s.naam) + '</b>' +
        '<span class="n">' + p.totaal.toLocaleString('nl-NL') + '</span>' +
        '<small>' + esc(s.wat) + '<br>' +
        (werk ? werk.toLocaleString('nl-NL') + ' vraagt aandacht' : 'niets openstaand') +
        '</small></button>';
    }).join('');
    for (const b of document.querySelectorAll('.soort')) {
      b.addEventListener('click', () => {
        soort = (soort === b.dataset.soort) ? '' : b.dataset.soort;
        pagina = 1; ververs();
      });
    }
  }

  function tekenSamenvatting(d) {
    /* DE ONBENOEMDE ROUTES ZIJN DE BELANGRIJKSTE REGEL VAN DIT SCHERM. Hoort
       nul te zijn. Staat er iets, dan is er iets in dit huis waarvan niemand kan
       zeggen wat het is -- precies de vraag die dit register beantwoordt. */
    const on = d.onbenoemd.length;
    $('#samenvatting').innerHTML =
      '<b>' + d.totaal.toLocaleString('nl-NL') + ' dingen</b> over ' +
      d.routes.toLocaleString('nl-NL') + ' routes. ' +
      (on
        ? '<b>' + on + ' route(s) horen bij geen enkel ding</b>: ' +
          esc(d.onbenoemd.slice(0, 5).join(', ')) + (on > 5 ? ' en meer' : '') +
          '. Zolang dat zo is, is "wij weten van alles wat het is" niet waar.'
        : 'Elke route hoort bij precies één ding dat een naam en een uitleg heeft.');
  }

  function vulStaten(d) {
    const kies = $('#staat');
    if (kies.options.length > 1) return;
    const alle = new Set();
    for (const s of d.soorten) for (const k of Object.keys(d.perSoort[s.id].telling)) alle.add(k);
    for (const k of [...alle].sort()) {
      const o = document.createElement('option');
      o.value = k; o.textContent = k;
      kies.appendChild(o);
    }
  }

  function tekenLijst(d) {
    const l = d.lijst;
    $('#lijst').innerHTML = l.resultaten.map((x, i) => {
      const zorg = AANDACHT.includes(x.status.staat) || x.schakel.stand === 'storing';
      const pct = x.status.pct === null ? '' : ' ' + x.status.pct + '%';
      return '<div class="ding rtg-rail" data-sig="' + (zorg ? 'incident' : 'neutraal') + '"' +
        ' data-i="' + i + '" tabindex="0" role="button">' +
        '<span class="srt">' + esc(x.soort) + '</span>' +
        '<span class="nm">' + esc(x.naam) + '</span>' +
        '<span class="dt">' + esc(x.doet) + '</span>' +
        '<span class="knop" data-stand="' + esc(x.schakel.stand || '') + '">' +
          esc(x.schakel.stand || 'n.v.t.') + '</span>' +
        '<span class="rtg-status" data-sig="' + (zorg ? 'incident' : 'gezond') + '">' +
          esc(x.status.staat) + esc(pct) + '</span></div>';
    }).join('') || '<div class="leeg">Geen ding past bij dit filter.</div>';

    for (const el of document.querySelectorAll('.ding')) {
      const open = () => toonKaart(l.resultaten[Number(el.dataset.i)], d.uitleg);
      el.addEventListener('click', open);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    }
    $('#paginatel').textContent = l.totaal
      ? 'pagina ' + l.pagina + ' van ' + l.paginas + ' · ' + l.totaal.toLocaleString('nl-NL') + ' dingen'
      : 'geen resultaten';
    $('#vorige').disabled = l.pagina <= 1;
    $('#volgende').disabled = l.pagina >= l.paginas;

    const f = d.filter;
    $('#filteruitleg').textContent =
      (f.alleenAandacht ? 'Alleen wat aandacht vraagt. ' : '') +
      (f.soort ? 'Soort: ' + f.soort + '. ' : '') +
      (f.staat ? 'Status: ' + f.staat + '. ' : '') +
      l.totaal.toLocaleString('nl-NL') + ' van ' + d.totaal.toLocaleString('nl-NL') + ' dingen.';
  }

  /* De kaart van een ding: de vier vragen onder elkaar, in die volgorde. */
  function toonKaart(x, uitleg) {
    $('#kSoort').textContent = x.soort;
    $('#kNaam').textContent = x.naam;
    const veld = (lb, wd) => '<div class="veld"><div class="lb">' + esc(lb) + '</div>' +
      '<div class="wd">' + wd + '</div></div>';
    const st = x.status;
    let h = '';
    h += veld('Wat het doet', esc(x.doet || 'geen beschrijving vastgelegd') +
      (x.onbeschreven ? ' <b>(onbeschreven -- dit scherm staat niet in de app-gids)</b>' : ''));
    h += veld('Aan of uit', x.schakel.schakelbaar
      ? '<b>' + esc(x.schakel.stand) + '</b>' +
        (x.schakel.standaard === false ? ' (staat standaard uit)' : '') +
        (x.schakel.doelgroepen && x.schakel.doelgroepen.length
          ? '<br><span class="lb">voor: ' + esc(x.schakel.doelgroepen.join(', ')) + '</span>' : '')
      : '<b>' + esc(x.schakel.stand) + '</b> -- niet schakelbaar.<br>' + esc(x.schakel.reden));
    h += veld('Status', '<b>' + esc(st.staat) + (st.pct === null ? '' : ' (' + st.pct + '% bewezen)') + '</b><br>' +
      esc((uitleg && uitleg[st.staat]) || '') +
      (st.cellen ? '<div class="getallen">' +
        '<div><b>' + st.routes + '</b>routes</div>' +
        '<div><b>' + st.bewezen + '</b>bewezen</div>' +
        '<div><b>' + st.ongemeten + '</b>ongemeten</div>' +
        '<div><b>' + st.gezakt + '</b>gezakt</div></div>' : ''));
    if (x.grens) h += veld('Wat deze control NIET aantoont', esc(x.grens));
    if (x.bewijsstuk) h += veld('Bewijsstuk', esc(x.bewijsstuk));
    h += veld('Waar', esc((x.waar || []).join(', ') || 'nergens'));
    $('#kLijf').innerHTML = h;
    $('#kaart').showModal();
  }

  async function ververs() {
    try {
      const d = await haal({ zoek: $('#zoek').value.trim(), soort,
        staat: $('#staat').value, alleenAandacht: $('#aandacht').checked,
        pagina, limiet: 40 });
      if (!d) return;
      laatste = d;
      tekenSoorten(d); tekenSamenvatting(d); vulStaten(d); tekenLijst(d);
    } catch (e) {
      $('#lijst').innerHTML = '<div class="leeg">' + esc(e.message) + '</div>';
    }
  }

  const opnieuw = () => { pagina = 1; ververs(); };
  $('#zoeken').addEventListener('click', opnieuw);
  $('#zoek').addEventListener('keydown', e => { if (e.key === 'Enter') opnieuw(); });
  $('#staat').addEventListener('change', opnieuw);
  $('#aandacht').addEventListener('change', opnieuw);
  $('#wis').addEventListener('click', () => {
    $('#zoek').value = ''; $('#staat').value = ''; $('#aandacht').checked = false;
    soort = ''; opnieuw();
  });
  $('#vorige').addEventListener('click', () => { if (pagina > 1) { pagina--; ververs(); } });
  $('#volgende').addEventListener('click', () => { pagina++; ververs(); });
  $('#kSluit').addEventListener('click', () => $('#kaart').close());
  ververs();
})();
</script>
<script src="/shared/deelmenu.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
