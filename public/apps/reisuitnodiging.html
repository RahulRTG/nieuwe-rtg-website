<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<!-- Lees het bearer-fragment in geheugen en wis het vóór de eerste stylesheet,
     fetch of andere navigatie. Het geheim komt daardoor niet in een HTTP-pad,
     query, referrer of browsergeschiedenis terecht. -->
<script>
(function () {
  try {
    var code = new URLSearchParams(location.hash.replace(/^#/, '')).get('code') || '';
    code = String(code).trim().toUpperCase();
    if (/^REIS\.[A-F0-9]{32}$/.test(code)) window.__RTG_REISUITNODIGING_CODE = code;
    if (code) history.replaceState(null, '', location.pathname);
  } catch (e) {}
})();
</script>
<script src="/shared/id.js"></script>
<title>Uw reis staat klaar · RTG</title>
<meta name="theme-color" content="#F4EFE7">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/ds/rtg-ds.css" rel="stylesheet">
<script src="/apps/reisprogramma-weergave.js"></script>
<script src="/ds/shell.js"></script>
<script src="/shared/rtg-heritage-transition.js" blocking="render"></script>
</head>
<!-- Een expliciet gedeeld reisprogramma is zonder account volledig leesbaar.
     Bestaande accountuitnodigingen houden hun beperkte voorvertoning.
     Beide controleren doel, scope, intrekking en verval bij de bron.
     Op het RTG Design System (TRAVELOS-MIGRATIE.md, stroom D): Detail, Taak
     (overnemen of aanmelden) en Status. Een openbare gastdeur draagt geen
     persoonlijke Edge en geen accountcontext: data-ds-geen-edge, en
     data-public-platform="travel-guest" laat de basis buiten de deur. -->
<body class="ds-scherm" data-public-platform="travel-guest" data-ds-geen-edge data-ds-schermtype="detail" data-travelos-profile="invite" data-rtg-toegang="registratie" data-rtg-world="travel">
<header class="ds-kop">
  <span></span>
  <a class="ds-kop__merk" href="/" aria-label="Rahul Travel Group" data-rtg-safe-exit>RTG</a>
  <span></span>
</header>
<main class="ds-detail" id="main">
  <img class="ds-detail__beeld" src="/images/worlds/heritage/travel-heritage-v2.jpg" alt="">
  <div class="ds-detail__inhoud" id="vak"><p class="ds-meta">Even kijken...</p></div>
</main>
<script src="/apps/reisuitnodiging-client.js"></script>
<script src="/shared/i18n.js" defer></script>
<script src="/shared/basis.js" defer></script>
</body>
</html>
