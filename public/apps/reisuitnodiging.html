<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<!-- Lees het bearer-fragment in geheugen en wis het vóór de eerste stylesheet,
     fetch of andere navigatie. Het geheim komt daardoor niet in een HTTP-pad,
     query, referrer of browsergeschiedenis terecht. -->
<script>
(function () {
  try {
    var code = new URLSearchParams(location.hash.replace(/^#/, '')).get('code') || '';
    code = String(code).trim().toUpperCase();
    if (/^REIS\.[A-F0-9]{32}$/.test(code)) window.__RTG_REISUITNODIGING_CODE = code;
    if (code) history.replaceState(null, '', location.pathname);
  } catch (e) {}
})();
</script>
<script src="/shared/id.js"></script>
<title>Uw reis staat klaar · RTG</title>
<meta name="theme-color" content="#0C0C0B">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<link href="/shared/ios.css" rel="stylesheet">
<link href="/shared/travel-os.css" rel="stylesheet">
<link rel="stylesheet" href="/apps/reisprogramma.css">
<script src="/apps/reisprogramma-weergave.js"></script>
<script src="/shared/rtg-world-desktop.js" defer></script>
<link id="rtgHeritageCss" href="/shared/rtg-heritage.css" rel="stylesheet">
</head>
<!-- Een expliciet gedeeld reisprogramma is zonder account volledig leesbaar.
     Bestaande accountuitnodigingen houden hun beperkte voorvertoning.
     Beide controleren doel, scope, intrekking en verval bij de bron. -->
<body data-public-platform="travel-guest" data-ios-uit class="rtg-stijl" data-rtg-modus="world" data-travelos-profile="invite" data-rtg-toegang="registratie" data-rtg-world="travel" data-rtg-skin="heritage" data-rtg-layout="standard">
<main class="rtg-wrap" style="max-width:34rem;margin:0 auto;padding:2.5rem 1.2rem 4rem;">
  <h1 class="rtg-ceremonie" style="font-size:1.9rem;margin-bottom:.4rem;">RTG</h1>
  <div id="vak"><p class="rtg-sub">Even kijken...</p></div>
</main>
<script src="/apps/reisuitnodiging-client.js"></script>




<script src="/shared/basis.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
</body>
</html>
