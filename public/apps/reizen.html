<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Reizen</title>
<meta name="theme-color" content="#0C0C0B">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifests/reizen.webmanifest">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/dagkleur.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<link href="/shared/rtg-ontwerp.css" rel="stylesheet">
<!-- de materialenlaag: dit scherm kiest materialen en geen kleuren
     (MATERIAAL.md). Na rtg-ontwerp.css, want hij vult die aan. -->
<link href="/shared/rtg-materiaal.css" rel="stylesheet">
<link href="/shared/rtg-themas.css" rel="stylesheet">
<style>
  /* Eén maatstelsel voor dit scherm; alles hangt aan de dichtheid van de modus
     zodat World/Pro/Command hetzelfde scherm anders dicht maken en niet een
     ander scherm worden (ONTWERP.md par. 2). */
  /* GEEN harde grond hier. Die kwam eerst uit dit bestand (var(--onyx-glans)),
     en daardoor kon geen enkel thema hem nog veranderen -- precies de reden dat
     vier thema's er vier keer hetzelfde uitzagen. De grond komt nu uit
     rtg-themas.css, dat per thema een ander MATERIAAL kiest. */
  main{padding:0 var(--rtg-ruim) 1rem;max-width:820px;margin-inline:auto;}

  /* --- de kop: merk links, monogram rechts --- */
  /* a.terug en niet .terug: de algemene a-regel van het blad schildert links
     bordeaux, en bordeaux als TEKSTkleur op zwart haalt de contrastgrens niet
     (CLAUDE.md: op zwart is het wit of burgundy-on-dark). De keuring meldde
     3,78:1; met de zachte tekstkleur is het weer leesbaar. */
  a.terug{display:inline-block;margin-top:1rem;font-size:.8rem;color:var(--rtg-soft);
    text-decoration:none;letter-spacing:.04em;}
  a.terug:hover,a.terug:focus-visible{color:var(--gold-tekst);}
  .merkkop{display:flex;align-items:flex-start;gap:1rem;padding:.7rem 0 1.1rem;}
  .merkkop h1{margin:0;font-size:clamp(2rem,8vw,2.6rem);line-height:1.02;letter-spacing:0.005em;}
  .merkkop .onder{display:block;margin-top:.45rem;font-size:.68rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--rtg-soft);}
  .monogram{margin-left:auto;flex:none;width:56px;height:56px;border-radius:50%;
    border:1px solid var(--gold-rand);display:grid;place-items:center;
    font-size:.82rem;letter-spacing:.08em;color:var(--gold-basis);}

  /* --- de aandachtsbalk: EEN dominante mededeling, geen zes dozen --- */
  /* GEEN width:100% hier. Een blok-element vult zijn ouder al, en met de
     padding en de rand erbij werd hij 9px te breed -- net genoeg om de hele
     pagina horizontaal te laten schuiven, en te weinig om het te zien zonder
     het te meten. */
  /* Vraagt er iets aandacht, dan is de balk FLUWEEL: bordeaux dat licht
     absorbeert en pas rood wordt als je kijkt. Is er niets, dan is hij stil --
     een gouden balk boven een rustige dag is loos alarm. */
  .balk{display:flex;align-items:center;gap:.95rem;text-align:left;
    padding:.95rem 1rem;border:1px solid var(--bordeaux-rand);
    border-left:2px solid var(--gold-tekst);
    border-radius:var(--rtg-rond-klein);background:var(--bordeaux-glans);
    color:var(--op-bordeaux);text-decoration:none;}
  .balk[data-rustig]{border-color:var(--rtg-line);border-left-color:var(--rtg-sig-stil);
    background:none;color:inherit;}
  .balk .teken{flex:none;color:var(--op-bordeaux);display:grid;place-items:center;}
  .balk[data-rustig] .teken{color:var(--rtg-soft);}
  /* IVOOR op fluweel, geen goud. Zelfs het champagne-hoogsel haalt op bordeaux
     maar 4,21:1 en de logotoon 2,09:1. Dit is dezelfde regel die CLAUDE.md al
     voor bordeaux stelt, nu andersom: op een bordeaux vlak lees je ivoor.
     Het goud blijft waar het wel werkt -- als rand, en als icoon op onyx. */
  .balk .kop{display:block;font-size:.66rem;letter-spacing:.19em;text-transform:uppercase;
    color:var(--op-bordeaux);opacity:.85;}
  .balk[data-rustig] .kop{color:var(--rtg-soft);}
  .balk .zin{display:block;margin-top:.25rem;font-size:1.12rem;line-height:1.25;}
  .balk .pijl{margin-left:auto;color:var(--rtg-soft);flex:none;}

  /* --- registerkop --- */
  .regkop{display:flex;align-items:baseline;gap:.8rem;margin:1.6rem 0 .55rem;}
  .regkop h2{margin:0;font-size:.68rem;letter-spacing:.19em;text-transform:uppercase;
    color:var(--rtg-soft);font-weight:500;}
  .regkop .tel{margin-left:auto;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--rtg-soft);font-variant-numeric:var(--rtg-cijfers);}

  /* --- het register: tijdlijn links, dan de datumkolom, dan de inhoud --- */
  .reis{display:flex;align-items:stretch;gap:0;position:relative;
    padding:0 0 0 1.15rem;color:inherit;text-decoration:none;}
  /* de tijdlijn loopt DOOR tussen de regels; de stip zit op de datum. Zo lees
     je de reeks als een reis door de tijd en niet als losse dozen. */
  .reis::before{content:"";position:absolute;left:3px;top:0;bottom:0;width:1px;
    background:var(--rtg-line);}
  /* De stip zit op de MIDDENLIJN van zijn regel, net als de datum ernaast. Hij
     stond op een vaste afstand van boven (1,55rem); toen de datum naar het
     midden zakte bleef hij achter en wees hij nergens meer naar. Een tijdlijn
     waarvan de stip niet bij zijn eigen datum staat, is geen tijdlijn.
     De lijn begint en eindigt daarom ook bij de eerste en laatste stip. */
  .reis:first-child::before{top:50%;}
  .reis:last-child::before{bottom:50%;}
  .reis .stip{position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:7px;height:7px;border-radius:50%;background:var(--rtg-sig-stil);}
  .reis[data-sig="gezond"]   .stip{background:var(--rtg-sig-gezond);}
  .reis[data-sig="aandacht"] .stip{background:var(--rtg-sig-aandacht);}
  .reis[data-sig="incident"] .stip{background:var(--rtg-sig-incident);}
  .reis[data-sig="actief"]   .stip{background:var(--rtg-sig-actief);}

  .reis .doos{display:flex;gap:var(--rtg-ruim);flex:1;min-width:0;
    padding:var(--rtg-ruim) 0;border-bottom:1px solid var(--rtg-line);}
  .reis:last-child .doos{border-bottom:0;}
  .reis:hover .doos,.reis:focus-visible .doos{background:rgba(255,255,255,.022);}

  /* Verticaal midden tussen de haarlijnen. De rij is een flexrij, dus .dag
     rekte wel mee in hoogte maar de tekst erin begon bovenaan -- terwijl de
     kolom ernaast (titel, status, feiten, kenmerk) veel hoger is. Het gevolg:
     de datum stond tegen de bovenste streep aan met een gat naar de onderste.
     Zelf een kolom worden en die centreren zet hem op de optische middenlijn
     van zijn eigen regel. */
  .dag{width:5.4rem;flex:none;text-align:center;
    display:flex;flex-direction:column;justify-content:center;}
  .dag .wd,.dag .mnd{display:block;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--rtg-soft);}
  .dag .nr{display:block;margin:.1rem 0 .05rem;}

  .kern{min-width:0;flex:1;}
  .kern h3{margin:0;font-size:1.02rem;font-weight:600;line-height:1.3;}
  /* de plaats staat als cursieve serif ACHTER de titel: een annotatie, geen
     tweede kop. Rechtop naast een sans-titel las het als een storing. */
  .kern h3 .rtg-plaats{font-size:.98rem;color:var(--rtg-muted);margin-left:.3em;}
  .kern .status{margin-top:.3rem;}
  .kern .feiten{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-top:.4rem;
    font-size:.82rem;color:var(--rtg-soft);}
  .kern .feiten span{display:inline-flex;align-items:center;gap:.35rem;}
  .kern .onder{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-top:.45rem;}
  .kern .bron{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rtg-soft);}
  .reis .pijl{align-self:center;padding-left:.4rem;color:var(--rtg-soft);flex:none;}

  /* --- de wereld: vier poorten, gelijk van maat, icoon in goud --- */
  .poorten{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.55rem;}
  .poort{display:block;padding:1rem .7rem;border:1px solid var(--rtg-line);
    border-radius:var(--rtg-rond-klein);text-align:center;color:inherit;text-decoration:none;}
  .poort:hover,.poort:focus-visible{border-color:var(--gold-rand);}
  .poort .ic{color:var(--gold-tekst);display:block;margin:0 auto .55rem;}
  .poort b{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;}
  .poort span{display:block;margin-top:.3rem;font-size:.76rem;line-height:1.4;color:var(--rtg-soft);}

  .stilte{border-left:2px solid var(--rtg-sig-incident);padding:.7rem 0 .7rem .9rem;margin:1rem 0;
    font-size:.84rem;line-height:1.55;color:var(--rtg-soft);}
  .stilte strong{color:var(--rtg-txt);}
</style>
<link href="/shared/ios.css" rel="stylesheet">
</head>
<body class="rtg-stijl" data-rtg-modus="pro">
<a class="skip" href="#inhoud">Naar de inhoud</a>

<!-- RTG Reizen ORKESTREERT de reisdomeinen en vervangt ze niet (PLATFORM.md).
     Verblijven, Reisbureau, Vluchten en Hangar houden hun eigen catalogus en
     hun eigen boekingsstroom. Daarom staat er op dit scherm geen knop die boekt,
     wijzigt of annuleert: elke regel is een link naar de app die het echte werk
     doet. Zou dit scherm ook boeken, dan ontstaat een reis op twee plekken
     (LAT.md regel 4). -->

<main id="inhoud">
  <!-- EEN vaste RTG-header: hamburger, appnaam, lucht, inhoud. Verder niets.
       Hier stonden een "Home"-link, een RTG-rondje en de ondertitel "uw
       reiswereld" -- vier keer tegelijk vertellen dat dit RTG is, waardoor het
       merk juist zwakker werd. De hamburger van het app-menu (shared/appmenu.js)
       is de enige navigatie; de weg terug loopt daardoorheen. -->
  <header class="merkkop">
    <h1 class="rtg-ceremonie">RTG Reizen</h1>
  </header>

  <a class="balk" id="balk" href="#komend" data-rustig>
    <span class="teken" id="balkTeken"></span>
    <span>
      <span class="kop" id="balkKop">Laden</span>
      <span class="zin rtg-ceremonie" id="balkZin">&nbsp;</span>
    </span>
    <span class="pijl" aria-hidden="true">&rsaquo;</span>
  </a>

  <div id="stilte"></div>

  <div class="regkop">
    <h2>Wat eraan komt</h2>
    <span class="tel" id="tel"></span>
  </div>
  <div id="komend"><p class="stil">Laden...</p></div>

  <div class="regkop"><h2>De reiswereld</h2></div>
  <div class="poorten" id="poorten"></div>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const token = () => { try { return localStorage.getItem('rtg_member_token'); } catch (e) { return null; } };
  const SOORT = { verblijf: 'Verblijf', reis: 'Reis', vlucht: 'Vlucht', charter: 'Charter' };

  /* Eén iconenset, 24x24 grid, één lijndikte (ONTWERP.md par. 13). Inline SVG
     en geen emoji: de huisregel is dat beeld uit de eigen set komt, en een
     emoji ziet er op elk toestel anders uit. */
  const ic = (d, n) => '<svg width="' + (n || 16) + '" height="' + (n || 16) + '" viewBox="0 0 24 24" ' +
    'fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  const ICO = {
    bel: '<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
    vink: '<path d="M20 6 9 17l-5-5"/>',
    mens: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    pand: '<rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>',
    bed:  '<path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20"/><circle cx="7" cy="12" r="2"/>',
    vlieg:'<path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7L9 11l-2 3H4l-1 2 3.5 1L8 21l2-1v-3l3-2 3.1 5.1a1 1 0 0 0 1.7-.9Z"/>',
    kaart:'<path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v14"/>'
  };

  const WERELD = [
    ['Het Huis', 'Reserveren en bestellen', '/apps/rtg.html', ICO.pand],
    ['Verblijven', 'Hotels, appart. en villa’s', '/apps/hotels.html', ICO.bed],
    ['Reisbureau', 'Reizen met ledenprijzen', '/apps/reisbureau.html', ICO.vlieg],
    ['Vluchten', 'Boeken, beheren, inchecken', '/apps/vluchten.html', ICO.kaart]
  ];

  const WD = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
  const MND = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
  function dagdeel(d) {
    const x = new Date(d + 'T00:00:00');
    if (isNaN(x)) return { wd: '', nr: d || '', mnd: '' };
    // twee cijfers, want 06 en 29 horen in een kolom even breed te zijn
    return { wd: WD[x.getDay()], nr: String(x.getDate()).padStart(2, '0'), mnd: MND[x.getMonth()] };
  }

  function tekenBalk(t) {
    /* Wachten is geen aandacht. Drie reizen die netjes bij de reisadviseur
       liggen is de normale gang van zaken; daar een gouden alarmbalk boven
       zetten is loos alarm, en loos alarm leert mensen de balk te negeren op de
       dag dat hij wel klopt. */
    const alarm = t.aandacht + t.onbekend;
    const b = $('#balk');
    if (alarm) {
      b.removeAttribute('data-rustig');
      $('#balkTeken').innerHTML = ic(ICO.bel, 22);
      $('#balkKop').textContent = 'Er vraagt iets aandacht';
      const s = [];
      if (t.aandacht) s.push(t.aandacht + ' ' + (t.aandacht === 1 ? 'vraagt' : 'vragen') + ' actie');
      if (t.onbekend) s.push(t.onbekend + ' met onbekende status');
      $('#balkZin').textContent = s.join(', ');
      return;
    }
    b.setAttribute('data-rustig', '');
    $('#balkTeken').innerHTML = ic(ICO.vink, 22);
    $('#balkKop').textContent = t.komend ? 'Alles loopt' : 'Niets gepland';
    $('#balkZin').textContent = t.wachtend
      ? t.wachtend + ' ' + (t.wachtend === 1 ? 'wacht' : 'wachten') + ' op bevestiging'
      : (t.komend ? 'geen actie nodig' : 'nog geen reizen');
  }

  function reisRegel(x) {
    const d = dagdeel(x.van);
    const feiten = [];
    // alleen tonen wat het domein echt weet; niets verzinnen
    if (x.personen) feiten.push('<span>' + ic(ICO.mens) + x.personen + ' ' +
      (x.personen === 1 ? 'reiziger' : 'reizigers') + '</span>');
    if (x.wacht) feiten.push('<span>' + ic(ICO.pand) + esc(x.wacht.charAt(0).toUpperCase() + x.wacht.slice(1)) + '</span>');
    return '<a class="reis" href="' + esc(x.link) + '"' + (x.sig ? ' data-sig="' + esc(x.sig) + '"' : '') + '>' +
      '<span class="stip"></span>' +
      '<span class="doos">' +
        '<span class="dag"><span class="wd">' + esc(d.wd) + '</span>' +
          '<span class="nr rtg-datum">' + esc(d.nr) + '</span>' +
          '<span class="mnd">' + esc(d.mnd) + '</span></span>' +
        '<span class="kern">' +
          '<h3>' + esc(x.titel || SOORT[x.soort] || 'Reis') +
            (x.bestemming ? '<span class="rtg-plaats">' + esc(x.bestemming) + '</span>' : '') + '</h3>' +
          (x.status ? '<span class="status"><span class="rtg-status"' +
            (x.sig ? ' data-sig="' + esc(x.sig) + '"' : '') +
            ' data-teken="' + esc(x.teken || '·') + '">' + esc(x.status) + '</span></span>' : '') +
          (feiten.length ? '<span class="feiten">' + feiten.join('<span aria-hidden="true">·</span>') + '</span>' : '') +
          '<span class="onder">' +
            (x.kenmerk ? '<button class="rtg-ref" type="button" data-ref="' + esc(x.kenmerk) +
              '" title="Kopieer kenmerk">' + esc(x.kenmerk) + '</button>' : '') +
            '<span class="bron">' + esc(x.app) + '</span>' +
          '</span>' +
        '</span>' +
      '</span>' +
      '<span class="pijl" aria-hidden="true">&rsaquo;</span>' +
    '</a>';
  }

  function teken(d) {
    $('#stilte').innerHTML = (d.stil || []).length
      ? '<div class="stilte" role="status"><strong>Niet alles is opgehaald.</strong> ' +
        esc((d.stil || []).join(' en ')) + ' gaf geen antwoord. Dit is een onvolledig reisschema, ' +
        'geen leeg reisschema; kijk zo nodig in de app zelf.</div>' : '';

    tekenBalk(d.telling || { komend: 0, aandacht: 0, wachtend: 0, onbekend: 0 });

    const r = d.komend || [];
    $('#tel').textContent = r.length ? r.length + (r.length === 1 ? ' reis' : ' reizen') : '';
    $('#komend').innerHTML = r.length ? r.map(reisRegel).join('')
      : '<p class="stil">Er staat niets gepland. Zodra u ergens boekt, in welke reisapp dan ook, ' +
        'verschijnt het hier vanzelf.</p>';

    $('#komend').querySelectorAll('.rtg-ref').forEach(b => b.addEventListener('click', async (e) => {
      e.preventDefault(); e.stopPropagation();
      try { await navigator.clipboard.writeText(b.dataset.ref); const t = b.textContent;
        b.textContent = 'gekopieerd'; setTimeout(() => { b.textContent = t; }, 1200); } catch (err) {}
    }));
  }

  $('#poorten').innerHTML = WERELD.map(([naam, uitleg, url, icoon]) =>
    '<a class="poort" href="' + url + '"><span class="ic">' + ic(icoon, 26) + '</span>' +
    '<b>' + esc(naam) + '</b><span>' + esc(uitleg) + '</span></a>').join('');

  (async function laad() {
    try {
      const res = await fetch('/api/reis/wereld', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (token() || '') },
        body: '{}'
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || 'Er ging iets mis.');
      teken(d);
    } catch (e) {
      $('#balkKop').textContent = 'Niet ingelogd';
      $('#balkZin').textContent = '';
      $('#komend').innerHTML = '<p class="stil">' + esc(e.message) + ' Log eerst in via de leden-app.</p>';
    }
  })();
})();
</script>
<script src="/shared/rtg-themas.js"></script>
<script src="/shared/deelmenu.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/volscherm.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
