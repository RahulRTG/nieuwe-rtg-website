const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let TOKEN;try{TOKEN=localStorage.getItem('rtg_office_token')}catch(e){}let HOUSE='rtg',VIEW='today',S=null;const api=async(p,b={})=>{const r=await fetch('/api/rtgone/'+p,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify(b)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Verbinding mislukt');return d};const euro=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0),date=x=>x?new Date(x).toLocaleDateString('nl-NL'):'Geen datum';function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
async function personalOffice(){let member=null;try{member=localStorage.getItem('rtg_member_token')}catch(e){}if(!member)return false;try{const r=await fetch('/api/account/start',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+member},body:JSON.stringify({rol:'kantoor'})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.token)return false;TOKEN=d.token;try{localStorage.setItem('rtg_office_token',TOKEN)}catch(e){}return true}catch(e){return false}}

function liveToday(){const v=S.vandaag||{items:[],telling:{}};return '<div class="stats"><div class="stat"><b>'+Number(v.telling.rtmail||0)+'</b><span>RTMAIL prioriteiten</span></div><div class="stat"><b>'+Number(v.telling.agenda||0)+'</b><span>Agenda</span></div><div class="stat"><b>'+Number(v.telling.goedkeuringen||0)+'</b><span>Goedkeuringen</span></div><div class="stat"><b>'+Number(v.telling.taken||0)+'</b><span>Open taken</span></div></div>'+(!v.persoonlijk?'<div class="card" style="margin-bottom:14px;border-color:rgba(200,170,56,.35)"><div class="ey">Tijdelijke gedeelde toegang</div><h2>Koppel uw persoonlijke RTG-account.</h2><p>Dan worden uw eigen RTMAIL, agenda, rechten en auditidentiteit toegevoegd. De algemene kantoorcode blijft alleen de tijdelijke terugval.</p><div class="meta"><a class="btn" href="/apps/app.html" style="text-decoration:none">Persoonlijk account openen</a></div></div>':'<div class="meta" style="margin-bottom:14px"><span class="tag ok">Persoonlijk · '+esc(v.identiteit)+'</span>'+(v.adres?'<span class="tag">'+esc(v.adres)+'</span>':'')+'</div>')+(v.items.length?'<div class="list">'+v.items.map(x=>'<div class="row"><div><b>'+esc(x.titel)+'</b><p>'+esc(x.soort)+(x.van?' · '+esc(x.van):'')+(x.at?' · '+new Date(x.at).toLocaleString('nl-NL'):'')+'</p></div><span class="tag">'+esc(x.soort)+'</span></div>').join('')+'</div>':'<div class="empty">Geen urgente live-items in dit huis.</div>')}

function render(){if(!S)return;let h='';if(VIEW==='today')h=hero('Goedemorgen. Dit verdient aandacht.','Uw persoonlijke livebeeld uit RTMAIL, agenda, goedkeuringen en de taken van het gekozen huis.')+liveToday()+'<div class="toolbar" style="margin-top:16px"><button class="btn primary" data-new="promise">Leg belofte vast</button><button class="btn" data-new="intention">Nieuwe intentie</button><button class="btn" data-new="friction">Bereken frictie</button></div>'+promiseRows(S.beloften.filter(x=>x.status==='open').slice(0,5));if(VIEW==='promises')h=hero('Beloftenregister.','Ook informele toezeggingen blijven zichtbaar totdat ze aantoonbaar zijn nagekomen.')+'<div class="toolbar"><button class="btn primary" data-new="promise">Leg belofte vast</button></div>'+promiseRows();if(VIEW==='intentions')h=hero('Waarom doen we dit?','Besluiten bewaren hun oorspronkelijke bedoeling, doelgroep, bewijs en herzieningsmoment.')+'<div class="toolbar"><button class="btn primary" data-new="intention">Nieuwe intentie</button></div>'+intentCards();if(VIEW==='friction')h=hero('Frictiegrootboek.','Maak de verborgen kosten van zoeken, wachten en dubbel werk financieel zichtbaar.')+'<div class="toolbar"><button class="btn primary" data-new="friction">Frictie registreren</button></div>'+(S.fricties.length?'<div class="list">'+S.fricties.map(x=>'<div class="row"><div><b>'+esc(x.naam)+'</b><p>'+x.minuten+' min · '+x.frequentie+'× per week · '+x.jaarMinuten+' minuten per jaar</p></div><div class="amount">'+euro(x.jaarCenten/100)+'</div></div>').join('')+'</div>':'<div class="empty">Nog geen frictie berekend.</div>');if(VIEW==='handover')h=hero('Levende overdracht.','Open beloften en noodzakelijke context reizen gecontroleerd mee naar een tijdelijke vervanger.')+'<div class="toolbar"><button class="btn primary" data-new="handover">Overdracht maken</button></div>'+(S.overdrachten.length?'<div class="grid">'+S.overdrachten.map(x=>'<article class="card"><div class="ey">'+esc(x.eigenaar)+' → '+esc(x. const FORMS={promise:{title:'Leg een belofte vast',endpoint:'belofte',fields:[['belofte','Wat is precies beloofd?','textarea'],['eigenaar','Wie is verantwoordelijk?'],['aan','Aan wie?'],['deadline','Deadline','date']]},intention:{title:'Bewaar de bedoeling',endpoint:'intentie',fields:[['titel','Naam van het besluit of initiatief'],['waarom','Waarom doen we dit?','textarea'],['voorWie','Voor wie doen we dit?'],['bewijs','Wanneer weten we dat het werkt?','textarea'],['herzieOp','Herzien op','date']]},friction:{title:'Bereken verborgen werk',endpoint:'frictie',fields:[['naam','Welke handeling kost onnodig tijd?'],['minuten','Minuten per keer','number'],['frequentie','Keer per week','number'],['uurloon','Totale kosten per uur (€)','number']]},handover:{title:'Maak een levende overdracht',endpoint:'overdracht',fields:[['eigenaar','Werk van wie?'],['naar','Overdracht aan wie?'],['geldigTot','Toegang geldig tot','date'],['context','Wat moet de vervanger echt weten?','textarea']]},automation:{title:'Bereid omkeerbare actie voor',endpoint:'automatisering/voorbereid',select:true}};let FORM=null;function openForm(type){FORM=FORMS[type];$('#formEy').textContent='RTG One · '+HOUSE;$('#formTitle').textContent=FORM.title;if(FORM.select){const open=S.beloften.filter(x=>x.status==='open');$('#fields').innerHTML='<select name="belofteId" required><option value="">Kies een open belofte</option>'+open.map(x=>'<option value="'+x.id+'">'+esc(x.belofte)+'</option>').join('')+'</select>'}else $('#fields').innerHTML=FORM.fields.map(f=>f[2]==='textarea'?'<textarea name="'+f[0]+'" placeholder="'+f[1]+'"></textarea>':'<input name="'+f[0]+'" type="'+(f[2]||'text')+'" placeholder="'+f[1]+'">').join('');$('#modal').hidden=false}$('#cancel').onclick=()=>$('#modal').hidden=true;$('#form').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));body.huis=HOUSE;try{await api(FORM.endpoint,body);$('#modal').hidden=true;toast('Veilig opgeslagen');await load()}catch(e lass="stat"><b>'+g.rechten.length+'</b><span>Mijn rechten</span></div><div class="stat"><b>'+rollen.length+'</b><span>Toewijzingen huis</span></div><div class="stat"><b>'+(g.baas?'Owner':'Staff')+'</b><span>Bestuursniveau</span></div></div><div class="toolbar">'+(g.baas?'<button class="btn primary" id="newRole">Rol toewijzen</button>':'')+(g.rollen.length?g.rollen.map(r=>'<span class="tag ok">'+esc((g.catalogus[r]||{}).naam||r)+'</span>').join(''):'<span class="tag">Geen specialistische rol</span>')+'</div>'+(rollen.length?'<div class="list">'+rollen.map(r=>'<div class="row"><div><b>'+esc(r.naam||r.key)+'</b><p>'+esc((g.catalogus[r.rol]||{}).naam||r.rol)+' · '+esc(r.huis)+'</p></div>'+(g.baas?'<button class="btn" data-role-remove="'+r.id+'">Intrekken</button>':'')+'</div>').join('')+'</div>':'<div class="empty">Nog geen rollen toegewezen in dit huis.</div>');if($('#newRole'))$('#newRole').onclick=roleForm;$$('[data-role-remove]').forEach(b=>b.onclick=()=>act('rol/trek',{id:b.dataset.roleRemove},'Rol ingetrokken'));return true}return false}
const renderBase=render;render=function(){if(!S)return;if(!renderSpecial())renderBase()};
</script><script>
(function(){
  const style=document.createElement('style');style.textContent='.flow{display:grid;grid-template-columns:1.05fr 1fr;gap:14px}.flowcol{min-width:0}.flowtitle{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}.flowtitle h2{font-size:22px;margin:0}.progress{height:4px;background:#292522;margin:13px 0 8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#7f1634,#c8aa38)}.steps{display:flex;gap:5px;flex-wrap:wrap}.step{font-size:8px;color:var(--soft)}.step:after{content:"→";margin-left:5px;color:var(--line)}.step:last-child:after{display:none}.mailcard{cursor:pointer}.mailcard:hover{border-color:var(--gold)}.palette{position:fixed;z-index:100;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:start center;padding-top:12vh}.palette[hidden]{display:none}.palbox{width:min(620px,calc(100% - 24px));background:#11100f;border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.7)}.palbox input{width:100%;padding:18px;border:0;border-bottom:1px solid var(--line);background:transparent;color:#fff;font-size:16px;outline:0}.palresults{padding:8px;display:grid;gap:3px}.palresults button{border:0;background:transparent;color:var(--muted);padding:12px;text-align:left;cursor:pointer}.palresults button:hover{background:var(--card);color:#fff}@media(max-width:900px){.flow{grid-template-columns:1fr}}';document.head.append(style);

  function renderWorkstreams(){const mails=((S.vandaag||{}).items||[]).filter(x=>x.soort==='rtmail'),projects=S.projecten||[];$('#main').innerHTML=hero('Van signaal naar resultaat.','Een bericht wordt geen los mailtje, maar een aantoonbare keten van bedoeling, eigenaarschap, werk, documenten en besluitvorming.')+'<div class="flow"><section class="flowcol"><div class="flowtitle"><h2>Persoonlijk RTMAIL</h2><span class="tag">'+mails.length+' bronnen</span></div>'+(mails.length?mails.map(m=>'<article class="card mailcard" data-convert="'+esc(m.id)+'" data-title="'+esc(m.titel)+'"><div class="ey">'+esc(m.van||'RTMAIL')+'</div><h2>'+esc(m.titel)+'</h2><p>'+esc(m.preview||'Open het bericht en start de gecontroleerde werkstroom.')+'</p><div class="meta"><span class="tag '+(!m.gelezen?'ok':'')+'">'+(m.gelezen?'Gelezen':'Nieuw')+'</span><span class="tag">Maak project →</span></div></article>').join(''):'<div class="empty">Log persoonlijk in of wacht op een nieuw RTMAIL-bericht.</div>')+'</section><section class="flowcol"><div class="flowtitle"><h2>Actieve werkstromen</h2><span class="tag ok">'+projects.length+' projecten</span></div>'+(projects.length?projects.map(p=>'<article class="card"><div class="ey">'+esc(p.status)+' · '+esc(p.huis)+'</div><h2>'+esc(p.titel)+'</h2><p>Bron: '+esc(p.bron.van)+' · Eigenaar: '+esc(p.eigenaar)+(p.deadline?' · Deadline '+esc(p.deadline):'')+'</p><div class="progress"><i style="width:'+Number(p.voortgang||0)+'%"></i></div><div class="steps"><span class="step">Bron</span><span class="step">Intentie</span><span class="step">Taken</span><span class="step">Documenten</span><span class="step">Besluit</span><span class="step">Resultaat</span></div><div class="meta">'+p.taken.map(t=>'<label class="tag '+(t.af?'ok':'')+'"><input type="checkbox" data-project="'+p.id+'" data-task="'+t.id+'" '+(t.af?'checked':'')+'> '+esc(t.tekst)+'</label>').join('')+'<a class="tag" href="'+esc(p.documenten.ruimte)+'">Open documenten</a></div></article>').join(''):'<div class="empty">Kies links een bericht om de eerste werkstroom te starten.</div>')+'</section></div>';$$('[data-convert]').forEach(b=>b.onclick=()=>projectForm(b.dataset.convert,b.dataset.title));$$('[data-project]').forEach(c=>c.onchange=()=>act('project/taak',{id:c.dataset.project,taakId:c.dataset.task,af:c.checked},'Project bijgewerkt'))}

})();
