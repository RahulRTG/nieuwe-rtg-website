<!doctype html>
<html lang="nl" data-rtg-thema="bordeaux">
<head>
<script src="/shared/id.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>RTG Game Night</title>
<script>
/* Een fragment reist niet naar de server. Neem de eenmalige koppeling direct
   in geheugen en haal hem uit de adresbalk voordat de rest van de pagina
   draait; zo belandt hij ook niet in screenshots, geschiedenis of kopieerlinks. */
try {
  window.__spelKoppeling = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim().toUpperCase();
} catch (e) { window.__spelKoppeling = ''; }
if (location.hash) history.replaceState(null, '', location.pathname + location.search);
</script>
<meta name="theme-color" content="#0C0C0B">
<link rel="icon" href="/icons/foundation.svg" type="image/svg+xml">
<link rel="stylesheet" href="/apps/foundation/stijl.css">
<script src="/apps/foundation/palet.js"></script>
<link href="/shared/rtg-ui.css" rel="stylesheet">
<!-- De basis-laag draagt de toegankelijkheidsstand. Alleen de technische
     wauw-laag komt erbij voor de wake lock. De persoonlijke metgezel hoort
     bewust niet op een gedeeld apparaat, ook niet als deze browser toevallig
     nog een ledenaccount in localStorage heeft. -->
<script src="/shared/basis.js"></script>
<script src="/shared/wauw.js" defer></script>
<style>
  /* Een televisie is geen deelnemer. Alles is vanaf de bank leesbaar en er is
     geen account-, menu- of bedieningslaag over het spelbeeld heen. */
  body{margin:0;background:var(--zwart,#0C0C0B);color:#fff;
    font-family:var(--sans,Inter,system-ui,sans-serif);overflow:hidden;}
  .vol{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:4vmin;text-align:center;gap:3vmin;}
  h1{font-family:var(--serif,'Bodoni Moda',serif);font-weight:500;
    font-size:clamp(1.6rem,5vmin,3.2rem);margin:0;letter-spacing:.01em;}
  .merk{font-size:clamp(.6rem,1.4vmin,.9rem);letter-spacing:.34em;text-transform:uppercase;
    color:var(--zacht,#8A8680);font-weight:700;}
  .uitleg{color:var(--zacht,#8A8680);font-size:clamp(.8rem,2vmin,1.2rem);max-width:34rem;}
  .veld{font-size:clamp(.8rem,2.2vmin,1.3rem);padding:.65rem .8rem;text-align:center;
    letter-spacing:.08em;text-transform:uppercase;background:#141310;color:#fff;
    border:1px solid #2a2622;width:min(90vw,32rem);}
  .koppel{width:auto;letter-spacing:.12em;cursor:pointer;}
  .rij{display:flex;flex-wrap:wrap;gap:3vmin;justify-content:center;align-items:flex-end;}
  .sp{display:flex;flex-direction:column;gap:.4vmin;min-width:8rem;}
  .sp .nm{font-size:clamp(.9rem,2.4vmin,1.5rem);color:var(--zacht,#8A8680);}
  .sp .pt{font-family:var(--serif,'Bodoni Moda',serif);font-size:clamp(2rem,9vmin,5rem);line-height:1;}
  .sp.aan .nm{color:#C23A5E;font-weight:700;}
  .sp.aan .pt{color:#fff;}
  .groot{font-family:var(--serif,'Bodoni Moda',serif);font-size:clamp(2rem,8vmin,4.5rem);line-height:1.1;}
  .fout{color:#C23A5E;}
  .klein{font-size:clamp(.7rem,1.6vmin,1rem);color:var(--zacht,#8A8680);}
</style>
</head>
<!-- Geen OS-chrome: op een gedeeld apparaat hoort geen accountmenu. -->
<body data-ios-uit data-rtg-projectie data-rtg-world="living" data-rtg-eigenvlak="bordeaux">
<main class="vol" id="hoofd">
  <div class="merk">RTG Game Night</div>
  <h1 id="titel">Zet dit scherm aan tafel</h1>
  <div class="uitleg">Open een potje in RTG, kies <b>Op het grote scherm</b> en open de veilige link of typ de eenmalige code.</div>
  <input class="veld" id="codeveld" maxlength="40" autocomplete="off" spellcheck="false" placeholder="GAME.••••••••••••••••••••••••••••••••" aria-label="Eenmalige schermcode">
  <button class="veld koppel" id="koppelKnop" type="button">Koppel scherm</button>
  <div class="klein" id="melding"></div>
</main>
<script src="/apps/spelscherm.js" defer></script>
</body>
</html>
