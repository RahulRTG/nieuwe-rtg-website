<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --card2:var(--rtg-card2); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft); --burgundy:#C23A5E; --gold:#A98F1C; --green:#4C9A75; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;padding-bottom:3.5rem;}
  h1,h2,h3{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 86%,transparent));backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 1rem) 1.1rem .7rem;border-bottom:1px solid var(--line);}
  header .ey{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--rtg-leesgoud,var(--gold));}
  header h1{font-size:1.5rem;}
  main{padding:1.1rem;max-width:620px;margin:0 auto;}
  /* De tabbladenrij is de eigen schakelaar van deze app -- het wisselen blijft
     van de pagina -- maar draagt de stijl van het deelmenu (shared/deelmenu.js):
     geen pil met een randje, maar een rustige balk met kleine kapitalen en een
     gouden streep onder de actieve. Zo is het huis er een. De
     voorvoegsels zijn nodig omdat de gedeelde pilrij in rtg-ui.css anders
     zwaarder weegt: die rij staat er als `body.rtg-stijl .tabs > button` en
     dat telt een klasse en een element MEER dan een kale `.tab`. Zonder de
     `.tabs >` ervoor stond deze regel er wel, maar deed hij niets -- gemeten
     in de browser, niet gehoopt. */
  body.rtg-stijl .tabs{display:flex;gap:.15rem;flex-wrap:wrap;margin:.2rem 0 1.1rem;padding:0 0 .1rem;
    border-bottom:1px solid var(--line);}
  body.rtg-stijl .tabs > .tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;
    margin-bottom:-1px;padding:.55rem .8rem .6rem;font-family:'Inter',system-ui,sans-serif;font-size:.72rem;
    font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    white-space:nowrap;cursor:pointer;}
  body.rtg-stijl .tabs > .tab:hover{color:var(--txt);border-bottom-color:transparent;}
  body.rtg-stijl .tabs > .tab.aan{background:none;color:var(--txt);border-bottom-color:var(--gold);}
  .item{border:1px solid var(--line);border-radius:0;padding:.8rem .95rem;margin-bottom:.6rem;background:var(--card);}
  .item h4{font-family:'Bodoni Moda',serif;font-weight:500;font-size:1.02rem;}
  .item .meta{font-size:.78rem;color:var(--muted);margin-top:.2rem;line-height:1.55;}
  .nr{font-family:'Bodoni Moda',serif;color:var(--rtg-leesgoud,var(--gold));letter-spacing:.05em;}
  .rij{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem;align-items:center;}
  .veld{background:var(--bg);border:1px solid var(--line);border-radius:0;color:var(--txt);font:inherit;font-size:.85rem;padding:.42rem .6rem;}
  .knop{background:var(--gold);color:#000;border:none;border-radius:0;font:inherit;font-weight:600;font-size:.84rem;padding:.45rem 1rem;cursor:pointer;}
  .knop.stil{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:400;}
  .status{display:inline-block;font-size:.68rem;padding:.1rem .5rem;border-radius:0;border:1px solid var(--line);color:var(--muted);}
  .status.open{border-color:var(--burgundy);color:var(--burgundy);}
  .status.ok{border-color:var(--rtg-leesgroen,var(--green));color:var(--rtg-leesgroen,var(--green));}
  .status.goud{border-color:var(--gold);color:var(--rtg-leesgoud,var(--gold));}
  .uitslag{font-family:'Bodoni Moda',serif;font-size:1.3rem;color:var(--rtg-leesgoud,var(--gold));}
  .pass{border:1px solid rgba(169,143,7,.5);border-radius:0;background:linear-gradient(135deg,rgba(169,143,7,.12),transparent);padding:1rem 1.1rem;margin-bottom:.7rem;}
  .pass .code{font-family:'Bodoni Moda',serif;font-size:2rem;color:var(--rtg-leesgoud,var(--gold));letter-spacing:.12em;text-align:center;margin:.5rem 0;animation:gloei 2.4s ease-in-out infinite;}
  @keyframes gloei{0%,100%{text-shadow:0 0 6px rgba(169,143,7,.25);}50%{text-shadow:0 0 22px rgba(194,58,94,.55);}}
  .pass .regel{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);padding:.2rem 0;}
  .pass .regel b{color:var(--txt);font-weight:600;}
  .leeg{color:var(--soft);font-size:.9rem;text-align:center;padding:2rem 1rem;line-height:1.6;}
  .melding{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:0;padding:.6rem 1rem;font-size:.85rem;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th,td{text-align:left;padding:.38rem .45rem;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  th{font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);font-weight:500;}
  tr.eigen td{color:var(--rtg-leesgoud,var(--gold));}
  .vak{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:0;padding:.7rem .85rem;margin-bottom:.5rem;color:var(--txt);font:inherit;cursor:pointer;}
  .vak.aan{border-color:var(--gold);background:linear-gradient(135deg,rgba(169,143,7,.12),var(--card));}
  .vz{font-size:.74rem;color:var(--soft);margin-top:.15rem;}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=null; try{ TOKEN=localStorage.getItem('rtg_member_token'); }catch(e){}
function meld(t){ const m=$('#melding'); m.textContent=t; m.style.opacity='1'; clearTimeout(m._t); m._t=setTimeout(()=>m.style.opacity='0',2800); }
const api=(pad,body,herkans)=>fetch('/api/member/sport'+pad,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify(body||{})}).then(async r=>{const d=await r.json().catch(()=>({}));
  // 428 = de gegevenspoort: Rahul vraagt wat er mist en daarna gaat dit gewoon door
  const p=herkans?null:(window.RTGGegevensPoort&&window.RTGGegevensPoort.vang(d,r.status,()=>api(pad,body,true),(q,b)=>fetch(q,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify(b||{})}).then(x=>x.json())));
  if(p)return p;
  if(!r.ok){throw new Error(d.error||'Er ging iets mis.');}return d;});
const eur=c=>'€ '+(Number(c||0)/100).toFixed(2);
const SPORT_KOPPEN={
  bord:['Vandaag','Alles rondom de wedstrijd. Op het juiste moment.','Uitslagen, de stand en uw volgende wedstrijd bij elkaar.'],
  stand:['De stand','Iedere uitslag telt.','De actuele stand, rechtstreeks berekend uit de wedstrijden van de club.'],
  tickets:['Wedstrijddag','Van uw vak tot de aftrap.','Kies een wedstrijd en een echt beschikbaar vak. De club houdt de capaciteit bij.'],
  mijn:['Mijn tickets','Uw toegang. Klaar voor de poort.','Uw wedstrijd, vak en toegangscode bij elkaar. Betalen doet u bij de club.'],
  club:['Mijn club','Dichter bij de club. Zonder iets te missen.','Clubmomenten en zakelijke mogelijkheden, rechtstreeks van de club.']
};
const BEGIN_TAB=/^#(bord|stand|tickets|mijn|club)$/.test(location.hash)?location.hash.slice(1):'bord';
let TAB=BEGIN_TAB, CLUB='FCRTG', CLUBNAAM='De club', VAK=null, GEKOZEN_WEDSTRIJD=null;
/* Meenemen (shared/uitvoer.js): het eigen model van het tabblad waar u staat.
   Het bord en uw tickets zijn lijsten van deze app; ze gaan mee met de velden
   LOS in plaats van de regel "FC RTG - Es Vedra 2-1" die op de kaart staat.
   De stand is een echte tabel op het scherm -- die haalt de laag zelf op, dus
   daar meldt deze app niets aan. */
let BORD=null, TICKETS=null;
if(window.RTGUitvoer) RTGUitvoer.bron(()=>{
  if(TAB==='bord'&&BORD&&BORD.length) return { naam:'wedstrijden',
    kolommen:['datum','tijd','club','tegenstander','team','competitie','thuis of uit','uitslag'],
    rijen:BORD.map(w=>[w.datum||'',w.tijd||'',w.club||'',w.tegen||'',w.team||'',w.competitie||'',w.thuis?'thuis':'uit',w.uitslag||'']) };
  if(TAB==='mijn'&&TICKETS&&TICKETS.length) return { naam:'mijn-tickets',
    kolommen:['datum','tijd','wedstrijd','vak','aantal','prijs','code','status'],
    rijen:TICKETS.map(t=>[t.datum||'',t.tijd||'',t.wedstrijd||'',t.vak||'',t.aantal||'',(Number(t.prijsCenten||0)/100).toFixed(2),t.code||'',t.status||'']) };
  return null;
});
function zetStand(tab, vervang){
  if(!SPORT_KOPPEN[tab]) return;
  TAB=tab;
  document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('aan',x.dataset.t===TAB));
  document.querySelectorAll('[data-sport]').forEach(x=>x.classList.toggle('aan',x.dataset.sport===TAB));
  const k=SPORT_KOPPEN[TAB]; $('#sportEy').textContent=k[0]; $('#sportKop').textContent=k[1]; $('#sportSub').textContent=k[2];
  if(location.hash!=='#'+TAB) history[vervang?'replaceState':'pushState'](null,'','#'+TAB);
  laad();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>zetStand(b.dataset.t));
document.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>zetStand(b.dataset.sport));
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(SPORT_KOPPEN[t]&&t!==TAB)zetStand(t,true);});

async function laad(){
  if(!TOKEN){ $('#inhoud').innerHTML='<div class="leeg">Log eerst in via de RTG-app; daarna staan hier alle uitslagen, standen en uw tickets.</div>'; return; }
  ({ bord: laadBord, stand: laadStand, tickets: laadTickets, mijn: laadMijn, club: laadClub })[TAB]();
}

async function laadBord(){
  let d; try{ d=await api('/bord'); }catch(e){ $('#inhoud').innerHTML='<div class="leeg">'+esc(e.message)+'</div>'; return; }
  CLUB = (d.clubs[0]||{}).code || CLUB;
  CLUBNAAM = (d.clubs[0]||{}).naam || CLUBNAAM;
  BORD = d.wedstrijden||[];
  const komend=d.wedstrijden.filter(w=>!w.uitslag).reverse(), gespeeld=d.wedstrijden.filter(w=>w.uitslag);
  let stand=null; try{stand=await api('/stand',{club:CLUB});}catch(e){}
  const wedstrijd=(w,komendNu)=>'<article class="sport-match'+(komendNu?' sport-fixture':'')+'">'+
    '<span class="sport-team"><span class="sport-crest">'+esc((w.thuis?w.club:w.tegen).slice(0,3).toUpperCase())+'</span>'+esc(w.thuis?w.club:w.tegen)+'</span>'+
    '<span class="sport-score"><b>'+(w.uitslag?esc(w.uitslag):'VS')+'</b><small>'+(w.uitslag?'Afgelopen':esc(w.datum)+' · '+esc(w.tijd))+'</small></span>'+
    '<span class="sport-team"><span class="sport-crest">'+esc((w.thuis?w.tegen:w.club).slice(0,3).toUpperCase())+'</span>'+esc(w.thuis?w.tegen:w.club)+'</span></article>';
  const laatste=gespeeld[0], volgende=komend.find(w=>w.thuis)||komend[0];
  $('#inhoud').innerHTML=(laatste?'<div class="sport-section"><h3>Vandaag</h3></div>'+wedstrijd(laatste,false):'')+
    (volgende?wedstrijd(volgende,true)+'<button class="sport-action" data-koop="'+esc(volgende.wedstrijdId)+'">Bekijk wedstrijddag</button>':'')+
    (stand?'<div class="sport-section"><h3>De stand</h3><button data-open="stand">Bekijk alles</button></div>'+tekenStand(stand,4):'')+
    (!d.wedstrijden.length?'<div class="leeg">Nog geen wedstrijden op het bord.</div>':'');
  document.querySelectorAll('[data-koop]').forEach(b=>b.onclick=()=>{ GEKOZEN_WEDSTRIJD=b.dataset.koop; zetStand('tickets'); });
  verbindOpen();
}

function tekenStand(d,max){
  const rijen=max?d.tabel.slice(0,max):d.tabel;
  return '<div class="sport-table"><table><tr><th>#</th><th>Club</th><th>G</th><th>W</th><th>GL</th><th>V</th><th>+/-</th><th>P</th></tr>'+rijen.map((r,i)=>
    '<tr'+(r.team===d.team?' class="eigen"':'')+'><td>'+(i+1)+'</td><td>'+esc(r.team)+'</td><td>'+r.g+'</td><td>'+r.w+'</td><td>'+r.gl+'</td><td>'+r.v+'</td><td>'+(r.dv-r.dt)+'</td><td><b>'+r.p+'</b></td></tr>').join('')+'</table></div>';
}
async function laadStand(){
  let d; try{ d=await api('/stand',{club:CLUB}); }catch(e){ $('#inhoud').innerHTML='<div class="leeg">'+esc(e.message)+'</div>'; return; }
  $('#inhoud').innerHTML='<div class="sport-section"><h3>'+esc(d.competitie||'De stand')+'</h3></div>'+tekenStand(d)+
    '<div class="item"><div class="meta">Rechtstreeks berekend uit de uitslagen die de club invoert.</div></div>';
}

async function laadTickets(voorWedstrijd){
  voorWedstrijd=voorWedstrijd||GEKOZEN_WEDSTRIJD; GEKOZEN_WEDSTRIJD=null;
  let b, p;
  try{ b=await api('/bord'); p=await api('/plattegrond',{club:CLUB}); }catch(e){ $('#inhoud').innerHTML='<div class="leeg">'+esc(e.message)+'</div>'; return; }
  const clubInfo=(b.clubs||[]).find(c=>c.code===CLUB); if(clubInfo) CLUBNAAM=clubInfo.naam;
  const thuis=b.wedstrijden.filter(w=>w.clubCode===CLUB&&w.thuis&&!w.uitslag).reverse();
  if(!thuis.length){ $('#inhoud').innerHTML='<div class="leeg">Geen thuiswedstrijden in de verkoop.</div>'; return; }
  const VZ_ICO={horeca:'',wc:'',entree:'',ehbo:''};
  const vzBij=id=>p.voorzieningen.filter(v=>v.bij===id).map(v=>(VZ_ICO[v.soort]||'')+' '+esc(v.naam)).join(' · ');
  if(!VAK) VAK=(p.vakken[0]||{}).id;
  $('#inhoud').innerHTML=
    '<div class="item"><h4>Kies de wedstrijd</h4>'+
    '<div class="rij"><select class="veld h-flex1" id="tkW">'+thuis.map(w=>'<option value="'+esc(w.wedstrijdId)+'"'+(voorWedstrijd===w.wedstrijdId?' selected':'')+'>'+esc(w.club)+' - '+esc(w.tegen)+' · '+esc(w.datum)+' '+esc(w.tijd)+'</option>').join('')+'</select></div></div>'+
    '<div class="sport-stadium"><div class="sport-stadium-copy"><b>'+esc(CLUBNAAM)+'</b><small>Uw vak en de voorzieningen eromheen.</small></div><div class="sport-map" aria-label="Schematische stadionplattegrond"></div></div>'+
    '<div class="sport-section"><h3>Kies uw vak</h3></div>'+
    p.vakken.map(v=>'<button class="vak'+(v.id===VAK?' aan':'')+'" data-vak="'+esc(v.id)+'"><b>'+esc(v.naam)+'</b> · '+eur(v.prijsCenten)+' p.p.'+
      '<div class="vz">'+(vzBij(v.id)||'vrij vak')+'</div></button>').join('')+
    '<div class="item"><div class="rij h-mt0"><select class="veld" id="tkN">'+[1,2,3,4,5,6,7,8].map(n=>'<option value="'+n+'">'+n+' ticket'+(n>1?'s':'')+'</option>').join('')+'</select>'+
    '<button class="knop h-flex1" id="tkGo">Reserveer</button></div>'+
    '<div class="meta">Afrekenen aan de poort: contant of RTG Pay bij de kassa. Uw code licht op onder Mijn tickets.</div></div>';
  document.querySelectorAll('[data-vak]').forEach(b2=>b2.onclick=()=>{ VAK=b2.dataset.vak; laadTickets($('#tkW').value); });
  $('#tkGo').onclick=async()=>{
    try{ const r=await api('/ticket/koop',{club:CLUB,wedstrijdId:$('#tkW').value,vak:VAK,aantal:$('#tkN').value});
      meld('Gereserveerd: '+r.ticket.code+' · '+r.ticket.vak+'. '+r.ticket.let);
      zetStand('mijn');
    }catch(e){ meld(e.message); }
  };
}

async function laadMijn(){
  let d; try{ d=await api('/tickets'); }catch(e){ $('#inhoud').innerHTML='<div class="leeg">'+esc(e.message)+'</div>'; return; }
  TICKETS=d.tickets||[];
  $('#inhoud').innerHTML=d.tickets.length?d.tickets.map(t=>
    '<div class="pass"><div class="regel"><span>Wedstrijd</span><b>'+esc(t.wedstrijd)+'</b></div>'+
    '<div class="regel"><span>Wanneer</span><b>'+esc(t.datum)+' · '+esc(t.tijd)+'</b></div>'+
    '<div class="regel"><span>Vak</span><b>'+esc(t.vak)+' · '+t.aantal+'x</b></div>'+
    '<div class="regel"><span>Aan de poort</span><b>'+eur(t.prijsCenten)+' ('+(t.status==='gescand'?'gescand':'contant of RTG Pay')+')</b></div>'+
    '<div class="sport-ticket"><img class="sport-ticket-qr" data-ticket-code="'+esc(t.code)+'" alt="QR-toegangscode voor '+esc(t.wedstrijd)+'"><div><small>Toegangscode</small><div class="sport-ticket-code">'+esc(t.code)+'</div><div class="meta">'+(t.status==='gescand'?'Gescand bij de entree; veel plezier.':'Laat deze code zien bij de entree van '+esc(t.club))+'</div></div></div>'+
    '<div class="sport-ticket-actions"><a href="#mijn">Toon toegang</a><a href="/apps/navigatie.html">Open route</a></div></div>').join('')
    :'<div class="leeg">Nog geen tickets.<div class="rij"><button class="knop" data-open="tickets">Kies een wedstrijd</button></div></div>';
  document.querySelectorAll('[data-ticket-code]').forEach(img=>{try{if(window.RTGQRteken)img.src=RTGQRteken.dataURL(img.dataset.ticketCode,{schaal:5,quiet:3});}catch(e){img.hidden=true;}});
  verbindOpen();
}

async function laadClub(){
  let m, sp, st, bord;
  try{ bord=await api('/bord'); m=await api('/momenten',{club:CLUB}); sp=await api('/sponsors',{club:CLUB}); st=await api('/stand',{club:CLUB}); }
  catch(e){ $('#inhoud').innerHTML='<div class="leeg">'+esc(e.message)+'</div>'; return; }
  const clubInfo=(bord.clubs||[]).find(c=>c.code===CLUB); if(clubInfo) CLUBNAAM=clubInfo.naam;
  $('#inhoud').innerHTML=
    '<div class="item"><h4>'+esc(CLUBNAAM)+'</h4><div class="meta">Uw club in uitslagen, stand en momenten.</div></div>'+
    '<div class="sport-section"><h3>De stand</h3><button data-open="stand">Bekijk alles</button></div>'+tekenStand(st,4)+
    '<div class="sport-section"><h3>Clubmomenten</h3></div>'+
    (m.momenten.length?m.momenten.map(x=>'<article class="sport-moment"><div><b>'+esc(x.tekst)+'</b><small>'+esc(x.door)+' · '+new Date(x.at).toLocaleDateString('nl-NL')+'</small></div></article>').join(''):'<div class="leeg">Nog geen momenten.</div>')+
    '<div class="sport-section"><h3>Interesse in partnership</h3></div>'+
    (sp.sponsors.length?sp.sponsors.map(s=>
      '<div class="item"><h4>'+esc(s.pakket)+' <span class="status goud">'+eur(s.prijsCenten)+'</span></h4>'+
      (s.tekst?'<div class="meta">'+esc(s.tekst)+'</div>':'')+
      '<div class="rij"><button class="knop stil" data-sp="'+esc(s.id)+'">Bekijk mogelijkheden</button></div></div>').join('')
      :'<div class="item"><div class="meta">Geen open sponsorpakketten op dit moment.</div></div>')+
    '<div class="item"><div class="meta">Interesse tonen kan op codenaam; de club beslist zelf en neemt contact op.</div></div>';
  document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=async()=>{
    try{ const r=await api('/sponsor',{club:CLUB,id:b.dataset.sp}); meld('U staat op de lijst voor "'+r.sponsor.pakket+'"; de club neemt contact op.'); }
    catch(e){ meld(e.message); }
  });
  verbindOpen();
}

function verbindOpen(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>zetStand(b.dataset.open));}
zetStand(TAB,true);
