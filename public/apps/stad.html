<!doctype html>
<html lang="nl">
<head>
<script src="/shared/id.js"></script>
<script src="/shared/stroom.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mijn Stad</title>
<meta name="theme-color" content="#F4EFE7">
<link rel="icon" href="/icons/partners.svg">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/ds/rtg-ds.css" rel="stylesheet">
<script src="/ds/shell.js"></script>
</head>
<!-- Mijn Stad op het RTG Design System (TRAVELOS-MIGRATIE.md, stroom G):
     Status (hoe de stad erbij staat) en Taak (iets melden), met de eigen
     meldingen als rustige lijst. Zelfde kern als ervoor: /api/stad/bewoner,
     /api/stad/melding en het seintje 'stad' op /api/stream. Geen eigen stijl. -->
<body class="ds-scherm" data-rtg-world="travel" data-ds-schermtype="taak">
<header class="ds-kop">
  <button class="ds-kop__actie" type="button" data-ds-zoek aria-label="Spring naar een functie"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
  <a class="ds-kop__merk" href="/apps/app.html" id="terug" aria-label="Terug naar de app">RTG</a>
  <a class="ds-kop__actie" href="/apps/ik.html" aria-label="Uw account"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></a>
</header>
<main class="ds-taak" id="main">
  <div class="ds-taak__kop">
    <p class="ds-label">RTG Stad · voor bewoners</p>
    <h1 class="ds-titel ds-titel--scherm">Mijn Stad</h1>
  </div>
  <div class="ds-paneel" id="app"><div class="ds-status ds-status--binnen"><p class="ds-status__tekst">Laden…</p></div></div>
</main>
<p class="ds-melding" id="toast" role="status" aria-live="polite"></p>
<script src="/shared/uitvoer.js"></script>
<script src="/apps/stad.js"></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/cookie.js" defer></script>
</body>
</html>
