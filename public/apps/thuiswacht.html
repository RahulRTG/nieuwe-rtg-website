<!doctype html>
<html lang="nl" data-ds="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thuiswacht</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<!-- Thuiswacht is een stand van RTG Veilig geworden. De vier veiligheidsapps
     deelden altijd al dezelfde serverkern (server/kern/veiligheid/) en dezelfde
     clientlaag (shared/veiligheid.js); ze verschilden alleen in de vraag die ze
     stelden. Vier tegels voor een systeem dat een systeem is, betekende dat
     iemand de Thuiswacht kende en het Codewoord nooit had gezien.

     Dit pad blijft bestaan omdat er van buiten naar gelinkt kan zijn -- uit een
     alarmmail, uit een gedeelde link, uit een oud bladwijzertje, of vanaf een
     toestel waarop deze app als PWA is geinstalleerd -- en een dood pad is
     erger dan een omleiding. De hash wijst de schil meteen naar de juiste
     stand, dus wie hier binnenkomt ziet precies het scherm dat hij zocht.

     De querystring gaat VOOR de hash mee. Andersom (…html#stand?x=1) is de
     query geen query meer maar een stuk van de hash, en dan komt hij nergens
     aan; die fout stond hier een commit lang in. -->
<meta http-equiv="refresh" content="0; url=/apps/veilig.html#wacht">
<link rel="canonical" href="/apps/veilig.html#wacht">
<script>location.replace('/apps/veilig.html' + location.search + '#wacht');</script>
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/ds/rtg-ds.css" rel="stylesheet">
</head>
<body class="ds-scherm" data-ds-schermtype="status" data-ds-nadruk="gereedschap">
<main class="ds-status" id="hoofd">
  <h1 class="ds-status__titel">Thuiswacht</h1>
  <p class="ds-status__tekst">Thuiswacht staat nu in RTG Veilig.</p>
  <a class="ds-knop ds-knop--primair ds-status__actie" href="/apps/veilig.html#wacht">Ga verder</a>
</main>
</body>
</html>
