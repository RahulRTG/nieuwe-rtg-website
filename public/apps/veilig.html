<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Veilig</title>
<meta name="theme-color" content="#0C0C0B">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifests/veilig.webmanifest">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/veiligheid.css" rel="stylesheet">
<link href="/shared/dagkleur.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<link href="/shared/canvas.css" rel="stylesheet">
<style>
  /* De vier standen. Dezelfde vormtaal als de Media OS (apps/media.html): een
     strook met haarlijn eronder, de actieve stand met een gouden onderrand.
     Geen tweede uitvinding voor hetzelfde element. */
  .standen{display:flex;gap:0.15rem;padding:0 1.1rem;border-bottom:1px solid var(--line);overflow-x:auto;}
  .standen button{background:none;border:0;padding:0.6rem 0.85rem 0.65rem;margin-bottom:-1px;color:var(--soft);
    font:inherit;font-size:0.92rem;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;}
  .standen button:focus-visible{outline:2px solid var(--goldlicht);outline-offset:-2px;}
  .standen button[aria-current="true"]{color:var(--txt);border-bottom-color:var(--gold);}
  .standregel{padding:0 1.1rem;margin:.7rem 0 0;}
  .stand{display:block;width:100%;text-align:left;margin:.5rem 0;padding:.9rem 1rem;
    background:transparent;border:1px solid var(--line);border-radius:12px;color:var(--txt);font:inherit;cursor:pointer;}
  .stand:focus-visible{outline:2px solid var(--goldlicht);outline-offset:2px;}
  .stand[aria-pressed="true"]{border-color:var(--goldlicht);background:rgba(201,162,75,.09);}
  .stand b{display:block;font-size:.98rem;margin-bottom:.2rem;}
  .stand span{display:block;color:var(--soft);font-size:.82rem;line-height:1.5;}
  .baan{border:1px solid var(--groen);border-radius:12px;padding:.8rem .9rem;margin:1rem 0;
    font-size:.84rem;line-height:1.55;color:var(--soft);background:rgba(105,184,145,.07);}
  .baan strong{color:var(--txt);}
</style>
<script src="/shared/seizoen.js" defer></script>
<script src="/shared/veiligheid.js" defer></script>
<link href="/shared/ios.css" rel="stylesheet">
</head>
<body class="rtg-stijl">
<a class="skip" href="#inhoud">Naar de inhoud</a>
<header class="kop">
  <a href="/apps/app.html" aria-label="Terug naar de app">&#8592;</a>
  <h1>RTG Veilig</h1>
  <div class="rek"></div>
  <span class="stil" id="standRegel">wie er over u waakt</span>
</header>

<!-- De vier standen waren vier apps: Thuiswacht, Codewoord, Vitaal en
     Thuisrust. Ze deelden altijd al ALLES wat eronder zit -- dezelfde
     serverkern (server/kern/veiligheid/), dezelfde clientlaag
     (shared/veiligheid.js), dezelfde kring en dezelfde eerlijke grens -- en
     verschilden alleen in welke vraag ze stelden. Vier tegels voor een systeem
     dat een systeem is, betekende in de praktijk dat iemand de Thuiswacht
     kende en het Codewoord nooit had gezien.

     Wat hier NIET gebeurt: er komt geen tweede administratie naast de kern
     (LAT.md regel 4). Elke stand roept exact dezelfde routes aan als zijn app
     dat deed. De winst zit in wat nu een keer bestaat in plaats van vier keer:
     de kring en de grens. -->
<nav class="standen" id="standen" aria-label="Standen"></nav>
<p class="stil standregel" id="standUitleg"></p>

<!-- RTG iD en de Labpas horen in de wereld die over identiteit gaat, en ze
     stonden nergens. RTG iD was de urgentste van alle wezen: apps/overheid.html
     zegt letterlijk "Open RTG iD in de leden-app en voer deze code in", terwijl
     dat scherm nergens te openen was. Een instructie naar een deur die niet
     bestaat. -->
<nav class="wereldapps" aria-label="Apps in deze wereld">
  <a href="/apps/rtgid.html">RTG iD</a>
  <a href="/apps/labpas.html">Labpas</a>
</nav>
<main id="inhoud">
  <section aria-label="De stand" id="paneelVak">
    <div id="paneel"><p class="stil">Laden...</p></div>
  </section>

  <!-- De kring stond in alle vier de apps apart en werd dus vier keer
       opgehaald en vier keer getekend. Hij hoort bij de persoon en niet bij de
       stand, dus hij staat hier een keer, onder alles wat u kiest. -->
  <section aria-label="Uw kring">
    <h2 id="kringKop">Uw kring</h2>
    <div class="kaart" id="kring"><p class="stil">Laden...</p></div>
  </section>

  <!-- De grens staat op ELKE stand, want dat is de zin die iemand beschermt
       tegen valse geruststelling. Hij hoort niet bij een stand maar bij de app;
       daarom staat hij buiten het paneel en niet erin. -->
  <div id="grens" class="rtgdeel-vast"></div>
</main>

<script src="/shared/uitvoer.js"></script>
<script src="/apps/veilig/wacht.js"></script>
<script src="/apps/veilig/codewoord.js"></script>
<script src="/apps/veilig/vitaal.js"></script>
<script src="/apps/veilig/rust.js"></script>
<script src="/apps/veilig/schil.js"></script>
<script src="/shared/deelmenu.js" defer></script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/bediening.js" defer></script>
<script src="/shared/randen.js" defer></script>
<script src="/shared/volscherm.js" defer></script>
<script src="/shared/cookie.js" defer></script>
<script src="/shared/sneltoets.js" defer></script>
<script src="/shared/ios.js" defer></script>
</body>
</html>
