<style>
  :root{ --bg:var(--rtg-bg); --card:var(--rtg-card); --card2:var(--rtg-card2); --line:var(--rtg-line);
    --txt:var(--rtg-txt); --muted:var(--rtg-muted); --soft:var(--rtg-soft); --burgundy:#C23A5E; --gold:#A98F1C; --green:#4C9A75; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;padding-bottom:3.5rem;}
  h1,h2,h3{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 86%,transparent));backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 1rem) 1.1rem .7rem;border-bottom:1px solid var(--line);}
  header .ey{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--rtg-leesgoud,#E7A8B8);}
  header h1{font-size:1.5rem;}
  main{padding:1.1rem;max-width:620px;margin:0 auto;}
  /* De tabbladenrij (Het bord / Mijn reizen) is de eigen schakelaar van deze
     app -- het wisselen blijft van de pagina -- maar draagt de stijl van het
     deelmenu (shared/deelmenu.js): geen pil met een randje, maar een rustige
     balk met kleine kapitalen en een gouden streep onder de actieve. Zo is het
     huis er een. De knopregels wijzen de knop aan via zijn rij
     (body.rtg-stijl .tabs > .tab): de gedeelde pilrij in rtg-ui.css schrijft
     body.rtg-stijl .tabs > button, en die weegt zwaarder dan .tab alleen --
     zonder die rij in het pad bleef de pil gewoon staan. */
  body.rtg-stijl .tabs{display:flex;gap:.15rem;flex-wrap:wrap;margin:.2rem 0 1.1rem;padding:0 0 .1rem;
    border-bottom:1px solid var(--line);}
  body.rtg-stijl .tabs > .tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;
    margin-bottom:-1px;padding:.55rem .8rem .6rem;font-family:'Inter',system-ui,sans-serif;font-size:.72rem;
    font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    white-space:nowrap;cursor:pointer;}
  body.rtg-stijl .tabs > .tab:hover{color:var(--txt);border-bottom-color:transparent;}
  body.rtg-stijl .tabs > .tab.aan{background:none;color:var(--txt);border-bottom-color:var(--gold);}
  .item{border:1px solid var(--line);border-radius:0;padding:.8rem .95rem;margin-bottom:.6rem;background:var(--card);}
  .item h4{font-family:'Bodoni Moda',serif;font-weight:500;font-size:1.02rem;}
  .item .meta{font-size:.78rem;color:var(--muted);margin-top:.2rem;line-height:1.55;}
  .nr{font-family:'Bodoni Moda',serif;color:var(--rtg-leesgoud,#E7A8B8);letter-spacing:.05em;}
  .rij{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem;align-items:center;}
  .veld{background:var(--bg);border:1px solid var(--line);border-radius:0;color:var(--txt);font:inherit;font-size:.85rem;padding:.42rem .6rem;}
  .knop{background:var(--gold);color:#000;border:none;border-radius:0;font:inherit;font-weight:600;font-size:.84rem;padding:.45rem 1rem;cursor:pointer;}
  .knop.stil{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:400;}
  .status{display:inline-block;font-size:.68rem;padding:.1rem .5rem;border-radius:0;border:1px solid var(--line);color:var(--muted);}
  .status.open{border-color:var(--burgundy);color:var(--burgundy);}
  .status.ok{border-color:var(--rtg-leesgroen,var(--green));color:var(--rtg-leesgroen,var(--green));}
  .status.goud{border-color:var(--gold);color:var(--rtg-leesgoud,#E7A8B8);}
  .pass{border:1px solid rgba(169,143,7,.5);border-radius:0;background:linear-gradient(135deg,rgba(169,143,7,.12),transparent);padding:1rem 1.1rem;margin-bottom:.7rem;}
  .pass .code{font-family:'Bodoni Moda',serif;font-size:2rem;color:var(--rtg-leesgoud,#E7A8B8);letter-spacing:.12em;text-align:center;margin:.5rem 0;animation:gloei 2.4s ease-in-out infinite;}
  @keyframes gloei{0%,100%{text-shadow:0 0 6px rgba(169,143,7,.25);}50%{text-shadow:0 0 22px rgba(194,58,94,.55);}}
  .pass .regel{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);padding:.2rem 0;}
  .pass .regel b{color:var(--txt);font-weight:600;}
  .pass .code-ontbreekt{text-align:center;margin:.75rem 0;}
  .pass .code-acties{justify-content:center;}
  .leeg{color:var(--soft);font-size:.9rem;text-align:center;padding:2rem 1rem;line-height:1.6;}
  .melding{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:0;padding:.6rem 1rem;font-size:.85rem;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none;}
  .sec{font-size:.78rem;color:var(--muted);line-height:1.6;margin:-.2rem 0 .8rem;}
</style>

<body class="rtg-stijl travel-os rtg-travel-flow rtg-flight-experience" data-rtg-eigenvlak="onyx" data-rtg-world="travel" data-rtg-skin="heritage">
<header class="vliegkop">
  <a class="vlucht-brand" href="/apps/reizen.html" aria-label="RTG TravelOS"><b>RTG</b><span>TravelOS</span><small>Van vertrek tot thuiskomst</small></a>
  <div class="vlucht-koptekst"><span class="ey" id="vluchtEy">Vlucht</span><h1 id="vluchtTitel">Waar wilt u naartoe?</h1><p id="vluchtIntro">Vind uw vlucht en zie meteen wat u nu moet doen.</p></div>

<!-- uitvoer.js zonder defer en vlak voor het eigen script: dat meldt zijn
     model aan met RTGUitvoer.bron(). In de <head> hield hij het parsen op
     zonder dat het iets won. -->
<script src="/shared/uitvoer.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=null; try{ TOKEN=localStorage.getItem('rtg_member_token'); }catch(e){}
const passSleutel=id=>'rtg_airport_boarding_pass_session_'+String(id||'');
function bewaarPass(id,code){ try{ sessionStorage.setItem(passSleutel(id),String(code||'')); }catch(e){} }
function leesPass(id){ try{ return sessionStorage.getItem(passSleutel(id))||''; }catch(e){ return ''; } }
function vergeetPass(id){ try{ sessionStorage.removeItem(passSleutel(id)); }catch(e){} }
function meld(t){ const m=$('#melding'); m.textContent=t; m.style.opacity='1'; clearTimeout(m._t); m._t=setTimeout(()=>m.style.opacity='0',2800); }
const api=(pad,body)=>fetch('/api/member/vluchten'+pad,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify(body||{})}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok){throw new Error(d.error||'Er ging iets mis.');}return d;});
const START_VIEW=new URLSearchParams(location.search).get('view');
let TAB=['mijn','charter'].includes(START_VIEW)?START_VIEW:'bord';
let BORD=null, MIJN=null;   // wat er binnenkwam; waaruit dit scherm tekent
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('aan',b.dataset.t===TAB));
/* Meenemen (shared/uitvoer.js): allebei de tabbladen zijn een echte lijst, dus
   u neemt mee wat u aankijkt -- het bord met de vluchten, of uw eigen
   boekingen. De velden los, zoals de app ze van de server krijgt. */
if(window.RTGUitvoer) RTGUitvoer.bron(()=>{
  if(TAB==='charter'){
    const r=(MIJN&&MIJN.charters||[]).map(c=>[c.code,c.soort,c.bestemming,c.datum,c.tijd,c.status]);
    return r.length?{naam:'mijn-charteraanvragen',
      kolommen:['code','soort','bestemming','datum','tijd','status'],rijen:r}:null;
  }
  if(TAB==='mijn'){
    const r=(MIJN&&MIJN.boekingen||[]).map(b=>[b.vlucht.datum,b.vlucht.tijd,b.vlucht.nummer,
      b.vlucht.bestemming,b.id,b.stoel||'',b.status]);
    return r.length?{naam:'mijn-reizen',
      kolommen:['datum','tijd','vluchtnummer','bestemming','boeking','stoel','status'],rijen:r}:null;
  }
  const r=(BORD&&BORD.vluchten||[]).map(v=>[v.datum,v.tijd,v.nummer,v.bestemming,v.soort,v.gate,
    v.geannuleerd?'geannuleerd':v.status]);
  return r.length?{naam:'vluchtenbord',
    kolommen:['datum','tijd','vluchtnummer','bestemming','soort','gate','status'],rijen:r}:null;
});
function zetTab(tab){
  TAB=['bord','mijn','charter'].includes(tab)?tab:'bord';
  document.body.dataset.vluchtTab=TAB;
  const kop={
    bord:['Vlucht','Waar wilt u naartoe?','Vind uw vlucht en zie meteen wat u nu moet doen.'],
    mijn:['Mijn vlucht','Alles bij de hand.','Uw tijd, gate, stoel, bagage en instapcode op één rustige plek.'],
    charter:['Persoonlijk vliegen','Uw tijd bepaalt het vertrek.','Vraag een privévlucht of helikopter aan. Operations bevestigt persoonlijk.']
  }[TAB];
  $('#vluchtEy').textContent=kop[0]; $('#vluchtTitel').textContent=kop[1]; $('#vluchtIntro').textContent=kop[2];
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('aan',x.dataset.t===TAB));
  document.querySelectorAll('[data-vlucht-nav]').forEach(x=>x.setAttribute('aria-current',x.dataset.vluchtNav===TAB?'page':'false'));
  const url=new URL(location.href); if(TAB==='bord') url.searchParams.delete('view'); else url.searchParams.set('view',TAB);
  history.replaceState(null,'',url.pathname+url.search); laad();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>zetTab(b.dataset.t));
document.querySelectorAll('[data-vlucht-nav]').forEach(b=>b.onclick=()=>zetTab(b.dataset.vluchtNav));

async function laad(){
  if(!TOKEN){ $('#inhoud').innerHTML='<div class="leeg">Log eerst in via de RTG-app; daarna boekt en checkt u hier in.</div>'; return; }
  if(TAB==='bord') laadBord(); else if(TAB==='mijn') laadMijn(); else laadCharter();
}
async function laadBord(){
  let d; try{ d=await api('/bord'); }catch(e){ $('#inhoud').innerHTML='<div class="leeg">'+esc(e.message)+'</div>'; return; }
  BORD=d;
  const sec=d.security.filter(f=>f.open).map(f=>esc(f.naam)+': '+f.wachtMinuten+' min').join(' · ');
  const eerste=(d.vluchten[0]||{}).datum||new Date().toISOString().slice(0,10);
  let h='<section class="vlucht-zoek"><span>Zoek uw vlucht</span><label>Waarheen<input id="vliegNaar" placeholder="Bestemming of vluchtnummer" autocomplete="off"></label>'+
    '<label>Datum<input id="vliegDatum" type="date" value="'+esc(eerste)+'"></label><label>Richting<select id="vliegSoort"><option value="">Alles</option><option value="vertrek">Vertrek</option><option value="aankomst">Aankomst</option></select></label>'+
    '<small>U ziet het actuele bord. Een boeking is pas gemaakt nadat de server haar bevestigt.</small></section>'+
    '<div class="sec">Security nu · '+(sec||'geen filter open')+'</div><div class="vlucht-lijstkop"><h2>Beschikbare vluchten</h2><span id="vluchtAantal">'+d.vluchten.length+' op het bord</span></div>';
  h+= d.vluchten.length ? d.vluchten.map(v=>{
    const st = v.geannuleerd?'<span class="status open">geannuleerd</span>'
      : v.status==='inchecken'?'<span class="status goud">inchecken open</span>'
      : v.status==='boarding'?'<span class="status goud">boarding · gate '+esc(v.gate)+'</span>'
      : v.status==='vertrokken'?'<span class="status ok">vertrokken</span>'
      : v.status==='geland'||v.status==='bagage-op-band'?'<span class="status ok">'+esc(v.status)+(v.band?' · band '+v.band:'')+'</span>'
      : '<span class="status">'+esc(v.status)+'</span>';
    const ver=v.vertraging?' <span class="status open">+'+v.vertraging.minuten+' min</span>':'';
    const boek=(v.soort==='vertrek'&&['gepland','inchecken'].includes(v.status))?'<div class="rij"><button class="knop" data-boek="'+v.id+'">Kies deze vlucht</button></div>':'';
    const zoek=esc([v.nummer,v.bestemming,v.datum,v.soort].join(' ').toLowerCase());
    return '<article class="item vluchtkaart" data-vlucht-zoek="'+zoek+'" data-datum="'+esc(v.datum)+'" data-soort="'+esc(v.soort)+'"><h4><span class="nr">'+esc(v.nummer)+'</span></h4><div class="vlucht-status">'+st+ver+'</div>'+
      '<div class="vlucht-tijd"><time>'+esc(v.tijd)+'</time><i></i><b>'+esc(v.bestemming)+'</b></div><div class="meta">'+esc(v.datum)+' · '+esc(v.soort)+' · gate '+esc(v.gate)+'</div>'+boek+'</article>';
  }).join('') : '<div class="leeg">Geen vluchten op het bord.</div>';
  $('#inhoud').innerHTML=h;
  function filterBord(){
    const q=$('#vliegNaar').value.trim().toLowerCase(), datum=$('#vliegDatum').value, soort=$('#vliegSoort').value;
    let n=0; document.querySelectorAll('[data-vlucht-zoek]').forEach(r=>{ const toon=(!q||r.dataset.vluchtZoek.includes(q))&&(!datum||r.dataset.datum===datum)&&(!soort||r.dataset.soort===soort); r.hidden=!toon; if(toon)n++; });
    $('#vluchtAantal').textContent=n+(n===1?' vlucht':' vluchten');
  }
  $('#vliegNaar').addEventListener('input',filterBord); $('#vliegDatum').addEventListener('change',filterBord); $('#vliegSoort').addEventListener('change',filterBord);
  document.querySelectorAll('[data-boek]').forEach(b=>b.onclick=async()=>{
    try{ const r=await api('/boek',{id:b.dataset.boek}); meld('Geboekt: '+r.boeking.id+'. Inchecken kan zodra het open staat.'); }catch(e){ meld(e.message); }
  });
}
async function laadMijn(){
  let d; try{ d=await api('/mijn'); }catch(e){ $('#inhoud').innerHTML='<div class="leeg">'+esc(e.message)+'</div>'; return; }
  MIJN=d;
  $('#inhoud').innerHTML='<div class="mijn-vluchtintro"><div><span class="nr">MIJN REIZEN</span><h2>Klaar om in te stappen.</h2></div><span>'+d.boekingen.length+(d.boekingen.length===1?' vlucht':' vluchten')+'</span></div>'+(d.boekingen.length ? d.boekingen.map(b=>{
    const v=b.vlucht;
    if(b.status==='ingecheckt'){
      const code=leesPass(b.id), pass=b.pass||{}, actief=pass.stand==='actief';
      return '<article class="pass instapkaart"><div class="instap-route"><strong>'+esc(v.nummer)+'</strong><span>naar</span><strong>'+esc(v.bestemming)+'</strong></div>'+
        '<div class="instap-details"><div><span>Vertrek</span><b>'+esc(v.tijd)+'</b></div><div><span>Gate</span><b>'+esc(v.gate)+'</b></div><div><span>Stoel</span><b>'+esc(b.stoel)+'</b></div><div><span>Bagage</span><b>'+b.koffers.length+(b.koffers.length===1?' koffer':' koffers')+'</b></div></div>'+
        (code&&actief?'<div class="code">'+esc(code)+'</div><div class="regel">Deze code staat alleen in dit browsertabblad. Laat haar zien bij security en de gate.</div>':
          '<div class="meta code-ontbreekt">De geheime code wordt niet door Mijn reizen teruggegeven. Geef een nieuwe uit als u haar niet meer op dit toestel heeft.</div>')+
        '<div class="instap-acties">'+
          ((!code||!actief)&&!v.geannuleerd?'<button class="knop" data-roteer="'+esc(b.id)+'" data-rotatie="'+esc(pass.rotatie||0)+'">Nieuwe instapcode</button>':'')+
          (actief?'<button class="knop stil" data-intrek="'+esc(b.id)+'" data-rotatie="'+esc(pass.rotatie||0)+'">Code intrekken</button>':'')+'</div>'+
        (b.koffers.length?'<div class="regel"><span>Koffers</span><b>'+b.koffers.map(k=>esc(k.tag)+' ('+esc(k.status)+(k.band?' · band '+k.band:'')+')').join('<br>')+'</b></div>':'')+
        (v.vertraging?'<div class="regel"><span>Let op</span><b>+'+v.vertraging.minuten+' min · '+esc(v.vertraging.reden)+'</b></div>':'')+'</article>';
    }
    const kan=v.status==='inchecken';
    return '<article class="item vluchtkaart"><h4><span class="nr">'+esc(v.nummer)+'</span></h4><div class="vlucht-status"><span class="status '+(v.geannuleerd?'open':'goud')+'">'+esc(v.geannuleerd?'geannuleerd':v.status)+'</span></div>'+
      '<div class="vlucht-tijd"><time>'+esc(v.tijd)+'</time><i></i><b>'+esc(v.bestemming)+'</b></div>'+
      '<div class="meta">'+esc(v.datum)+' · boeking '+esc(b.id)+'</div>'+
      (kan?'<div class="rij"><select class="veld" data-kof="'+esc(b.id)+'"><option value="0">Geen koffer</option><option value="1">1 koffer</option><option value="2">2 koffers</option><option value="3">3 koffers</option></select><button class="knop" data-in="'+esc(b.id)+'">Inchecken</button></div>'
        : v.geannuleerd?'':'<div class="meta">Inchecken kan zodra het open staat.</div>')+'</article>';
  }).join('') : '<div class="leeg">Nog geen reizen. Kies eerst een vlucht, of vraag persoonlijk vervoer aan.</div>');
  document.querySelectorAll('[data-in]').forEach(b=>b.onclick=async()=>{
    const kof=document.querySelector('[data-kof="'+b.dataset.in+'"]');
    try{ const r=await api('/incheck',{id:b.dataset.in,koffers:kof?kof.value:0});
      bewaarPass(b.dataset.in,r.pass.code); meld('Ingecheckt; de boarding-passcode is eenmalig uitgegeven.'); laadMijn(); }catch(e){ meld(e.message); }
  });
  document.querySelectorAll('[data-roteer]').forEach(b=>b.onclick=async()=>{
    try{ const r=await api('/pass/roteer',{id:b.dataset.roteer,rotatie:Number(b.dataset.rotatie)});
      bewaarPass(b.dataset.roteer,r.pass.code); meld('Nieuwe boarding-passcode eenmalig uitgegeven.'); laadMijn(); }catch(e){ meld(e.message); }
  });
  document.querySelectorAll('[data-intrek]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Deze boarding-passcode direct intrekken?')) return;
    try{ await api('/pass/intrek',{id:b.dataset.intrek,rotatie:Number(b.dataset.rotatie)});
      vergeetPass(b.dataset.intrek); meld('Boarding-passcode ingetrokken.'); laadMijn(); }catch(e){ meld(e.message); }
  });
}
async function laadCharter(){
  let d; try{ d=await api('/mijn'); }catch(e){ $('#inhoud').innerHTML='<div class="leeg">'+esc(e.message)+'</div>'; return; }
  MIJN=d;
  const aanvragen=d.charters||[];
  $('#inhoud').innerHTML='<section class="charter-hero"><div><span>Persoonlijk vliegen</span><h2>Uw tijd bepaalt het vertrek.</h2><p>Vraag een privévlucht of helikopter aan. Operations bevestigt persoonlijk.</p></div></section>'+
    '<section class="charter-paneel"><span class="nr">UW AANVRAAG</span><div class="charter-keuzes"><label><input type="radio" name="chSoort" value="privejet" checked> Privéjet</label><label><input type="radio" name="chSoort" value="helikopter"> Helikopter</label></div>'+
    '<div class="charter-velden"><label>Bestemming<input class="veld" id="chBest" placeholder="Waar wilt u heen?" maxlength="60"></label><label>Datum<input class="veld" id="chDatum" type="date"></label><label>Tijd<input class="veld" id="chTijd" type="time" value="12:00"></label></div>'+
    '<button class="knop" id="chVraag">Vraag persoonlijk aan</button><p class="charter-grens">Geen automatische belofte. Eerst persoonlijke bevestiging door Operations.</p>'+
    (aanvragen.length?'<div class="charter-lijst"><h3>Uw aanvragen</h3>'+aanvragen.map(c=>'<div class="charter-aanvraag"><b>'+esc(c.code)+' · '+esc(c.bestemming)+'</b>'+esc(c.soort)+' · '+esc(c.datum)+' '+esc(c.tijd)+' · <span class="status '+(c.status==='bevestigd'?'ok':c.status==='afgewezen'?'open':'goud')+'">'+esc(c.status)+(c.vlucht?' · '+esc(c.vlucht):'')+'</span></div>').join('')+'</div>':'')+'</section>';
  $('#chDatum').value=new Date().toISOString().slice(0,10);
  $('#chVraag').onclick=async()=>{
    const soort=document.querySelector('[name="chSoort"]:checked').value;
    try{ const r=await api('/charter',{soort,bestemming:$('#chBest').value,datum:$('#chDatum').value,tijd:$('#chTijd').value});
      meld('Aangevraagd ('+r.charter.code+'); Operations bevestigt persoonlijk.'); laadCharter(); }catch(e){ meld(e.message); }
  };
}
