<!doctype html>
<html lang="nl">
<head>
<script src="/shared/id.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Vluchten</title>
<meta name="theme-color" content="#F4EFE7">
<link rel="icon" href="/icons/partners.svg">
<link rel="manifest" href="/manifests/vluchten.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vluchten">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/ds/rtg-ds.css" rel="stylesheet">
<script src="/ds/shell.js"></script>
<script src="/shared/rtg-heritage-transition.js" blocking="render"></script>
</head>
<!-- TravelOS op het RTG Design System (TRAVELOS-MIGRATIE.md, batch 4):
     Collectie (het bord), Detail (de instapkaart) en Taak (persoonlijk
     vliegen). Interne luchthavendata, geen airline-feed. Geen eigen stijl:
     alles komt uit /ds/rtg-ds.css. -->
<body class="ds-scherm" data-rtg-world="travel" data-ds-schermtype="collectie">
<header class="ds-kop">
  <button class="ds-kop__actie" type="button" data-ds-zoek aria-label="Spring naar een functie"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
  <a class="ds-kop__merk" href="/apps/reizen.html" aria-label="RTG TravelOS">RTG</a>
  <a class="ds-kop__actie" href="/apps/ik.html" aria-label="Uw account"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></a>
</header>

<main class="ds-collectie" id="main">
  <div class="ds-collectie__kop">
    <p class="ds-label" id="vluchtEy">Vlucht</p>
    <h1 class="ds-titel ds-titel--scherm" id="vluchtTitel">Waar wilt u naartoe?</h1>
    <p class="ds-meta" id="vluchtIntro">Vind uw vlucht en zie meteen wat u nu moet doen.</p>
  </div>
  <div class="ds-tabs" role="tablist" aria-label="RTG Vlucht">
    <button class="ds-tab" role="tab" type="button" data-t="bord" aria-selected="true">Vluchten</button>
    <button class="ds-tab" role="tab" type="button" data-t="mijn" aria-selected="false" data-ds-actie="Mijn reizen">Mijn reizen</button>
    <button class="ds-tab" role="tab" type="button" data-t="charter" aria-selected="false" data-ds-actie="Persoonlijk vliegen">Persoonlijk</button>
  </div>
  <div id="inhoud" role="tabpanel"><div class="ds-status ds-status--binnen"><p class="ds-status__tekst">Laden…</p></div></div>
  <nav class="ds-chips" aria-label="TravelOS reisflow">
    <a class="ds-chip" href="/apps/reizen.html">Uw reis</a>
    <a class="ds-chip" href="/apps/vluchten.html?view=mijn" aria-current="page">Vlucht</a>
    <a class="ds-chip" href="/apps/rit.html">Aankomst</a>
  </nav>
</main>

<p class="ds-melding" id="melding" role="status" aria-live="polite"></p>
<!-- uitvoer.js zonder defer en vlak voor de eigen scripts: die melden hun
     model aan met RTGUitvoer.bron(). -->
<script src="/shared/uitvoer.js"></script>
<script src="/shared/poortgesprek.js"></script>
<script src="/apps/vluchten-momenten.js"></script>
<script src="/apps/vluchten-voorzijde.js"></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/cookie.js" defer></script>
</body>
</html>
