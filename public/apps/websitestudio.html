<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Website-studio · RTG Atelier</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0C0C0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Website-studio">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<style>
  :root{ --bg:#0C0C0B; --card:#151312; --card2:#1B1817; --line:rgba(255,255,255,0.10);
    --txt:#F4F1EC; --muted:rgba(244,241,236,0.68); --soft:rgba(244,241,236,0.5); --burgundy:#C23A5E; --gold:#A98F1C; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;}
  h1,h2{font-family:'Bodoni Moda',serif;font-weight:500;letter-spacing:-.01em;}
  /* de werkbalk van de studio */
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg),rgba(12,12,11,.92));backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:calc(env(safe-area-inset-top) + .7rem) 1rem .7rem;}
  header .ey{font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
  header h1{font-size:1.05rem;}
  header .terug{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:.35rem .6rem;font:inherit;font-size:.78rem;cursor:pointer;text-decoration:none;}
  .titelin{background:var(--card2);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:.85rem;border-radius:10px;padding:.4rem .6rem;min-width:12rem;}
  .sp{flex:1 1 auto;}
  .knop{background:var(--card2);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:.8rem;font-weight:600;border-radius:10px;padding:.45rem .8rem;cursor:pointer;white-space:nowrap;}
  .knop:hover{border-color:var(--gold);}
  .knop.prim{background:var(--burgundy);border-color:var(--burgundy);color:#fff;}
  .knop.aan{border-color:var(--gold);color:var(--gold);}
  .swatches{display:flex;gap:.35rem;align-items:center;}
  .swatch{width:1.35rem;height:1.35rem;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}
  .swatch.actief{border-color:#fff;}
  /* toestelkiezer: telefoon / tablet / desktop -- schaalt het doek naar die versie */
  .apparaten{display:flex;gap:.15rem;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:.15rem;}
  .apparaten button{background:transparent;border:0;color:var(--muted);font:inherit;font-size:.72rem;font-weight:600;padding:.3rem .55rem;border-radius:7px;cursor:pointer;white-space:nowrap;}
  .apparaten button.aan{background:var(--bg);color:var(--gold);}
  /* het doek (de website die je bouwt) -- een container, zodat de blokken
     meebuigen met de DOEK-breedte (de gekozen versie), niet met het venster */
  main{padding:1.3rem;display:flex;justify-content:center;min-height:60vh;}
  .doek{width:100%;max-width:1080px;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.4);container-type:inline-size;transition:max-width .28s ease;}
  .doek.mobielkader{border-radius:30px;border:2px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5);}
  /* thema-tokens op het doek zelf */
  .doek[data-thema="donker"]{ --dbg:#0C0C0B; --dtxt:#F4F1EC; --dmut:rgba(244,241,236,.66); --dline:rgba(255,255,255,.12); --dcard:#151312; }
  .doek[data-thema="licht"]{ --dbg:#F5F1EA; --dtxt:#20160F; --dmut:rgba(32,22,15,.66); --dline:rgba(32,22,15,.14); --dcard:#FBF8F2; }
  .doek{background:var(--dbg);color:var(--dtxt);font-family:'Inter',system-ui,sans-serif;}
  .blok{position:relative;}
  .blok h1,.blok h2,.blok h3{font-family:'Bodoni Moda',serif;font-weight:500;color:var(--dtxt);line-height:1.1;}
  .b-hero{padding:clamp(2.4rem,7cqw,5rem) clamp(1.4rem,5cqw,3.4rem);text-align:center;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 22%,var(--dbg)),var(--dbg));}
  .b-hero h1{font-size:clamp(1.9rem,5cqw,3.4rem);}
  .b-hero .sub{color:var(--dmut);font-size:clamp(1rem,2cqw,1.2rem);margin:.9rem auto 0;max-width:44ch;line-height:1.6;}
  .b-knop{display:inline-block;margin-top:1.4rem;background:var(--acc);color:#fff;border-radius:999px;padding:.7rem 1.5rem;font-weight:600;font-size:.95rem;text-decoration:none;border:0;cursor:inherit;}
  .b-kop{padding:1.6rem clamp(1.4rem,5cqw,3.4rem) .3rem;}
  .b-kop h2{font-size:clamp(1.4rem,3cqw,2rem);}
  .b-tekst{padding:.6rem clamp(1.4rem,5cqw,3.4rem);color:var(--dmut);font-size:1rem;line-height:1.7;max-width:62ch;}
  .b-knoprij{padding:1rem clamp(1.4rem,5cqw,3.4rem);}
  .b-beeld{padding:1rem clamp(1.4rem,5cqw,3.4rem);}
  .b-beeld img{width:100%;border-radius:12px;display:block;}
  .b-beeld .bij{font-size:.78rem;color:var(--dmut);margin-top:.4rem;text-align:center;}
  .b-kol{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;padding:1.2rem clamp(1.4rem,5cqw,3.4rem);}
  .b-kol h3{font-size:1.15rem;margin-bottom:.4rem;}
  .b-kol .kt{color:var(--dmut);line-height:1.6;font-size:.95rem;}
  .b-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem;padding:1.2rem clamp(1.4rem,5cqw,3.4rem);}
  .b-gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;}
  .b-citaat{padding:2rem clamp(1.4rem,5cqw,3.4rem);text-align:center;}
  .b-citaat .q{font-family:'Bodoni Moda',serif;font-size:clamp(1.3rem,3cqw,1.9rem);line-height:1.35;color:var(--dtxt);}
  .b-citaat .bron{color:var(--acc);font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;margin-top:.8rem;}
  .b-voet{padding:1.6rem clamp(1.4rem,5cqw,3.4rem);border-top:1px solid var(--dline);color:var(--dmut);font-size:.82rem;text-align:center;}
  /* de versies buigen mee met de doek-breedte (container), niet met het venster */
  @container (max-width:640px){ .b-kol{grid-template-columns:1fr;} .b-gal{grid-template-columns:repeat(auto-fill,minmax(46%,1fr));} }
  /* per versie verbergen: geldt in het voorbeeld en in de export, niet tijdens bewerken */
  @container (max-width:640px){ .doek:not(.bewerk) .v-weg-telefoon{display:none!important;} }
  @container (min-width:641px) and (max-width:1000px){ .doek:not(.bewerk) .v-weg-tablet{display:none!important;} }
  @container (min-width:1001px){ .doek:not(.bewerk) .v-weg-desktop{display:none!important;} }
  /* bewerk-affordances (alleen in bewerk-modus) */
  .bewerk .blok{outline:1px dashed transparent;transition:outline-color .15s;}
  .bewerk .blok:hover{outline-color:color-mix(in srgb,var(--gold) 55%,transparent);}
  .bew{outline:none;border-radius:4px;cursor:text;}
  .bewerk .bew:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 30%,transparent);}
  .bewerk .b-beeld img,.bewerk .b-gal img{cursor:pointer;}
  .bwbalk{position:absolute;top:6px;right:6px;display:none;gap:.25rem;z-index:3;background:rgba(12,12,11,.86);border:1px solid var(--line);border-radius:10px;padding:.2rem;}
  .bewerk .blok:hover>.bwbalk{display:flex;}
  .bwbalk button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card2);color:var(--txt);cursor:pointer;font-size:.85rem;line-height:1;display:grid;place-items:center;}
  .bwbalk button:hover{border-color:var(--gold);}
  .bwbalk button.aan{border-color:var(--gold);color:var(--gold);}
  .bwbalk button svg{display:block;}
  .bwbalk .weg:hover{background:var(--burgundy);border-color:var(--burgundy);color:#fff;}
  .grip{cursor:grab;}
  .blok.sleep{opacity:.5;}
  /* blok dat op de HUIDIGE versie verborgen is: tijdens bewerken vaag met een label */
  .bewerk .blok.dim{opacity:.4;}
  .vlabel{position:absolute;top:6px;left:6px;z-index:3;background:rgba(12,12,11,.86);border:1px solid var(--gold);color:var(--gold);font-family:'Inter',sans-serif;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;padding:.16rem .45rem;border-radius:8px;}
  .leegdoek{padding:4rem 1.4rem;text-align:center;color:var(--dmut);}
  /* sheets */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:40;padding:1.2rem;}
  .sheet.open{display:grid;}
  .sheet .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem;max-width:520px;width:100%;max-height:82vh;overflow:auto;}
  .sheet h2{font-size:1.15rem;margin-bottom:.2rem;}
  .sheet .sub{font-size:.8rem;color:var(--soft);margin-bottom:.9rem;}
  .blokkies{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.5rem;}
  .blokkies button{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:.7rem .5rem;font:inherit;font-size:.82rem;cursor:pointer;text-align:left;}
  .blokkies button:hover{border-color:var(--gold);}
  .blokkies .k{display:block;font-size:.66rem;color:var(--soft);margin-top:.2rem;}
  .beeldgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.5rem;}
  .beeldgrid button{padding:0;border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:none;}
  .beeldgrid button:hover{border-color:var(--gold);}
  .beeldgrid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
  .lijstrij{display:flex;align-items:center;gap:.6rem;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;margin-bottom:.4rem;}
  .lijstrij .nm{flex:1;font-size:.9rem;font-weight:600;}
  .lijstrij .mt{font-size:.72rem;color:var(--soft);}
  .lijstrij button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:.3rem .55rem;font:inherit;font-size:.75rem;cursor:pointer;}
  .melding{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#000;border:1px solid var(--gold);color:var(--txt);padding:.55rem .9rem;border-radius:10px;font-size:.82rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;}
  .inlog{max-width:440px;margin:5rem auto;text-align:center;padding:0 1.2rem;}
  .inlog a{color:var(--gold);}
</style>
</head>
<body>
<header>
  <a class="terug" href="/apps/kantoren.html">← Kantoren</a>
  <div><div class="ey">RTG Atelier</div><h1>Website-studio</h1></div>
  <input class="titelin" id="titel" maxlength="80" placeholder="Naam van je sjabloon" aria-label="Naam van het sjabloon">
  <div class="swatches" id="swatches" aria-label="Accentkleur"></div>
  <button class="knop" id="themaKnop" title="Licht of donker">Donker</button>
  <div class="apparaten" id="apparaten" role="group" aria-label="Versie per toestel">
    <button type="button" data-a="telefoon">Telefoon</button>
    <button type="button" data-a="tablet">Tablet</button>
    <button type="button" data-a="desktop">Desktop</button>
  </div>
  <span class="sp"></span>
  <button class="knop" id="blokKnop">+ Blok</button>
  <button class="knop" id="bewerkKnop">Voorbeeld</button>
  <button class="knop" id="openKnop">Openen</button>
  <button class="knop" id="exportKnop">Exporteer</button>
  <button class="knop prim" id="bewaarKnop">Opslaan</button>
</header>
<main id="hoofd"><div class="doek" id="doek" data-thema="donker"></div></main>

<!-- blok-kiezer -->
<div class="sheet" id="blokSheet"><div class="box">
  <h2>Nieuw blok</h2><div class="sub">Kies een blok; je kunt het daarna vrij verplaatsen en de tekst aanpassen.</div>
  <div class="blokkies" id="blokkies"></div>
</div></div>
<!-- beeld-kiezer -->
<div class="sheet" id="beeldSheet"><div class="box">
  <h2>Kies beeld</h2><div class="sub">Eigen RTG-campagnebeeld (quiet luxury). Geen stockfoto's.</div>
  <div class="beeldgrid" id="beeldgrid"></div>
</div></div>
<!-- opgeslagen sjablonen -->
<div class="sheet" id="openSheet"><div class="box">
  <h2>Opgeslagen sjablonen</h2><div class="sub">Open een eerder bewaard ontwerp om verder te werken.</div>
  <div id="openlijst"></div>
</div></div>

<div class="melding" id="melding" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=null; try{ TOKEN=localStorage.getItem('rtg_office_token'); }catch(e){}
const api=(pad,body)=>fetch('/api/office/atelierweb/'+pad,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify(body||{})}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Er ging iets mis.');return d;});
function meld(t){const m=$('#melding');m.textContent=t;m.style.opacity='1';clearTimeout(m._t);m._t=setTimeout(()=>m.style.opacity='0',2600);}

const BEELDEN=['bamboe','hero','huis-omslag','jet','kaiseki','kyoto-suite','onsen','palacio','riad'].map(n=>'/campagne/'+n+'.jpg');
const ACCENTEN=['#7F1634','#9E1C40','#C23A5E','#857007','#A98F1C','#0C0C0B','#2E5D48'];
const BLOKTYPES=[
  {t:'hero',n:'Hero',k:'grote kop + knop'},{t:'kop',n:'Kop',k:'sectiekop'},{t:'tekst',n:'Tekst',k:'alinea'},
  {t:'knop',n:'Knop',k:'oproep'},{t:'beeld',n:'Beeld',k:'één afbeelding'},{t:'kolommen',n:'Twee kolommen',k:'naast elkaar'},
  {t:'galerij',n:'Galerij',k:'meerdere beelden'},{t:'citaat',n:'Citaat',k:'uitspraak'},{t:'ruimte',n:'Ruimte',k:'witruimte'},{t:'voettekst',n:'Voettekst',k:'onderaan'}
];
function nieuwBlok(t){
  const id='b'+Math.random().toString(36).slice(2,8);
  if(t==='hero')return{id,type:t,kop:'Een titel die blijft hangen',sub:'Een korte, warme ondertitel die vertelt waar dit over gaat.',knop:'Ontdek meer'};
  if(t==='kop')return{id,type:t,tekst:'Een sectiekop'};
  if(t==='tekst')return{id,type:t,tekst:'Schrijf hier je verhaal. Klik en typ; het past zich vanzelf aan.'};
  if(t==='knop')return{id,type:t,tekst:'Klik hier',href:''};
  if(t==='beeld')return{id,type:t,src:BEELDEN[1],bijschrift:''};
  if(t==='kolommen')return{id,type:t,lk:'Links',lt:'Tekst in de linker kolom.',rk:'Rechts',rt:'Tekst in de rechter kolom.'};
  if(t==='galerij')return{id,type:t,beelden:[BEELDEN[0],BEELDEN[3],BEELDEN[6]]};
  if(t==='citaat')return{id,type:t,tekst:'Een uitspraak die het merk samenvat.',bron:'Naam'};
  if(t==='ruimte')return{id,type:t,hoogte:48};
  if(t==='voettekst')return{id,type:t,tekst:'© Rahul Travel Group'};
  return{id,type:'tekst',tekst:''};
}

let DESIGN={id:null,titel:'',thema:'donker',accent:'#7F1634',blokken:[nieuwBlok('hero'),nieuwBlok('tekst')]};
let BEWERK=true;
let beeldDoel=null; // {blok, veld} of {blok, index} bij galerij

// de versies: welke doek-breedte hoort bij welk toestel
const APPARATEN=[{k:'telefoon',n:'telefoon',w:390},{k:'tablet',n:'tablet',w:768},{k:'desktop',n:'desktop',w:1080}];
let APPARAAT='desktop';
function devNaam(k){const d=APPARATEN.find(x=>x.k===k);return d?d.n:k;}
// de oog-glyfen (SVG, geen emoji): tonen / verbergen op de gekozen versie
const OOG='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const OOG_UIT='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.1 3.9M6.1 6.1A17 17 0 0 0 2 12s3.5 7 10 7a10.9 10.9 0 0 0 3.9-.7"/></svg>';
function toggleZicht(i){const b=DESIGN.blokken[i];const set=new Set(b.verberg||[]);if(set.has(APPARAAT))set.delete(APPARAAT);else set.add(APPARAAT);b.verberg=[...set];render();}

function veld(waarde,zetter,meer){
  const el=document.createElement(meer?'div':'span');
  el.textContent=waarde||'';
  if(BEWERK){ el.contentEditable='true'; el.className='bew'; el.spellcheck=false;
    el.addEventListener('blur',()=>zetter(el.textContent));
    el.addEventListener('keydown',e=>{ if(!meer&&e.key==='Enter'){e.preventDefault();el.blur();} });
  }
  return el;
}
function balk(i){
  const b=document.createElement('div'); b.className='bwbalk';
  const mk=(txt,cls,fn,titel)=>{const x=document.createElement('button');x.type='button';x.textContent=txt;if(cls)x.className=cls;x.title=titel||'';x.addEventListener('click',ev=>{ev.stopPropagation();fn();});return x;};
  b.appendChild(mk('↑','',()=>verplaats(i,-1),'Omhoog'));
  b.appendChild(mk('↓','',()=>verplaats(i,1),'Omlaag'));
  b.appendChild(mk('⧉','',()=>dupliceer(i),'Dupliceren'));
  // tonen/verbergen op de huidige versie (telefoon/tablet/desktop)
  const verborgen=(DESIGN.blokken[i].verberg||[]).includes(APPARAAT);
  const z=document.createElement('button'); z.type='button'; z.innerHTML=verborgen?OOG_UIT:OOG;
  if(verborgen)z.className='aan'; z.title=(verborgen?'Weer tonen op ':'Verbergen op ')+devNaam(APPARAAT);
  z.addEventListener('click',ev=>{ev.stopPropagation();toggleZicht(i);}); b.appendChild(z);
  b.appendChild(mk('×','weg',()=>verwijder(i),'Verwijderen'));
  return b;
}
function renderBlok(blok,i){
  const s=document.createElement('section'); s.className='blok'; s.dataset.i=i;
  if(BEWERK){ s.draggable=true;
    s.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',i);s.classList.add('sleep');});
    s.addEventListener('dragend',()=>s.classList.remove('sleep'));
    s.addEventListener('dragover',e=>e.preventDefault());
    s.addEventListener('drop',e=>{e.preventDefault();const van=+e.dataTransfer.getData('text/plain');if(!isNaN(van))herorden(van,i);});
  }
  const t=blok.type;
  if(t==='hero'){ s.classList.add('b-hero');
    const h=document.createElement('h1'); h.appendChild(veld(blok.kop,v=>blok.kop=v)); s.appendChild(h);
    const p=document.createElement('div'); p.className='sub'; p.appendChild(veld(blok.sub,v=>blok.sub=v,true)); s.appendChild(p);
    const a=document.createElement('span'); a.className='b-knop'; a.appendChild(veld(blok.knop,v=>blok.knop=v)); s.appendChild(a);
  } else if(t==='kop'){ s.classList.add('b-kop'); const h=document.createElement('h2'); h.appendChild(veld(blok.tekst,v=>blok.tekst=v)); s.appendChild(h);
  } else if(t==='tekst'){ s.classList.add('b-tekst'); s.appendChild(veld(blok.tekst,v=>blok.tekst=v,true));
  } else if(t==='knop'){ s.classList.add('b-knoprij'); const a=document.createElement('span'); a.className='b-knop'; a.appendChild(veld(blok.tekst,v=>blok.tekst=v)); s.appendChild(a);
  } else if(t==='beeld'){ s.classList.add('b-beeld');
    const img=document.createElement('img'); img.src=blok.src; img.alt=blok.bijschrift||'Beeld';
    if(BEWERK) img.addEventListener('click',()=>kiesBeeld({blok,veld:'src'}));
    s.appendChild(img); const bij=document.createElement('div'); bij.className='bij'; bij.appendChild(veld(blok.bijschrift,v=>blok.bijschrift=v)); s.appendChild(bij);
  } else if(t==='kolommen'){ s.classList.add('b-kol');
    [['lk','lt'],['rk','rt']].forEach(([kk,kt])=>{const c=document.createElement('div');const h=document.createElement('h3');h.appendChild(veld(blok[kk],v=>blok[kk]=v));const p=document.createElement('div');p.className='kt';p.appendChild(veld(blok[kt],v=>blok[kt]=v,true));c.appendChild(h);c.appendChild(p);s.appendChild(c);});
  } else if(t==='galerij'){ s.classList.add('b-gal');
    (blok.beelden||[]).forEach((src,gi)=>{const img=document.createElement('img');img.src=src;img.alt='';if(BEWERK)img.addEventListener('click',()=>kiesBeeld({blok,index:gi}));s.appendChild(img);});
  } else if(t==='citaat'){ s.classList.add('b-citaat'); const q=document.createElement('div'); q.className='q'; q.appendChild(veld(blok.tekst,v=>blok.tekst=v,true)); const br=document.createElement('div'); br.className='bron'; br.appendChild(veld(blok.bron,v=>blok.bron=v)); s.appendChild(q); s.appendChild(br);
  } else if(t==='ruimte'){ s.style.height=(blok.hoogte||40)+'px';
  } else if(t==='voettekst'){ s.classList.add('b-voet'); s.appendChild(veld(blok.tekst,v=>blok.tekst=v));
  }
  // per versie verbergen: klassen die het voorbeeld/de export laten reageren
  (blok.verberg||[]).forEach(d=>s.classList.add('v-weg-'+d));
  // tijdens bewerken: op de huidige versie verborgen blokken vaag met een label
  if(BEWERK && (blok.verberg||[]).includes(APPARAAT)){ s.classList.add('dim'); const lb=document.createElement('div'); lb.className='vlabel'; lb.textContent='Verborgen op '+devNaam(APPARAAT); s.appendChild(lb); }
  if(BEWERK) s.appendChild(balk(i));
  return s;
}
function render(){
  const doek=$('#doek'); doek.dataset.thema=DESIGN.thema; doek.style.setProperty('--acc',DESIGN.accent);
  const dev=APPARATEN.find(d=>d.k===APPARAAT)||APPARATEN[2]; doek.style.maxWidth=dev.w+'px';
  doek.className='doek'+(BEWERK?' bewerk':'')+(APPARAAT!=='desktop'?' mobielkader':''); doek.textContent='';
  if(!DESIGN.blokken.length){ const l=document.createElement('div'); l.className='leegdoek'; l.textContent='Leeg doek. Klik op "+ Blok" om te beginnen.'; doek.appendChild(l); return; }
  DESIGN.blokken.forEach((b,i)=>doek.appendChild(renderBlok(b,i)));
}
function zetApparaat(k){ APPARAAT=k; document.querySelectorAll('#apparaten button').forEach(b=>b.classList.toggle('aan',b.dataset.a===k)); render(); }
function verplaats(i,d){const j=i+d;if(j<0||j>=DESIGN.blokken.length)return;const a=DESIGN.blokken;[a[i],a[j]]=[a[j],a[i]];render();}
function herorden(van,naar){const a=DESIGN.blokken;const [x]=a.splice(van,1);a.splice(naar,0,x);render();}
function dupliceer(i){const kopie=JSON.parse(JSON.stringify(DESIGN.blokken[i]));kopie.id='b'+Math.random().toString(36).slice(2,8);DESIGN.blokken.splice(i+1,0,kopie);render();}
function verwijder(i){DESIGN.blokken.splice(i,1);render();}

function kiesBeeld(doel){beeldDoel=doel;$('#beeldSheet').classList.add('open');}
function bouwBeeldgrid(){const g=$('#beeldgrid');g.textContent='';BEELDEN.forEach(src=>{const b=document.createElement('button');b.type='button';const im=document.createElement('img');im.src=src;im.alt='';b.appendChild(im);b.addEventListener('click',()=>{if(!beeldDoel)return;if(beeldDoel.veld)beeldDoel.blok[beeldDoel.veld]=src;else if(beeldDoel.index!=null)beeldDoel.blok.beelden[beeldDoel.index]=src;$('#beeldSheet').classList.remove('open');render();});g.appendChild(b);});}
function bouwBlokkies(){const g=$('#blokkies');g.textContent='';BLOKTYPES.forEach(bt=>{const b=document.createElement('button');b.type='button';b.innerHTML=esc(bt.n)+'<span class="k">'+esc(bt.k)+'</span>';b.addEventListener('click',()=>{DESIGN.blokken.push(nieuwBlok(bt.t));$('#blokSheet').classList.remove('open');render();setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),40);});g.appendChild(b);});}
function bouwSwatches(){const g=$('#swatches');g.textContent='';ACCENTEN.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='swatch'+(c===DESIGN.accent?' actief':'');b.style.background=c;b.title=c;b.addEventListener('click',()=>{DESIGN.accent=c;bouwSwatches();render();});g.appendChild(b);});}

function zetBewerk(aan){BEWERK=aan;$('#bewerkKnop').textContent=aan?'Voorbeeld':'Bewerken';$('#bewerkKnop').classList.toggle('aan',!aan);render();}

async function bewaar(){
  DESIGN.titel=$('#titel').value.trim()||'Naamloos sjabloon';
  try{ const d=await api('bewaar',{design:DESIGN}); DESIGN.id=d.design.id; meld('Opgeslagen.'); }
  catch(e){ meld(e.message); }
}
async function openen(){
  try{ const d=await api('lijst'); const l=$('#openlijst'); l.textContent='';
    if(!(d.lijst||[]).length){ l.innerHTML='<div style="color:var(--soft);font-size:.85rem;">Nog geen opgeslagen sjablonen.</div>'; }
    (d.lijst||[]).forEach(it=>{const r=document.createElement('div');r.className='lijstrij';r.innerHTML='<span class="nm">'+esc(it.titel)+'</span><span class="mt">'+it.blokken+' blok'+(it.blokken===1?'':'ken')+'</span>';const ob=document.createElement('button');ob.textContent='Open';ob.addEventListener('click',async()=>{try{const dd=await api('haal',{id:it.id});DESIGN=dd.design;DESIGN.blokken=DESIGN.blokken||[];$('#titel').value=DESIGN.titel;bouwSwatches();$('#themaKnop').textContent=DESIGN.thema==='licht'?'Licht':'Donker';$('#openSheet').classList.remove('open');zetBewerk(true);meld('Geopend.');}catch(e){meld(e.message);}});r.appendChild(ob);l.appendChild(r);});
    $('#openSheet').classList.add('open');
  }catch(e){ meld(e.message); }
}
function exporteer(){
  const was=BEWERK; BEWERK=false; render();
  const inner=$('#doek').innerHTML; BEWERK=was; render();
  const css=document.querySelector('style').textContent.replace(/\/\* bewerk[\s\S]*?\}\n/,'');
  const html='<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(DESIGN.titel||'RTG sjabloon')+'</title>'+
    '<link href="/fonts/fonts.css" rel="stylesheet"><style>body{margin:0;background:'+(DESIGN.thema==='licht'?'#F5F1EA':'#0C0C0B')+';}'+css+'</style></head>'+
    '<body><div class="doek" data-thema="'+DESIGN.thema+'" style="--acc:'+DESIGN.accent+';max-width:1080px;margin:0 auto;">'+inner+'</div></body></html>';
  const blob=new Blob([html],{type:'text/html'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=(DESIGN.titel||'rtg-sjabloon').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.html';
  document.body.appendChild(a); a.click(); a.remove(); meld('Sjabloon geëxporteerd als webpagina.');
}

// bediening
if(!TOKEN){ $('#hoofd').innerHTML='<div class="inlog"><h2 style="font-family:\'Bodoni Moda\',serif;">Log in via de Kantoren</h2><p style="color:var(--muted);margin-top:.6rem;line-height:1.6;">De Website-studio hoort bij het RTG Atelier. Open de Kantoren en log in met je kantoor-account.</p><p style="margin-top:1rem;"><a href="/apps/kantoren.html">Naar de Kantoren →</a></p></div>'; }
else {
  bouwSwatches(); bouwBlokkies(); bouwBeeldgrid();
  $('#blokKnop').addEventListener('click',()=>$('#blokSheet').classList.add('open'));
  $('#bewaarKnop').addEventListener('click',bewaar);
  $('#openKnop').addEventListener('click',openen);
  $('#exportKnop').addEventListener('click',exporteer);
  $('#bewerkKnop').addEventListener('click',()=>zetBewerk(!BEWERK));
  $('#themaKnop').addEventListener('click',()=>{DESIGN.thema=DESIGN.thema==='donker'?'licht':'donker';$('#themaKnop').textContent=DESIGN.thema==='licht'?'Licht':'Donker';render();});
  document.querySelectorAll('#apparaten button').forEach(b=>b.addEventListener('click',()=>zetApparaat(b.dataset.a)));
  document.querySelectorAll('.sheet').forEach(sh=>sh.addEventListener('click',e=>{if(e.target===sh)sh.classList.remove('open');}));
  // eventueel meteen in een gekozen versie openen (?versie=telefoon/tablet/desktop)
  const wens=new URLSearchParams(location.search).get('versie');
  zetApparaat(APPARATEN.some(d=>d.k===wens)?wens:'desktop');
}
</script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/cookie.js" defer></script>
</body>
</html>
