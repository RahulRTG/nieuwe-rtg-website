<style>
  /* ============ RTG WERELD: ÉÉN APP, ÉÉN NETWERK, JOUW CONTEXT ============

     Hier stonden De Salon, Pulse, RTG Zakelijk, de genootschappen en de
     verhalen als vijf losse apps op het beginscherm. Voor de gebruiker is dat
     vijf keer dezelfde vraag -- "wat is er?" -- met vijf antwoorden op vijf
     plekken, en de vervelende bijwerking van LinkedIn: om een zakelijk contact
     te spreken moest je naar een andere app, terwijl het gewoon één mens is.

     Dit is die ene app. Bovenaan staat één schakelaar (Alles, Lifestyle,
     Business, Communities, Privé). Die verandert niet van app maar van wereld:
     dezelfde feed, dezelfde identiteit, dezelfde chat, andere context.

     WAT DIT SCHERM BEWUST NIET DOET. Het kent geen enkele regel over wie wat
     mag. Welke werelden er open staan, welke profiellagen je hebt en wat je
     verder mag, komt uit /api/wereld/state -- dat leest server/kern/wereld/
     rechten.js, en dat is de enige plek waar het staat. Een knop die hier
     verschijnt maar door de server geweigerd wordt, is de fout die je krijgt
     zodra dit scherm zijn eigen lijstje bijhoudt.

     En de vormtaal komt uit de UI-kit (/shared/rtg-ui.css). Wat hier staat is
     alleen wat deze app echt eigen heeft: de wereldschakelaar en de feedkaart.
     Geen nieuwe kleuren, geen tweede lettertype -- bordeaux blijft een accent
     en op zwart schrijven we wit of --rtg-acc. */

  body{margin:0;background:var(--rtg-bg);color:var(--rtg-txt);
    font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}

  /* De kop is het member passport: eerst wie u in dit huis bent, daarna wat u
     hier wilt doen. De passtatus komt volledig van de server; dit scherm kent
     zelf geen vertaling van RTG/Lifestyle/Business naar Verified/Signature. */
  .kop{position:sticky;top:0;z-index:5;background:var(--rtg-bg);
    border-bottom:1px solid var(--rtg-line);padding:0.9rem 1.1rem 0;}
  .kopinhoud{max-width:760px;margin:0 auto;}
  .elite-merk{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;
    margin-bottom:0.7rem;}
  .elite-merk .eyebrow{font-size:0.58rem;line-height:1.2;letter-spacing:0.18em;
    text-transform:uppercase;color:var(--rtg-leesgoud,#D5BF62);margin:0 0 0.18rem;}
  .kop .elite-titel{font-family:'Bodoni Moda',Georgia,serif;font-weight:400;
    font-size:1.65rem;margin:0;letter-spacing:0.01em;}
  .belofte{font-family:'Bodoni Moda',Georgia,serif;font-size:0.88rem;
    color:var(--rtg-muted);font-style:italic;text-align:right;padding-bottom:0.1rem;}

  .passport{background:linear-gradient(125deg,var(--rtg-card2),var(--rtg-card));
    border:1px solid var(--rtg-line);border-radius:0;padding:0.72rem 0.8rem;
    margin-bottom:0.65rem;box-shadow:inset 0 1px rgba(255,255,255,0.025);}
  .passportkop{display:flex;align-items:center;justify-content:space-between;
    gap:0.8rem;}
  .passportlabel{font-size:0.56rem;letter-spacing:0.16em;text-transform:uppercase;
    color:var(--rtg-soft);margin:0 0 0.18rem;}
  .kop .wie{font-size:0.8rem;color:var(--rtg-txt);margin:0;font-weight:600;}
  .kop .wie span{color:var(--rtg-muted);font-weight:400;}
  .badges{display:flex;justify-content:flex-end;gap:0.35rem;flex-wrap:wrap;}
  .lidbadge{border:1px solid var(--rtg-line);border-radius:0;
    padding:0.25rem 0.55rem;font-size:0.58rem;line-height:1;
    letter-spacing:0.08em;text-transform:uppercase;color:var(--rtg-muted);}
  .lidbadge.lidstatus.signature{border-color:rgba(169,143,28,0.72);color:var(--rtg-leesgoud,#D5BF62);
    background:rgba(169,143,28,0.09);}
  .lidbadge.lidstatus.verified{border-color:rgba(255,255,255,0.28);color:var(--rtg-txt);}
  .pasvoet{display:flex;gap:0.45rem;align-items:center;margin-top:0.48rem;
    padding-top:0.48rem;border-top:1px solid var(--rtg-line);font-size:0.62rem;
    color:var(--rtg-soft);}
  .pasvoet::before{content:'';width:0.38rem;height:0.38rem;border-radius:50%;
    background:var(--rtg-acc);box-shadow:0 0 0 3px rgba(194,58,94,0.1);}
  .pasvoet.verified::before{background:#74A886;box-shadow:0 0 0 3px rgba(116,168,134,0.1);}

  /* Eén identiteit, vijf lenzen. Dichte lenzen blijven zichtbaar als belofte,
     met de reden uit de server. */
  .lenzen{display:flex;gap:0.38rem;overflow-x:auto;padding-bottom:0.65rem;
    scrollbar-width:none;}
  .lenzen::-webkit-scrollbar{display:none;}
  .lenzen a,.lenzen span{flex:1 0 auto;min-width:5.2rem;text-align:center;
    text-decoration:none;border:1px solid var(--rtg-line);border-radius:0;
    padding:0.42rem 0.58rem;color:var(--rtg-muted);font-size:0.64rem;
    font-weight:600;letter-spacing:0.035em;transition:border-color .18s,color .18s;}
  .lenzen a:hover,.lenzen a[aria-current="page"]{color:var(--rtg-txt);
    border-color:var(--rtg-acc);}
  .lenzen span{opacity:0.42;cursor:not-allowed;}
  .lenzen span::after{content:'  ·  Signature';font-size:0.52rem;}

  /* DE WERELDSCHAKELAAR. Een rij, horizontaal scrollend op een telefoon.
     Een wereld die dicht is verdwijnt niet: hij staat er, gedimd, met een slotje.
     Wegstoppen wat je niet hebt is oneerlijk naar beide kanten -- je weet dan
     niet wat je mist, en je merkt ook niet dat het er is. */
  .werelden{display:flex;gap:0.4rem;overflow-x:auto;padding:0.05rem 0 0.9rem;
    scrollbar-width:none;}
  .werelden::-webkit-scrollbar{display:none;}
  .werelden button{flex:0 0 auto;background:none;border:1px solid var(--rtg-line);
    border-radius:0;padding:0.42rem 0.95rem;color:var(--rtg-muted);
    font:inherit;font-size:0.76rem;font-weight:600;cursor:pointer;
    white-space:nowrap;transition:background .18s,color .18s,border-color .18s;}
  /* De gekozen wereld: bijna-zwart OP het accent haalde 3,78:1, en dat is de
     omgekeerde vorm van dezelfde fout. --rtg-acc-inkt is precies hiervoor
     gemaakt: hij volgt de dagkleur mee (shared/dagkleur.css rekent per tint uit
     of er zwarte of witte inkt op past) en valt zonder dagkleur terug op wit,
     dat op de bordeaux 5,17:1 haalt. */
  .werelden button[aria-current="true"]{background:var(--rtg-acc);
    border-color:var(--rtg-acc);color:var(--rtg-acc-inkt);}
  .werelden button[disabled]{opacity:0.42;cursor:not-allowed;}
  .werelden button[disabled]::after{content:' ·';}

  /* de feed */
  main{padding:1.1rem 1.1rem 5.5rem;max-width:640px;margin:0 auto;}
  .kaart{background:var(--rtg-card);border:1px solid var(--rtg-line);
    border-radius:0;padding:1rem 1.05rem;margin-bottom:0.8rem;}
  .kaart .r1{display:flex;align-items:baseline;gap:0.55rem;margin-bottom:0.5rem;}
  .kaart .auteur{font-weight:600;font-size:0.86rem;}
  .kaart .bron{font-size:0.66rem;color:var(--rtg-soft);text-transform:uppercase;
    letter-spacing:0.08em;}
  .kaart .tijd{margin-left:auto;font-size:0.7rem;color:var(--rtg-soft);
    font-variant-numeric:tabular-nums;}
  .kaart p{margin:0 0 0.7rem;font-size:0.9rem;line-height:1.55;
    color:var(--rtg-txt);white-space:pre-wrap;overflow-wrap:anywhere;}
  .kaart img{width:100%;border-radius:0;display:block;
    margin-bottom:0.7rem;}
  .kaart .acties{display:flex;gap:0.5rem;align-items:center;}
  .kaart .acties button{background:none;border:1px solid var(--rtg-line);
    border-radius:0;padding:0.3rem 0.75rem;color:var(--rtg-muted);
    font:inherit;font-size:0.72rem;cursor:pointer;}
  .kaart .acties button:hover{color:var(--rtg-txt);border-color:var(--rtg-acc);}
  .kaart .tel{font-size:0.72rem;color:var(--rtg-soft);margin-left:auto;
    font-variant-numeric:tabular-nums;}

  .leeg{color:var(--rtg-soft);font-size:0.85rem;line-height:1.6;
    text-align:center;padding:3rem 1rem;}
  .meer{display:block;width:100%;background:none;border:1px solid var(--rtg-line);
    border-radius:0;padding:0.6rem;color:var(--rtg-muted);font:inherit;
    font-size:0.78rem;cursor:pointer;margin-top:0.4rem;}
  .fout{background:rgba(222,110,146,0.10);border:1px solid var(--rtg-rood);
    border-radius:0;padding:0.75rem 0.9rem;
    font-size:0.8rem;color:var(--rtg-txt);margin-bottom:0.8rem;}

  /* het profiel: per laag een kaart, per veld een regel met een keuzelijst.
     De keuzelijst is de hele interactie -- invullen gebeurt in de bronapp. */
  .laag{background:var(--rtg-card);border:1px solid var(--rtg-line);
    border-radius:0;padding:1rem 1.05rem;margin-bottom:0.8rem;}
  .laag h2{font-family:'Bodoni Moda',Georgia,serif;font-weight:400;
    font-size:1.1rem;margin:0 0 0.15rem;}
  .laag .bron{font-size:0.7rem;color:var(--rtg-soft);margin:0 0 0.9rem;}
  .laag .bron a{color:var(--rtg-acc);}
  .veld{display:flex;align-items:center;gap:0.6rem;padding:0.55rem 0;
    border-top:1px solid var(--rtg-line);flex-wrap:wrap;}
  .veld .nm{font-size:0.8rem;font-weight:600;min-width:8rem;}
  .veld .wa{font-size:0.8rem;color:var(--rtg-muted);flex:1;
    overflow-wrap:anywhere;}
  .veld .wa.leeg{color:var(--rtg-soft);font-style:italic;}
  .veld select{background:var(--rtg-card2);color:var(--rtg-txt);font:inherit;
    font-size:0.74rem;border:1px solid var(--rtg-line);
    border-radius:0;padding:0.28rem 0.6rem;cursor:pointer;}

  /* zoeken: een veld en een lijst treffers. De regel "gedeelde connecties"
     staat op de kaart, want dat is wat een introductie mogelijk maakt. */
  #zoekform{display:flex;gap:0.5rem;margin-bottom:1rem;}
  #zoekform input{flex:1;background:var(--rtg-card2);color:var(--rtg-txt);
    font:inherit;font-size:0.85rem;border:1px solid var(--rtg-line);
    border-radius:0;padding:0.5rem 0.95rem;}
  /* dezelfde inkt-op-accent als de gekozen wereld hierboven: bijna-zwart op
     het accent haalt 3,78:1, --rtg-acc-inkt volgt de dagkleur en leest overal */
  #zoekform button{background:var(--rtg-acc);color:var(--rtg-acc-inkt);font:inherit;
    font-size:0.8rem;font-weight:600;border:0;border-radius:0;
    padding:0.5rem 1.1rem;cursor:pointer;}
  .via{font-size:0.72rem;color:var(--rtg-acc);margin-top:0.35rem;}

  /* DE NAVIGATIE: vijf, en niet meer. Home, Ontdek, Chat, Activiteit, Profiel.
     Alle diepte zit erachter; de app hoort klein te voelen. Chat is bewust een
     LINK en geen tab: berichten is een eigen app (/apps/comm.html) en blijft
     dat -- zie de kop van server/kern/wereld/koppel.js. */
  .balk{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;
    background:color-mix(in srgb,var(--rtg-bg) 94%,transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--rtg-line);
    padding-bottom:env(safe-area-inset-bottom);}
  .balk a{flex:1;text-align:center;padding:0.7rem 0.2rem 0.75rem;
    color:var(--rtg-soft);text-decoration:none;font-size:0.66rem;
    font-weight:600;letter-spacing:0.01em;}
  .balk a[aria-current="page"]{color:var(--rtg-txt);}
  .balk a[aria-current="page"] span{color:var(--rtg-txt);}
  .balk span{display:block;font-size:1.05rem;line-height:1.35;}
  /* shared/rtg-worlds-2026.css schuift elke vaste `body > nav` omlaag met
     `top:var(--os-switcher-h)`, zodat een KOPbalk niet onder de os-switcher
     verdwijnt. Deze balk staat onderaan (`bottom:0`); met een top erbij rekt
     een vast element zich uit van de switcher tot de onderrand en ligt dan als
     onzichtbaar vlak over de hele app -- de wereldknoppen waren niet meer te
     raken. Een onderbalk heeft geen top; de specificiteit is bewust een tree
     hoger dan de gedeelde regel, want die staat later in de cascade. */
  body:has(> .os-switcher):not(.rtg-edge-host) > nav.balk{top:auto;}

  @media (max-width:520px){
    .belofte{display:none;}
    .passportkop{align-items:flex-start;}
    .badges{max-width:48%;}
    .lenzen{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0.25rem;
      overflow:visible;}
    .lenzen a,.lenzen span{min-width:0;padding:0.4rem 0.12rem;font-size:0.56rem;}
    .lenzen span::after{content:'S';display:block;font-size:0.44rem;margin-top:0.12rem;}
  }
</style>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (t) { return String(t == null ? '' : t)
    .replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  var token = null; try { token = localStorage.getItem('rtg_member_token'); } catch (e) {}

  function api(pad, body) {
    return fetch('/api/wereld' + pad, { method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().catch(function () { return {}; })
        .then(function (d) { if (!r.ok) throw new Error(d.error || 'Er ging iets mis.'); return d; }); });
  }

  var staat = { modus: 'alles', modi: [], lenzen: [], vanaf: 0, items: [], kaart: {},
    weergave: 'feed', zichtbaarheden: [], vermogens: [] };
  var mag = function (v) { return staat.vermogens.indexOf(v) >= 0; };

  function toon(bericht) {
    var n = $('#fout');
    n.hidden = !bericht; n.className = 'fout'; n.textContent = bericht || '';
  }

  var klok = function (at) {
    if (!at) return '';
    var d = new Date(at), nu = new Date();
    if (d.toDateString() === nu.toDateString())
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    return d.getDate() + '/' + (d.getMonth() + 1);
  };
  var BRONNAAM = { salon: 'De Salon', pulse: 'Pulse', zakelijk: 'Zakelijk',
    genootschap: 'Genootschap', verhalen: 'Verhaal' };

  function tekenPassport(d) {
    var lid = d.lidmaatschap;
    if (!lid) return;
    $('#passport').hidden = false;
    $('#wie').innerHTML = esc(d.ik.codenaam) + ' <span>· ' + esc(lid.pas.naam) + '</span>';
    $('#badges').innerHTML = '<span class="lidbadge member">' + esc(lid.member.naam) + '</span>'
      + '<span class="lidbadge lidstatus ' + esc(lid.status.id) + '">' + esc(lid.status.naam) + '</span>';
    var identiteit = $('#identiteit');
    identiteit.className = 'pasvoet ' + esc(lid.identiteit.id);
    identiteit.textContent = lid.identiteit.naam;
  }

  function tekenLenzen() {
    var n = $('#lenzen');
    n.textContent = '';
    staat.lenzen.forEach(function (lens) {
      var el = document.createElement(lens.open ? 'a' : 'span');
      el.textContent = lens.naam;
      if (lens.open) {
        el.href = lens.url;
        if (lens.id === 'friends') el.setAttribute('aria-current', 'page');
      } else {
        el.setAttribute('aria-disabled', 'true');
        el.title = lens.reden || '';
      }
      n.appendChild(el);
    });
  }

  /* De wereldschakelaar. Een dichte wereld blijft staan maar is uitgeschakeld,
     met de reden die de SERVER meegaf -- hier staat geen eigen tekst over wat
     een pas kost of biedt, want dan zou dat op twee plekken staan. */
  function tekenWerelden() {
    var n = $('#werelden');
    n.textContent = '';
    staat.modi.forEach(function (m) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = m.naam;
      b.setAttribute('aria-current', staat.modus === m.id ? 'true' : 'false');
      if (!m.open) { b.disabled = true; b.title = m.reden || ''; }
      else b.addEventListener('click', function () { kies(m.id); });
      n.appendChild(b);
    });
  }

  function kies(modus) {
    if (modus === staat.modus) return;
    staat.modus = modus; staat.vanaf = 0; staat.items = [];
    tekenWerelden();
    // de keuze onthouden is een gemak, geen voorwaarde: mislukt hij, dan werkt
    // de feed gewoon door in de gekozen wereld (maar we zwijgen er niet over)
    api('/modus', { modus: modus }).catch(function (e) { toon(e.message); });
    laad();
  }

  function tekenFeed(meer) {
    var n = $('#feed');
    n.textContent = '';
    if (!staat.items.length) {
      n.innerHTML = '<p class="leeg">Hier is het nog stil.<br>'
        + 'Wat je plaatst in De Salon, op Pulse of op het zakelijke prikbord komt hier samen.</p>';
      return;
    }
    staat.items.forEach(function (i) {
      var k = document.createElement('article');
      k.className = 'kaart';
      k.innerHTML =
        '<div class="r1"><span class="auteur">' + esc(i.auteur) + '</span>'
        + '<span class="bron">' + esc(BRONNAAM[i.bron] || i.bron) + '</span>'
        + '<span class="tijd">' + esc(klok(i.at)) + '</span></div>'
        + (i.tekst ? '<p>' + esc(i.tekst) + '</p>' : '')
        + (i.beeld && i.beeld.length ? '<img src="' + esc(i.beeld[0].src) + '" alt="' + esc(i.beeld[0].alt || '') + '">' : '')
        + '<div class="acties">'
        + '<button type="button" data-open="' + esc(i.open) + '">Openen</button>'
        + '<button type="button" data-chat="' + esc(i.auteur) + '" data-over="' + esc(i.open) + '">Bericht</button>'
        + '<span class="tel">' + (i.likes || 0) + ' · ' + (i.reacties || 0) + '</span>'
        + '</div>';
      n.appendChild(k);
    });
    if (meer) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'meer'; b.textContent = 'Meer laden';
      b.addEventListener('click', function () { staat.vanaf = staat.items.length; laad(true); });
      n.appendChild(b);
    }
  }

  /* Openen gebruikt de koppelkaart die de SERVER bij het opstarten meegaf. Dit
     scherm kent dus geen enkele app-URL uit zichzelf -- de kaart staat in
     kern/wereld/koppel.js en een app die verhuist breekt geen schermen. Hij
     wordt één keer bezorgd in plaats van per tik bevraagd; een opzoektabel die
     voor iedereen hetzelfde is, hoeft geen rondje langs de server.

     Onbekend blijft onbekend: we zeggen het, en gokken niet naar de homepage. */
  function naarRef(ref) {
    var m = /^rtg:\/\/([a-z]+)\/(.+)$/.exec(ref || '');
    var k = m && staat.kaart[m[1]];
    if (!k) { toon('Deze verwijzing ken ik niet.'); return; }
    location.href = k.app + '?' + k.param + '=' + encodeURIComponent(m[2]);
  }

  document.addEventListener('click', function (e) {
    var o = e.target.closest('[data-open]'), c = e.target.closest('[data-chat]');
    if (o) {
      naarRef(o.getAttribute('data-open'));
    } else if (c) {
      api('/gesprek', { codenaam: c.getAttribute('data-chat'), over: c.getAttribute('data-over') })
        .then(function (d) { location.href = d.url; })
        .catch(function (err) { toon(err.message); });
    }
  });

  /* ---------------------------------------------------- het profiel

     Wat hier NIET staat is net zo belangrijk als wat er wel staat: geen
     invoervelden. Elke laag woont in zijn eigen app en die houdt zijn keuring;
     dit scherm toont de waarde en zegt waar je hem wijzigt (de `bron` komt van
     de server mee). Wat je hier WEL doet is het enige dat de wereldlaag zelf
     bezit: per veld kiezen wie het mag zien.

     De keuzelijst wordt gevuld met de zichtbaarheden die de SERVER meegaf --
     geen eigen lijstje in de HTML, want dan zou een verwijderde stand hier
     blijven staan (dat is precies wat er met 'vrienden' gebeurd zou zijn). */
  var ZICHT_UITLEG = {
    iedereen: 'Iedereen', contacten: 'Mijn contacten',
    zakelijk: 'Zakelijke contacten', genootschap: 'Mijn genootschappen',
    alleenik: 'Alleen ik'
  };

  function toonWaarde(w) {
    if (w === null || w === undefined || w === '') return null;
    if (w === true) return 'Ja';
    if (Array.isArray(w)) return w.map(function (x) {
      if (x && typeof x === 'object') return x.naam || x.handle || x.platform || '';
      return String(x);
    }).filter(Boolean).join(', ');
    return String(w);
  }

  function tekenProfiel(lagen) {
    var n = $('#profiel');
    n.textContent = '';
    if (mag('inzicht.profielbezoek')) {
      var bez = document.createElement('section');
      bez.className = 'laag'; bez.id = 'bezoekers';
      bez.innerHTML = '<h2>Wie bekeek jouw profiel</h2>'
        + '<p class="bron">Bezoeken blijven 90 dagen staan. Kijk jij bij een ander, '
        + 'dan ziet die jou hier ook: er is geen onzichtbare stand.</p>';
      n.appendChild(bez);
      api('/bezoekers', {})
        .then(function (d) {
          bez.innerHTML += d.totaal
            ? d.bezoekers.map(function (b) {
              return '<div class="veld"><span class="nm">' + esc(b.codenaam) + '</span>'
                + '<span class="wa">' + esc(klok(b.at)) + ' &middot; ' + b.keer + 'x</span></div>';
            }).join('')
            : '<div class="veld"><span class="wa leeg">Nog niemand.</span></div>';
        })
        .catch(function (e) { toon(e.message); });
    }
    lagen.forEach(function (l) {
      var kaart = document.createElement('section');
      kaart.className = 'laag';
      var bron = l.bron
        ? 'Je vult dit in bij <a href="' + esc(l.bron.app) + '">' + esc(l.bron.naam) + '</a>.'
        : '';
      kaart.innerHTML = '<h2>' + esc(l.naam) + '</h2><p class="bron">' + bron + '</p>';
      l.velden.forEach(function (v) {
        var w = toonWaarde(v.waarde);
        var rij = document.createElement('div');
        rij.className = 'veld';
        rij.innerHTML = '<span class="nm">' + esc(v.naam) + '</span>'
          + '<span class="wa' + (w ? '' : ' leeg') + '">' + esc(w || 'Nog niet ingevuld') + '</span>';
        var sel = document.createElement('select');
        sel.setAttribute('aria-label', 'Wie mag ' + v.naam + ' zien?');
        staat.zichtbaarheden.forEach(function (z) {
          var o = document.createElement('option');
          o.value = z; o.textContent = ZICHT_UITLEG[z] || z;
          if (z === v.zicht) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener('change', function () {
          api('/profiel/zicht', { pad: v.pad, niveau: sel.value })
            .then(function () { toon(null); })
            .catch(function (e) { toon(e.message); });
        });
        rij.appendChild(sel);
        kaart.appendChild(rij);
      });
      n.appendChild(kaart);
    });
  }

  /* ZOEKEN. Het scherm toont hier geen enkele regel over wie wat mag zien: de
     server geeft per treffer alleen de velden terug die deze zoeker mag zien
     (kern/wereld/netwerk.js). Wat hier binnenkomt, mag dus getoond worden --
     het filteren gebeurt aan de kant waar de gegevens staan. */
  function tekenTreffers(d) {
    var n = $('#zoekuit');
    n.textContent = '';
    if (!d.treffers.length) {
      n.innerHTML = '<p class="leeg">Niemand gevonden.<br>'
        + 'Let op: je vindt alleen wat leden voor jou zichtbaar hebben gezet.</p>';
      return;
    }
    d.treffers.forEach(function (t) {
      var k = document.createElement('article');
      k.className = 'kaart';
      var regels = t.velden.map(function (v) {
        var w = toonWaarde(v.waarde);
        return w ? '<p>' + esc(w) + '</p>' : '';
      }).join('');
      k.innerHTML = '<div class="r1"><span class="auteur">' + esc(t.codenaam) + '</span>'
        + '<span class="bron">' + esc(t.pas) + '</span></div>' + regels
        + (t.gedeeld
          ? '<p class="via">' + t.gedeeld + ' gedeelde connectie(s)'
            + (t.via.length ? ' &middot; via ' + esc(t.via.join(', ')) : '') + '</p>'
          : '')
        + '<div class="acties"><button type="button" data-chat="' + esc(t.codenaam)
        + '" data-over="">Bericht</button></div>';
      n.appendChild(k);
    });
  }

  $('#zoekform').addEventListener('submit', function (e) {
    e.preventDefault();
    api('/zoek', { q: $('#zoekq').value })
      .then(function (d) { toon(null); tekenTreffers(d); })
      .catch(function (err) { toon(err.message); });
  });

  $('#homeTab').addEventListener('click', function (e) {
    e.preventDefault();
    toonWeergave('feed');
  });

  $('#ontdekTab').addEventListener('click', function (e) {
    e.preventDefault();
    /* Zonder het vermogen is er hier niets te doen, en dan sturen we je naar
       het beginscherm in plaats van een leeg paneel te tonen. Het scherm
       verzint die regel niet zelf -- hij komt uit /api/wereld/state. */
    if (!mag('zoeken.geavanceerd')) { location.href = '/apps/app.html'; return; }
    toonWeergave(staat.weergave === 'ontdek' ? 'feed' : 'ontdek');
  });

  /* Wisselen tussen de feed en het profiel. Bewust binnen dezelfde app: het
     profiel is een KANT van dezelfde identiteit, niet een andere plek. */
  function toonWeergave(welke) {
    staat.weergave = welke;
    $('#feed').hidden = welke !== 'feed';
    $('#profiel').hidden = welke !== 'profiel';
    $('#ontdek').hidden = welke !== 'ontdek';
    $('#werelden').hidden = welke !== 'feed';
    $('#lenzen').hidden = welke !== 'feed';
    var bij = { feed: 'homeTab', profiel: 'profielTab', ontdek: 'ontdekTab' };
    document.querySelectorAll('.balk a').forEach(function (a) {
      a.setAttribute('aria-current', a.id === bij[welke] ? 'page' : 'false');
    });
  }

  $('#profielTab').addEventListener('click', function (e) {
    e.preventDefault();
    if (staat.weergave === 'profiel') { toonWeergave('feed'); return; }
    api('/profiel', {})
      .then(function (d) {
        staat.zichtbaarheden = d.zichtbaarheden || [];
        tekenProfiel(d.lagen || []);
        toonWeergave('profiel');
      })
      .catch(function (err) { toon(err.message); });
  });

  function laad(aanvullen) {
    return api('/feed', { modus: staat.modus, vanaf: staat.vanaf })
      .then(function (d) {
        staat.items = aanvullen ? staat.items.concat(d.items) : d.items;
        toon(null);
        tekenFeed(d.meer);
      })
      .catch(function (e) { toon(e.message); tekenFeed(false); });
  }

  api('/state', {})
    .then(function (d) {
      staat.modus = d.modus; staat.modi = d.modi; staat.kaart = d.koppelkaart || {};
      staat.vermogens = d.vermogens || []; staat.lenzen = d.lenzen || [];
      /* De modus reist mee naar de aparte berichten-app: de la die bij deze
         wereld hoort komt van de SERVER (kern/wereld/koppel.js), zodat dit
         scherm geen eigen kaart bijhoudt. Is er geen la voor deze wereld, dan
         blijft de link gewoon de inbox openen. */
      var chat = document.querySelector('.balk a[href="/apps/comm.html"]');
      if (chat) chat.href = '/apps/comm.html' + (d.chatLade ? '?lade=' + encodeURIComponent(d.chatLade) : '');
      tekenPassport(d);
      tekenLenzen();
      tekenWerelden();
      return laad();
    })
    .catch(function (e) {
      $('#passport').hidden = false;
      $('#wie').textContent = 'Niet ingelogd';
      /* De wachtregel weghalen, anders staat er "Bezig met laden..." ONDER een
         foutmelding: het scherm zou dan tegelijk zeggen dat het stuk is en dat
         het nog bezig is. De melding is het antwoord; verder hoort dit vlak
         leeg te zijn. */
      $('#feed').textContent = '';
      toon(e.message + ' Log opnieuw in via de app.');
    });
})();
</script>
