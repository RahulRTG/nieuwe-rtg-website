<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTG Workspace</title>
<meta name="theme-color" content="#0C0C0B">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/shared/rtg-uniform.css" rel="stylesheet">
<link href="/shared/dagkleur.css" rel="stylesheet">
<link href="/shared/rtg-ui.css" rel="stylesheet">
<link href="/shared/rtg-ontwerp.css" rel="stylesheet">
<link href="/shared/rtg-schil.css" rel="stylesheet">
<!-- de vorm van de mediamelding hoort bij de mediapoort: zonder dit blad
     staat de uitleg er wel, maar ongestileerd -->
<link href="/shared/media.css" rel="stylesheet">
<style>
  /* De werkruimte is geen pagina die scrolt maar een vlak dat het scherm vult.
     Daarom hier geen max-width: extra pixels horen extra RTG te tonen en niet
     bredere marges (WERKRUIMTE.md par. 8). */
  html,body{height:100%;margin:0;overflow:hidden;}
  a.terugmobiel{display:inline-block;margin-top:.5rem;font-size:.76rem;
    color:var(--rtg-soft);text-decoration:none;letter-spacing:.04em;}
  a.terugmobiel:hover,a.terugmobiel:focus-visible{color:var(--rtg-goud);}
</style>
</head>
<!-- data-ios-uit: deze pagina IS de schil. Een hamburger met een app-menu zou
     hier een tweede navigator naast de console zetten, en twee navigators is er
     een te veel. De weg terug staat daarom expliciet in de console zelf; zonder
     die link zou dit attribuut een uitweg zijn in plaats van een keuze. -->
<body class="rtg-stijl" data-rtg-modus="pro" data-rtg-schil="standaard" data-ios-uit data-rtg-eigenvlak="onyx">

<main class="rtg-werkruimte" id="ruimte">
  <!-- De console: het anker van de werkruimte, geen menu met twintig apps maar
       de huidige context (WERKRUIMTE.md par. 2). -->
  <aside class="rtg-console" id="console" aria-label="RTG Command">
    <div>
      <h1 id="ruimteTitel">RTG Command</h1>
      <div class="wie" id="wie">Nederland / RTG</div>
      <a class="terugmobiel" id="ruimteTerug" href="/apps/app.html">&lsaquo; RTG Mobile</a>
    </div>

    <div class="blok console-zoek">
      <div class="bloknaam">Vraag of open iets</div>
      <input class="zoek" id="zoek" placeholder="&#8984;K  Reizen, Veilig, Ibiza..." aria-label="Zoeken of openen">
    </div>

    <div class="blok console-werelden">
      <div class="bloknaam" id="wereldLabel">Werelden</div>
      <div class="rijtje" id="werelden"></div>
    </div>

    <div class="blok console-actief">
      <div class="bloknaam">Actief</div>
      <div class="rijtje" data-actieflijst></div>
    </div>

    <div class="blok console-ruimtes">
      <div class="bloknaam">Werkruimtes</div>
      <div class="rijtje" data-ruimtes></div>
      <button type="button" class="bewaar" id="bewaar">Deze kamer bewaren</button>
    </div>

    <div class="blok console-context">
      <div class="bloknaam">Gedeelde context</div>
      <div class="context" data-context></div>
    </div>

    <div class="blok console-rahul">
      <div class="bloknaam">Rahul</div>
      <div class="context">Optioneel. Rahul kan ordenen en voorbereiden; alle
      schermen en handelingen blijven zonder AI volledig bruikbaar.</div>
    </div>
  </aside>
</main>

<!-- HET PALET (WERKRUIMTE.md par. 10, stap 6). Het staat over de ruimte heen en
     niet in een la: de console is de navigator, en navigeren doe je vanaf waar
     je bent. Escape sluit; Enter doet de bovenste regel. -->
<div class="palet" id="palet" hidden role="dialog" aria-modal="true" aria-label="Commandopalet">
  <div class="paletdoos">
    <input id="paletIn" autocomplete="off" placeholder="Open een app, haal een werkruimte terug, sluit iets..." aria-label="Opdracht">
    <ul id="paletLijst" role="listbox"></ul>
  </div>
</div>

<!-- media.js VOOR de schil: die geeft het camera- en microfoonrecht door aan
     elke surface, en dat moet gebeuren voordat er een frame wordt gemaakt. -->
<script src="/shared/media.js"></script>
<script src="/shared/rtg-schil.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);

  /* De werelden die als surface te openen zijn. Elk is een ECHTE app die zijn
     eigen pagina blijft: de schil weet alleen naam en adres, niet wat erin
     gebeurt (PLATFORM.md -- de apps houden hun diepte, de bovenlaag verbindt). */
  const PERSOONLIJK = [
    { id: 'reizen', naam: 'Reizen', kort: 'RE', url: '/apps/reizen.html' },
    { id: 'veilig', naam: 'Veilig', kort: 'VE', url: '/apps/veilig.html' },
    { id: 'agenda', naam: 'Agenda', kort: 'AG', url: '/apps/agenda.html' },
    { id: 'bestanden', naam: 'Bestanden', kort: 'BF', url: '/apps/bestanden.html' },
    { id: 'notities', naam: 'Notities', kort: 'NT', url: '/apps/notities.html' },
    { id: 'office', naam: 'Documenten', kort: 'DO', url: '/apps/office.html' },
    { id: 'kantoor', naam: 'RTG Kantoor', kort: 'KA', url: '/apps/kantoor.html' },
    { id: 'sociaal', naam: 'RTG Sociaal', kort: 'SO', url: '/apps/sociaal.html' }
  ];

  /* Dezelfde Spatial Shell heeft een eigen bedrijfsstand. Dit is geen tweede
     desktop en geen kopie van de kantoorfuncties: elke surface opent de echte
     bestaande app met haar eigen rechten. De schil bewaart alleen de indeling. */
  const KANTOOR = [
    { id: 'vandaag', naam: 'Vandaag', kort: 'VD', url: '/apps/kantoor.html' },
    { id: 'afdelingen', naam: 'Afdelingen', kort: 'AF', url: '/apps/kantoren.html' },
    { id: 'personeel', naam: 'Personeel', kort: 'HR', url: '/apps/personeel.html?kantoor=1' },
    { id: 'office', naam: 'RTG Office', kort: 'OF', url: '/apps/office.html?werk=kantoor' },
    { id: 'agenda', naam: 'Agenda', kort: 'AG', url: '/apps/agenda.html' },
    { id: 'mail', naam: 'RTG Mail', kort: 'ML', url: '/apps/rtmail.html' },
    { id: 'bestanden', naam: 'Bestanden', kort: 'BF', url: '/apps/bestanden.html' },
    { id: 'backoffice', naam: 'Backoffice', kort: 'BO', url: '/apps/backoffice.html' },
    { id: 'command', naam: 'RTG Command', kort: 'CM', url: '/apps/command.html' }
  ];
  const kantoorModus = new URLSearchParams(location.search).get('gebied') === 'kantoor';
  const WERELDEN = kantoorModus ? KANTOOR : PERSOONLIJK;
  if (kantoorModus) {
    document.title = 'RTG Work OS';
    $('#ruimteTitel').textContent = 'RTG Work OS';
    $('#wie').textContent = 'Rahul Travel Group · Kantooromgeving';
    $('#wereldLabel').textContent = 'Werkbanken';
    $('#ruimteTerug').href = '/apps/personeel.html?kantoor=1';
    $('#ruimteTerug').textContent = '‹ Personeelsingang';
    document.body.dataset.omgeving = 'kantoor';
  }

  const SNEL = kantoorModus
    ? ['vandaag', 'office', 'agenda', 'mail', 'bestanden']
    : ['reizen', 'agenda', 'notities', 'office', 'bestanden'];
  const schil = RTGSchil.start({ vak: $('#ruimte'), console: $('#console'), apps: WERELDEN, dock: SNEL });

  $('#werelden').innerHTML = WERELDEN.map(w =>
    '<button type="button" data-open="' + w.id + '" aria-label="' + w.naam + '">' +
    '<span class="app-kort" aria-hidden="true">' + w.kort + '</span><span class="app-label">' + w.naam + '</span></button>').join('');
  $('#werelden').querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => {
    const w = WERELDEN.find(x => x.id === b.dataset.open);
    if (w) RTGSchil.open(w.id, { naam: w.naam, url: w.url, kort: w.naam });
  }));

  /* HET PALET (WERKRUIMTE.md par. 10, stap 6). De console is de navigator; dit
     is zijn mond. Hier stond een zoekregel die alleen op naam kon openen --
     eerlijk, maar niet veel. Nu opent hij apps, haalt hij een bewaarde
     werkruimte terug en sluit hij een surface, en de treffers komen uit de
     schil zelf (RTGSchil.palet) zodat het scherm ze niet nog eens bijhoudt. */
  let paletKeuze = 0;
  function paletTeken() {
    const t = RTGSchil.palet($('#paletIn').value);
    paletKeuze = Math.min(paletKeuze, Math.max(0, t.length - 1));
    $('#paletLijst').innerHTML = t.length
      ? t.map((x, i) => '<li role="option"' + (i === paletKeuze ? ' aria-selected="true"' : '') +
          '><span>' + x.label + '</span><span class="hint">' + x.hint + '</span></li>').join('')
      : '<li class="leeg">Niets gevonden</li>';
    $('#paletLijst').querySelectorAll('li[role="option"]').forEach((li, i) =>
      li.addEventListener('click', () => { t[i].doe(); paletDicht(); }));
    return t;
  }
  function paletOpen() {
    $('#palet').hidden = false; paletKeuze = 0;
    $('#paletIn').value = ''; $('#paletIn').focus(); paletTeken();
  }
  function paletDicht() { $('#palet').hidden = true; }
  $('#ruimte').addEventListener('rtg-palet-open', paletOpen);
  $('#paletIn').addEventListener('input', () => { paletKeuze = 0; paletTeken(); });
  $('#paletIn').addEventListener('keydown', (e) => {
    const t = RTGSchil.palet($('#paletIn').value);
    if (e.key === 'ArrowDown') { e.preventDefault(); paletKeuze = Math.min(paletKeuze + 1, t.length - 1); paletTeken(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); paletKeuze = Math.max(paletKeuze - 1, 0); paletTeken(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (t[paletKeuze]) { t[paletKeuze].doe(); paletDicht(); } }
    else if (e.key === 'Escape') { e.preventDefault(); paletDicht(); }
  });
  $('#palet').addEventListener('click', (e) => { if (e.target.id === 'palet') paletDicht(); });
  // de zoekregel in de console opent hetzelfde palet: EEN ingang, twee plekken
  $('#zoek').addEventListener('focus', paletOpen);
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); paletOpen(); }
  });

  /* Een kamer bewaren (stap 5). Bewust met een naam die u zelf geeft: "Mijn
     Directie" onthoudt u, "Werkruimte 3" niet. */
  $('#bewaar').addEventListener('click', () => {
    const n = prompt('Hoe heet deze kamer?', 'Mijn Directie');
    if (n) RTGSchil.bewaarRuimte(n);
  });

  // een werkruimte begint niet leeg: twee surfaces, zodat de tafel meteen leest
  const begin = kantoorModus
    ? [{ id: 'vandaag', naam: 'Vandaag', url: '/apps/kantoor.html' },
       { id: 'afdelingen', naam: 'Afdelingen', url: '/apps/kantoren.html' }]
    : [{ id: 'reizen', naam: 'Reizen', url: '/apps/reizen.html' },
       { id: 'agenda', naam: 'Agenda', url: '/apps/agenda.html' }];
  begin.forEach(x => RTGSchil.open(x.id, { naam: x.naam, url: x.url, kort: x.naam }));
})();
</script>
<script src="/shared/metgezel.js" defer></script>
<script src="/shared/basis.js" defer></script>
<script src="/shared/cookie.js" defer></script>
</body>
</html>
