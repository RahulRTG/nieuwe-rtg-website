<!-- DEZELFDE VRAAG ALS EEN LID STELT, en met opzet hetzelfde antwoord: het

     op een dag iets anders zeggen over dezelfde maand, en dan is de vraag welke
     van de twee op de factuur staat.

     Wat hier NIET staat is een eigen verbruiksgrens. Die hoort bij een PERSOON
     die zijn eigen uitgaven in de hand houdt; op een zaak zou hij een
     medewerker het werk uit handen slaan zonder dat die weet wie hem zette. Het
     kantoorslot geldt hier wel, en dat is het slot dat op deze plek hoort. -->
